<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318">
  <text class="heading" x="24" y="24">Policy</text>
  <text class="heading" x="180" y="24">Full queue of 16 + new batch</text>
  <text class="heading" x="428" y="24">Result</text>
  <rect class="band" x="12" y="36" width="656" height="84" rx="6"/>
  <text class="code bold" x="24" y="72">PauseAndResume</text>
  <text class="small muted" x="24" y="90">default, lossless</text>
  <rect class="node" x="180" y="61" width="34" height="34" rx="4"/>
  <text class="code small" x="197" y="82" text-anchor="middle">b1</text>
  <rect class="node" x="220" y="61" width="34" height="34" rx="4"/>
  <text class="code small" x="237" y="82" text-anchor="middle">b2</text>
  <text class="bold muted" x="277" y="82" text-anchor="middle">…</text>
  <rect class="node" x="300" y="61" width="34" height="34" rx="4"/>
  <text class="code small" x="317" y="82" text-anchor="middle">b16</text>
  <path class="edge dashed muted" d="M370 78 H342" marker-end="url(#arrow-muted)"/>
  <rect class="node ghost" x="370" y="61" width="34" height="34" rx="4"/>
  <text class="small muted" x="387" y="111" text-anchor="middle">not pushed</text>
  <text class="code small" x="387" y="82" text-anchor="middle">b17</text>
  <text class="code small amber" x="428" y="62">subStatus := Paused</text>
  <text class="small" x="428" y="80">The worker drains the queue, then</text>
  <text class="small" x="428" y="98">re-reads from its checkpoint. No loss.</text>
  <rect class="band" x="12" y="130" width="656" height="84" rx="6"/>
  <text class="code bold" x="24" y="166">DropSubscription</text>
  <text class="small muted" x="24" y="184">fail fast</text>
  <rect class="node" x="180" y="155" width="34" height="34" rx="4"/>
  <text class="code small" x="197" y="176" text-anchor="middle">b1</text>
  <rect class="node" x="220" y="155" width="34" height="34" rx="4"/>
  <text class="code small" x="237" y="176" text-anchor="middle">b2</text>
  <text class="bold muted" x="277" y="176" text-anchor="middle">…</text>
  <rect class="node" x="300" y="155" width="34" height="34" rx="4"/>
  <text class="code small" x="317" y="176" text-anchor="middle">b16</text>
  <path class="edge dashed muted" d="M370 172 H342" marker-end="url(#arrow-muted)"/>
  <rect class="node ghost" x="370" y="155" width="34" height="34" rx="4"/>
  <text class="small muted" x="387" y="205" text-anchor="middle">not pushed</text>
  <text class="code small" x="387" y="176" text-anchor="middle">b17</text>
  <text class="code small rose" x="428" y="156">subStatus := Overflowed</text>
  <text class="small" x="428" y="174">Terminal. The worker throws</text>
  <text class="code small" x="428" y="192">SubscriptionOverflowed</text>
  <rect class="band" x="12" y="224" width="656" height="84" rx="6"/>
  <text class="code bold" x="24" y="260">DropOldest</text>
  <text class="small muted" x="24" y="278">lossy, best effort</text>
  <rect class="node rose dashed" x="180" y="249" width="34" height="34" rx="4"/>
  <text class="code small" x="197" y="270" text-anchor="middle">b1</text>
  <rect class="node" x="220" y="249" width="34" height="34" rx="4"/>
  <text class="code small" x="237" y="270" text-anchor="middle">b2</text>
  <text class="bold muted" x="277" y="270" text-anchor="middle">…</text>
  <rect class="node" x="300" y="249" width="34" height="34" rx="4"/>
  <text class="code small" x="317" y="270" text-anchor="middle">b16</text>
  <path class="edge accent" d="M370 266 H342" marker-end="url(#arrow-accent)"/>
  <rect class="node accent" x="370" y="249" width="34" height="34" rx="4"/>
  <text class="small rose" x="197" y="299" text-anchor="middle">evicted</text>
  <text class="small accent" x="387" y="299" text-anchor="middle">enqueued</text>
  <text class="code small" x="387" y="270" text-anchor="middle">b17</text>
  <text class="code small" x="428" y="250">tryReadTBQueue, writeTBQueue</text>
  <text class="small" x="428" y="268">The oldest batch is lost.</text>
  <text class="small" x="428" y="286">The new batch is enqueued.</text>
</svg>
