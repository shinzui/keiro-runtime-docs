<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240">
  <text class="heading" x="20" y="22">$all positions, oldest to newest</text>
  <text class="code small amber" x="440" y="22" text-anchor="middle">cursor 8</text>
  <text class="code small amber" x="636" y="22" text-anchor="middle">cursor 0</text>
  <rect class="band" x="16" y="34" width="648" height="48" rx="6"/>
  <rect class="node" x="24" y="43" width="52" height="30" rx="5"/>
  <text class="code small" x="50" y="62" text-anchor="middle">1</text>
  <rect class="node" x="84" y="43" width="52" height="30" rx="5"/>
  <text class="code small" x="110" y="62" text-anchor="middle">2</text>
  <rect class="node" x="144" y="43" width="52" height="30" rx="5"/>
  <text class="code small" x="170" y="62" text-anchor="middle">3</text>
  <rect class="node" x="204" y="43" width="52" height="30" rx="5"/>
  <text class="code small" x="230" y="62" text-anchor="middle">4</text>
  <rect class="node violet" x="264" y="43" width="52" height="30" rx="5"/>
  <text class="code small violet" x="290" y="62" text-anchor="middle">5</text>
  <rect class="node violet" x="324" y="43" width="52" height="30" rx="5"/>
  <text class="code small violet" x="350" y="62" text-anchor="middle">6</text>
  <rect class="node violet" x="384" y="43" width="52" height="30" rx="5"/>
  <text class="code small violet" x="410" y="62" text-anchor="middle">7</text>
  <rect class="node accent" x="444" y="43" width="52" height="30" rx="5"/>
  <text class="code small accent" x="470" y="62" text-anchor="middle">8</text>
  <rect class="node accent" x="504" y="43" width="52" height="30" rx="5"/>
  <text class="code small accent" x="530" y="62" text-anchor="middle">9</text>
  <rect class="node accent" x="564" y="43" width="52" height="30" rx="5"/>
  <text class="code small accent" x="590" y="62" text-anchor="middle">10</text>
  <path class="edge amber dashed" d="M440 28 V88"/>
  <path class="edge amber dashed" d="M636 28 V88"/>

  <path class="edge violet" d="M264 92 V98 H436 V92"/>
  <text class="small violet" x="350" y="116" text-anchor="middle">page 2: 7, 6, 5</text>
  <path class="edge accent" d="M444 92 V98 H616 V92"/>
  <text class="small accent" x="530" y="116" text-anchor="middle">page 1: 10, 9, 8</text>

  <text class="small" x="20" y="152">1.</text>
  <text class="code small" x="40" y="152">readAllBackward (GlobalPosition 0) 3</text>
  <text class="small accent" x="310" y="152">returns page 1, newest first</text>
  <text class="small" x="20" y="176">2.</text>
  <text class="code small" x="40" y="176">readAllBackward (GlobalPosition 8) 3</text>
  <text class="small violet" x="310" y="176">returns only positions below 8</text>
  <text class="small muted" x="20" y="208">Cursor 0 starts after the newest event.</text>
  <text class="small muted" x="20" y="226">The oldest position in page 1 is the next cursor. No boundary event repeats.</text>
</svg>
