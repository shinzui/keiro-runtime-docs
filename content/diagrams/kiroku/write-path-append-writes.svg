<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640">
  <rect class="group" x="8" y="40" width="664" height="588" rx="8"/>
  <text class="small muted" x="660" y="58" text-anchor="end">one statement</text>
  <text class="code" x="20" y="26">appendToStream orders-1 (ExactVersion 4) [e1, e2, e3]</text>
  <text class="heading" x="44" y="62">streams</text>
  <text class="code small muted" x="110" y="82" text-anchor="middle">stream_id</text>
  <text class="code small muted" x="250" y="82" text-anchor="middle">stream_name</text>
  <text class="code small muted" x="420" y="82" text-anchor="middle">stream_version</text>
  <rect class="band" x="44" y="90" width="616" height="26" rx="4"/>
  <text class="code small" x="110" y="107" text-anchor="middle">s</text>
  <text class="code small" x="250" y="107" text-anchor="middle">orders-1</text>
  <text class="code small" x="420" y="107" text-anchor="middle">4 → 7</text>
  <circle class="node" cx="24" cy="103" r="10"/>
  <text class="small bold" x="24" y="107" text-anchor="middle">1</text>
  <text class="code small muted" x="478" y="107">WHERE stream_version = 4</text>
  <rect class="band accent" x="44" y="120" width="616" height="26" rx="4"/>
  <text class="code small accent" x="110" y="137" text-anchor="middle">0</text>
  <text class="code small accent" x="250" y="137" text-anchor="middle">$all</text>
  <text class="code small accent" x="420" y="137" text-anchor="middle">g → g+3</text>
  <circle class="node" cx="24" cy="133" r="10"/>
  <text class="small bold" x="24" y="137" text-anchor="middle">4</text>
  <text class="heading" x="44" y="174">events</text>
  <text class="code small muted" x="110" y="194" text-anchor="middle">event_id</text>
  <text class="code small muted" x="250" y="194" text-anchor="middle">event_type</text>
  <text class="code small muted" x="420" y="194" text-anchor="middle">data, metadata, …</text>
  <rect class="band" x="44" y="202" width="616" height="26" rx="4"/>
  <text class="code small" x="110" y="219" text-anchor="middle">e1</text>
  <text class="code small" x="250" y="219" text-anchor="middle">type-1</text>
  <text class="code small" x="420" y="219" text-anchor="middle">…</text>
  <rect class="band" x="44" y="232" width="616" height="26" rx="4"/>
  <text class="code small" x="110" y="249" text-anchor="middle">e2</text>
  <text class="code small" x="250" y="249" text-anchor="middle">type-2</text>
  <text class="code small" x="420" y="249" text-anchor="middle">…</text>
  <rect class="band" x="44" y="262" width="616" height="26" rx="4"/>
  <text class="code small" x="110" y="279" text-anchor="middle">e3</text>
  <text class="code small" x="250" y="279" text-anchor="middle">type-3</text>
  <text class="code small" x="420" y="279" text-anchor="middle">…</text>
  <circle class="node" cx="24" cy="245" r="10"/>
  <text class="small bold" x="24" y="249" text-anchor="middle">2</text>
  <text class="heading" x="44" y="322">stream_events</text>
  <text class="code small muted" x="80" y="342" text-anchor="middle">event_id</text>
  <text class="code small muted" x="160" y="342" text-anchor="middle">stream_id</text>
  <text class="code small muted" x="260" y="342" text-anchor="middle">stream_version</text>
  <text class="code small muted" x="400" y="342" text-anchor="middle">original_stream_id</text>
  <text class="code small muted" x="570" y="342" text-anchor="middle">original_stream_version</text>
  <rect class="band" x="44" y="350" width="616" height="26" rx="4"/>
  <text class="code small" x="80" y="367" text-anchor="middle">e1</text>
  <text class="code small" x="160" y="367" text-anchor="middle">s</text>
  <text class="code small" x="260" y="367" text-anchor="middle">5</text>
  <text class="code small" x="400" y="367" text-anchor="middle">s</text>
  <text class="code small" x="570" y="367" text-anchor="middle">5</text>
  <rect class="band" x="44" y="380" width="616" height="26" rx="4"/>
  <text class="code small" x="80" y="397" text-anchor="middle">e2</text>
  <text class="code small" x="160" y="397" text-anchor="middle">s</text>
  <text class="code small" x="260" y="397" text-anchor="middle">6</text>
  <text class="code small" x="400" y="397" text-anchor="middle">s</text>
  <text class="code small" x="570" y="397" text-anchor="middle">6</text>
  <rect class="band" x="44" y="410" width="616" height="26" rx="4"/>
  <text class="code small" x="80" y="427" text-anchor="middle">e3</text>
  <text class="code small" x="160" y="427" text-anchor="middle">s</text>
  <text class="code small" x="260" y="427" text-anchor="middle">7</text>
  <text class="code small" x="400" y="427" text-anchor="middle">s</text>
  <text class="code small" x="570" y="427" text-anchor="middle">7</text>
  <circle class="node" cx="24" cy="393" r="10"/>
  <text class="small bold" x="24" y="397" text-anchor="middle">3</text>
  <rect class="band accent" x="44" y="448" width="616" height="26" rx="4"/>
  <text class="code small accent" x="80" y="465" text-anchor="middle">e1</text>
  <text class="code small accent" x="160" y="465" text-anchor="middle">0</text>
  <text class="code small accent" x="260" y="465" text-anchor="middle">g+1</text>
  <text class="code small accent" x="400" y="465" text-anchor="middle">s</text>
  <text class="code small accent" x="570" y="465" text-anchor="middle">5</text>
  <rect class="band accent" x="44" y="478" width="616" height="26" rx="4"/>
  <text class="code small accent" x="80" y="495" text-anchor="middle">e2</text>
  <text class="code small accent" x="160" y="495" text-anchor="middle">0</text>
  <text class="code small accent" x="260" y="495" text-anchor="middle">g+2</text>
  <text class="code small accent" x="400" y="495" text-anchor="middle">s</text>
  <text class="code small accent" x="570" y="495" text-anchor="middle">6</text>
  <rect class="band accent" x="44" y="508" width="616" height="26" rx="4"/>
  <text class="code small accent" x="80" y="525" text-anchor="middle">e3</text>
  <text class="code small accent" x="160" y="525" text-anchor="middle">0</text>
  <text class="code small accent" x="260" y="525" text-anchor="middle">g+3</text>
  <text class="code small accent" x="400" y="525" text-anchor="middle">s</text>
  <text class="code small accent" x="570" y="525" text-anchor="middle">7</text>
  <circle class="node" cx="24" cy="491" r="10"/>
  <text class="small bold" x="24" y="495" text-anchor="middle">5</text>
  <rect class="node green" x="44" y="552" width="616" height="32" rx="5"/>
  <text class="small" x="352" y="573" text-anchor="middle">Result row: stream_id s, stream version 7, global position g+3</text>
  <circle class="node" cx="24" cy="568" r="10"/>
  <text class="small bold" x="24" y="572" text-anchor="middle">6</text>
  <text class="small muted" x="44" y="612">Steps 2 to 6 run only when step 1 updates a row. Otherwise nothing is written and no row returns.</text>
</svg>
