<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330">
  <text class="heading" x="40" y="26">Worker state over time</text>
  <rect class="band" x="40" y="36" width="156" height="30" rx="5"/>
  <text class="code" x="118" y="56" text-anchor="middle">CatchingUp</text>
  <rect class="band accent" x="200" y="36" width="216" height="30" rx="5"/>
  <text class="code accent" x="308" y="56" text-anchor="middle">Live</text>
  <rect class="band amber" x="420" y="36" width="56" height="30" rx="5"/>
  <text class="code amber" x="448" y="56" text-anchor="middle">Paused</text>
  <rect class="band accent" x="480" y="36" width="116" height="30" rx="5"/>
  <text class="code accent" x="538" y="56" text-anchor="middle">Live</text>
  <path class="axis rose" d="M602 32 V262"/>
  <text class="small rose" x="608" y="56">crash</text>
  <text class="heading" x="40" y="100">One lifetime span (not used)</text>
  <rect class="node rose dashed" x="40" y="110" width="556" height="26" rx="5"/>
  <text class="small" x="318" y="127" text-anchor="middle">opened at start, still open at the crash</text>
  <text class="small rose" x="40" y="156">Nothing is exported while the worker runs, and the span is lost.</text>
  <text class="heading" x="40" y="192">Short spans from kiroku-otel</text>
  <rect class="node accent" x="40" y="202" width="156" height="24" rx="5"/>
  <text class="code small" x="118" y="218" text-anchor="middle">catchup</text>
  <rect class="node amber" x="420" y="202" width="56" height="24" rx="5"/>
  <text class="code small" x="448" y="218" text-anchor="middle">paused</text>
  <rect class="node rose" x="596" y="202" width="12" height="24" rx="3"/>
  <text class="code small rose" x="614" y="218">stopped</text>
  <rect class="node violet" x="70" y="234" width="8" height="18" rx="2"/>
  <rect class="node violet" x="110" y="234" width="8" height="18" rx="2"/>
  <rect class="node violet" x="150" y="234" width="8" height="18" rx="2"/>
  <rect class="node violet" x="236" y="234" width="8" height="18" rx="2"/>
  <rect class="node violet" x="276" y="234" width="8" height="18" rx="2"/>
  <rect class="node violet" x="316" y="234" width="8" height="18" rx="2"/>
  <rect class="node violet" x="356" y="234" width="8" height="18" rx="2"/>
  <rect class="node violet" x="396" y="234" width="8" height="18" rx="2"/>
  <rect class="node violet" x="510" y="234" width="8" height="18" rx="2"/>
  <rect class="node violet" x="550" y="234" width="8" height="18" rx="2"/>
  <text class="small violet" x="40" y="272">deliver: one short span per batch</text>
  <text class="small muted" x="40" y="300">Each span is exported when it ends. Deliver spans end at once,</text>
  <text class="small muted" x="40" y="318">so the trace stays current while the worker runs.</text>
</svg>
