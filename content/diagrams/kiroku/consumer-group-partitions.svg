  <text class="small muted" x="452" y="256">no stream in this sample</text>
  <text class="code small" x="24" y="306">member = hashtextextended(stream_id::text, 0) mod 4</text>
  <text class="small muted" x="24" y="332">Each stream hashes to exactly one member,</text>
