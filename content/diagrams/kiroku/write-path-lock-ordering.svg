<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330">
  <rect class="group" x="16" y="12" width="316" height="306" rx="8"/>
  <text class="title" x="32" y="38">Caller order</text>
  <text class="small muted" x="32" y="56">A locks 1 then 2. B locks 2 then 1.</text>
  <rect class="node" x="116" y="70" width="120" height="34" rx="5"/>
  <text class="code" x="176" y="91" text-anchor="middle">txn A</text>
  <rect class="node" x="116" y="230" width="120" height="34" rx="5"/>
  <text class="code" x="176" y="251" text-anchor="middle">txn B</text>
  <rect class="node" x="32" y="150" width="100" height="34" rx="5"/>
  <text class="code" x="82" y="171" text-anchor="middle">stream 1</text>
  <rect class="node" x="220" y="150" width="100" height="34" rx="5"/>
  <text class="code" x="270" y="171" text-anchor="middle">stream 2</text>
  <path class="edge" d="M136 104 V127 H82 V146" marker-end="url(#arrow)"/>
  <text class="small" x="128" y="121" text-anchor="end">1. holds</text>
  <path class="edge dashed rose" d="M216 104 V127 H270 V146" marker-end="url(#arrow-rose)"/>
  <text class="small rose" x="224" y="121" text-anchor="start">2. waits</text>
  <path class="edge" d="M216 230 V207 H270 V188" marker-end="url(#arrow)"/>
  <text class="small" x="224" y="223" text-anchor="start">1. holds</text>
  <path class="edge dashed rose" d="M136 230 V207 H82 V188" marker-end="url(#arrow-rose)"/>
  <text class="small rose" x="128" y="223" text-anchor="end">2. waits</text>
  <text class="small bold rose" x="174" y="298" text-anchor="middle">Cycle: each waits for the other</text>
  <rect class="group" x="348" y="12" width="316" height="306" rx="8"/>
  <text class="title" x="364" y="38">stream_id order</text>
  <text class="small muted" x="364" y="56">Both lock 1 first, then 2.</text>
  <rect class="node" x="448" y="70" width="120" height="34" rx="5"/>
  <text class="code" x="508" y="91" text-anchor="middle">txn A</text>
  <rect class="node" x="448" y="230" width="120" height="34" rx="5"/>
  <text class="code" x="508" y="251" text-anchor="middle">txn B</text>
  <rect class="node" x="364" y="150" width="100" height="34" rx="5"/>
  <text class="code" x="414" y="171" text-anchor="middle">stream 1</text>
  <rect class="node" x="552" y="150" width="100" height="34" rx="5"/>
  <text class="code" x="602" y="171" text-anchor="middle">stream 2</text>
  <path class="edge" d="M468 104 V127 H414 V146" marker-end="url(#arrow)"/>
  <text class="small" x="460" y="121" text-anchor="end">1. holds</text>
  <path class="edge" d="M548 104 V127 H602 V146" marker-end="url(#arrow)"/>
  <text class="small" x="556" y="121" text-anchor="start">2. holds</text>
  <path class="edge dashed amber" d="M468 230 V207 H414 V188" marker-end="url(#arrow-amber)"/>
  <text class="small amber" x="460" y="223" text-anchor="end">1. waits</text>
  <text class="small bold green" x="506" y="298" text-anchor="middle">B waits for A. No cycle.</text>
</svg>
