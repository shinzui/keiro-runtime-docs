<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <text class="heading" x="24" y="24">runWorker · impure driver (Worker.hs)</text>
  <rect class="group" x="12" y="34" width="656" height="284" rx="10"/>

  <rect class="node" x="40" y="56" width="220" height="64" rx="6"/>
  <text class="title" x="150" y="81" text-anchor="middle">1 · Publish</text>
  <text class="code small" x="150" y="103" text-anchor="middle">writeTVar stateVar st</text>

  <rect class="node" x="420" y="56" width="220" height="64" rx="6"/>
  <text class="title" x="530" y="77" text-anchor="middle">2 · Sense</text>
  <text class="code small" x="530" y="96" text-anchor="middle">nextInput st</text>
  <text class="small muted" x="530" y="112" text-anchor="middle">the worker blocks here</text>

  <rect class="node accent" x="420" y="226" width="220" height="64" rx="6"/>
  <text class="title accent" x="530" y="247" text-anchor="middle">3 · Decide</text>
  <text class="code small" x="530" y="266" text-anchor="middle">step st inp</text>
  <text class="small accent" x="530" y="282" text-anchor="middle">pure, no I/O (Fsm.hs)</text>

  <rect class="node" x="40" y="226" width="220" height="64" rx="6"/>
  <text class="title" x="150" y="251" text-anchor="middle">4 · Act</text>
  <text class="code small" x="150" y="273" text-anchor="middle">runEffects st' effs</text>

  <path class="edge" d="M260 88 H414" marker-end="url(#arrow)"/>
  <text class="small muted" x="337" y="80" text-anchor="middle">then</text>

  <path class="edge" d="M530 120 V220" marker-end="url(#arrow)"/>
  <text class="code small" x="542" y="174">Input</text>

  <path class="edge" d="M420 244 H266" marker-end="url(#arrow)"/>
  <text class="code small" x="343" y="236" text-anchor="middle">(st', [Effect])</text>

  <path class="edge dashed amber" d="M260 272 H414" marker-end="url(#arrow-amber)"/>
  <text class="small amber" x="337" y="288" text-anchor="middle">follow-up Input</text>
  <text class="small amber" x="337" y="304" text-anchor="middle">(feed, no nextInput)</text>

  <path class="edge" d="M150 226 V126" marker-end="url(#arrow)"/>
  <text class="code small" x="162" y="170">loop st'</text>
  <text class="small muted" x="162" y="186">st' is not Stopped</text>

  <path class="edge green" d="M150 290 V340" marker-end="url(#arrow-green)"/>
  <text class="small green" x="162" y="330">st' is Stopped</text>
  <rect class="node green" x="40" y="346" width="220" height="34" rx="6"/>
  <text x="150" y="368" text-anchor="middle">exit the loop</text>
</svg>
