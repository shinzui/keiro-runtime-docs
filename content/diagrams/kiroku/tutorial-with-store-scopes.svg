<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <text class="heading" x="20" y="28">Start</text>
  <text class="heading" x="664" y="28" text-anchor="end">Stop</text>
  <rect class="group" x="124" y="40" width="432" height="270" rx="10"/>
  <text class="bold" x="140" y="64">Connection pool</text>
  <text class="small muted" x="262" y="64">each connection sets search_path</text>
  <rect class="group" x="144" y="80" width="392" height="210" rx="9"/>
  <text class="bold" x="160" y="104">Notifier</text>
  <text class="small muted" x="226" y="104">dedicated LISTEN connection</text>
  <rect class="group accent" x="164" y="120" width="352" height="150" rx="8"/>
  <text class="bold accent" x="180" y="144">EventPublisher</text>
  <text class="small muted" x="296" y="144">wakes on Notifier ticks</text>
  <rect class="node accent" x="184" y="160" width="312" height="90" rx="6"/>
  <text class="bold" x="340" y="190" text-anchor="middle">Your body</text>
  <text class="code small" x="340" y="212" text-anchor="middle">\store -&gt; …</text>
  <text class="small muted" x="340" y="234" text-anchor="middle">append, read, subscribe</text>
  <text class="small" x="20" y="64">1. pool</text>
  <text class="small" x="20" y="104">2. Notifier</text>
  <text class="small" x="20" y="144">3. publisher</text>
  <text class="small" x="20" y="209">4. body runs</text>
  <path class="edge" d="M108 52 V196" marker-end="url(#arrow)"/>
  <text class="small" x="572" y="274">1. publisher</text>
  <text class="small" x="572" y="294">2. Notifier</text>
  <text class="small" x="572" y="314">3. pool</text>
  <path class="edge" d="M662 258 V318" marker-end="url(#arrow)"/>
  <text class="small muted" x="572" y="240">on an exception</text>
  <text class="small muted" x="572" y="224">also runs</text>
</svg>
