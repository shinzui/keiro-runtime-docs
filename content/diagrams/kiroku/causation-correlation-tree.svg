<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 376">
  <!-- Flow c1 -->
  <rect class="group accent" x="16" y="16" width="456" height="344" rx="10"/>

  <rect class="group amber" x="30" y="32" width="180" height="52" rx="8"/>
  <text class="code small amber" x="222" y="46">findCausationAncestors e</text>
  <rect class="group amber" x="30" y="192" width="180" height="116" rx="8"/>
  <text class="code small amber" x="222" y="254">findCausationDescendants e</text>

  <path class="edge" d="M120 122 V78" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 122 V66 H204" marker-end="url(#arrow)"/>
  <path class="edge" d="M120 202 V158" marker-end="url(#arrow)"/>
  <path class="edge" d="M120 266 V238" marker-end="url(#arrow)"/>

  <rect class="node accent" x="40" y="42" width="160" height="32" rx="6"/>
  <text x="120" y="63" text-anchor="middle">OrderPlaced</text>
  <rect class="node accent" x="40" y="122" width="160" height="32" rx="6"/>
  <text class="bold" x="120" y="143" text-anchor="middle">PaymentRequested</text>
  <text class="small bold accent" x="210" y="143">e</text>
  <rect class="node accent" x="260" y="122" width="160" height="32" rx="6"/>
  <text x="340" y="143" text-anchor="middle">StockReserved</text>
  <rect class="node accent" x="40" y="202" width="160" height="32" rx="6"/>
  <text x="120" y="223" text-anchor="middle">PaymentCaptured</text>
  <rect class="node accent" x="40" y="266" width="160" height="32" rx="6"/>
  <text x="120" y="287" text-anchor="middle">ReceiptSent</text>

  <text class="small bold accent" x="30" y="332">correlationId c1</text>
  <text class="small muted" x="30" y="350">findByCorrelation c1 returns every event in this box.</text>

  <!-- Flow c2 -->
  <rect class="group violet" x="488" y="16" width="176" height="176" rx="10"/>
  <path class="edge" d="M576 122 V78" marker-end="url(#arrow)"/>
  <rect class="node violet" x="504" y="42" width="144" height="32" rx="6"/>
  <text x="576" y="63" text-anchor="middle">CartAbandoned</text>
  <rect class="node violet" x="504" y="122" width="144" height="32" rx="6"/>
  <text x="576" y="143" text-anchor="middle">ReminderSent</text>
  <text class="small bold violet" x="502" y="178">correlationId c2</text>

  <!-- Legend -->
  <path class="edge" d="M500 232 H540" marker-end="url(#arrow)"/>
  <text class="code small" x="550" y="236">causationId</text>
  <text class="small muted" x="500" y="260">Each arrow points from</text>
  <text class="small muted" x="500" y="278">a child to its parent.</text>
  <text class="small muted" x="500" y="306">Box color marks the</text>
  <text class="small muted" x="500" y="324">correlation id of a flow.</text>
</svg>
