<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 376">
  <!-- Flow c1: the causation chain A -> B -> C -> D -> E from the kiroku-store tests -->
  <rect class="group accent" x="16" y="16" width="456" height="344" rx="10"/>

  <path class="edge" d="M140 96 V78" marker-end="url(#arrow)"/>
  <path class="edge" d="M140 152 V134" marker-end="url(#arrow)"/>
  <path class="edge" d="M140 208 V190" marker-end="url(#arrow)"/>
  <path class="edge" d="M140 264 V246" marker-end="url(#arrow)"/>

  <rect class="node accent" x="80" y="40" width="120" height="32" rx="6"/>
  <text class="code" x="140" y="61" text-anchor="middle">A</text>
  <rect class="node accent" x="80" y="96" width="120" height="32" rx="6"/>
  <text class="code" x="140" y="117" text-anchor="middle">B</text>
  <rect class="node accent" x="80" y="152" width="120" height="32" rx="6"/>
  <text class="code bold" x="140" y="173" text-anchor="middle">C</text>
  <text class="small bold accent" x="70" y="173" text-anchor="end">e</text>
  <rect class="node accent" x="80" y="208" width="120" height="32" rx="6"/>
  <text class="code" x="140" y="229" text-anchor="middle">D</text>
  <rect class="node accent" x="80" y="264" width="120" height="32" rx="6"/>
  <text class="code" x="140" y="285" text-anchor="middle">E</text>

  <path class="axis amber" d="M210 40 H218 V184 H210"/>
  <text class="code small amber" x="230" y="100">findCausationAncestors e</text>
  <text class="small muted" x="230" y="118">returns C, B, A</text>
  <path class="axis amber" d="M210 152 H232 V296 H210"/>
  <text class="code small amber" x="244" y="236">findCausationDescendants e</text>
  <text class="small muted" x="244" y="254">returns C, D, E</text>

  <text class="small bold accent" x="30" y="326">correlationId c1</text>
  <text class="small muted" x="30" y="346">findByCorrelation c1 returns every event in this box.</text>

  <!-- Flow c2 -->
  <rect class="group violet" x="488" y="16" width="176" height="176" rx="10"/>
  <rect class="node violet" x="504" y="42" width="144" height="32" rx="6"/>
  <text class="code" x="576" y="63" text-anchor="middle">Other-1</text>
  <rect class="node violet" x="504" y="122" width="144" height="32" rx="6"/>
  <text class="code" x="576" y="143" text-anchor="middle">Other-2</text>
  <text class="small bold violet" x="502" y="178">correlationId c2</text>

  <!-- Legend -->
  <path class="edge" d="M500 232 H540" marker-end="url(#arrow)"/>
  <text class="code small" x="550" y="236">causationId</text>
  <text class="small muted" x="500" y="260">Each arrow points from</text>
  <text class="small muted" x="500" y="278">a child to its parent.</text>
  <text class="small muted" x="500" y="306">Box color marks the</text>
  <text class="small muted" x="500" y="324">correlation id of a flow.</text>
</svg>
