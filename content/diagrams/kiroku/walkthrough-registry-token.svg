<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318">
  <text class="code small muted" x="150" y="26">store ^. #subscriptionRegistry</text>
  <rect class="group" x="138" y="36" width="404" height="70" rx="8"/>
  <rect class="node" x="158" y="52" width="150" height="38" rx="5"/>
  <text class="code small" x="233" y="75" text-anchor="middle">(name, member)</text>
  <path class="edge" d="M308 71 H366" marker-end="url(#arrow)"/>
  <text class="small muted" x="337" y="64" text-anchor="middle">maps to</text>
  <rect class="node accent" x="372" y="52" width="150" height="38" rx="5"/>
  <text class="code small" x="447" y="75" text-anchor="middle">(t2, cell B)</text>

  <path class="edge dashed rose" d="M166 172 V140 H233 V96" marker-end="url(#arrow-rose)"/>
  <text class="small rose" x="156" y="162" text-anchor="end">lookup with t1</text>
  <path class="edge accent" d="M447 90 V140 H514 V166" marker-end="url(#arrow-accent)"/>
  <text class="small accent" x="524" y="160">points to cell B</text>

  <rect class="node muted" x="24" y="172" width="284" height="104" rx="6"/>
  <text class="title" x="40" y="196">Worker A · older</text>
  <text class="code small" x="40" y="216">token t1 · writes cell A</text>
  <text class="small" x="40" y="240">currentState returns Nothing.</text>
  <text class="small" x="40" y="258">cleanup keeps the entry: t1 ≠ t2.</text>

  <rect class="node green" x="372" y="172" width="284" height="104" rx="6"/>
  <text class="title" x="388" y="196">Worker B · newer</text>
  <text class="code small" x="388" y="216">token t2 · writes cell B</text>
  <text class="small" x="388" y="240">currentState returns Just s.</text>
  <text class="small" x="388" y="258">cleanup removes the entry on exit.</text>

  <text class="small muted" x="24" y="304">Both workers use the same key. The token decides which worker owns the entry.</text>
</svg>
