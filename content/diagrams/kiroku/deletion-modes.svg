<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 438">
  <text class="heading" x="30" y="24">Operation</text>
  <text class="heading" x="204" y="24">Direct stream reads</text>
  <text class="heading" x="440" y="24">$all log</text>

  <!-- Row 1: normal -->
  <rect class="band" x="16" y="36" width="648" height="80" rx="6"/>
  <text class="title" x="30" y="62">Normal stream</text>
  <text class="code small muted" x="30" y="82">orders-1</text>
  <rect class="node" x="204" y="48" width="36" height="28" rx="4"/>
  <text class="code small" x="222" y="66" text-anchor="middle">e1</text>
  <rect class="node" x="248" y="48" width="36" height="28" rx="4"/>
  <text class="code small" x="266" y="66" text-anchor="middle">e2</text>
  <rect class="node" x="292" y="48" width="36" height="28" rx="4"/>
  <text class="code small" x="310" y="66" text-anchor="middle">e3</text>
  <rect class="node" x="336" y="48" width="36" height="28" rx="4"/>
  <text class="code small" x="354" y="66" text-anchor="middle">e4</text>
  <rect class="node" x="380" y="48" width="36" height="28" rx="4"/>
  <text class="code small" x="398" y="66" text-anchor="middle">e5</text>
  <rect class="node accent" x="440" y="48" width="36" height="28" rx="4"/>
  <text class="code small" x="458" y="66" text-anchor="middle">e1</text>
  <rect class="node accent" x="484" y="48" width="36" height="28" rx="4"/>
  <text class="code small" x="502" y="66" text-anchor="middle">e2</text>
  <rect class="node accent" x="528" y="48" width="36" height="28" rx="4"/>
  <text class="code small" x="546" y="66" text-anchor="middle">e3</text>
  <rect class="node accent" x="572" y="48" width="36" height="28" rx="4"/>
  <text class="code small" x="590" y="66" text-anchor="middle">e4</text>
  <rect class="node accent" x="616" y="48" width="36" height="28" rx="4"/>
  <text class="code small" x="634" y="66" text-anchor="middle">e5</text>
  <text class="small muted" x="204" y="102">Every reader sees every event.</text>

  <!-- Row 2: soft delete -->
  <rect class="band" x="16" y="124" width="648" height="80" rx="6"/>
  <text class="title" x="30" y="150">Soft delete</text>
  <text class="code small muted" x="30" y="170">softDeleteStream</text>
  <rect class="node ghost dashed" x="204" y="136" width="36" height="28" rx="4"/>
  <text class="code small muted" x="222" y="154" text-anchor="middle">e1</text>
  <rect class="node ghost dashed" x="248" y="136" width="36" height="28" rx="4"/>
  <text class="code small muted" x="266" y="154" text-anchor="middle">e2</text>
  <rect class="node ghost dashed" x="292" y="136" width="36" height="28" rx="4"/>
  <text class="code small muted" x="310" y="154" text-anchor="middle">e3</text>
  <rect class="node ghost dashed" x="336" y="136" width="36" height="28" rx="4"/>
  <text class="code small muted" x="354" y="154" text-anchor="middle">e4</text>
  <rect class="node ghost dashed" x="380" y="136" width="36" height="28" rx="4"/>
  <text class="code small muted" x="398" y="154" text-anchor="middle">e5</text>
  <rect class="node accent" x="440" y="136" width="36" height="28" rx="4"/>
  <text class="code small" x="458" y="154" text-anchor="middle">e1</text>
  <rect class="node accent" x="484" y="136" width="36" height="28" rx="4"/>
  <text class="code small" x="502" y="154" text-anchor="middle">e2</text>
  <rect class="node accent" x="528" y="136" width="36" height="28" rx="4"/>
  <text class="code small" x="546" y="154" text-anchor="middle">e3</text>
  <rect class="node accent" x="572" y="136" width="36" height="28" rx="4"/>
  <text class="code small" x="590" y="154" text-anchor="middle">e4</text>
  <rect class="node accent" x="616" y="136" width="36" height="28" rx="4"/>
  <text class="code small" x="634" y="154" text-anchor="middle">e5</text>
  <text class="small muted" x="204" y="190">Reversible with undeleteStream.</text>

  <!-- Row 3: close the book -->
  <rect class="band" x="16" y="212" width="648" height="80" rx="6"/>
  <text class="title" x="30" y="238">Close the book</text>
  <text class="code small muted" x="30" y="258">setStreamTruncateBefore</text>
  <rect class="node ghost dashed" x="204" y="224" width="36" height="28" rx="4"/>
  <text class="code small muted" x="222" y="242" text-anchor="middle">e1</text>
  <rect class="node ghost dashed" x="248" y="224" width="36" height="28" rx="4"/>
  <text class="code small muted" x="266" y="242" text-anchor="middle">e2</text>
  <path class="axis amber" d="M288 218 V258"/>
  <rect class="node" x="292" y="224" width="36" height="28" rx="4"/>
  <text class="code small" x="310" y="242" text-anchor="middle">e3</text>
  <rect class="node" x="336" y="224" width="36" height="28" rx="4"/>
  <text class="code small" x="354" y="242" text-anchor="middle">e4</text>
  <rect class="node" x="380" y="224" width="36" height="28" rx="4"/>
  <text class="code small" x="398" y="242" text-anchor="middle">e5</text>
  <rect class="node accent" x="440" y="224" width="36" height="28" rx="4"/>
  <text class="code small" x="458" y="242" text-anchor="middle">e1</text>
  <rect class="node accent" x="484" y="224" width="36" height="28" rx="4"/>
  <text class="code small" x="502" y="242" text-anchor="middle">e2</text>
  <rect class="node accent" x="528" y="224" width="36" height="28" rx="4"/>
  <text class="code small" x="546" y="242" text-anchor="middle">e3</text>
  <rect class="node accent" x="572" y="224" width="36" height="28" rx="4"/>
  <text class="code small" x="590" y="242" text-anchor="middle">e4</text>
  <rect class="node accent" x="616" y="224" width="36" height="28" rx="4"/>
  <text class="code small" x="634" y="242" text-anchor="middle">e5</text>
  <text class="small muted" x="204" y="278">Marker at version 3. Reversible with clearStreamTruncateBefore.</text>

  <!-- Row 4: hard delete -->
  <rect class="band rose" x="16" y="300" width="648" height="80" rx="6"/>
  <text class="title" x="30" y="326">Hard delete</text>
  <text class="code small muted" x="30" y="346">hardDeleteStream</text>
  <rect class="node rose dashed" x="204" y="312" width="36" height="28" rx="4"/>
  <rect class="node rose dashed" x="248" y="312" width="36" height="28" rx="4"/>
  <rect class="node rose dashed" x="292" y="312" width="36" height="28" rx="4"/>
  <rect class="node rose dashed" x="336" y="312" width="36" height="28" rx="4"/>
  <rect class="node rose dashed" x="380" y="312" width="36" height="28" rx="4"/>
  <rect class="node rose dashed" x="440" y="312" width="36" height="28" rx="4"/>
  <rect class="node rose dashed" x="484" y="312" width="36" height="28" rx="4"/>
  <rect class="node rose dashed" x="528" y="312" width="36" height="28" rx="4"/>
  <rect class="node rose dashed" x="572" y="312" width="36" height="28" rx="4"/>
  <rect class="node rose dashed" x="616" y="312" width="36" height="28" rx="4"/>
  <text class="small rose" x="204" y="366">Irreversible. Needs kiroku.enable_hard_deletes for the session.</text>

  <!-- Legend -->
  <rect class="node" x="30" y="402" width="26" height="20" rx="4"/>
  <text class="small" x="64" y="416">visible</text>
  <rect class="node ghost dashed" x="140" y="402" width="26" height="20" rx="4"/>
  <text class="small" x="174" y="416">hidden, rows kept</text>
  <rect class="node rose dashed" x="316" y="402" width="26" height="20" rx="4"/>
  <text class="small" x="350" y="416">rows physically removed</text>
</svg>
