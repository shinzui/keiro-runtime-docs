  <rect class="node accent" x="390" y="498" width="120" height="20" rx="4"/>
  <text class="code small accent" x="450" y="512" text-anchor="middle">now</text>
  <rect class="node" x="530" y="498" width="120" height="20" rx="4"/>
  <text class="code small" x="590" y="512" text-anchor="middle">now</text>
  <rect class="band" x="16" y="528" width="648" height="28" rx="5"/>
