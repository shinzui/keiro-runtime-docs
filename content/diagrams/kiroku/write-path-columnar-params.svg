  <path class="edge" d="M340 562 V592" marker-end="url(#arrow)"/>
  <rect class="node accent" x="110" y="598" width="460" height="56" rx="6"/>
  <text class="code accent" x="340" y="621" text-anchor="middle">unnest($1, …, $7) WITH ORDINALITY</text>
  <text class="small" x="340" y="641" text-anchor="middle">3 rows with idx 1, 2, 3 · one statement, one round trip</text>
