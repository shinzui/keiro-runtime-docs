<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 296">
  <text class="heading rose" x="20" y="24">Pool checkout per statement</text>
  <rect class="node" x="32" y="40" width="284" height="32" rx="5"/>
  <text x="174" y="60" text-anchor="middle">runner</text>
  <path class="edge" d="M52 72 V122 H66" marker-end="url(#arrow)"/>
  <path class="edge" d="M52 122 V172 H66"/>
  <path class="edge" d="M52 172 V222 H66"/>
  <path class="edge" d="M60 172 H66" marker-end="url(#arrow)"/>
  <path class="edge" d="M60 222 H66" marker-end="url(#arrow)"/>
  <rect class="node" x="72" y="106" width="244" height="32" rx="5"/>
  <text x="194" y="126" text-anchor="middle">session A: statement_timeout</text>
  <rect class="node" x="72" y="156" width="244" height="32" rx="5"/>
  <text x="194" y="176" text-anchor="middle">session B: advisory lock</text>
  <rect class="node rose" x="72" y="206" width="244" height="32" rx="5"/>
  <text x="194" y="226" text-anchor="middle">session C: migration SQL</text>
  <text class="small rose" x="32" y="266">The lock and the timeout do not apply</text>
  <text class="small rose" x="32" y="282">to the session that runs the SQL.</text>

  <path class="axis dashed" d="M340 20 V286"/>

  <text class="heading accent" x="364" y="24">One dedicated connection</text>
  <rect class="node" x="380" y="40" width="284" height="32" rx="5"/>
  <text x="522" y="60" text-anchor="middle">runner</text>
  <path class="edge accent" d="M522 72 V96" marker-end="url(#arrow-accent)"/>
  <rect class="group accent" x="380" y="102" width="284" height="140" rx="8"/>
  <text class="small accent" x="394" y="120">one session for the whole operation</text>
  <rect class="node" x="396" y="130" width="252" height="28" rx="5"/>
  <text x="522" y="149" text-anchor="middle">statement_timeout</text>
  <rect class="node" x="396" y="166" width="252" height="28" rx="5"/>
  <text x="522" y="185" text-anchor="middle">advisory lock</text>
  <rect class="node accent" x="396" y="202" width="252" height="28" rx="5"/>
  <text x="522" y="221" text-anchor="middle">ledger and migration SQL</text>
  <text class="small accent" x="380" y="266">The lock and the timeout apply</text>
  <text class="small accent" x="380" y="282">to every statement.</text>
</svg>
