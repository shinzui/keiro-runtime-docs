  <rect class="node dashed" x="230" y="252" width="22" height="16" rx="3"/>
  <text class="small" x="260" y="264">appended, pending</text>
  <text class="small muted" x="20" y="290">Each ledger identity is a component name plus a migration name. Positions restart at 1 per component.</text>
