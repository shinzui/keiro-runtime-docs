  <rect class="node green" x="200" y="49" width="96" height="32" rx="5"/>
  <text class="code" x="248" y="69" text-anchor="middle">0001</text>
  <path class="edge" d="M296 65 H314" marker-end="url(#arrow)"/>
  <rect class="node green" x="320" y="49" width="96" height="32" rx="5"/>
  <text class="code" x="368" y="69" text-anchor="middle">0002</text>
  <path class="edge" d="M416 65 H434" marker-end="url(#arrow)"/>
  <rect class="node dashed" x="440" y="49" width="96" height="32" rx="5"/>
  <text class="code" x="488" y="69" text-anchor="middle">0003</text>

  <rect class="band" x="16" y="110" width="648" height="50" rx="6"/>
  <text class="code" x="32" y="132">billing</text>
  <text class="small muted" x="32" y="149">needs accounts</text>
  <rect class="node green" x="200" y="119" width="96" height="32" rx="5"/>
  <text class="code" x="248" y="139" text-anchor="middle">0001</text>
  <path class="edge" d="M296 135 H314" marker-end="url(#arrow)"/>
  <rect class="node dashed" x="320" y="119" width="96" height="32" rx="5"/>
  <text class="code" x="368" y="139" text-anchor="middle">0002</text>

  <rect class="band" x="16" y="180" width="648" height="50" rx="6"/>
  <text class="code" x="32" y="202">delivery</text>
  <text class="small muted" x="32" y="219">needs billing</text>
  <rect class="node dashed" x="200" y="189" width="96" height="32" rx="5"/>
  <text class="code" x="248" y="209" text-anchor="middle">0001</text>

  <path class="edge dashed accent" d="M536 65 H600 V100 H180 V135 H194" marker-end="url(#arrow-accent)"/>
  <path class="edge dashed accent" d="M416 135 H600 V170 H180 V205 H194" marker-end="url(#arrow-accent)"/>
