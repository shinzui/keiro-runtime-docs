<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270">
  <text class="small muted" x="20" y="44">another operation</text>
  <rect class="band amber" x="170" y="30" width="350" height="22" rx="4"/>
  <text class="small amber" x="345" y="45" text-anchor="middle">holds the advisory lock</text>

  <text class="code" x="20" y="94">WaitIndefinitely</text>
  <path class="edge dotted" d="M170 90 H514"/>
  <text class="small muted halo" x="345" y="84" text-anchor="middle">waits</text>
  <rect class="node accent" x="520" y="76" width="140" height="28" rx="5"/>
  <text x="590" y="95" text-anchor="middle">acquires, runs</text>

  <text class="code" x="20" y="144">WaitFor 30</text>
  <path class="edge dotted" d="M170 140 H364"/>
  <circle class="dot rose" cx="370" cy="140" r="5"/>
  <text class="code small rose" x="382" y="144">AdvisoryLockTimedOut</text>

  <text class="code" x="20" y="194">NoWait</text>
  <circle class="dot rose" cx="170" cy="190" r="5"/>
  <text class="code small rose" x="182" y="194">AdvisoryLockUnavailable</text>

  <path class="axis" d="M170 228 H664" marker-end="url(#arrow)"/>
  <path class="axis dashed" d="M170 60 V228"/>
  <path class="axis dashed" d="M370 154 V228"/>
  <path class="axis dashed" d="M520 60 V72"/>
  <path class="axis dashed" d="M520 108 V228"/>
  <text class="small muted" x="170" y="246" text-anchor="middle">operation starts</text>
  <text class="small muted" x="370" y="246" text-anchor="middle">30 s</text>
  <text class="small muted" x="520" y="246" text-anchor="middle">holder releases</text>
  <text class="small muted" x="664" y="262" text-anchor="end">time</text>
</svg>
