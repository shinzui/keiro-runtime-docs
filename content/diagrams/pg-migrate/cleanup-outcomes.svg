<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 252">
  <text class="heading" x="20" y="24">Primary outcome</text>
  <text class="heading" x="250" y="24">Cleanup</text>
  <text class="heading" x="480" y="24">Reported result</text>
  <text class="small muted" x="250" y="40">restore timeout, then unlock</text>

  <rect class="node green" x="16" y="54" width="190" height="44" rx="5"/>
  <text x="111" y="72" text-anchor="middle">SQL and ledger rows</text>
  <text x="111" y="89" text-anchor="middle">committed</text>
  <path class="edge" d="M206 76 H240" marker-end="url(#arrow)"/>
  <rect class="node amber" x="246" y="54" width="190" height="44" rx="5"/>
  <text x="341" y="81" text-anchor="middle">trouble observed</text>
  <path class="edge" d="M436 76 H470" marker-end="url(#arrow)"/>
  <rect class="node green" x="476" y="54" width="188" height="44" rx="5"/>
  <text x="570" y="72" text-anchor="middle">successful report</text>
  <text class="code small" x="570" y="89" text-anchor="middle">cleanupIssues</text>

  <rect class="node rose" x="16" y="118" width="190" height="44" rx="5"/>
  <text x="111" y="145" text-anchor="middle">primary error</text>
  <path class="edge" d="M206 140 H240" marker-end="url(#arrow)"/>
  <rect class="node amber" x="246" y="118" width="190" height="44" rx="5"/>
  <text x="341" y="145" text-anchor="middle">trouble observed</text>
  <path class="edge" d="M436 140 H470" marker-end="url(#arrow)"/>
  <rect class="node rose" x="476" y="118" width="188" height="44" rx="5"/>
  <text class="code small" x="570" y="136" text-anchor="middle">CleanupFailed</text>
  <text class="code small" x="570" y="153" text-anchor="middle">primary issues</text>

  <rect class="node amber" x="16" y="182" width="190" height="44" rx="5"/>
  <text x="111" y="200" text-anchor="middle">asynchronous</text>
  <text x="111" y="217" text-anchor="middle">interruption</text>
  <path class="edge" d="M206 204 H240" marker-end="url(#arrow)"/>
  <rect class="node" x="246" y="182" width="190" height="44" rx="5"/>
  <text x="341" y="209" text-anchor="middle">cleanup attempted</text>
  <path class="edge" d="M436 204 H470" marker-end="url(#arrow)"/>
  <rect class="node amber" x="476" y="182" width="188" height="44" rx="5"/>
  <text x="570" y="200" text-anchor="middle">exception rethrown</text>
  <text x="570" y="217" text-anchor="middle">after cleanup</text>
  <text class="small muted" x="20" y="246">Cleanup trouble never replaces the primary outcome. It is reported next to it.</text>
</svg>
