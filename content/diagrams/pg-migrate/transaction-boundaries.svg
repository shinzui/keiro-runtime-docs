<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318">
  <text class="heading" x="20" y="24">Transactional migration</text>
  <rect class="group accent" x="16" y="36" width="420" height="72" rx="8"/>
  <text class="small accent" x="30" y="54">one PostgreSQL transaction</text>
  <rect class="node" x="30" y="64" width="176" height="32" rx="5"/>
  <text x="118" y="84" text-anchor="middle">migration SQL</text>
  <path class="edge" d="M206 80 H238" marker-end="url(#arrow)"/>
  <rect class="node" x="244" y="64" width="176" height="32" rx="5"/>
  <text x="332" y="84" text-anchor="middle">insert applied row</text>
  <path class="edge green" d="M436 56 H456" marker-end="url(#arrow-green)"/>
  <rect class="node green" x="462" y="40" width="202" height="32" rx="5"/>
  <text class="green" x="563" y="60" text-anchor="middle">commit: both persist</text>
  <path class="edge rose" d="M436 92 H456" marker-end="url(#arrow-rose)"/>
  <rect class="node rose" x="462" y="76" width="202" height="32" rx="5"/>
  <text class="rose" x="563" y="96" text-anchor="middle">failure: both roll back</text>

  <text class="heading" x="20" y="152">Nontransactional migration</text>
  <rect class="group" x="16" y="164" width="200" height="72" rx="8"/>
  <text class="small muted" x="28" y="182">transaction 1</text>
  <rect class="node" x="28" y="192" width="176" height="32" rx="5"/>
  <text x="116" y="212" text-anchor="middle">insert running row</text>
  <rect class="group amber" x="240" y="164" width="200" height="72" rx="8"/>
  <text class="small amber" x="252" y="182">no transaction</text>
  <rect class="node amber" x="252" y="192" width="176" height="32" rx="5"/>
  <text x="340" y="212" text-anchor="middle">one SQL statement</text>
  <rect class="group" x="464" y="164" width="200" height="72" rx="8"/>
  <text class="small muted" x="476" y="182">transaction 2</text>
  <rect class="node" x="476" y="192" width="176" height="32" rx="5"/>
  <text x="564" y="212" text-anchor="middle">mark applied or failed</text>
  <path class="edge" d="M204 208 H246" marker-end="url(#arrow)"/>
  <path class="edge" d="M428 208 H470" marker-end="url(#arrow)"/>

  <text class="small muted" x="20" y="268">ledger status</text>
  <rect class="band amber" x="116" y="254" width="348" height="22" rx="4"/>
  <text class="small amber" x="290" y="269" text-anchor="middle">running: the effect is unknown if interrupted</text>
  <rect class="band green" x="468" y="254" width="196" height="22" rx="4"/>
  <text class="small green" x="566" y="269" text-anchor="middle">applied or failed</text>
  <path class="axis" d="M116 290 H664" marker-end="url(#arrow)"/>
  <text class="small muted" x="116" y="308">time</text>
</svg>
