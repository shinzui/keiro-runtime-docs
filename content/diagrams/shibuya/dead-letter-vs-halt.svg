<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <text class="heading" x="16" y="24">Ordered stream feeding a projection</text>

  <text class="code bold" x="16" y="62">AckDeadLetter</text>
  <rect class="band" x="140" y="38" width="524" height="88" rx="6"/>
  <rect class="node green" x="156" y="46" width="96" height="30" rx="5"/>
  <text class="small" x="204" y="66" text-anchor="middle">earlier</text>
  <rect class="node rose" x="286" y="46" width="96" height="30" rx="5"/>
  <text class="code" x="334" y="66" text-anchor="middle">42</text>
  <rect class="node amber" x="416" y="46" width="96" height="30" rx="5"/>
  <text class="code" x="464" y="66" text-anchor="middle">43</text>
  <rect class="node amber" x="546" y="46" width="96" height="30" rx="5"/>
  <text class="small" x="594" y="66" text-anchor="middle">later</text>
  <path class="edge" d="M252 61 H282" marker-end="url(#arrow)"/>
  <path class="edge" d="M382 61 H412" marker-end="url(#arrow)"/>
  <path class="edge" d="M512 61 H542" marker-end="url(#arrow)"/>
  <text class="small rose" x="334" y="98" text-anchor="middle">leaves processing</text>
  <text class="small amber" x="529" y="98" text-anchor="middle">applied without 42</text>
  <text class="small muted" x="156" y="116">Later messages continue. Safe only when they do not depend on 42.</text>

  <text class="code bold" x="16" y="166">AckHalt</text>
  <rect class="band" x="140" y="142" width="524" height="88" rx="6"/>
  <rect class="node green" x="156" y="150" width="96" height="30" rx="5"/>
  <text class="small" x="204" y="170" text-anchor="middle">earlier</text>
  <rect class="node rose" x="286" y="150" width="96" height="30" rx="5"/>
  <text class="code" x="334" y="170" text-anchor="middle">42</text>
  <rect class="node ghost" x="416" y="150" width="96" height="30" rx="5"/>
  <text class="code muted" x="464" y="170" text-anchor="middle">43</text>
  <rect class="node ghost" x="546" y="150" width="96" height="30" rx="5"/>
  <text class="small muted" x="594" y="170" text-anchor="middle">later</text>
  <path class="edge" d="M252 165 H282" marker-end="url(#arrow)"/>
  <path class="axis rose" d="M399 146 V184"/>
  <text class="small rose" x="334" y="202" text-anchor="middle">processor stops</text>
  <text class="small muted" x="529" y="202" text-anchor="middle">not applied</text>
  <text class="small muted" x="156" y="220">Nothing after 42 is applied, so the projection does not skip 42.</text>

  <rect class="node green" x="156" y="256" width="16" height="16" rx="3"/>
  <text class="small muted" x="180" y="268">applied</text>
  <rect class="node rose" x="250" y="256" width="16" height="16" rx="3"/>
  <text class="small muted" x="274" y="268">cannot be applied</text>
  <rect class="node amber" x="400" y="256" width="16" height="16" rx="3"/>
  <text class="small muted" x="424" y="268">applied after a gap</text>
</svg>
