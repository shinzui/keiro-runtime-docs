<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <text class="heading" x="16" y="24">Ordered stream feeding a projection</text>

  <text class="code bold" x="16" y="62">AckDeadLetter</text>
  <rect class="band" x="140" y="38" width="524" height="88" rx="6"/>
  <rect class="node green" x="156" y="46" width="70" height="30" rx="5"/>
  <text class="code" x="191" y="66" text-anchor="middle">40</text>
  <rect class="node green" x="256" y="46" width="70" height="30" rx="5"/>
  <text class="code" x="291" y="66" text-anchor="middle">41</text>
  <rect class="node rose" x="356" y="46" width="70" height="30" rx="5"/>
  <text class="code" x="391" y="66" text-anchor="middle">42</text>
  <rect class="node amber" x="456" y="46" width="70" height="30" rx="5"/>
  <text class="code" x="491" y="66" text-anchor="middle">43</text>
  <rect class="node amber" x="556" y="46" width="70" height="30" rx="5"/>
  <text class="code" x="591" y="66" text-anchor="middle">44</text>
  <path class="edge" d="M226 61 H252" marker-end="url(#arrow)"/>
  <path class="edge" d="M326 61 H352" marker-end="url(#arrow)"/>
  <path class="edge" d="M426 61 H452" marker-end="url(#arrow)"/>
  <path class="edge" d="M526 61 H552" marker-end="url(#arrow)"/>
  <text class="small rose" x="391" y="98" text-anchor="middle">leaves processing</text>
  <text class="small amber" x="541" y="98" text-anchor="middle">applied without 42</text>
  <text class="small muted" x="156" y="116">Later messages continue. Safe only when they do not depend on 42.</text>

  <text class="code bold" x="16" y="166">AckHalt</text>
  <rect class="band" x="140" y="142" width="524" height="88" rx="6"/>
  <rect class="node green" x="156" y="150" width="70" height="30" rx="5"/>
  <text class="code" x="191" y="170" text-anchor="middle">40</text>
  <rect class="node green" x="256" y="150" width="70" height="30" rx="5"/>
  <text class="code" x="291" y="170" text-anchor="middle">41</text>
  <rect class="node rose" x="356" y="150" width="70" height="30" rx="5"/>
  <text class="code" x="391" y="170" text-anchor="middle">42</text>
  <rect class="node ghost" x="456" y="150" width="70" height="30" rx="5"/>
  <text class="code muted" x="491" y="170" text-anchor="middle">43</text>
  <rect class="node ghost" x="556" y="150" width="70" height="30" rx="5"/>
  <text class="code muted" x="591" y="170" text-anchor="middle">44</text>
  <path class="edge" d="M226 165 H252" marker-end="url(#arrow)"/>
  <path class="edge" d="M326 165 H352" marker-end="url(#arrow)"/>
  <path class="axis rose" d="M441 146 V184"/>
  <text class="small rose" x="391" y="202" text-anchor="middle">processor stops</text>
  <text class="small muted" x="541" y="202" text-anchor="middle">not applied</text>
  <text class="small muted" x="156" y="220">Nothing after 42 is applied, so the projection does not skip 42.</text>

  <rect class="node green" x="156" y="256" width="16" height="16" rx="3"/>
  <text class="small muted" x="180" y="268">applied</text>
  <rect class="node rose" x="250" y="256" width="16" height="16" rx="3"/>
  <text class="small muted" x="274" y="268">cannot be applied</text>
  <rect class="node amber" x="400" y="256" width="16" height="16" rx="3"/>
  <text class="small muted" x="424" y="268">applied after a gap</text>
</svg>
