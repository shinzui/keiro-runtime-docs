<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330">
  <text class="heading" x="16" y="24">Readiness: every input must hold</text>

  <rect class="node" x="16" y="36" width="384" height="34" rx="5"/>
  <text class="small" x="30" y="57">Application is running and accepts work</text>
  <rect class="node" x="16" y="78" width="384" height="34" rx="5"/>
  <text class="small" x="30" y="99">Every running processor appears in the metrics map</text>
  <rect class="node" x="16" y="120" width="384" height="34" rx="5"/>
  <text class="small" x="30" y="141">Every dependency check is healthy</text>
  <rect class="node rose" x="16" y="162" width="384" height="34" rx="5"/>
  <text class="small" x="30" y="183">No processor is <tspan class="code">Failed</tspan>, live or retained</text>
  <rect class="node amber" x="16" y="204" width="384" height="34" rx="5"/>
  <text class="small" x="30" y="225">No processor is stuck: now − lastProgress ≤ stuckThreshold</text>

  <path class="edge" d="M400 53 H424 V137"/>
  <path class="edge" d="M400 95 H424"/>
  <path class="edge" d="M400 137 H436" marker-end="url(#arrow)"/>
  <path class="edge" d="M400 179 H424"/>
  <path class="edge" d="M400 221 H424 V137"/>

  <rect class="node accent" x="440" y="117" width="72" height="40" rx="20"/>
  <text class="bold accent" x="476" y="141" text-anchor="middle">all</text>
  <path class="edge accent" d="M512 137 H536" marker-end="url(#arrow-accent)"/>
  <rect class="node accent" x="540" y="117" width="124" height="40" rx="5"/>
  <text class="code small" x="602" y="134" text-anchor="middle">/health/ready</text>
  <text class="small" x="602" y="150" text-anchor="middle">ready = true</text>

  <path class="axis dashed" d="M16 262 H664"/>
  <text class="heading" x="16" y="286">Liveness</text>
  <text class="small" x="100" y="286">The master is not stopped and answers before livenessTimeoutMicros.</text>
  <text class="code small" x="100" y="308">/health/live</text>
</svg>
