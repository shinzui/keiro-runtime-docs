<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290">
  <text class="heading" x="16" y="28">Decision</text>
  <text class="heading" x="196" y="28">This message</text>
  <text class="heading" x="476" y="28">The processor</text>

  <rect class="node green" x="16" y="40" width="164" height="50" rx="5"/>
  <text class="code bold" x="98" y="70" text-anchor="middle">AckOk</text>
  <rect class="node" x="190" y="40" width="276" height="50" rx="5"/>
  <text class="small" x="204" y="60">Done. The adapter deletes, archives,</text>
  <text class="small" x="204" y="78">commits an offset, or advances a cursor.</text>
  <rect class="node" x="476" y="40" width="188" height="50" rx="5"/>
  <text class="small" x="490" y="69">continues</text>

  <rect class="node amber" x="16" y="100" width="164" height="50" rx="5"/>
  <text class="code bold" x="98" y="122" text-anchor="middle">AckRetry</text>
  <text class="code small muted" x="98" y="140" text-anchor="middle">RetryDelay</text>
  <rect class="node" x="190" y="100" width="276" height="50" rx="5"/>
  <text class="small" x="204" y="120">Runs again after the delay, as closely</text>
  <text class="small" x="204" y="138">as the backend can honor it.</text>
  <rect class="node" x="476" y="100" width="188" height="50" rx="5"/>
  <text class="small" x="490" y="129">continues</text>

  <rect class="node rose" x="16" y="160" width="164" height="50" rx="5"/>
  <text class="code bold" x="98" y="182" text-anchor="middle">AckDeadLetter</text>
  <text class="code small muted" x="98" y="200" text-anchor="middle">DeadLetterReason</text>
  <rect class="node" x="190" y="160" width="276" height="50" rx="5"/>
  <text class="small" x="204" y="180">Leaves normal processing with a</text>
  <text class="small" x="204" y="198">reason. It is not retried.</text>
  <rect class="node" x="476" y="160" width="188" height="50" rx="5"/>
  <text class="small" x="490" y="189">continues</text>

  <rect class="node rose" x="16" y="220" width="164" height="50" rx="5"/>
  <text class="code bold" x="98" y="242" text-anchor="middle">AckHalt</text>
  <text class="code small muted" x="98" y="260" text-anchor="middle">HaltReason</text>
  <rect class="node ghost" x="190" y="220" width="276" height="50" rx="5"/>
  <text class="small muted" x="204" y="249">The adapter applies its halt effect.</text>
  <rect class="node rose" x="476" y="220" width="188" height="50" rx="5"/>
  <text class="small bold rose" x="490" y="240">stops</text>
  <text class="small" x="490" y="258">continuing is unsafe</text>
</svg>
