<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330">
  <text class="heading" x="16" y="24">BatchAck from the handler</text>
  <rect class="node violet" x="16" y="34" width="648" height="74" rx="6"/>
  <text class="code small" x="32" y="58">decisions = { m2 ↦ AckRetry (RetryDelay 30),</text>
  <text class="code small" x="129" y="76">m4 ↦ AckDeadLetter (InvalidPayload "e"), m9 ↦ AckOk }</text>
  <text class="code small" x="32" y="96">fallback = AckOk</text>

  <text class="heading" x="16" y="140">Retained batch</text>
  <text class="heading" x="250" y="140">Source</text>
  <text class="heading" x="400" y="140">Resolved decision</text>

  <rect class="node" x="16" y="152" width="120" height="30" rx="5"/>
  <text class="code" x="76" y="172" text-anchor="middle">m1</text>
  <path class="edge muted" d="M136 167 H396" marker-end="url(#arrow)"/>
  <text class="small muted halo" x="250" y="171">fallback</text>
  <rect class="node green" x="400" y="152" width="264" height="30" rx="5"/>
  <text class="code small" x="414" y="171">AckOk</text>

  <rect class="node" x="16" y="192" width="120" height="30" rx="5"/>
  <text class="code" x="76" y="212" text-anchor="middle">m2</text>
  <path class="edge violet" d="M136 207 H396" marker-end="url(#arrow-violet)"/>
  <text class="small violet halo" x="250" y="211">decisions</text>
  <rect class="node amber" x="400" y="192" width="264" height="30" rx="5"/>
  <text class="code small" x="414" y="211">AckRetry (RetryDelay 30)</text>

  <rect class="node" x="16" y="232" width="120" height="30" rx="5"/>
  <text class="code" x="76" y="252" text-anchor="middle">m3</text>
  <path class="edge muted" d="M136 247 H396" marker-end="url(#arrow)"/>
  <text class="small muted halo" x="250" y="251">fallback</text>
  <rect class="node green" x="400" y="232" width="264" height="30" rx="5"/>
  <text class="code small" x="414" y="251">AckOk</text>

  <rect class="node" x="16" y="272" width="120" height="30" rx="5"/>
  <text class="code" x="76" y="292" text-anchor="middle">m4</text>
  <path class="edge violet" d="M136 287 H396" marker-end="url(#arrow-violet)"/>
  <text class="small violet halo" x="250" y="291">decisions</text>
  <rect class="node rose" x="400" y="272" width="264" height="30" rx="5"/>
  <text class="code small" x="414" y="291">AckDeadLetter (InvalidPayload "e")</text>

  <text class="small muted" x="16" y="322">m9 is not in the batch, so its entry is not used.</text>
</svg>
