<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <text class="heading" x="16" y="24">Metrics: what the processors do now</text>

  <rect class="node" x="16" y="56" width="130" height="32" rx="5"/>
  <text class="small" x="81" y="76" text-anchor="middle">orders loop</text>
  <rect class="node" x="16" y="120" width="130" height="32" rx="5"/>
  <text class="small" x="81" y="140" text-anchor="middle">payments loop</text>

  <rect class="node" x="176" y="56" width="160" height="32" rx="5"/>
  <text class="code small" x="256" y="76" text-anchor="middle">ProcessorMetrics</text>
  <rect class="node" x="176" y="120" width="160" height="32" rx="5"/>
  <text class="code small" x="256" y="140" text-anchor="middle">ProcessorMetrics</text>

  <rect class="node accent" x="366" y="56" width="120" height="96" rx="5"/>
  <text class="code bold accent" x="426" y="92" text-anchor="middle">Master</text>
  <text class="small" x="426" y="112" text-anchor="middle">metrics map</text>
  <text class="small" x="426" y="128" text-anchor="middle">and lifecycle</text>

  <rect class="node" x="516" y="40" width="148" height="164" rx="5"/>
  <text class="bold" x="590" y="62" text-anchor="middle">metrics server</text>
  <text class="code small" x="530" y="88">/metrics</text>
  <text class="code small" x="530" y="110">/metrics/prometheus</text>
  <text class="code small" x="530" y="132">/health/live</text>
  <text class="code small" x="530" y="154">/health/ready</text>
  <text class="code small" x="530" y="176">/ws</text>

  <path class="edge" d="M146 72 H172" marker-end="url(#arrow)"/>
  <path class="edge" d="M146 136 H172" marker-end="url(#arrow)"/>
  <path class="edge" d="M336 72 H362" marker-end="url(#arrow)"/>
  <path class="edge" d="M336 136 H362" marker-end="url(#arrow)"/>
  <path class="edge accent" d="M486 104 H512" marker-end="url(#arrow-accent)"/>
  <text class="small muted" x="256" y="178" text-anchor="middle">one TVar per processor</text>

  <path class="axis dashed" d="M16 226 H664"/>

  <text class="heading" x="16" y="254">Traces: what happened to one message</text>
  <rect class="node" x="16" y="270" width="180" height="44" rx="5"/>
  <text class="code small" x="106" y="297" text-anchor="middle">Envelope.traceContext</text>
