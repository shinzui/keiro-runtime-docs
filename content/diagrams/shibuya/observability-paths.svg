  <text class="code small violet" x="336" y="288" text-anchor="middle">"orders process"</text>
  <text class="small" x="336" y="305" text-anchor="middle">Consumer span per handler call</text>
  <rect class="node" x="476" y="270" width="188" height="44" rx="5"/>
  <text class="small" x="570" y="297" text-anchor="middle">status from AckDecision</text>
  <path class="edge" d="M196 292 H232" marker-end="url(#arrow)"/>
  <text class="small muted" x="214" y="284" text-anchor="middle">parent</text>
  <path class="edge" d="M436 292 H472" marker-end="url(#arrow)"/>
