<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <rect class="band violet" x="16" y="30" width="648" height="70" rx="6"/>
  <text class="heading violet" x="28" y="48">Adapter</text>
  <rect class="band accent" x="16" y="110" width="648" height="70" rx="6"/>
  <text class="heading accent" x="28" y="128">Runner</text>
  <rect class="band" x="16" y="190" width="648" height="70" rx="6"/>
  <text class="heading" x="28" y="208">Handler code</text>

  <path class="edge" d="M100 88 V152 H186" marker-end="url(#arrow)"/>
  <text class="code small" x="108" y="127">Ingested</text>
  <path class="edge" d="M310 152 H336" marker-end="url(#arrow)"/>
  <path class="edge" d="M400 168 V212" marker-end="url(#arrow)"/>
  <text class="code small" x="408" y="195">Message</text>
  <path class="edge accent" d="M460 232 H570 V172" marker-end="url(#arrow-accent)"/>
  <text class="code small accent" x="476" y="224">AckDecision</text>
  <path class="edge" d="M570 136 V92" marker-end="url(#arrow)"/>

  <rect class="node" x="35" y="56" width="130" height="32" rx="5"/>
  <text class="code" x="100" y="76" text-anchor="middle">Adapter.source</text>
  <rect class="node" x="190" y="136" width="120" height="32" rx="5"/>
  <text x="250" y="156" text-anchor="middle">bounded inbox</text>
  <rect class="node" x="340" y="136" width="120" height="32" rx="5"/>
  <text class="code" x="400" y="156" text-anchor="middle">toMessage</text>
  <rect class="node" x="340" y="216" width="120" height="32" rx="5"/>
  <text class="code" x="400" y="236" text-anchor="middle">Handler</text>
  <rect class="node accent" x="490" y="136" width="160" height="32" rx="5"/>
  <text class="code accent" x="570" y="156" text-anchor="middle">ack.finalize</text>
  <rect class="node violet" x="490" y="56" width="160" height="32" rx="5"/>
  <text x="570" y="76" text-anchor="middle">backend effect</text>

  <text class="small muted" x="28" y="284">The handler returns a decision. Only the runner calls the ack handle.</text>
</svg>
