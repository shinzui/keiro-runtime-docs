<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236">
  <text class="small accent" x="150" y="22">graceful phase, bounded by totalShutdownTimeout = 55 s</text>
  <rect class="group accent" x="146" y="32" width="417" height="94" rx="6"/>

  <text class="small" x="16" y="72">adapter shutdown</text>
  <rect class="node violet" x="150" y="58" width="22" height="22" rx="3"/>

  <text class="small" x="16" y="108">drain</text>
  <rect class="node accent" x="172" y="94" width="338" height="22" rx="3"/>
  <text class="small" x="341" y="109" text-anchor="middle">wait for processors, up to drainTimeout = 45 s</text>

  <text class="small" x="16" y="152">master cleanup</text>
  <rect class="node amber" x="510" y="138" width="24" height="22" rx="3"/>
  <text class="small muted" x="502" y="153" text-anchor="end">starts when the graceful phase ends; always attempted</text>

  <path class="edge dashed rose" d="M600 32 V180"/>
  <text class="code small rose" x="596" y="224" text-anchor="end">terminationGracePeriodSeconds: 60</text>

  <path class="axis" d="M150 180 H620"/>
  <path class="axis" d="M150 176 V184"/>
  <path class="axis" d="M262.5 176 V184"/>
  <path class="axis" d="M375 176 V184"/>
  <path class="axis" d="M487.5 176 V184"/>
  <path class="axis" d="M600 176 V184"/>
  <text class="small muted" x="150" y="200" text-anchor="middle">0 s</text>
  <text class="small muted" x="262.5" y="200" text-anchor="middle">15 s</text>
  <text class="small muted" x="375" y="200" text-anchor="middle">30 s</text>
  <text class="small muted" x="487.5" y="200" text-anchor="middle">45 s</text>
  <text class="small muted" x="600" y="200" text-anchor="middle">60 s</text>
  <text class="small muted" x="16" y="200">elapsed</text>
</svg>
