<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <text class="heading" x="20" y="40">OrderingPolicy</text>
  <text class="heading" x="421" y="16" text-anchor="middle">Concurrency</text>
  <text class="code bold" x="259" y="40" text-anchor="middle">Serial</text>
  <text class="code bold" x="421" y="40" text-anchor="middle">Ahead n</text>
  <text class="code bold" x="583" y="40" text-anchor="middle">Async n</text>

  <text class="code bold" x="20" y="89">StrictInOrder</text>
  <rect class="node green" x="180" y="58" width="158" height="52" rx="5"/>
  <text class="green" x="259" y="89" text-anchor="middle">accepted</text>
  <rect class="node rose" x="342" y="58" width="158" height="52" rx="5"/>
  <text class="rose" x="421" y="81" text-anchor="middle">rejected</text>
  <text class="code small muted" x="421" y="99" text-anchor="middle">validatePolicy</text>
  <rect class="node rose" x="504" y="58" width="158" height="52" rx="5"/>
  <text class="rose" x="583" y="81" text-anchor="middle">rejected</text>
  <text class="code small muted" x="583" y="99" text-anchor="middle">validatePolicy</text>

  <text class="code bold" x="20" y="149">PartitionedInOrder</text>
  <rect class="node green" x="180" y="118" width="158" height="52" rx="5"/>
  <text class="green" x="259" y="149" text-anchor="middle">accepted</text>
  <rect class="node accent" x="342" y="118" width="158" height="52" rx="5"/>
  <text class="accent" x="421" y="141" text-anchor="middle">keyed by partition</text>
  <text class="small muted" x="421" y="159" text-anchor="middle">single-message only</text>
  <rect class="node accent" x="504" y="118" width="158" height="52" rx="5"/>
  <text class="accent" x="583" y="141" text-anchor="middle">keyed by partition</text>
  <text class="small muted" x="583" y="159" text-anchor="middle">single-message only</text>

  <text class="code bold" x="20" y="209">Unordered</text>
  <rect class="node green" x="180" y="178" width="158" height="52" rx="5"/>
  <text class="green" x="259" y="209" text-anchor="middle">accepted</text>
  <rect class="node green" x="342" y="178" width="158" height="52" rx="5"/>
  <text class="green" x="421" y="209" text-anchor="middle">accepted</text>
  <rect class="node green" x="504" y="178" width="158" height="52" rx="5"/>
  <text class="green" x="583" y="209" text-anchor="middle">accepted</text>

  <text class="small muted" x="20" y="262">runApp rejects PartitionedInOrder with Ahead or Async for a BatchingProcessor.</text>
</svg>
