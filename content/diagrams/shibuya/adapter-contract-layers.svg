  <text class="code small" x="263" y="308" text-anchor="middle">toMessage</text>
  <rect class="node" x="362" y="288" width="130" height="32" rx="5"/>
  <text class="code small" x="427" y="308" text-anchor="middle">Handler</text>
  <rect class="node accent" x="526" y="288" width="130" height="32" rx="5"/>
  <text class="code small" x="591" y="308" text-anchor="middle">ack.finalize</text>
  <path class="edge" d="M164 304 H194" marker-end="url(#arrow)"/>
  <path class="edge" d="M328 304 H358" marker-end="url(#arrow)"/>
