  <rect class="node muted" x="511" y="34" width="153" height="34" rx="5"/>
  <text x="587" y="55" text-anchor="middle">test data</text>

  <rect class="band violet" x="16" y="92" width="648" height="116" rx="6"/>
  <text class="heading violet" x="28" y="196">Adapters own polling, decoding, leases, cursors, ack effects</text>
  <path class="edge" d="M92 68 V96" marker-end="url(#arrow)"/>
  <path class="edge" d="M257 68 V96" marker-end="url(#arrow)"/>
  <path class="edge" d="M422 68 V96" marker-end="url(#arrow)"/>
  <path class="edge" d="M587 68 V96" marker-end="url(#arrow)"/>
  <rect class="node" x="26" y="100" width="133" height="72" rx="5"/>
  <text class="small bold" x="92" y="120" text-anchor="middle">pgmq adapter</text>
  <text class="small" x="92" y="140" text-anchor="middle">Attempt from read count</text>
  <text class="small" x="92" y="158" text-anchor="middle">retry by visibility</text>
  <rect class="node" x="191" y="100" width="133" height="72" rx="5"/>
  <text class="small bold" x="257" y="120" text-anchor="middle">Kafka adapter</text>
  <text class="small" x="257" y="140" text-anchor="middle">partition metadata</text>
  <text class="small" x="257" y="158" text-anchor="middle">commit offsets</text>
  <rect class="node" x="356" y="100" width="133" height="72" rx="5"/>
  <text class="small bold" x="422" y="120" text-anchor="middle">kiroku adapter</text>
  <text class="small" x="422" y="140" text-anchor="middle">store positions</text>
  <text class="small" x="422" y="158" text-anchor="middle">as cursors</text>
  <rect class="node" x="521" y="100" width="133" height="72" rx="5"/>
  <text class="small bold" x="587" y="120" text-anchor="middle">mock adapter</text>
  <text class="small" x="587" y="140" text-anchor="middle">records decisions</text>
  <text class="small" x="587" y="158" text-anchor="middle">in an IORef</text>

  <path class="edge" d="M92 208 V250" marker-end="url(#arrow)"/>
  <text class="code small" x="100" y="234">Ingested</text>
  <path class="edge accent" d="M591 250 V212" marker-end="url(#arrow-accent)"/>
  <text class="code small accent" x="583" y="234" text-anchor="end">finalize decision</text>

  <rect class="band accent" x="16" y="254" width="648" height="80" rx="6"/>
