<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 266">
  <text class="heading" x="16" y="24">Span</text>
  <text class="heading" x="210" y="24">One trace across two queues</text>

  <rect class="band" x="16" y="40" width="648" height="40" rx="6"/>
  <text class="small" x="28" y="65">upstream producer span</text>
  <rect class="node muted" x="210" y="49" width="80" height="22" rx="3"/>

  <rect class="band" x="16" y="90" width="648" height="40" rx="6"/>
  <text class="code small" x="42" y="115">"orders process"</text>
  <rect class="node violet" x="330" y="99" width="230" height="22" rx="3"/>
  <text class="small" x="342" y="114">Consumer</text>

  <rect class="band" x="16" y="140" width="648" height="40" rx="6"/>
  <text class="code small" x="56" y="165">validate-order</text>
  <rect class="node" x="350" y="149" width="100" height="22" rx="3"/>
  <text class="small" x="362" y="164">internal</text>

  <rect class="band" x="16" y="190" width="648" height="40" rx="6"/>
  <text class="code small" x="56" y="215">"payments process"</text>
  <rect class="node violet" x="540" y="199" width="120" height="22" rx="3"/>
  <text class="small" x="552" y="214">Consumer</text>

  <path class="edge accent" d="M290 60 H310 V110 H326" marker-end="url(#arrow-accent)"/>
  <path class="edge accent" d="M500 110 V210 H536" marker-end="url(#arrow-accent)"/>
  <circle class="dot accent" cx="500" cy="110" r="4"/>

  <text class="small accent" x="16" y="254">Each arrow is W3C trace headers in a message, read as Envelope.traceContext.</text>
  <text class="code small accent halo" x="506" y="186">currentTraceHeaders</text>
</svg>
