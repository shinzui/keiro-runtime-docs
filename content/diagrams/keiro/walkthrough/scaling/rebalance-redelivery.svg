<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330">
  <rect class="band" x="16" y="30" width="648" height="62" rx="6"/>
  <text class="heading" x="28" y="56">old owner</text>
  <text class="small muted" x="28" y="74">worker A</text>
  <rect class="node amber" x="170" y="46" width="150" height="30" rx="5"/>
  <text class="small" x="245" y="65" text-anchor="middle">handler(event E) runs</text>
  <path class="edge rose thick" d="M326 50 L342 72 M342 50 L326 72"/>
  <text class="small rose" x="352" y="58">bucket shed: reader cancelled</text>
  <text class="small rose" x="352" y="75">async exception, no ack</text>

  <rect class="band" x="16" y="108" width="648" height="50" rx="6"/>
  <text class="heading" x="28" y="138">checkpoint</text>
  <path class="axis" d="M170 133 H540"/>
  <text class="code small" x="190" y="127">before event E</text>
  <rect class="node green" x="548" y="120" width="104" height="26" rx="5"/>
  <text class="code small" x="600" y="137" text-anchor="middle">after event E</text>

  <rect class="band" x="16" y="174" width="648" height="62" rx="6"/>
  <text class="heading" x="28" y="200">new owner</text>
  <text class="small muted" x="28" y="218">worker B</text>
  <path class="edge dashed" d="M400 146 V186" marker-end="url(#arrow)"/>
  <text class="small muted" x="408" y="168">starts from the checkpoint</text>
  <rect class="node accent" x="400" y="190" width="150" height="30" rx="5"/>
  <text class="small" x="475" y="209" text-anchor="middle">handler(event E) again</text>
  <path class="edge green" d="M556 205 H600 V152" marker-end="url(#arrow-green)"/>
  <text class="code small green" x="580" y="228" text-anchor="middle">ShardAckOk</text>

  <path class="axis" d="M170 258 H650" marker-end="url(#arrow)"/>
  <text class="small muted" x="170" y="276">time</text>

  <text class="small muted" x="28" y="304">The shed bucket loses no event. Event E is delivered again, so the handler must be idempotent.</text>
</svg>
