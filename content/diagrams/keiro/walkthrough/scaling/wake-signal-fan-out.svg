<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 566">
  <text class="heading" x="20" y="26">PostgreSQL</text>
  <rect class="node" x="140" y="38" width="400" height="36" rx="6"/>
  <text x="340" y="61" text-anchor="middle">an append fires NOTIFY on kiroku.events</text>
  <path class="edge" d="M340 74 V128" marker-end="url(#arrow)"/>

  <rect class="group" x="16" y="96" width="648" height="454" rx="10"/>
  <text class="heading" x="32" y="118">keiro process</text>
  <g transform="translate(0 18)">

  <rect class="node accent" x="140" y="114" width="400" height="36" rx="6"/>
  <text x="340" y="137" text-anchor="middle">Notifier: one listener connection per store</text>
  <text class="small muted" x="552" y="130">the only</text>
  <text class="small muted" x="552" y="145">DB connection</text>
  <path class="edge" d="M340 150 V178" marker-end="url(#arrow)"/>

  <rect class="node" x="140" y="182" width="400" height="36" rx="6"/>
  <text class="code" x="340" y="205" text-anchor="middle">notifier.tickChan :: TChan ()</text>
  <text class="small muted" x="552" y="205">STM broadcast</text>

  <path class="edge" d="M340 218 V236 H120 V256" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 236 V256" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 236 H560 V256" marker-end="url(#arrow)"/>

  <rect class="node dashed" x="40" y="260" width="160" height="34" rx="6"/>
  <text class="code small" x="120" y="281" text-anchor="middle">dupTChan cursor</text>
  <rect class="node dashed" x="260" y="260" width="160" height="34" rx="6"/>
  <text class="code small" x="340" y="281" text-anchor="middle">dupTChan cursor</text>
  <rect class="node dashed" x="480" y="260" width="160" height="34" rx="6"/>
  <text class="code small" x="560" y="281" text-anchor="middle">dupTChan cursor</text>

  <path class="edge" d="M120 294 V318" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 294 V318" marker-end="url(#arrow)"/>
  <path class="edge" d="M560 294 V318" marker-end="url(#arrow)"/>

  <rect class="node" x="40" y="322" width="160" height="34" rx="6"/>
  <text x="120" y="343" text-anchor="middle">worker 1</text>
  <rect class="node" x="260" y="322" width="160" height="34" rx="6"/>
  <text x="340" y="343" text-anchor="middle">worker 2</text>
  <rect class="node" x="480" y="322" width="160" height="34" rx="6"/>
  <text x="560" y="343" text-anchor="middle">worker 3</text>

  <text class="small muted" x="340" y="380" text-anchor="middle">Each cursor is an STM operation, not a connection. Ticks queue per cursor.</text>

  <path class="edge dotted" d="M120 356 V410"/>
  <rect class="group accent" x="40" y="410" width="600" height="108" rx="8"/>
  <text class="code small accent" x="56" y="430">waitForWake wake fallbackMicros</text>

  <rect class="node" x="60" y="440" width="240" height="34" rx="6"/>
  <text x="180" y="461" text-anchor="middle">readTChan, then drain</text>
  <text class="code bold" x="340" y="461" text-anchor="middle">orElse</text>
  <rect class="node" x="380" y="440" width="240" height="34" rx="6"/>
  <text x="500" y="461" text-anchor="middle">registerDelay timer fires</text>

  <path class="edge" d="M180 474 V484" marker-end="url(#arrow)"/>
  <path class="edge" d="M500 474 V484" marker-end="url(#arrow)"/>
  <rect class="node accent" x="105" y="486" width="150" height="26" rx="5"/>
  <text class="code small" x="180" y="503" text-anchor="middle">WokenByNotify</text>
  <rect class="node" x="425" y="486" width="150" height="26" rx="5"/>
  <text class="code small" x="500" y="503" text-anchor="middle">WokenByTimeout</text>
  </g>
</svg>
