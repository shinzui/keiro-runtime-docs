<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392">
  <rect class="band" x="16" y="30" width="648" height="40" rx="6"/>
  <text class="heading" x="28" y="55">appends</text>
  <circle class="dot amber" cx="215" cy="50" r="5"/>
  <circle class="dot amber" cx="230" cy="50" r="5"/>
  <circle class="dot amber" cx="241" cy="50" r="5"/>
  <circle class="dot amber" cx="252" cy="50" r="5"/>

  <rect class="band" x="16" y="96" width="648" height="56" rx="6"/>
  <text class="heading" x="28" y="128">fixed poll</text>
  <rect class="node accent" x="150" y="112" width="35" height="24" rx="4"/>
  <rect class="node accent" x="335" y="112" width="35" height="24" rx="4"/>
  <rect class="node accent" x="520" y="112" width="35" height="24" rx="4"/>
  <path class="edge dashed amber" d="M215 146 H328" marker-end="url(#arrow-amber)"/>
  <text class="small amber" x="272" y="172" text-anchor="middle">waits for the next fixed pass</text>

  <rect class="band" x="16" y="226" width="648" height="56" rx="6"/>
  <text class="heading" x="28" y="258">push-aware</text>
  <rect class="node accent" x="150" y="242" width="35" height="24" rx="4"/>
  <rect class="node accent" x="217" y="242" width="43" height="24" rx="4"/>
  <rect class="node accent" x="263" y="242" width="35" height="24" rx="4"/>
  <rect class="node accent" x="448" y="242" width="35" height="24" rx="4"/>
  <rect class="node accent" x="598" y="242" width="35" height="24" rx="4"/>

  <text class="small accent" x="290" y="206">queued ticks are drained: one wake, one pass</text>
  <path class="edge accent" d="M280 198 V236" marker-end="url(#arrow-accent)"/>
  <text class="small muted" x="210" y="222" text-anchor="end">NOTIFY wakes it</text>

  <path class="edge dashed muted" d="M300 296 H442" marker-end="url(#arrow)"/>
  <text class="small muted" x="372" y="316" text-anchor="middle">no NOTIFY: the fallback pollInterval ends the wait</text>

  <path class="axis" d="M150 340 H650" marker-end="url(#arrow)"/>
  <text class="small muted" x="150" y="358">time</text>

  <circle class="dot amber" cx="158" cy="378" r="5"/>
  <text class="small" x="170" y="382">append (fires NOTIFY)</text>
  <rect class="node accent" x="330" y="370" width="28" height="16" rx="3"/>
  <text class="small" x="366" y="382">one pass (idempotent)</text>
</svg>
