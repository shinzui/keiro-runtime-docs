<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <text class="heading" x="20" y="24">Example: six buckets, three workers start together</text>
  <text class="code small muted" x="133" y="50" text-anchor="middle">b0</text>
  <text class="code small muted" x="185" y="50" text-anchor="middle">b1</text>
  <text class="code small muted" x="237" y="50" text-anchor="middle">b2</text>
  <text class="code small muted" x="289" y="50" text-anchor="middle">b3</text>
  <text class="code small muted" x="341" y="50" text-anchor="middle">b4</text>
  <text class="code small muted" x="393" y="50" text-anchor="middle">b5</text>
  <rect class="band" x="16" y="56" width="648" height="50" rx="6"/>
  <text class="heading" x="28" y="85">pass 1</text>
  <rect class="node accent" x="110" y="62" width="46" height="38" rx="5"/>
  <text class="bold" x="133" y="82" text-anchor="middle">A</text>
  <text class="small muted" x="133" y="97" text-anchor="middle">new</text>
  <rect class="node violet" x="162" y="62" width="46" height="38" rx="5"/>
  <text class="bold" x="185" y="82" text-anchor="middle">B</text>
  <text class="small muted" x="185" y="97" text-anchor="middle">new</text>
  <rect class="node green" x="214" y="62" width="46" height="38" rx="5"/>
  <text class="bold" x="237" y="82" text-anchor="middle">C</text>
  <text class="small muted" x="237" y="97" text-anchor="middle">new</text>
  <rect class="node ghost" x="266" y="62" width="46" height="38" rx="5"/>
  <text class="small muted" x="289" y="86" text-anchor="middle">free</text>
  <rect class="node ghost" x="318" y="62" width="46" height="38" rx="5"/>
  <text class="small muted" x="341" y="86" text-anchor="middle">free</text>
  <rect class="node ghost" x="370" y="62" width="46" height="38" rx="5"/>
  <text class="small muted" x="393" y="86" text-anchor="middle">free</text>
  <text class="small" x="434" y="78">estimate 1 worker: target 6</text>
  <text class="small muted" x="434" y="95">each worker claims 1 bucket</text>
  <rect class="band" x="16" y="120" width="648" height="50" rx="6"/>
  <text class="heading" x="28" y="149">pass 2</text>
  <rect class="node accent" x="110" y="126" width="46" height="38" rx="5"/>
  <text class="bold" x="133" y="150" text-anchor="middle">A</text>
  <rect class="node violet" x="162" y="126" width="46" height="38" rx="5"/>
  <text class="bold" x="185" y="150" text-anchor="middle">B</text>
  <rect class="node green" x="214" y="126" width="46" height="38" rx="5"/>
  <text class="bold" x="237" y="150" text-anchor="middle">C</text>
  <rect class="node accent" x="266" y="126" width="46" height="38" rx="5"/>
  <text class="bold" x="289" y="146" text-anchor="middle">A</text>
  <text class="small muted" x="289" y="161" text-anchor="middle">new</text>
  <rect class="node violet" x="318" y="126" width="46" height="38" rx="5"/>
  <text class="bold" x="341" y="146" text-anchor="middle">B</text>
  <text class="small muted" x="341" y="161" text-anchor="middle">new</text>
  <rect class="node green" x="370" y="126" width="46" height="38" rx="5"/>
  <text class="bold" x="393" y="146" text-anchor="middle">C</text>
  <text class="small muted" x="393" y="161" text-anchor="middle">new</text>
  <text class="small" x="434" y="142">estimate 3 workers: target 2</text>
  <text class="small muted" x="434" y="159">each worker claims 1 more</text>
  <rect class="band" x="16" y="184" width="648" height="50" rx="6"/>
  <text class="heading" x="28" y="213">pass 3</text>
  <rect class="node accent" x="110" y="190" width="46" height="38" rx="5"/>
  <text class="bold" x="133" y="214" text-anchor="middle">A</text>
  <rect class="node violet" x="162" y="190" width="46" height="38" rx="5"/>
  <text class="bold" x="185" y="214" text-anchor="middle">B</text>
  <rect class="node green" x="214" y="190" width="46" height="38" rx="5"/>
  <text class="bold" x="237" y="214" text-anchor="middle">C</text>
  <rect class="node accent" x="266" y="190" width="46" height="38" rx="5"/>
  <text class="bold" x="289" y="214" text-anchor="middle">A</text>
  <rect class="node violet" x="318" y="190" width="46" height="38" rx="5"/>
  <text class="bold" x="341" y="214" text-anchor="middle">B</text>
  <rect class="node green" x="370" y="190" width="46" height="38" rx="5"/>
  <text class="bold" x="393" y="214" text-anchor="middle">C</text>
  <text class="small" x="434" y="206">each worker holds 2 = target</text>
  <text class="small muted" x="434" y="223">renew only, no claim</text>
  <text class="small muted" x="28" y="262">Target = ceil(6 / live workers). Live workers = owners with an unexpired lease, plus self.</text>
  <text class="small muted" x="28" y="282">FOR UPDATE SKIP LOCKED makes concurrent claims take different buckets.</text>
</svg>
