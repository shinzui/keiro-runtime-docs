  <path class="edge" d="M452 82 V94" marker-end="url(#arrow)"/>
  <path class="edge" d="M452 130 V142" marker-end="url(#arrow)"/>
  <path class="edge" d="M452 178 V190" marker-end="url(#arrow)"/>
