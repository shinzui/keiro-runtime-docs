  <text class="heading" x="20" y="24">Before the commit</text>
  <text class="heading" x="356" y="24">After the commit</text>
  <rect class="band" x="16" y="38" width="314" height="210" rx="8"/>
  <rect class="band" x="350" y="38" width="314" height="210" rx="8"/>
  <path class="axis green" d="M340 34 V300"/>
  <text class="small green" x="334" y="316" text-anchor="end">events committed</text>

  <rect class="node" x="30" y="52" width="190" height="30" rx="5"/>
  <text class="code small" x="125" y="71" text-anchor="middle">hydrate</text>
  <rect class="node" x="30" y="100" width="190" height="30" rx="5"/>
  <text class="code small" x="125" y="119" text-anchor="middle">evaluateCommand</text>
  <rect class="node" x="30" y="148" width="190" height="30" rx="5"/>
  <text class="code small" x="125" y="167" text-anchor="middle">encodeEvents</text>
  <rect class="node accent" x="30" y="196" width="190" height="30" rx="5"/>
  <text class="code small" x="125" y="215" text-anchor="middle">appendToStream</text>
  <path class="edge" d="M125 82 V94" marker-end="url(#arrow)"/>
  <path class="edge" d="M125 130 V142" marker-end="url(#arrow)"/>
  <path class="edge" d="M125 178 V190" marker-end="url(#arrow)"/>
  <text class="small rose" x="232" y="71">Left</text>
  <text class="small rose" x="232" y="119">Left</text>
  <text class="small rose" x="232" y="167">Left</text>
  <text class="small rose" x="232" y="215">retry or Left</text>

  <path class="edge accent" d="M125 226 V238 H312 V67 H356" marker-end="url(#arrow-accent)"/>
  <rect class="node" x="362" y="52" width="180" height="30" rx="5"/>
  <text class="code small" x="452" y="71" text-anchor="middle">applyEventsEither</text>
  <rect class="node" x="362" y="100" width="180" height="30" rx="5"/>
  <text class="code small" x="452" y="119" text-anchor="middle">shouldSnapshotSpan</text>
  <rect class="node" x="362" y="148" width="180" height="30" rx="5"/>
  <text class="code small" x="452" y="167" text-anchor="middle">encodeSnapshotStrict</text>
  <rect class="node" x="362" y="196" width="180" height="30" rx="5"/>
