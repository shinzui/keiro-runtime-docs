  <text class="code small amber" x="552" y="80">divergence</text>
  <text class="small muted" x="552" y="119">policy check</text>
  <text class="code small amber" x="552" y="162">encode.</text>
  <text class="code small amber" x="552" y="176">failures</text>
  <text class="code small amber" x="552" y="210">write.</text>
  <text class="code small amber" x="552" y="224">failures</text>

  <text class="small rose" x="20" y="272">A failure here returns Left CommandError.</text>
  <rect class="node green" x="362" y="262" width="180" height="30" rx="5"/>
  <text class="code small" x="452" y="281" text-anchor="middle">Right CommandResult</text>
