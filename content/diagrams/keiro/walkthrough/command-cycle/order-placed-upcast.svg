<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 268">
  <text class="heading" x="20" y="24">Stored v1 payload</text>
  <text class="heading" x="400" y="24">Migrated v2 payload</text>
  <rect class="node" x="20" y="40" width="250" height="176" rx="8"/>
  <text class="code small muted" x="36" y="64">{</text>
  <text class="code small" x="50" y="96">"orderId": "o-17"</text>
  <text class="code small amber" x="50" y="136">"qty": 2</text>
  <text class="code small muted" x="50" y="176">"sku" (optional)</text>
  <text class="code small muted" x="36" y="204">}</text>

  <rect class="node accent" x="400" y="40" width="260" height="176" rx="8"/>
  <text class="code small muted" x="416" y="64">{</text>
  <text class="code small green" x="430" y="80">"kind": "OrderPlaced"</text>
  <text class="code small" x="430" y="96">"orderId": "o-17"</text>
  <text class="code small amber" x="430" y="136">"quantity": 2</text>
  <text class="code small green" x="430" y="176">"sku": value or "UNKNOWN"</text>
  <text class="code small muted" x="416" y="204">}</text>

  <path class="edge" d="M196 92 H422" marker-end="url(#arrow)"/>
  <text class="small muted halo" x="310" y="86" text-anchor="middle">copied</text>
  <path class="edge amber" d="M126 132 H422" marker-end="url(#arrow-amber)"/>
  <text class="small amber halo" x="310" y="126" text-anchor="middle">renamed</text>
  <path class="edge dashed green" d="M180 172 H422" marker-end="url(#arrow-green)"/>
  <text class="small green halo" x="310" y="166" text-anchor="middle">kept or defaulted</text>
  <text class="small muted" x="20" y="244">upcastOrderPlacedV1 is rung 1. It runs on read only; the stored v1 bytes never change.</text>
  <text class="small muted" x="20" y="262">The upcaster also adds the kind field.</text>
</svg>
