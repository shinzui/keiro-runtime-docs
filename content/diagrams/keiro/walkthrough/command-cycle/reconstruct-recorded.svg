<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262">
  <text class="heading" x="20" y="24">A batch of 3 events</text>
  <rect class="node accent" x="20" y="44" width="190" height="96" rx="7"/>
  <text class="code bold" x="115" y="66" text-anchor="middle">AppendResult</text>
  <text class="code small" x="34" y="92">streamVersion</text><text class="code small accent" x="196" y="92" text-anchor="end">lastSv</text>
  <text class="code small" x="34" y="112">globalPosition</text><text class="code small accent" x="196" y="112" text-anchor="end">lastGp</text>
  <text class="small muted" x="34" y="132">the last event only</text>
  <text class="code small" x="20" y="166">count = 3</text>
  <text class="code small" x="20" y="186">firstSv = lastSv - 3 + 1</text>
  <text class="code small" x="20" y="206">firstGp = lastGp - 3 + 1</text>
  <path class="edge" d="M210 92 H240" marker-end="url(#arrow)"/>
  <text class="small muted" x="275" y="56" text-anchor="middle">i</text>
  <text class="small muted" x="365" y="56" text-anchor="middle">prepared</text>
  <text class="small muted" x="487" y="56" text-anchor="middle">streamVersion</text>
  <text class="small muted" x="602" y="56" text-anchor="middle">globalPosition</text>
  <rect class="band" x="250" y="66" width="410" height="34" rx="5"/>
  <text class="code small" x="275" y="87" text-anchor="middle">0</text>
  <rect class="node" x="310" y="71" width="110" height="24" rx="4"/>
  <text class="code small" x="365" y="87" text-anchor="middle">EventData 0</text>
  <text class="code small accent" x="487" y="87" text-anchor="middle">lastSv - 2</text>
  <text class="code small accent" x="602" y="87" text-anchor="middle">lastGp - 2</text>
  <rect class="band" x="250" y="106" width="410" height="34" rx="5"/>
  <text class="code small" x="275" y="127" text-anchor="middle">1</text>
  <rect class="node" x="310" y="111" width="110" height="24" rx="4"/>
  <text class="code small" x="365" y="127" text-anchor="middle">EventData 1</text>
  <text class="code small accent" x="487" y="127" text-anchor="middle">lastSv - 1</text>
  <text class="code small accent" x="602" y="127" text-anchor="middle">lastGp - 1</text>
  <rect class="band" x="250" y="146" width="410" height="34" rx="5"/>
  <text class="code small" x="275" y="167" text-anchor="middle">2</text>
  <rect class="node" x="310" y="151" width="110" height="24" rx="4"/>
  <text class="code small" x="365" y="167" text-anchor="middle">EventData 2</text>
  <text class="code small accent" x="487" y="167" text-anchor="middle">lastSv</text>
  <text class="code small accent" x="602" y="167" text-anchor="middle">lastGp</text>
  <text class="code small" x="250" y="210">event i gets (first + i) for both counters</text>
  <text class="small muted" x="20" y="246">No second query: kiroku inserts the batch as one gap-free run (WITH ORDINALITY).</text>
</svg>
