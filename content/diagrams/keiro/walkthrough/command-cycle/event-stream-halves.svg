<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <rect class="group accent" x="20" y="16" width="640" height="94" rx="10"/>
  <text class="heading accent" x="36" y="40">Pure half: the decision machine</text>
  <rect class="node accent" x="40" y="58" width="180" height="34" rx="6"/>
  <text class="code small" x="130" y="80" text-anchor="middle">transducer</text>
  <rect class="node accent" x="250" y="58" width="180" height="34" rx="6"/>
  <text class="code small" x="340" y="80" text-anchor="middle">initialState</text>
  <rect class="node accent" x="460" y="58" width="180" height="34" rx="6"/>
  <text class="code small" x="550" y="80" text-anchor="middle">initialRegisters</text>

  <path class="axis" d="M340 110 V150"/>
  <text class="small muted" x="350" y="135">one EventStream record</text>

  <rect class="group" x="20" y="150" width="640" height="138" rx="10"/>
  <text class="heading" x="36" y="174">Persistence half: the durable store</text>
  <rect class="node" x="36" y="188" width="140" height="34" rx="6"/>
  <text class="code small" x="106" y="210" text-anchor="middle">eventCodec</text>
  <rect class="node" x="192" y="188" width="140" height="34" rx="6"/>
  <text class="code small" x="262" y="210" text-anchor="middle">resolveStreamName</text>
  <rect class="node" x="348" y="188" width="140" height="34" rx="6"/>
  <text class="code small" x="418" y="210" text-anchor="middle">snapshotPolicy</text>
  <rect class="node" x="504" y="188" width="140" height="34" rx="6"/>
  <text class="code small" x="574" y="210" text-anchor="middle">stateCodec</text>
  <text class="small muted" x="106" y="240" text-anchor="middle">events to payloads</text>
  <text class="small muted" x="262" y="240" text-anchor="middle">handle to StreamName</text>
  <text class="small muted" x="418" y="240" text-anchor="middle">when to snapshot</text>
  <text class="small muted" x="574" y="240" text-anchor="middle">how to serialize</text>
  <path class="axis rose" d="M352 254 H640"/>
  <text class="small rose" x="496" y="273" text-anchor="middle">stateCodec = Nothing disables snapshotting</text>
