  <text class="small muted" x="20" y="122">A page may end InFlight. The keiki wrapper and the registers carry into the next page.</text>
  <text class="small muted" x="20" y="140">Only the end of the stream must be Settled. A final InFlight is HydrationTruncatedChain.</text>
