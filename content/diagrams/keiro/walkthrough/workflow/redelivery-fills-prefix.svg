  <text class="small muted" x="315" y="196" text-anchor="middle">never ran</text>
  <path class="edge muted" d="M420 192 H436" marker-end="url(#arrow)"/>
  <rect class="node green" x="440" y="172" width="220" height="40" rx="5"/>
  <text class="code small green" x="550" y="196" text-anchor="middle">PMCommandAppended</text>

  <text class="small muted" x="20" y="248">Point lookups find the committed IDs. Only the missing write appends.</text>
