<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262">
  <text class="heading" x="216" y="28">First delivery</text>
  <text class="heading" x="446" y="28">Redelivery</text>

  <text class="small bold" x="20" y="60">Tx1</text>
  <text class="small muted" x="20" y="76">manager state + timers</text>
  <rect class="node green" x="210" y="44" width="210" height="40" rx="5"/>
  <text class="small green" x="315" y="68" text-anchor="middle">committed</text>
  <path class="edge muted" d="M420 64 H436" marker-end="url(#arrow)"/>
  <rect class="node" x="440" y="44" width="220" height="40" rx="5"/>
  <text class="code small" x="550" y="68" text-anchor="middle">PMStateDuplicate</text>

  <text class="small bold" x="20" y="114">Tx2</text>
  <text class="small muted" x="20" y="130">target 0 + projections</text>
  <rect class="node green" x="210" y="98" width="210" height="40" rx="5"/>
  <text class="small green" x="315" y="122" text-anchor="middle">committed</text>
  <path class="edge muted" d="M420 118 H436" marker-end="url(#arrow)"/>
  <rect class="node" x="440" y="98" width="220" height="40" rx="5"/>
  <text class="code small" x="550" y="122" text-anchor="middle">PMCommandDuplicate</text>

  <path class="edge dashed rose" d="M210 156 H420"/>
  <text class="small rose halo" x="315" y="160" text-anchor="middle">crash</text>

  <text class="small bold" x="20" y="188">Tx3</text>
  <text class="small muted" x="20" y="204">target 1 + projections</text>
