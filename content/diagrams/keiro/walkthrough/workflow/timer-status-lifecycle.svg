<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316">
  <rect class="group" x="30" y="40" width="392" height="128" rx="8"/>
  <text class="small muted" x="412" y="58" text-anchor="end">claimable or in flight</text>

  <path class="edge" d="M90 96 C90 64, 150 64, 150 92" marker-end="url(#arrow)"/>
  <text class="small" x="120" y="60" text-anchor="middle">re-arm</text>

  <rect class="node accent" x="50" y="96" width="140" height="40" rx="6"/>
  <text class="code" x="120" y="120" text-anchor="middle">Scheduled</text>
  <rect class="node amber" x="270" y="96" width="140" height="40" rx="6"/>
  <text class="code" x="340" y="120" text-anchor="middle">Firing</text>

  <path class="edge" d="M190 106 H266" marker-end="url(#arrow)"/>
  <text class="small" x="228" y="99" text-anchor="middle">claim</text>
  <path class="edge" d="M270 126 H194" marker-end="url(#arrow)"/>
  <text class="small" x="232" y="150" text-anchor="middle">requeue</text>

  <rect class="node green" x="530" y="96" width="130" height="40" rx="6"/>
  <text class="code" x="595" y="120" text-anchor="middle">Fired</text>
  <path class="edge green" d="M410 116 H526" marker-end="url(#arrow-green)"/>
  <text class="small" x="432" y="108">markTimerFired</text>

  <path class="edge" d="M130 168 V226" marker-end="url(#arrow)"/>
  <text class="small" x="140" y="202">cancelTimer</text>
  <rect class="node muted" x="60" y="230" width="140" height="40" rx="6"/>
  <text class="code" x="130" y="254" text-anchor="middle">Cancelled</text>

  <path class="edge rose" d="M340 168 V226" marker-end="url(#arrow-rose)"/>
  <text class="small" x="350" y="202">deadLetterTimer</text>
  <rect class="node rose" x="270" y="230" width="140" height="40" rx="6"/>
  <text class="code" x="340" y="254" text-anchor="middle">Dead</text>

  <text class="small muted" x="20" y="302">Fired, Cancelled and Dead are terminal. The claim selects only Scheduled rows.</text>
</svg>
