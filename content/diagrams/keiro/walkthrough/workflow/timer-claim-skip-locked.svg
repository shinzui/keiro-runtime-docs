<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 282">
  <text class="heading" x="20" y="24">keiro_timers ordered by fire_at, timer_id</text>
  <text class="small muted" x="36" y="46">timer_id</text>
  <text class="small muted" x="140" y="46">status</text>
  <text class="small muted" x="290" y="46">fire_at</text>

  <rect class="band accent" x="20" y="54" width="380" height="36" rx="5"/>
  <text class="code small" x="36" y="76">t-1</text>
  <text class="code small" x="140" y="76">scheduled</text>
  <text class="code small" x="290" y="76">&lt;= now</text>

  <rect class="band accent" x="20" y="98" width="380" height="36" rx="5"/>
  <text class="code small" x="36" y="120">t-2</text>
  <text class="code small" x="140" y="120">scheduled</text>
  <text class="code small" x="290" y="120">&lt;= now</text>

  <rect class="band" x="20" y="142" width="380" height="36" rx="5"/>
  <text class="code small muted" x="36" y="164">t-3</text>
  <text class="code small muted" x="140" y="164">firing</text>
  <text class="code small muted" x="290" y="164">&lt;= now</text>
  <text class="small muted" x="440" y="164">status is not scheduled</text>

  <path class="axis dashed amber" d="M20 194 H524"/>
  <text class="small amber" x="532" y="198">now ($1)</text>

  <rect class="band" x="20" y="210" width="380" height="36" rx="5"/>
  <text class="code small muted" x="36" y="232">t-4</text>
  <text class="code small muted" x="140" y="232">scheduled</text>
  <text class="code small muted" x="290" y="232">&gt; now</text>
  <text class="small muted" x="440" y="232">fire_at after now: not due</text>

  <rect class="node accent" x="440" y="54" width="220" height="36" rx="5"/>
  <text class="small" x="550" y="76" text-anchor="middle">Worker A locks t-1</text>
  <path class="edge accent" d="M440 72 H406" marker-end="url(#arrow-accent)"/>

  <rect class="node accent" x="440" y="98" width="220" height="36" rx="5"/>
  <text class="small" x="550" y="120" text-anchor="middle">Worker B skips t-1, locks t-2</text>
  <path class="edge accent" d="M440 116 H406" marker-end="url(#arrow-accent)"/>

  <text class="small muted" x="20" y="272">Each claim sets status firing and adds 1 to attempts. Neither worker waits.</text>
</svg>
