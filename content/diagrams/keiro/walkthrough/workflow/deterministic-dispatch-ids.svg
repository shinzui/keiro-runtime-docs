<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 362">
  <rect class="node" x="20" y="40" width="140" height="32" rx="5"/>
  <text class="small" x="90" y="60" text-anchor="middle">manager name</text>
  <rect class="node" x="180" y="40" width="140" height="32" rx="5"/>
  <text class="small" x="250" y="60" text-anchor="middle">correlation id</text>
  <rect class="node" x="340" y="40" width="140" height="32" rx="5"/>
  <text class="small" x="410" y="60" text-anchor="middle">source event id</text>
  <rect class="node accent" x="500" y="40" width="140" height="32" rx="5"/>
  <text class="small accent" x="570" y="60" text-anchor="middle">emit index</text>
  <text class="heading" x="20" y="26">Inputs</text>

  <path class="edge" d="M90 72 V90 H570 M250 72 V90 M410 72 V90 M570 72 V90"/>
  <path class="edge" d="M330 90 V104" marker-end="url(#arrow)"/>
  <rect class="node" x="180" y="108" width="300" height="34" rx="5"/>
  <text class="code" x="330" y="130" text-anchor="middle">deterministicCommandId</text>
  <text class="small muted" x="492" y="130">UUIDv5</text>

  <text class="heading" x="20" y="178">One source event, one id per emit index</text>

  <rect class="node accent" x="20" y="190" width="124" height="34" rx="5"/>
  <text class="code small" x="82" y="211" text-anchor="middle">index -1</text>
  <path class="edge" d="M144 207 H176" marker-end="url(#arrow)"/>
  <rect class="band" x="180" y="188" width="480" height="38" rx="6"/>
  <text class="small" x="194" y="211">manager stream</text>
  <rect class="node accent" x="464" y="194" width="186" height="26" rx="5"/>
  <text class="code small" x="557" y="211" text-anchor="middle">managerEventId</text>

  <rect class="node accent" x="20" y="240" width="124" height="34" rx="5"/>
  <text class="code small" x="82" y="261" text-anchor="middle">index 0</text>
  <path class="edge" d="M144 257 H176" marker-end="url(#arrow)"/>
  <rect class="band" x="180" y="238" width="480" height="38" rx="6"/>
  <text class="small" x="194" y="261">target of commands[0]</text>
  <rect class="node accent" x="464" y="244" width="186" height="26" rx="5"/>
  <text class="code small" x="557" y="261" text-anchor="middle">command id, index 0</text>

  <rect class="node accent" x="20" y="290" width="124" height="34" rx="5"/>
  <text class="code small" x="82" y="311" text-anchor="middle">index 1</text>
  <path class="edge" d="M144 307 H176" marker-end="url(#arrow)"/>
  <rect class="band" x="180" y="288" width="480" height="38" rx="6"/>
  <text class="small" x="194" y="311">target of commands[1]</text>
  <rect class="node accent" x="464" y="294" width="186" height="26" rx="5"/>
  <text class="code small" x="557" y="311" text-anchor="middle">command id, index 1</text>

  <text class="small muted" x="20" y="350">Redelivery derives the same ids. eventAlreadyIn checks each id in its own stream.</text>
</svg>
