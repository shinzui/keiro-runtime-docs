<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 252">
  <text class="small muted" x="270" y="30" text-anchor="middle">requeueStuckAfter (300 s by default)</text>
  <path class="axis" d="M104 42 H436" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <text class="heading" x="20" y="74">status</text>
  <rect class="band accent" x="20" y="84" width="80" height="30" rx="4"/>
  <rect class="band amber" x="100" y="84" width="340" height="30" rx="4"/>
  <text class="code small amber" x="320" y="103" text-anchor="middle">firing</text>
  <rect class="band accent" x="440" y="84" width="30" height="30" rx="4"/>
  <rect class="band amber" x="470" y="84" width="90" height="30" rx="4"/>
  <text class="code small amber" x="515" y="103" text-anchor="middle">firing</text>
  <rect class="band green" x="560" y="84" width="100" height="30" rx="4"/>
  <text class="code small green" x="610" y="103" text-anchor="middle">fired</text>
  <text class="code small accent" x="60" y="103" text-anchor="middle">scheduled</text>

  <path class="axis" d="M20 130 H660"/>
  <path class="axis" d="M100 124 V136 M440 124 V136 M470 124 V136 M560 124 V136"/>
  <path class="edge rose" d="M194 124 L206 136 M206 124 L194 136"/>

  <text class="small" x="100" y="154" text-anchor="middle">claim, attempts 1</text>
  <text class="small rose" x="200" y="176" text-anchor="middle">crash before markTimerFired</text>
  <text class="small" x="436" y="154" text-anchor="end">sweep: back to scheduled</text>
  <text class="small" x="474" y="176">claim, attempts 2</text>
  <text class="small green" x="564" y="154">markTimerFired</text>

  <text class="small muted" x="20" y="218">The work was not marked fired, so the sweep makes the row claimable again.</text>
  <text class="small muted" x="20" y="236">The fire action can therefore run twice for one timer and must be idempotent.</text>
</svg>
