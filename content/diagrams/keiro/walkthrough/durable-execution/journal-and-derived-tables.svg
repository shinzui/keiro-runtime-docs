<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336">
  <text class="heading" x="24" y="28">One transaction per journal append</text>
  <rect class="group accent" x="16" y="40" width="648" height="254" rx="8"/>
  <text class="heading" x="40" y="68">Journal stream</text>
  <rect class="band accent" x="36" y="80" width="268" height="196" rx="6"/>
  <text class="code small accent" x="48" y="104">wf:order-fulfillment-&lt;order&gt;</text>
  <rect class="node" x="48" y="116" width="244" height="30" rx="5"/>
  <text class="code small" x="170" y="135" text-anchor="middle">StepRecorded reserve-inventory</text>
  <rect class="node" x="48" y="154" width="244" height="30" rx="5"/>
  <text class="code small" x="170" y="173" text-anchor="middle">StepRecorded sleep:cooling-off</text>
  <rect class="node" x="48" y="192" width="244" height="30" rx="5"/>
  <text class="small italic muted" x="170" y="211" text-anchor="middle">six more StepRecorded events</text>
  <rect class="node" x="48" y="230" width="244" height="30" rx="5"/>
  <text class="code small" x="170" y="249" text-anchor="middle">WorkflowCompleted</text>
  <text class="heading" x="400" y="68">Derived tables</text>
  <path class="edge accent" d="M304 178 H340"/>
  <path class="edge accent" d="M340 102 V252"/>
  <path class="edge accent" d="M340 102 H394" marker-end="url(#arrow-accent)"/>
  <path class="edge accent" d="M340 152 H394" marker-end="url(#arrow-accent)"/>
  <path class="edge accent" d="M340 202 H394" marker-end="url(#arrow-accent)"/>
  <path class="edge accent" d="M340 252 H394" marker-end="url(#arrow-accent)"/>
  <rect class="node" x="400" y="82" width="240" height="40" rx="5"/>
  <text class="code small" x="414" y="99">keiro_workflow_steps</text>
  <text class="small muted" x="414" y="115">Does this step exist?</text>
  <rect class="node" x="400" y="132" width="240" height="40" rx="5"/>
  <text class="code small" x="414" y="149">keiro_workflows</text>
  <text class="small muted" x="414" y="165">Which instances are due?</text>
  <rect class="node" x="400" y="182" width="240" height="40" rx="5"/>
  <text class="code small" x="414" y="199">keiro_awakeables</text>
  <text class="small muted" x="414" y="215">Awakeable status and payload</text>
  <rect class="node" x="400" y="232" width="240" height="40" rx="5"/>
  <text class="code small" x="414" y="249">keiro_workflow_children</text>
  <text class="small muted" x="414" y="265">Parent and child links</text>
  <text class="small muted" x="36" y="318">Replay folds the stream.</text>
  <text class="small muted" x="400" y="318">Lookups and workers read the tables.</text>
</svg>
