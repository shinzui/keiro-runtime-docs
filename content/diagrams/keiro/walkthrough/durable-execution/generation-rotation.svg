<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 286">
  <text class="small bold amber" x="412" y="30">2  rotation marker closes generation 0</text>
  <rect class="band" x="16" y="40" width="648" height="68" rx="6"/>
  <text class="bold" x="28" y="66">generation 0</text>
  <text class="code small" x="28" y="88">wf:&lt;name&gt;-&lt;id&gt;</text>
  <rect class="node" x="196" y="56" width="92" height="36" rx="5"/>
  <text class="code small" x="242" y="78" text-anchor="middle">step a</text>
  <rect class="node" x="298" y="56" width="92" height="36" rx="5"/>
  <text class="code small" x="344" y="78" text-anchor="middle">step b</text>
  <rect class="node amber dashed" x="404" y="56" width="248" height="36" rx="5"/>
  <text class="code small" x="528" y="78" text-anchor="middle">__workflow_continued_as_new__</text>
  <text class="small bold accent" x="196" y="140">1  seed and patch set, one transaction</text>
  <rect class="band accent" x="16" y="152" width="648" height="68" rx="6"/>
  <text class="bold" x="28" y="178">generation 1</text>
  <text class="code small" x="28" y="200">wf:&lt;name&gt;-&lt;id&gt;#1</text>
  <rect class="group accent" x="188" y="160" width="314" height="52" rx="7"/>
  <rect class="node" x="196" y="168" width="148" height="36" rx="5"/>
  <text class="code small" x="270" y="190" text-anchor="middle">__workflow_seed__</text>
  <rect class="node" x="350" y="168" width="144" height="36" rx="5"/>
  <text class="small" x="422" y="190" text-anchor="middle">patch set, if any</text>
  <rect class="node ghost" x="516" y="168" width="136" height="36" rx="5"/>
  <text class="small muted" x="584" y="190" text-anchor="middle">later steps</text>
  <text class="small muted" x="28" y="252">Step 1 raises MAX(generation) to 1, so every later run resolves generation 1.</text>
  <text class="small muted" x="28" y="272">A crash between step 1 and step 2 still continues from the seed.</text>
</svg>
