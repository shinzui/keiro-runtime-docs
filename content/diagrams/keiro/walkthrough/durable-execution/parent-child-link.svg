<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <text class="heading" x="20" y="28">Parent journal</text>
  <text class="heading" x="252" y="28">Link row</text>
  <text class="heading" x="468" y="28">Child journal</text>
  <rect class="band" x="16" y="40" width="200" height="214" rx="6"/>
  <text class="code" x="30" y="62">wf:parent-p1</text>
  <rect class="node" x="30" y="76" width="172" height="36" rx="5"/>
  <text class="code small" x="116" y="98" text-anchor="middle">child:c7</text>
  <text class="small muted" x="116" y="140" text-anchor="middle">awaitChild suspends</text>
  <text class="small muted" x="116" y="156" text-anchor="middle">on child:c7:result</text>
  <rect class="node accent" x="30" y="190" width="172" height="48" rx="5"/>
  <text class="code small" x="116" y="210" text-anchor="middle">child:c7:result</text>
  <text class="small muted" x="116" y="228" text-anchor="middle">result or sentinel</text>
  <rect class="node" x="248" y="76" width="184" height="162" rx="6"/>
  <text class="code small bold" x="262" y="98">keiro_workflow_children</text>
  <text class="small muted" x="262" y="124">child</text>
  <text class="code small" x="340" y="124">c7</text>
  <text class="small muted" x="262" y="146">parent</text>
  <text class="code small" x="340" y="146">p1</text>
  <text class="small muted" x="262" y="168">awaitStep</text>
  <text class="code small" x="262" y="186">child:c7:result</text>
  <text class="small muted" x="262" y="212">status</text>
  <text class="code small" x="340" y="212">running</text>
  <rect class="band" x="464" y="40" width="200" height="214" rx="6"/>
  <text class="code" x="478" y="62">wf:child-c7</text>
  <rect class="node" x="478" y="76" width="172" height="36" rx="5"/>
  <text class="code small" x="564" y="98" text-anchor="middle">StepRecorded …</text>
  <rect class="node green" x="478" y="134" width="172" height="36" rx="5"/>
  <text class="code small" x="564" y="156" text-anchor="middle">WorkflowCompleted</text>
  <rect class="node rose dashed" x="478" y="196" width="172" height="36" rx="5"/>
  <text class="code small" x="564" y="218" text-anchor="middle">WorkflowCancelled</text>
  <path class="edge accent" d="M202 94 H244" marker-end="url(#arrow-accent)"/>
  <text class="small bold accent" x="223" y="86" text-anchor="middle">1</text>
  <path class="edge green" d="M478 152 H436" marker-end="url(#arrow-green)"/>
  <text class="small bold green" x="457" y="144" text-anchor="middle">2</text>
  <path class="edge rose" d="M432 214 H474" marker-end="url(#arrow-rose)"/>
  <text class="small bold rose" x="453" y="206" text-anchor="middle">3</text>
  <path class="edge" d="M248 214 H206" marker-end="url(#arrow)"/>
  <text class="small bold" x="227" y="206" text-anchor="middle">2, 3</text>
  <text class="small" x="20" y="284"><tspan class="bold accent">1</tspan>  spawnChild journals child:c7 in the parent and registers the link row.</text>
  <text class="small" x="20" y="304"><tspan class="bold green">2</tspan>  childCompletionHook marks the row completed and appends the result to the parent.</text>
  <text class="small" x="20" y="324"><tspan class="bold rose">3</tspan>  cancelChild appends WorkflowCancelled to the child and a sentinel to the parent.</text>
</svg>
