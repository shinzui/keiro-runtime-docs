<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <text class="heading" x="16" y="28">Parent journal</text>
  <text class="heading" x="250" y="28">Link row</text>
  <text class="heading" x="470" y="28">Child journal</text>
  <rect class="band" x="10" y="40" width="216" height="214" rx="6"/>
  <text class="code small" x="20" y="62">wf:order-fulfillment-&lt;order&gt;</text>
  <rect class="node" x="20" y="76" width="196" height="36" rx="5"/>
  <text class="code small" x="118" y="98" text-anchor="middle">child:&lt;order&gt;-ship</text>
  <text class="small muted" x="118" y="140" text-anchor="middle">awaitChild suspends on</text>
  <text class="code small muted" x="118" y="156" text-anchor="middle">child:&lt;order&gt;-ship:result</text>
  <rect class="node accent" x="20" y="190" width="196" height="48" rx="5"/>
  <text class="code small" x="118" y="210" text-anchor="middle">child:&lt;order&gt;-ship:result</text>
  <text class="small muted" x="118" y="228" text-anchor="middle">result or sentinel</text>
  <rect class="node" x="250" y="76" width="196" height="162" rx="6"/>
  <text class="code small bold" x="260" y="98">keiro_workflow_children</text>
  <text class="small muted" x="260" y="124">child</text>
  <text class="code small" x="324" y="124">&lt;order&gt;-ship</text>
  <text class="small muted" x="260" y="146">parent</text>
  <text class="code small" x="324" y="146">&lt;order&gt;</text>
  <text class="small muted" x="260" y="168">awaitStep</text>
  <text class="code small" x="260" y="186">child:&lt;order&gt;-ship:result</text>
  <text class="small muted" x="260" y="212">status</text>
  <text class="code small" x="324" y="212">running</text>
  <rect class="band" x="466" y="40" width="204" height="214" rx="6"/>
  <text class="code small" x="476" y="62">wf:ship-order-&lt;order&gt;-ship</text>
  <rect class="node" x="480" y="76" width="176" height="36" rx="5"/>
  <text class="code small" x="568" y="98" text-anchor="middle">StepRecorded …</text>
  <rect class="node green" x="480" y="134" width="176" height="36" rx="5"/>
  <text class="code small" x="568" y="156" text-anchor="middle">WorkflowCompleted</text>
  <rect class="node rose dashed" x="480" y="196" width="176" height="36" rx="5"/>
  <text class="code small" x="568" y="218" text-anchor="middle">WorkflowCancelled</text>
  <path class="edge accent" d="M216 94 H246" marker-end="url(#arrow-accent)"/>
  <text class="small bold accent" x="233" y="86" text-anchor="middle">1</text>
  <path class="edge green" d="M480 152 H450" marker-end="url(#arrow-green)"/>
  <text class="small bold green" x="463" y="144" text-anchor="middle">2</text>
  <path class="edge rose" d="M446 214 H476" marker-end="url(#arrow-rose)"/>
  <text class="small bold rose" x="463" y="206" text-anchor="middle">3</text>
  <path class="edge" d="M250 214 H220" marker-end="url(#arrow)"/>
  <text class="small bold" x="235" y="206" text-anchor="middle">2, 3</text>
  <text class="small" x="16" y="284"><tspan class="bold accent">1</tspan>  spawnChild journals child:&lt;order&gt;-ship in the parent and registers the link row.</text>
  <text class="small" x="16" y="304"><tspan class="bold green">2</tspan>  childCompletionHook marks the row completed and appends the result to the parent.</text>
  <text class="small" x="16" y="324"><tspan class="bold rose">3</tspan>  cancelChild appends WorkflowCancelled to the child and a sentinel to the parent.</text>
</svg>
