<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 286">
  <text class="heading" x="32" y="28">workflow_id</text>
  <text class="heading" x="150" y="28">status</text>
  <text class="heading" x="290" y="28">wake_after</text>
  <text class="heading" x="470" y="28">With $1 = now</text>
  <rect class="band accent" x="16" y="40" width="648" height="36" rx="6"/>
  <text class="code" x="32" y="63">w-1</text>
  <text class="code" x="150" y="63">running</text>
  <text class="code muted" x="290" y="63">NULL</text>
  <text class="small green" x="470" y="63">returned: first arm</text>
  <rect class="band accent" x="16" y="84" width="648" height="36" rx="6"/>
  <text class="code" x="32" y="107">w-2</text>
  <text class="code" x="150" y="107">suspended</text>
  <text class="code" x="290" y="107">now - 5 s</text>
  <text class="small green" x="470" y="107">returned: second arm</text>
  <rect class="band" x="16" y="128" width="648" height="36" rx="6"/>
  <text class="code" x="32" y="151">w-3</text>
  <text class="code" x="150" y="151">suspended</text>
  <text class="code" x="290" y="151">now + 1 h</text>
  <text class="small muted" x="470" y="151">skipped: hint not due</text>
  <rect class="band" x="16" y="172" width="648" height="36" rx="6"/>
  <text class="code" x="32" y="195">w-4</text>
  <text class="code" x="150" y="195">suspended</text>
  <text class="code muted" x="290" y="195">NULL</text>
  <text class="small muted" x="470" y="195">skipped: no hint</text>
  <rect class="band" x="16" y="216" width="648" height="36" rx="6"/>
  <text class="code" x="32" y="239">w-5</text>
  <text class="code" x="150" y="239">completed</text>
  <text class="code muted" x="290" y="239">NULL</text>
  <text class="small muted" x="470" y="239">skipped: terminal</text>
  <text class="small muted" x="32" y="276">A suspended row with no due hint costs the resume worker nothing.</text>
</svg>
