<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 276">
  <text class="heading" x="20" y="28">Delay to next_attempt_at after each crash</text>
  <line class="axis dashed" x1="120" y1="40" x2="120" y2="226"/>
  <text class="small" x="20" y="61">crash 1</text>
  <rect class="band amber" x="120" y="48" width="14" height="20" rx="3"/>
  <text class="code small" x="142" y="63">2 s</text>
  <text class="small" x="20" y="89">crash 2</text>
  <rect class="band amber" x="120" y="76" width="28" height="20" rx="3"/>
  <text class="code small" x="156" y="91">4 s</text>
  <text class="small" x="20" y="117">crash 3</text>
  <rect class="band amber" x="120" y="104" width="56" height="20" rx="3"/>
  <text class="code small" x="184" y="119">8 s</text>
  <text class="small" x="20" y="145">crash 4</text>
  <rect class="band amber" x="120" y="132" width="112" height="20" rx="3"/>
  <text class="code small" x="240" y="147">16 s</text>
  <text class="small" x="20" y="173">crash 5</text>
  <rect class="band amber" x="120" y="160" width="224" height="20" rx="3"/>
  <text class="code small" x="352" y="175">32 s</text>
  <text class="small" x="20" y="201">crash 6</text>
  <rect class="band amber" x="120" y="188" width="448" height="20" rx="3"/>
  <text class="code small" x="576" y="203">64 s</text>
  <text class="small" x="20" y="229">later</text>
  <rect class="band amber" x="120" y="216" width="448" height="20" rx="3"/>
  <text class="code small" x="576" y="231">64 s cap</text>
  <text class="small muted" x="20" y="264">At maxAttempts (5 by default) the worker appends WorkflowFailed instead of another delay.</text>
</svg>
