<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316">
  <text class="heading" x="20" y="28">Journal stream</text>
  <text class="heading" x="388" y="28">WorkflowState (Map Text Value)</text>
  <rect class="band accent" x="16" y="40" width="300" height="236" rx="6"/>
  <text class="code accent" x="32" y="62">wf:&lt;name&gt;-&lt;id&gt;</text>
  <rect class="band" x="384" y="40" width="280" height="236" rx="6"/>
  <text class="code" x="400" y="62">step name → JSON result</text>
  <rect class="node" x="32" y="76" width="268" height="30" rx="5"/>
  <text class="code small" x="44" y="95">StepRecorded reserve</text>
  <rect class="node" x="32" y="116" width="268" height="30" rx="5"/>
  <text class="code small" x="44" y="135">StepRecorded sleep:cooldown</text>
  <rect class="node" x="32" y="156" width="268" height="30" rx="5"/>
  <text class="code small" x="44" y="175">StepRecorded child:c7</text>
  <rect class="node" x="32" y="196" width="268" height="30" rx="5"/>
  <text class="code small" x="44" y="215">StepRecorded child:c7:result</text>
  <rect class="node muted" x="32" y="236" width="268" height="30" rx="5"/>
  <text class="code small" x="44" y="255">WorkflowCompleted</text>
  <path class="edge accent" d="M300 91 H394" marker-end="url(#arrow-accent)"/>
  <path class="edge accent" d="M300 131 H394" marker-end="url(#arrow-accent)"/>
  <path class="edge accent" d="M300 171 H394" marker-end="url(#arrow-accent)"/>
  <path class="edge accent" d="M300 211 H394" marker-end="url(#arrow-accent)"/>
  <rect class="node" x="400" y="76" width="248" height="30" rx="5"/>
  <text class="code small" x="412" y="95">reserve</text>
  <text class="small muted" x="636" y="95" text-anchor="end">step result</text>
  <rect class="node" x="400" y="116" width="248" height="30" rx="5"/>
  <text class="code small" x="412" y="135">sleep:cooldown</text>
  <text class="small muted" x="636" y="135" text-anchor="end">null</text>
  <rect class="node" x="400" y="156" width="248" height="30" rx="5"/>
  <text class="code small" x="412" y="175">child:c7</text>
  <text class="small muted" x="636" y="175" text-anchor="end">spawn record</text>
