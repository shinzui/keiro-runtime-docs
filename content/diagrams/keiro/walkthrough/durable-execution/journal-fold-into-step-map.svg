  <text class="code small" x="412" y="215">child:c7:result</text>
  <text class="small muted" x="636" y="215" text-anchor="end">child result</text>
  <text class="small italic muted" x="412" y="255">terminal marker: no map entry</text>
  <text class="small muted" x="20" y="300">Reserved prefixes let wake completions use the same StepRecorded event.</text>
