<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 344">
  <text class="heading" x="20" y="28">StateCodec in the running code</text>
  <text class="heading" x="356" y="28">One keiro.keiro_snapshots row</text>

  <rect class="band" x="356" y="44" width="308" height="34" rx="5"/>
  <text class="code" x="370" y="66">stream_id</text>
  <text class="small muted" x="530" y="65">Kiroku stream id</text>

  <rect class="band" x="356" y="86" width="308" height="34" rx="5"/>
  <text class="code" x="370" y="108">stream_version</text>
  <text class="small muted" x="530" y="107">snapshot version</text>

  <rect class="band" x="356" y="128" width="308" height="34" rx="5"/>
  <text class="code" x="370" y="150">state</text>
  <text class="code small" x="450" y="149">{ state, registers }</text>

  <rect class="band accent" x="356" y="170" width="308" height="34" rx="5"/>
  <text class="code accent" x="370" y="192">state_codec_version</text>

  <rect class="band accent" x="356" y="212" width="308" height="34" rx="5"/>
  <text class="code accent" x="370" y="234">regfile_shape_hash</text>

  <rect class="band accent" x="356" y="254" width="308" height="34" rx="5"/>
  <text class="code accent" x="370" y="276">state_shape_hash</text>

  <rect class="node" x="20" y="128" width="220" height="34" rx="5"/>
  <text class="code" x="130" y="150" text-anchor="middle">encode (s, RegFile rs)</text>
  <path class="edge muted" d="M240 145 H348" marker-end="url(#arrow)"/>

  <rect class="node accent" x="20" y="170" width="220" height="34" rx="5"/>
  <text class="code" x="130" y="192" text-anchor="middle">stateCodecVersion</text>
  <path class="edge accent" d="M240 187 H348" marker-end="url(#arrow-accent)"/>
  <text class="small accent" x="294" y="181" text-anchor="middle">equal?</text>

  <rect class="node accent" x="20" y="212" width="220" height="34" rx="5"/>
  <text class="code" x="130" y="234" text-anchor="middle">shapeHash</text>
  <path class="edge accent" d="M240 229 H348" marker-end="url(#arrow-accent)"/>
  <text class="small accent" x="294" y="223" text-anchor="middle">equal?</text>

  <rect class="node accent" x="20" y="254" width="220" height="34" rx="5"/>
  <text class="code" x="130" y="276" text-anchor="middle">stateShapeHash</text>
  <path class="edge accent" d="M240 271 H348" marker-end="url(#arrow-accent)"/>
  <text class="small accent" x="294" y="265" text-anchor="middle">equal?</text>

  <text class="small muted" x="20" y="318">All three must match before decode. Any mismatch is SnapshotNotFound,</text>
  <text class="small muted" x="20" y="334">and hydration replays events from the initial pair.</text>
</svg>
