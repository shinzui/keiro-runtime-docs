<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 242">
  <text class="heading" x="20" y="24">Every 3 · one command appends two events</text>

  <rect class="band accent" x="200" y="86" width="140" height="48" rx="6"/>
  <text class="small accent" x="306" y="128" text-anchor="middle">(2, 4]</text>

  <path class="axis" d="M40 110 H640"/>
  <path class="axis" d="M60 104 V116 M130 104 V116 M200 104 V116 M270 104 V116 M340 104 V116 M410 104 V116 M480 104 V116 M550 104 V116 M620 104 V116"/>

  <path class="edge dashed muted" d="M270 64 V84"/>
  <path class="edge dashed muted" d="M340 64 V84"/>
  <rect class="node" x="238" y="36" width="64" height="28" rx="5"/>
  <text class="code small" x="270" y="54" text-anchor="middle">event v3</text>
  <rect class="node" x="308" y="36" width="64" height="28" rx="5"/>
  <text class="code small" x="340" y="54" text-anchor="middle">event v4</text>

  <circle class="dot accent" cx="270" cy="110" r="6"/>
  <circle class="dot muted" cx="480" cy="110" r="5"/>
  <text class="small muted" x="480" y="94" text-anchor="middle">next multiple</text>

  <text class="code small" x="60" y="152" text-anchor="middle">0</text>
  <text class="code small" x="130" y="152" text-anchor="middle">1</text>
  <text class="code small" x="200" y="152" text-anchor="middle">2</text>
  <text class="code small accent" x="270" y="152" text-anchor="middle">3</text>
  <text class="code small" x="340" y="152" text-anchor="middle">4</text>
  <text class="code small" x="410" y="152" text-anchor="middle">5</text>
  <text class="code small" x="480" y="152" text-anchor="middle">6</text>
  <text class="code small" x="550" y="152" text-anchor="middle">7</text>
  <text class="small muted" x="620" y="152" text-anchor="middle">version</text>

  <text class="small muted" x="200" y="172" text-anchor="middle">preVersion</text>
  <text class="small muted" x="340" y="172" text-anchor="middle">postVersion</text>

  <text class="small" x="20" y="212">Version 3 is a multiple of 3 inside (2, 4], so shouldSnapshotSpan fires.</text>
  <text class="small muted" x="20" y="230">A check of only the final version 4 would miss this boundary.</text>
</svg>
