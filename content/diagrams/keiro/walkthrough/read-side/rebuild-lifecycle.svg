<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <text class="heading" x="20" y="26">keiro_read_models status</text>
  <rect class="band green" x="20" y="36" width="128" height="30" rx="5"/>
  <text class="code small green" x="84" y="55" text-anchor="middle">Live</text>
  <rect class="band amber" x="154" y="36" width="446" height="30" rx="5"/>
  <text class="code small amber" x="377" y="55" text-anchor="middle">Rebuilding</text>
  <rect class="band green" x="606" y="36" width="54" height="30" rx="5"/>
  <text class="code small green" x="633" y="55" text-anchor="middle">Live</text>

  <text class="heading" x="20" y="92">Rebuilder</text>
  <rect class="node amber" x="152" y="100" width="144" height="100" rx="5"/>
  <text class="code small" x="224" y="118" text-anchor="middle">startRebuild</text>
  <text class="small" x="160" y="140">1. status Rebuilding</text>
  <text class="small" x="160" y="156">2. TRUNCATE table</text>
  <text class="small" x="160" y="172">3. delete dedup rows</text>
  <text class="small" x="160" y="188">4. reset to replayFrom</text>
  <text class="small muted" x="224" y="214" text-anchor="middle">one transaction</text>

  <rect class="node" x="302" y="100" width="98" height="100" rx="5"/>
  <text class="small bold" x="351" y="118" text-anchor="middle">replay</text>
  <text class="small" x="351" y="140" text-anchor="middle">unfenced</text>
  <text class="small" x="351" y="156" text-anchor="middle">apply from</text>
  <text class="code small" x="351" y="172" text-anchor="middle">replayFrom</text>
  <text class="small muted" x="351" y="188" text-anchor="middle">dedup kept</text>

  <rect class="node" x="406" y="100" width="68" height="100" rx="5"/>
  <text class="small bold" x="440" y="118" text-anchor="middle">verify</text>
  <text class="small" x="440" y="140" text-anchor="middle">table</text>
  <text class="small" x="440" y="156" text-anchor="middle">and</text>
  <text class="small" x="440" y="172" text-anchor="middle">cursor</text>

  <rect class="node green" x="480" y="100" width="120" height="100" rx="5"/>
  <text class="code small" x="540" y="118" text-anchor="middle">finishRebuild</text>
  <text class="small" x="540" y="140" text-anchor="middle">zero-apply guard</text>
  <text class="small" x="540" y="156" text-anchor="middle">passes, then</text>
  <text class="small" x="540" y="172" text-anchor="middle">status Live</text>


  <text class="heading" x="20" y="242">Live async writer</text>
  <rect class="node" x="20" y="250" width="128" height="44" rx="5"/>
  <text class="code small" x="84" y="268" text-anchor="middle">AsyncApplied</text>
  <text class="small muted" x="84" y="285" text-anchor="middle">checkpoint</text>
  <rect class="node rose" x="300" y="250" width="174" height="44" rx="5"/>
  <text class="code small rose" x="387" y="268" text-anchor="middle">AsyncFenced</text>
  <text class="small" x="387" y="285" text-anchor="middle">fail or park, no checkpoint</text>
  <rect class="node" x="606" y="250" width="54" height="44" rx="5"/>
  <text class="small" x="633" y="276" text-anchor="middle">resume</text>

  <text class="small muted" x="20" y="318">The registry row lock serializes the two sides: a live writer commits before</text>
  <text class="small muted" x="20" y="334">the Rebuilding transition, or runs after it and returns AsyncFenced.</text>
</svg>
