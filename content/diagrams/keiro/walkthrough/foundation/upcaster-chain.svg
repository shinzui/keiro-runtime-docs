<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330">
  <text class="heading" x="20" y="24">Contiguous chain</text>
  <text class="code small muted" x="20" y="44">orderCodec: schemaVersion = 2, upcasters = [(1, const upcastOrderPlacedV1)]</text>
  <rect class="node" x="20" y="62" width="130" height="36" rx="6"/>
  <text class="code" x="85" y="85" text-anchor="middle">v1 payload</text>
  <path class="edge" d="M150 80 H244" marker-end="url(#arrow)"/>
  <text class="code small" x="197" y="72" text-anchor="middle">rung 1</text>
  <rect class="node accent" x="250" y="62" width="130" height="36" rx="6"/>
  <text class="code accent" x="315" y="85" text-anchor="middle">v2 payload</text>
  <path class="edge" d="M380 80 H474" marker-end="url(#arrow)"/>
  <text class="code small" x="427" y="72" text-anchor="middle">decode</text>
  <rect class="node green" x="480" y="62" width="180" height="36" rx="6"/>
  <text class="code" x="570" y="85" text-anchor="middle">OrderEvent</text>
  <rect class="node" x="20" y="132" width="130" height="36" rx="6"/>
  <text class="code" x="85" y="155" text-anchor="middle">v2 payload</text>
  <path class="edge" d="M150 150 H315 V104" marker-end="url(#arrow)"/>
  <text class="small muted" x="162" y="186">Already at schemaVersion: no rung runs.</text>
  <text class="small muted" x="350" y="130">Stored version comes from the</text>
  <text class="small muted" x="350" y="147">schemaVersion stamp in metadata.</text>

  <text class="heading" x="20" y="226">Gap in the chain</text>
  <text class="code small muted" x="20" y="246">schemaVersion = 4, upcasters = [(1, …), (3, …)]</text>
  <rect class="node" x="20" y="264" width="110" height="36" rx="6"/>
  <text class="code" x="75" y="287" text-anchor="middle">v1 payload</text>
  <path class="edge" d="M130 282 H204" marker-end="url(#arrow)"/>
  <text class="code small" x="167" y="274" text-anchor="middle">rung 1</text>
  <rect class="node" x="210" y="264" width="110" height="36" rx="6"/>
  <text class="code" x="265" y="287" text-anchor="middle">v2 payload</text>
  <path class="edge dashed rose" d="M320 282 H414" marker-end="url(#arrow-rose)"/>
  <text class="small rose" x="367" y="274" text-anchor="middle">no rung 2</text>
  <rect class="node rose" x="420" y="264" width="240" height="36" rx="6"/>
  <text class="code" x="540" y="287" text-anchor="middle">GapInUpcasterChain 2 3</text>
  <text class="small muted" x="20" y="322">Migration stops at version 2 because the next rung starts at version 3.</text>
</svg>
