<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 402">
  <text class="heading" x="20" y="26">Control state: the vertex</text>
  <rect class="node" x="20" y="40" width="64" height="30" rx="5"/>
  <text class="code small" x="52" y="59" text-anchor="middle">Empty</text>
  <rect class="node" x="96" y="40" width="116" height="30" rx="5"/>
  <text class="code small" x="154" y="59" text-anchor="middle">OpenWithItems</text>
  <rect class="node" x="224" y="40" width="88" height="30" rx="5"/>
  <text class="code small" x="268" y="59" text-anchor="middle">Reserved</text>
  <rect class="node accent" x="324" y="40" width="60" height="30" rx="5"/>
  <text class="code small accent" x="354" y="59" text-anchor="middle">Paid</text>
  <rect class="node" x="396" y="40" width="80" height="30" rx="5"/>
  <text class="code small" x="436" y="59" text-anchor="middle">Shipped</text>
  <rect class="node" x="488" y="40" width="92" height="30" rx="5"/>
  <text class="code small" x="534" y="59" text-anchor="middle">Delivered</text>
  <text class="small muted" x="20" y="92">OrderVertex also has Cancelled and Refunded.</text>

  <path class="edge dashed muted" d="M354 70 V112 H282 V166"/>
  <path class="edge dashed muted" d="M354 112 H612 V166"/>

  <rect class="group" x="20" y="132" width="310" height="206" rx="8"/>
  <text class="code bold" x="36" y="158">order A</text>
  <text class="small muted" x="104" y="158">canonicalLog, events 1 to 7</text>
  <text class="small muted" x="36" y="188">state</text>
  <rect class="node accent" x="250" y="170" width="64" height="26" rx="5"/>
  <text class="code small accent" x="282" y="187" text-anchor="middle">Paid</text>
  <text class="small muted" x="36" y="218">registers</text>
  <rect class="band" x="30" y="226" width="290" height="22" rx="4"/>
  <text class="code small" x="40" y="241">itemCount</text>
  <text class="code small" x="310" y="241" text-anchor="end">4</text>
  <rect class="band" x="30" y="252" width="290" height="22" rx="4"/>
  <text class="code small" x="40" y="267">discountBp</text>
  <text class="code small" x="310" y="267" text-anchor="end">1000</text>
  <rect class="band" x="30" y="278" width="290" height="22" rx="4"/>
  <text class="code small" x="40" y="293">paymentRef</text>
  <text class="code small" x="310" y="293" text-anchor="end">"PAY-99"</text>
  <rect class="band" x="30" y="304" width="290" height="22" rx="4"/>
  <text class="code small" x="40" y="319">amountPaid</text>
  <text class="code small" x="310" y="319" text-anchor="end">1925</text>

  <rect class="group" x="350" y="132" width="310" height="206" rx="8"/>
  <text class="code bold" x="366" y="158">order B</text>
  <text class="small muted" x="434" y="158">refundLog, events 1 to 3</text>
  <text class="small muted" x="366" y="188">state</text>
  <rect class="node accent" x="580" y="170" width="64" height="26" rx="5"/>
  <text class="code small accent" x="612" y="187" text-anchor="middle">Paid</text>
  <text class="small muted" x="366" y="218">registers</text>
  <rect class="band" x="360" y="226" width="290" height="22" rx="4"/>
  <text class="code small" x="370" y="241">itemCount</text>
  <text class="code small" x="640" y="241" text-anchor="end">1</text>
  <rect class="band" x="360" y="252" width="290" height="22" rx="4"/>
  <text class="code small" x="370" y="267">discountBp</text>
  <text class="small italic muted" x="640" y="267" text-anchor="end">not set</text>
  <rect class="band" x="360" y="278" width="290" height="22" rx="4"/>
  <text class="code small" x="370" y="293">paymentRef</text>
  <text class="code small" x="640" y="293" text-anchor="end">"PAY-7"</text>
  <rect class="band" x="360" y="304" width="290" height="22" rx="4"/>
  <text class="code small" x="370" y="319">amountPaid</text>
  <text class="code small" x="640" y="319" text-anchor="end">100</text>

  <text class="small muted" x="20" y="366">Values from the OrderCart test logs in keiki. amountPaid is fixed-point money. discountBp is in basis points.</text>
  <text class="small muted" x="20" y="384">Same vertex, different registers: the vertex alone cannot rebuild the register file.</text>
</svg>
