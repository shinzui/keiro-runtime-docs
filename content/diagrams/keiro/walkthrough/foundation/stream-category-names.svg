<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410">
  <text class="heading" x="20" y="24">One declaration, two derived names</text>
  <rect class="node accent" x="20" y="62" width="170" height="48" rx="6"/>
  <text class="code accent" x="105" y="83" text-anchor="middle">orderCategory</text>
  <text class="small muted" x="105" y="100" text-anchor="middle">StreamCategory a</text>
  <path class="edge" d="M190 80 H240 V56 H394" marker-end="url(#arrow)"/>
  <path class="edge" d="M190 92 H240 V116 H394" marker-end="url(#arrow)"/>
  <text class="code small" x="252" y="49">entityStream</text>
  <text class="code small" x="252" y="109">categoryName</text>
  <rect class="node" x="400" y="38" width="260" height="36" rx="6"/>
  <text class="code" x="530" y="61" text-anchor="middle">Stream a: "order-&lt;id&gt;"</text>
  <rect class="node" x="400" y="98" width="260" height="36" rx="6"/>
  <text class="code" x="530" y="121" text-anchor="middle">CategoryName: "order"</text>
  <text class="small green" x="530" y="156" text-anchor="middle">Always equal to kiroku's category</text>
  <text class="small green" x="530" y="172" text-anchor="middle">of every entityStream name.</text>

  <text class="heading" x="20" y="204">Stream name anatomy</text>
  <rect class="node accent" x="20" y="216" width="110" height="34" rx="5"/>
  <text class="code accent" x="75" y="238" text-anchor="middle">order</text>
  <rect class="node" x="130" y="216" width="28" height="34" rx="5"/>
  <text class="code" x="144" y="238" text-anchor="middle">-</text>
  <rect class="node" x="158" y="216" width="110" height="34" rx="5"/>
  <text class="code" x="213" y="238" text-anchor="middle">&lt;id&gt;</text>
  <path class="axis accent" d="M24 258 H126"/>
  <path class="axis" d="M162 258 H264"/>
  <text class="small accent" x="75" y="274" text-anchor="middle">category</text>
  <text class="small" x="213" y="274" text-anchor="middle">entity id</text>
  <text class="small muted" x="300" y="232">kiroku splits a stream name at its first -.</text>
  <text class="small muted" x="300" y="250">The category is the join key for readCategory</text>
  <text class="small muted" x="300" y="268">and for category subscriptions.</text>

  <text class="heading" x="20" y="310">A raw prefix that contains a dash</text>
  <rect class="group" x="15" y="319" width="222" height="44" rx="7"/>
  <rect class="node rose" x="20" y="324" width="100" height="34" rx="5"/>
  <text class="code rose" x="70" y="346" text-anchor="middle">hospital</text>
  <rect class="node" x="120" y="324" width="28" height="34" rx="5"/>
  <text class="code" x="134" y="346" text-anchor="middle">-</text>
  <rect class="node" x="148" y="324" width="84" height="34" rx="5"/>
  <text class="code" x="190" y="346" text-anchor="middle">surge</text>
  <rect class="node" x="242" y="324" width="28" height="34" rx="5"/>
  <text class="code" x="256" y="346" text-anchor="middle">-</text>
  <rect class="node" x="270" y="324" width="44" height="34" rx="5"/>
  <text class="code" x="292" y="346" text-anchor="middle">&lt;id&gt;</text>
  <text class="small rose" x="70" y="382" text-anchor="middle">parsed category</text>
  <text class="small muted" x="126" y="400" text-anchor="middle">intended prefix</text>
  <text class="code small" x="350" y="336">category "hospital-surge"</text>
  <text class="small rose" x="350" y="354">returns Left CategoryError,</text>
  <text class="small muted" x="350" y="372">so the bug fails at the definition site.</text>
</svg>
