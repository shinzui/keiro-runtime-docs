<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348">
  <text class="heading" x="20" y="24">Example: one source, rows in created_at order</text>
  <text class="small muted" x="30" y="54">row</text>
  <text class="small muted" x="80" y="54">message_key</text>
  <text class="small muted" x="180" y="54">status</text>
  <text class="code small bold" x="350" y="54" text-anchor="middle">PerKeyHeadOfLine</text>
  <text class="code small bold" x="480" y="54" text-anchor="middle">PerSourceStream</text>
  <text class="code small bold" x="610" y="54" text-anchor="middle">BestEffort</text>
  <rect class="band" x="16" y="64" width="648" height="36" rx="5"/>
  <text class="code small" x="30" y="87">r1</text>
  <text class="code small bold" x="80" y="87">A</text>
  <text class="code small amber" x="180" y="87">publishing</text>
  <text class="small muted" x="350" y="87" text-anchor="middle">not a candidate</text>
  <text class="small muted" x="480" y="87" text-anchor="middle">not a candidate</text>
  <text class="small muted" x="610" y="87" text-anchor="middle">not a candidate</text>
  <rect class="band" x="16" y="106" width="648" height="36" rx="5"/>
  <text class="code small" x="30" y="129">r2</text>
  <text class="code small bold" x="80" y="129">B</text>
  <text class="code small" x="180" y="129">pending</text>
  <rect class="node green" x="316" y="112" width="68" height="24" rx="12"/>
  <text class="small" x="350" y="128" text-anchor="middle">claim</text>
  <text class="small rose" x="480" y="129" text-anchor="middle">blocked</text>
  <rect class="node green" x="576" y="112" width="68" height="24" rx="12"/>
  <text class="small" x="610" y="128" text-anchor="middle">claim</text>
  <rect class="band" x="16" y="148" width="648" height="36" rx="5"/>
  <text class="code small" x="30" y="171">r3</text>
  <text class="code small bold" x="80" y="171">A</text>
  <text class="code small" x="180" y="171">pending</text>
  <text class="small rose" x="350" y="171" text-anchor="middle">blocked</text>
  <text class="small rose" x="480" y="171" text-anchor="middle">blocked</text>
  <rect class="node green" x="576" y="154" width="68" height="24" rx="12"/>
  <text class="small" x="610" y="170" text-anchor="middle">claim</text>
  <rect class="band" x="16" y="190" width="648" height="36" rx="5"/>
  <text class="code small" x="30" y="213">r4</text>
  <text class="code small muted italic" x="80" y="213">null</text>
  <text class="code small" x="180" y="213">pending</text>
  <rect class="node green" x="316" y="196" width="68" height="24" rx="12"/>
  <text class="small" x="350" y="212" text-anchor="middle">claim</text>
  <text class="small rose" x="480" y="213" text-anchor="middle">blocked</text>
  <rect class="node green" x="576" y="196" width="68" height="24" rx="12"/>
  <text class="small" x="610" y="212" text-anchor="middle">claim</text>
  <rect class="band" x="16" y="232" width="648" height="36" rx="5"/>
  <text class="code small" x="30" y="255">r5</text>
  <text class="code small bold" x="80" y="255">B</text>
  <text class="code small" x="180" y="255">pending</text>
  <text class="small rose" x="350" y="255" text-anchor="middle">blocked</text>
  <text class="small rose" x="480" y="255" text-anchor="middle">blocked</text>
  <rect class="node green" x="576" y="238" width="68" height="24" rx="12"/>
  <text class="small" x="610" y="254" text-anchor="middle">claim</text>
  <text class="small muted" x="20" y="290">r1 is publishing: non-terminal, so it blocks later rows, but the claim never selects it.</text>
  <text class="small muted" x="20" y="310">PerKeyHeadOfLine: an earlier non-terminal row with the same key blocks. Null keys bypass.</text>
  <text class="small muted" x="20" y="330">PerSourceStream: any earlier non-terminal row in the source blocks. BestEffort never blocks.</text>
</svg>
