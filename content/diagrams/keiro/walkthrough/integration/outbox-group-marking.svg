<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 314">
  <text class="heading" x="20" y="24">Example: one PerKeyHeadOfLine group, key A</text>
  <text class="small muted" x="30" y="54">row</text>
  <text class="small muted" x="80" y="54">publish outcome</text>
  <text class="small muted" x="244" y="54">mark</text>
  <text class="small muted" x="400" y="54">why</text>
  <rect class="band" x="28" y="64" width="620" height="36" rx="5"/>
  <text class="code small bold" x="40" y="87">A1</text>
  <text class="code small" x="80" y="87">PublishSucceeded</text>
  <rect class="node green" x="236" y="70" width="146" height="24" rx="5"/>
  <text class="code small" x="309" y="86" text-anchor="middle">sent</text>
  <text class="small muted" x="400" y="87">terminal</text>
  <rect class="band" x="28" y="106" width="620" height="36" rx="5"/>
  <text class="code small bold" x="40" y="129">A2</text>
  <text class="code small" x="80" y="129">PublishRejected</text>
  <rect class="node violet" x="236" y="112" width="146" height="24" rx="5"/>
  <text class="code small" x="309" y="128" text-anchor="middle">rejected</text>
  <text class="small muted" x="400" y="129">terminal, keeps code and detail</text>
  <rect class="band rose" x="28" y="148" width="620" height="36" rx="5"/>
  <text class="code small bold" x="40" y="171">A3</text>
  <text class="code small" x="80" y="171">PublishFailed</text>
  <rect class="node rose" x="236" y="154" width="146" height="24" rx="5"/>
  <text class="code small" x="309" y="170" text-anchor="middle">failed or dead</text>
  <text class="small muted" x="400" y="171">the pivot: dead at maxAttempts</text>
  <rect class="band" x="28" y="190" width="620" height="36" rx="5"/>
  <text class="code small bold" x="40" y="213">A4</text>
  <text class="code small" x="80" y="213">PublishSucceeded</text>
  <rect class="node amber" x="236" y="196" width="146" height="24" rx="5"/>
  <text class="code small" x="309" y="212" text-anchor="middle">failed (skipped)</text>
  <text class="small muted" x="400" y="213">after the pivot: attempt not consumed</text>
  <rect class="band" x="28" y="232" width="620" height="36" rx="5"/>
  <text class="code small bold" x="40" y="255">A5</text>
  <text class="code small" x="80" y="255">PublishFailed</text>
  <rect class="node amber" x="236" y="238" width="146" height="24" rx="5"/>
  <text class="code small" x="309" y="254" text-anchor="middle">failed (skipped)</text>
  <text class="small muted" x="400" y="255">after the pivot: attempt not consumed</text>
  <rect class="group accent" x="16" y="40" width="648" height="240" rx="8"/>
  <text class="small accent" x="30" y="296">All marks commit in one transaction. Each mark applies only if the row is still publishing.</text>
</svg>
