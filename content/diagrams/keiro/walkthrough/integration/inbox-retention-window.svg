<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318">
  <text class="heading" x="20" y="24">deliveries of one message</text>
  <rect class="node green" x="40" y="36" width="130" height="44" rx="6"/>
  <text class="small" x="105" y="54" text-anchor="middle">first delivery</text>
  <text class="small" x="105" y="71" text-anchor="middle">handler runs</text>
  <rect class="node" x="225" y="36" width="150" height="44" rx="6"/>
  <text class="small" x="300" y="54" text-anchor="middle">redelivery</text>
  <text class="code small" x="300" y="71" text-anchor="middle">InboxDuplicate</text>
  <rect class="node amber" x="500" y="36" width="150" height="44" rx="6"/>
  <text class="small" x="575" y="54" text-anchor="middle">redelivery after GC</text>
  <text class="small" x="575" y="71" text-anchor="middle">handler runs again</text>

  <path class="edge dashed muted" d="M105 80 V140"/>
  <path class="edge dashed muted" d="M300 80 V140"/>
  <path class="edge dashed muted" d="M575 80 V140"/>

  <text class="heading" x="20" y="194">keiro_inbox row (source, dedupe_key)</text>
  <rect class="band green" x="105" y="140" width="335" height="30" rx="4"/>
  <text class="code small" x="120" y="160">completed</text>
  <rect class="band amber" x="575" y="140" width="85" height="30" rx="4"/>
  <text class="code small" x="586" y="160">completed</text>
  <text class="small muted" x="508" y="160" text-anchor="middle">no row</text>

  <path class="edge rose dashed" d="M440 128 V196"/>
  <text class="code small rose" x="440" y="214" text-anchor="middle">garbageCollectCompleted</text>
  <text class="small rose" x="440" y="230" text-anchor="middle">deletes the row</text>

  <rect class="band accent" x="105" y="250" width="290" height="22" rx="4"/>
  <text class="small accent" x="250" y="265" text-anchor="middle">keepFor: duplicate-detection window</text>

  <path class="axis" d="M40 292 H650" marker-end="url(#arrow)"/>
  <text class="small muted" x="105" y="308" text-anchor="middle">completed_at</text>
  <text class="small muted" x="620" y="308" text-anchor="end">time</text>
</svg>
