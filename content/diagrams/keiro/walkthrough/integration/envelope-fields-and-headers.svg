<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 684">
  <text class="heading" x="28" y="24">IntegrationEvent field</text>
  <text class="heading" x="232" y="24">wire name</text>
  <text class="heading" x="510" y="24">emitted</text>
  <rect class="band" x="16" y="36" width="648" height="52" rx="6"/>
  <text class="small muted italic" x="28" y="52">identity</text>
  <text class="code small" x="40" y="74">messageId</text>
  <text class="code small accent" x="232" y="74">keiro-message-id</text>
  <circle class="dot accent" cx="516" cy="70" r="4"/>
  <text class="small accent bold" x="528" y="74">always</text>
  <rect class="band" x="16" y="96" width="648" height="100" rx="6"/>
  <text class="small muted italic" x="28" y="112">routing</text>
  <text class="code small" x="40" y="134">source</text>
  <text class="code small accent" x="232" y="134">keiro-source</text>
  <circle class="dot accent" cx="516" cy="130" r="4"/>
  <text class="small accent bold" x="528" y="134">always</text>
  <text class="code small" x="40" y="158">destination</text>
  <text class="code small accent" x="232" y="158">keiro-destination</text>
  <circle class="dot accent" cx="516" cy="154" r="4"/>
  <text class="small accent bold" x="528" y="158">always</text>
  <text class="code small" x="40" y="182">key</text>
  <text class="small violet" x="232" y="182">Kafka record key</text>
  <text class="small violet" x="528" y="182">record field</text>
  <rect class="band" x="16" y="204" width="648" height="124" rx="6"/>
  <text class="small muted italic" x="28" y="220">contract</text>
  <text class="code small" x="40" y="242">eventType</text>
  <text class="code small accent" x="232" y="242">keiro-event-type</text>
  <circle class="dot accent" cx="516" cy="238" r="4"/>
  <text class="small accent bold" x="528" y="242">always</text>
  <text class="code small" x="40" y="266">schemaVersion</text>
  <text class="code small accent" x="232" y="266">keiro-schema-version</text>
  <circle class="dot accent" cx="516" cy="262" r="4"/>
  <text class="small accent bold" x="528" y="266">always</text>
  <text class="code small" x="40" y="290">contentType</text>
  <text class="code small accent" x="232" y="290">content-type</text>
  <circle class="dot accent" cx="516" cy="286" r="4"/>
  <text class="small accent bold" x="528" y="290">always</text>
  <text class="code small" x="40" y="314">schemaReference</text>
  <text class="code small" x="232" y="314">keiro-schema-* (up to 5)</text>
  <circle class="node" cx="516" cy="310" r="4"/>
  <text class="small " x="528" y="314">only when set</text>
  <rect class="band" x="16" y="336" width="648" height="124" rx="6"/>
  <text class="small muted italic" x="28" y="352">provenance</text>
  <text class="code small" x="40" y="374">sourceEventId</text>
  <text class="code small" x="232" y="374">keiro-source-event-id</text>
  <circle class="node" cx="516" cy="370" r="4"/>
  <text class="small " x="528" y="374">only when set</text>
  <text class="code small" x="40" y="398">sourceGlobalPosition</text>
  <text class="code small" x="232" y="398">keiro-source-global-position</text>
  <circle class="node" cx="516" cy="394" r="4"/>
  <text class="small " x="528" y="398">only when set</text>
  <text class="code small" x="40" y="422">causationId</text>
  <text class="code small" x="232" y="422">keiro-causation-id</text>
  <circle class="node" cx="516" cy="418" r="4"/>
  <text class="small " x="528" y="422">only when set</text>
  <text class="code small" x="40" y="446">correlationId</text>
  <text class="code small" x="232" y="446">keiro-correlation-id</text>
  <circle class="node" cx="516" cy="442" r="4"/>
  <text class="small " x="528" y="446">only when set</text>
  <rect class="band" x="16" y="468" width="648" height="76" rx="6"/>
  <text class="small muted italic" x="28" y="484">payload and time</text>
  <text class="code small" x="40" y="506">payloadBytes</text>
  <text class="small violet" x="232" y="506">Kafka record payload</text>
  <text class="small violet" x="528" y="506">record field</text>
  <text class="code small" x="40" y="530">occurredAt</text>
  <text class="code small accent" x="232" y="530">keiro-occurred-at</text>
  <circle class="dot accent" cx="516" cy="526" r="4"/>
  <text class="small accent bold" x="528" y="530">always</text>
  <rect class="band" x="16" y="552" width="648" height="76" rx="6"/>
  <text class="small muted italic" x="28" y="568">cross-cutting</text>
  <text class="code small" x="40" y="590">traceContext</text>
  <text class="code small" x="232" y="590">traceparent, tracestate</text>
  <circle class="node" cx="516" cy="586" r="4"/>
  <text class="small " x="528" y="590">only when set</text>
  <text class="code small" x="40" y="614">attributes</text>
  <text class="code small" x="232" y="614">keiro-attributes (JSON)</text>
  <circle class="node" cx="516" cy="610" r="4"/>
  <text class="small " x="528" y="614">only when set</text>
  <text class="small muted" x="28" y="652">integrationHeaders always emits the seven accent headers.</text>
  <text class="small muted" x="28" y="670">It adds each other header only when its field is set.</text>
</svg>
