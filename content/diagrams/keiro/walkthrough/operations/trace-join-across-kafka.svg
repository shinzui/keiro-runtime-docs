<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <rect class="band" x="16" y="30" width="648" height="70" rx="6"/>
  <text class="heading" x="28" y="52">producer process</text>
  <rect class="node accent" x="150" y="58" width="260" height="30" rx="5"/>
  <text class="code small" x="280" y="77" text-anchor="middle">send billing.orders.v1</text>
  <text class="small muted" x="422" y="77">kind Producer, trace T</text>


  <rect class="band" x="16" y="116" width="648" height="70" rx="6"/>
  <text class="heading" x="28" y="138">Kafka record</text>
  <rect class="node" x="150" y="144" width="260" height="30" rx="5"/>
  <text class="code small" x="280" y="163" text-anchor="middle">traceparent, tracestate</text>
  <text class="small muted" x="422" y="163">headers from traceContext</text>


  <rect class="band" x="16" y="202" width="648" height="116" rx="6"/>
  <text class="heading" x="28" y="224">consumer process</text>
  <rect class="node" x="150" y="230" width="260" height="30" rx="5"/>
  <text class="code small" x="280" y="249" text-anchor="middle">withRemoteParent</text>
  <text class="small muted" x="422" y="243">decodeSpanContext, then</text>
  <text class="small muted" x="422" y="257">attachContext for the body</text>
  <path class="edge" d="M196 260 V280" marker-end="url(#arrow)"/>
  <rect class="node accent" x="196" y="282" width="260" height="30" rx="5"/>
  <text class="code small" x="326" y="301" text-anchor="middle">process billing.orders.v1</text>
  <text class="small muted" x="468" y="295">kind Consumer, trace T</text>
  <text class="small muted" x="468" y="309">child of the remote parent</text>

  <text class="small muted" x="20" y="344">No traceparent, or one that does not parse: the consumer span opens without a remote parent.</text>
  <path class="edge" d="M280 88 V140" marker-end="url(#arrow)"/>
  <path class="edge" d="M280 174 V226" marker-end="url(#arrow)"/>
</svg>
