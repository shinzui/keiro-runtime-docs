<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <rect class="group" x="16" y="16" width="648" height="250" rx="10"/>
  <text class="heading" x="32" y="40">one PostgreSQL database</text>

  <rect class="node violet" x="32" y="54" width="196" height="34" rx="6"/>
  <text class="code bold" x="130" y="76" text-anchor="middle">kiroku</text>
  <text class="code small" x="44" y="112">streams</text>
  <text class="code small" x="44" y="132">events, stream_events</text>
  <text class="code small" x="44" y="152">subscriptions</text>
  <text class="code small" x="44" y="172">dead_letters</text>
  <text class="small muted" x="44" y="196">event store objects</text>

  <rect class="node accent" x="242" y="54" width="196" height="34" rx="6"/>
  <text class="code bold" x="340" y="76" text-anchor="middle">keiro</text>
  <text class="code small" x="254" y="112">keiro_snapshots</text>
  <text class="code small" x="254" y="132">keiro_timers, keiro_workflows</text>
  <text class="code small" x="254" y="152">keiro_outbox, keiro_inbox</text>
  <text class="code small" x="254" y="172">keiro_dead_letters</text>
  <text class="small muted" x="254" y="196">framework objects, and more</text>

  <rect class="node dashed" x="452" y="54" width="196" height="34" rx="6"/>
  <text class="bold" x="550" y="76" text-anchor="middle">application schemas</text>
  <text class="small" x="464" y="112">projection tables</text>
  <text class="small" x="464" y="132">read-model tables</text>
  <text class="small muted" x="464" y="196">configured separately</text>

  <path class="axis" d="M32 214 H648"/>
  <text class="small muted" x="44" y="240">owner: Kiroku component</text>
  <text class="small muted" x="254" y="240">owner: keiro component</text>
  <text class="small muted" x="464" y="240">owner: the application</text>

  <text class="heading" x="20" y="300">frameworkMigrationPlan kiroku keiro</text>
  <rect class="node violet" x="32" y="314" width="196" height="36" rx="6"/>
  <text class="code" x="130" y="337" text-anchor="middle">kirokuMigrations</text>
  <rect class="node accent" x="276" y="314" width="196" height="36" rx="6"/>
  <text class="code" x="374" y="337" text-anchor="middle">keiroMigrations</text>
  <path class="edge" d="M228 332 H270" marker-end="url(#arrow)"/>
  <text class="small muted" x="276" y="370">declares a dependency on kiroku,</text>
  <text class="small muted" x="276" y="386">so it always runs after Kiroku</text>
  <rect class="node ghost" x="516" y="314" width="132" height="36" rx="6"/>
  <text class="small muted" x="582" y="336" text-anchor="middle">app components</text>
  <path class="edge dashed muted" d="M472 332 H510" marker-end="url(#arrow)"/>
  <text class="small muted" x="582" y="370" text-anchor="middle">a larger plan</text>
  <text class="small muted" x="582" y="386" text-anchor="middle">the app builds</text>
</svg>
