<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <!-- Kiroku: delivery and checkpoints -->
  <rect class="group" x="16" y="8" width="648" height="196" rx="8"/>
  <text class="small bold" x="28" y="28">Kiroku owns delivery, member checkpoints, retry, and dead letters</text>

  <rect class="node" x="49" y="40" width="96" height="24" rx="4"/>
  <text class="code small" x="97" y="56" text-anchor="middle">orders-3</text>
  <rect class="node" x="49" y="70" width="96" height="24" rx="4"/>
  <text class="code small" x="97" y="86" text-anchor="middle">orders-8</text>
  <rect class="node" x="211" y="40" width="96" height="24" rx="4"/>
  <text class="code small" x="259" y="56" text-anchor="middle">orders-1</text>
  <rect class="node" x="211" y="70" width="96" height="24" rx="4"/>
  <text class="code small" x="259" y="86" text-anchor="middle">orders-6</text>
  <rect class="node" x="373" y="40" width="96" height="24" rx="4"/>
  <text class="code small" x="421" y="56" text-anchor="middle">orders-2</text>
  <rect class="node" x="373" y="70" width="96" height="24" rx="4"/>
  <text class="code small" x="421" y="86" text-anchor="middle">orders-5</text>
  <rect class="node" x="535" y="40" width="96" height="24" rx="4"/>
  <text class="code small" x="583" y="56" text-anchor="middle">orders-4</text>
  <rect class="node" x="535" y="70" width="96" height="24" rx="4"/>
  <text class="code small" x="583" y="86" text-anchor="middle">orders-7</text>

  <path class="edge" d="M97 94 V110" marker-end="url(#arrow)"/>
  <path class="edge" d="M259 94 V110" marker-end="url(#arrow)"/>
  <path class="edge" d="M421 94 V110" marker-end="url(#arrow)"/>
  <path class="edge" d="M583 94 V110" marker-end="url(#arrow)"/>

  <rect class="node" x="24" y="114" width="146" height="44" rx="5"/>
  <text x="97" y="133" text-anchor="middle">member 0</text>
  <text class="small muted" x="97" y="150" text-anchor="middle">own checkpoint</text>
  <rect class="node" x="186" y="114" width="146" height="44" rx="5"/>
  <text x="259" y="133" text-anchor="middle">member 1</text>
  <text class="small muted" x="259" y="150" text-anchor="middle">own checkpoint</text>
  <rect class="node" x="348" y="114" width="146" height="44" rx="5"/>
  <text x="421" y="133" text-anchor="middle">member 2</text>
  <text class="small muted" x="421" y="150" text-anchor="middle">own checkpoint</text>
  <rect class="node" x="510" y="114" width="146" height="44" rx="5"/>
  <text x="583" y="133" text-anchor="middle">member 3</text>
  <text class="small muted" x="583" y="150" text-anchor="middle">own checkpoint</text>

  <text class="small muted" x="28" y="182">A stable hash of the stream id picks the member. One checkpoint per (subscription_name, member).</text>
  <text class="small muted" x="28" y="196">Parked or exhausted deliveries go to <tspan class="code">kiroku.dead_letters</tspan>.</text>

  <!-- Keiro: assignment only -->
  <rect class="group accent" x="16" y="216" width="648" height="90" rx="8"/>
  <text class="small bold" x="28" y="236">Keiro owns assignment only: <tspan class="code">keiro.keiro_subscription_shards</tspan></text>

  <rect class="node accent" x="24" y="248" width="146" height="44" rx="5"/>
  <text x="97" y="267" text-anchor="middle">bucket 0</text>
  <text class="small muted" x="97" y="284" text-anchor="middle">owner A, lease expiry</text>
  <rect class="node accent" x="186" y="248" width="146" height="44" rx="5"/>
  <text x="259" y="267" text-anchor="middle">bucket 1</text>
  <text class="small muted" x="259" y="284" text-anchor="middle">owner A, lease expiry</text>
  <rect class="node violet" x="348" y="248" width="146" height="44" rx="5"/>
  <text x="421" y="267" text-anchor="middle">bucket 2</text>
  <text class="small muted" x="421" y="284" text-anchor="middle">owner B, lease expiry</text>
  <rect class="node violet" x="510" y="248" width="146" height="44" rx="5"/>
  <text x="583" y="267" text-anchor="middle">bucket 3</text>
  <text class="small muted" x="583" y="284" text-anchor="middle">owner B, lease expiry</text>

  <path class="edge accent" d="M97 292 V326" marker-end="url(#arrow-accent)"/>
  <path class="edge accent" d="M259 292 V326" marker-end="url(#arrow-accent)"/>
  <path class="edge violet" d="M421 292 V326" marker-end="url(#arrow-violet)"/>
  <path class="edge violet" d="M583 292 V326" marker-end="url(#arrow-violet)"/>

  <rect class="node accent" x="24" y="330" width="308" height="36" rx="5"/>
  <text x="178" y="353" text-anchor="middle">Worker A runs readers for members 0 and 1</text>
  <rect class="node violet" x="348" y="330" width="308" height="36" rx="5"/>
  <text x="502" y="353" text-anchor="middle">Worker B runs readers for members 2 and 3</text>
</svg>
