<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <!-- lane 1: renewal on time -->
  <text class="heading" x="24" y="22">Renewal on time</text>
  <path class="axis dashed" d="M120 34 V114"/>
  <path class="axis dashed" d="M260 34 V114"/>
  <path class="axis dashed" d="M390 34 V114"/>
  <path class="axis dashed" d="M520 34 V114"/>
  <rect class="node rose" x="24" y="34" width="96" height="30" rx="5"/>
  <text x="72" y="54" text-anchor="middle">Dead</text>
  <rect class="node amber" x="120" y="34" width="400" height="30" rx="5"/>
  <text x="320" y="54" text-anchor="middle">Firing (claim token held)</text>
  <rect class="node green" x="520" y="34" width="136" height="30" rx="5"/>
  <text x="588" y="54" text-anchor="middle">Fired</text>
  <text class="small muted" x="24" y="94">lease</text>
  <rect class="band accent" x="120" y="74" width="180" height="8" rx="3"/>
  <rect class="band accent" x="260" y="86" width="180" height="8" rx="3"/>
  <rect class="band accent" x="390" y="98" width="180" height="8" rx="3"/>
  <text class="small accent" x="306" y="82">lease 60 s</text>
  <text class="code small" x="120" y="130" text-anchor="middle">claimDeadTimer</text>
  <text class="code small" x="260" y="130" text-anchor="middle">renewTimerResume</text>
  <text class="code small" x="390" y="130" text-anchor="middle">renewTimerResume</text>
  <text class="code small" x="520" y="130" text-anchor="middle">completeTimerResume</text>
  <text class="small muted" x="120" y="146" text-anchor="middle">attempts + 1</text>
  <text class="small muted" x="260" y="146" text-anchor="middle">extends from DB time</text>
  <text class="small green" x="520" y="146" text-anchor="middle">returns True</text>

  <!-- lane 2: renewal too late -->
  <text class="heading" x="24" y="186">Renewal too late</text>
  <path class="axis dashed" d="M120 198 V262"/>
  <path class="axis dashed" d="M340 198 V262"/>
  <path class="axis dashed" d="M520 198 V262"/>
  <rect class="node rose" x="24" y="198" width="96" height="30" rx="5"/>
  <text x="72" y="218" text-anchor="middle">Dead</text>
  <rect class="node amber" x="120" y="198" width="220" height="30" rx="5"/>
  <text x="230" y="218" text-anchor="middle">Firing (claim token held)</text>
  <rect class="node rose" x="340" y="198" width="316" height="30" rx="5"/>
  <text x="498" y="218" text-anchor="middle">Dead, ownership cleared</text>
  <text class="small muted" x="24" y="246">lease</text>
  <rect class="band accent" x="120" y="238" width="180" height="8" rx="3"/>
  <text class="small rose halo" x="306" y="248">expires</text>
  <text class="code small" x="120" y="278" text-anchor="middle">claimDeadTimer</text>
  <text class="code small" x="340" y="278" text-anchor="middle">recoverExpiredTimerResumes</text>
  <text class="code small" x="520" y="278" text-anchor="middle">renewTimerResume</text>
  <text class="small muted" x="340" y="294" text-anchor="middle">expired claim goes back to Dead</text>
  <text class="small rose" x="520" y="294" text-anchor="middle">returns False</text>
  <text class="small rose" x="520" y="310" text-anchor="middle">lost ownership: stop work</text>
</svg>
