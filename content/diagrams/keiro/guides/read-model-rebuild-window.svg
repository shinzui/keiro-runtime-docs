<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392">
  <text class="code" x="250" y="22" text-anchor="middle">startRebuild</text>
  <text class="code" x="560" y="22" text-anchor="middle">finishRebuild</text>
  <path class="axis dashed" d="M250 32 V252"/>
  <path class="axis dashed" d="M560 32 V252"/>

  <text class="small muted" x="16" y="69">Registry status</text>
  <rect class="node green" x="140" y="44" width="106" height="40" rx="5"/>
  <text x="193" y="69" text-anchor="middle">Live</text>
  <rect class="node amber" x="254" y="44" width="302" height="40" rx="5"/>
  <text x="405" y="69" text-anchor="middle">Rebuilding (writer fence)</text>
  <rect class="node green" x="564" y="44" width="100" height="40" rx="5"/>
  <text x="614" y="69" text-anchor="middle">Live</text>

  <text class="small muted" x="16" y="117">Queries</text>
  <rect class="node" x="140" y="92" width="106" height="40" rx="5"/>
  <text x="193" y="117" text-anchor="middle">rows</text>
  <rect class="node rose" x="254" y="92" width="302" height="40" rx="5"/>
  <text class="code" x="405" y="117" text-anchor="middle">ReadModelNotLive</text>
  <rect class="node" x="564" y="92" width="100" height="40" rx="5"/>
  <text x="614" y="117" text-anchor="middle">rows</text>

  <text class="small muted" x="16" y="173">Live worker</text>
  <rect class="band" x="140" y="140" width="524" height="56" rx="6"/>
  <rect class="node green" x="148" y="148" width="94" height="40" rx="5"/>
  <text class="code small" x="195" y="166" text-anchor="middle">AsyncApplied</text>
  <text class="small muted" x="195" y="181" text-anchor="middle">checkpoint</text>
  <rect class="node rose" x="300" y="148" width="150" height="40" rx="5"/>
  <text class="code small" x="375" y="166" text-anchor="middle">AsyncFenced</text>
  <text class="small muted" x="375" y="181" text-anchor="middle">no write, no checkpoint</text>
  <rect class="node green" x="568" y="148" width="90" height="40" rx="5"/>
  <text class="code small" x="613" y="166" text-anchor="middle">AsyncApplied</text>
  <text class="small muted" x="613" y="181" text-anchor="middle">retried event</text>
  <path class="edge dashed muted" d="M450 168 H564" marker-end="url(#arrow)"/>

  <text class="small muted" x="16" y="233">Rebuilder</text>
  <rect class="node accent" x="262" y="204" width="286" height="48" rx="5"/>
  <text class="code small" x="405" y="224" text-anchor="middle">applyAsyncProjectionUnfenced</text>
  <text class="small muted" x="405" y="241" text-anchor="middle">replay from replayFrom to the head</text>

  <rect class="group" x="140" y="276" width="300" height="104" rx="6"/>
  <text class="small bold" x="152" y="296">startRebuild: one transaction</text>
  <text class="small" x="152" y="316">1. status Rebuilding, fence live writers</text>
  <text class="small" x="152" y="332">2. truncate the application table</text>
  <text class="small" x="152" y="348">3. delete dedup keys of projectionNames</text>
  <text class="small" x="152" y="364">4. reset subscription members to replayFrom</text>

  <rect class="group" x="452" y="276" width="212" height="104" rx="6"/>
  <text class="small bold" x="464" y="296">finishRebuild: guarded</text>
  <text class="small" x="464" y="316">new dedup rows: status Live</text>
  <text class="small rose" x="464" y="340">no applies past replayFrom:</text>
  <text class="code small rose" x="464" y="356">RebuildProducedNoApplies</text>
  <text class="small rose" x="464" y="372">model stays Rebuilding</text>
</svg>
