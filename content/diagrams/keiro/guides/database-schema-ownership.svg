<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440">
  <text class="heading" x="20" y="28">Roles</text>
  <text class="heading" x="216" y="28">Schemas in one database</text>
  <rect class="group" x="190" y="34" width="482" height="392" rx="10"/>

  <rect class="node" x="200" y="42" width="464" height="44" rx="6"/>
  <text class="code" x="216" y="69">kiroku</text>
  <text class="small muted" x="290" y="69">event store, owned by Kiroku</text>

  <rect class="node accent" x="200" y="98" width="464" height="166" rx="6"/>
