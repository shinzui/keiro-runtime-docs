  <text class="small" x="320" y="150" text-anchor="middle">read side and rebuilds · 15 tables</text>
  <rect class="node" x="438" y="134" width="212" height="24" rx="4"/>
  <text class="small" x="544" y="150" text-anchor="middle">workflows · 4 tables</text>
  <rect class="node" x="214" y="166" width="212" height="24" rx="4"/>
  <text class="code small" x="320" y="182" text-anchor="middle">keiro_timers</text>
  <rect class="node" x="438" y="166" width="212" height="24" rx="4"/>
  <text class="code small" x="544" y="182" text-anchor="middle">keiro_outbox</text>
  <rect class="node" x="214" y="198" width="212" height="24" rx="4"/>
  <text class="code small" x="320" y="214" text-anchor="middle">keiro_inbox</text>
  <rect class="node" x="438" y="198" width="212" height="24" rx="4"/>
  <text class="code small" x="544" y="214" text-anchor="middle">keiro_snapshots</text>
  <rect class="node" x="214" y="230" width="212" height="24" rx="4"/>
  <text class="code small" x="320" y="246" text-anchor="middle">keiro_subscription_shards</text>
  <rect class="node" x="438" y="230" width="212" height="24" rx="4"/>
  <text class="code small" x="544" y="246" text-anchor="middle">keiro_dead_letters</text>

  <rect class="node violet" x="200" y="276" width="464" height="40" rx="6"/>
  <text class="code violet" x="216" y="301">keiro_read</text>
  <text class="small muted" x="306" y="301">status view and guarded read functions</text>

  <rect class="node amber" x="200" y="328" width="464" height="36" rx="6"/>
  <text class="code" x="216" y="351">pgmigrate</text>
  <text class="small muted" x="300" y="351">migration ledger</text>

  <rect class="node dashed" x="200" y="376" width="464" height="40" rx="6"/>
  <text x="216" y="401">your schemas</text>
  <text class="small muted" x="314" y="401">read models, projections, integration state</text>

  <rect class="node" x="16" y="96" width="160" height="56" rx="6"/>
  <text x="96" y="119" text-anchor="middle">Application roles</text>
  <text class="small muted" x="96" y="138" text-anchor="middle">USAGE on kiroku, keiro</text>
  <path class="edge" d="M176 124 H182 V64 H196" marker-end="url(#arrow)"/>
  <path class="edge" d="M182 124 H196" marker-end="url(#arrow)"/>

  <rect class="node" x="16" y="268" width="160" height="48" rx="6"/>
  <text x="96" y="288" text-anchor="middle">External readers</text>
  <text class="small muted" x="96" y="305" text-anchor="middle">keiro_read only</text>
  <path class="edge violet" d="M176 296 H196" marker-end="url(#arrow-violet)"/>

  <rect class="node" x="16" y="324" width="148" height="48" rx="6"/>
  <text x="90" y="344" text-anchor="middle">Migration job</text>
  <text class="small muted" x="90" y="361" text-anchor="middle">schema-owner role</text>
