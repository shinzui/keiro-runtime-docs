<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350">
  <text class="heading" x="295" y="30" text-anchor="middle">Before</text>
  <text class="heading" x="550" y="30" text-anchor="middle">After, in one transaction</text>
  <rect class="group accent" x="436" y="44" width="228" height="248" rx="8"/>

  <text class="small" x="20" y="83">journal stream</text>
  <text class="small muted" x="20" y="99">append-only</text>
  <rect class="node rose" x="190" y="66" width="210" height="40" rx="5"/>
  <text class="code small" x="295" y="90" text-anchor="middle">WorkflowFailed</text>
  <path class="edge muted" d="M404 86 H441" marker-end="url(#arrow-muted)"/>
  <rect class="node" x="448" y="66" width="204" height="40" rx="5"/>
  <text class="code small" x="550" y="82" text-anchor="middle">WorkflowFailed</text>
  <text class="small muted" x="550" y="98" text-anchor="middle">kept as history</text>

  <text class="small" x="20" y="143">step index row</text>
  <text class="small muted" x="20" y="159">current generation</text>
  <rect class="node rose" x="190" y="126" width="210" height="40" rx="5"/>
  <text class="code small" x="295" y="150" text-anchor="middle">__workflow_failed__</text>
  <path class="edge muted" d="M404 146 H441" marker-end="url(#arrow-muted)"/>
  <rect class="node ghost" x="448" y="126" width="204" height="40" rx="5"/>
  <text class="small muted" x="550" y="150" text-anchor="middle">row deleted</text>

  <text class="small" x="20" y="203">keiro_workflows</text>
  <text class="small muted" x="20" y="219">instance row</text>
  <rect class="node rose" x="190" y="186" width="210" height="40" rx="5"/>
  <text class="code small" x="295" y="202" text-anchor="middle">status failed</text>
  <text class="small muted" x="295" y="218" text-anchor="middle">attempts and last_error set</text>
  <path class="edge muted" d="M404 206 H441" marker-end="url(#arrow-muted)"/>
  <rect class="node green" x="448" y="186" width="204" height="40" rx="5"/>
  <text class="code small" x="550" y="202" text-anchor="middle">status running</text>
  <text class="small muted" x="550" y="218" text-anchor="middle">attempts 0; error, lease cleared</text>

  <text class="small" x="20" y="263">child link</text>
  <text class="small muted" x="20" y="279">only for a child</text>
  <rect class="node rose" x="190" y="246" width="210" height="40" rx="5"/>
  <text class="code small" x="295" y="270" text-anchor="middle">status failed</text>
  <path class="edge muted" d="M404 266 H441" marker-end="url(#arrow-muted)"/>
  <rect class="node green" x="448" y="246" width="204" height="40" rx="5"/>
  <text class="code small" x="550" y="270" text-anchor="middle">status running</text>

  <text class="small muted" x="20" y="324">The instance is discoverable again. The next resume pass replays it, and completed steps short-circuit.</text>
</svg>
