<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 680 290">
  <text class="heading" x="20" y="58">Before</text>
  <rect class="node" x="16" y="72" width="132" height="50" rx="6"/>
  <text class="code small" x="82" y="93" text-anchor="middle">enrichEvent</text>
  <text class="small muted" x="82" y="110" text-anchor="middle">Kiroku hook</text>

  <rect class="group accent" x="168" y="36" width="496" height="156" rx="8"/>
  <text class="heading accent" x="184" y="58">One Hasql transaction</text>

  <rect class="node" x="184" y="72" width="140" height="50" rx="6"/>
  <text x="254" y="93" text-anchor="middle">append events</text>
  <text class="small muted" x="254" y="110" text-anchor="middle">updates $all</text>

  <rect class="node" x="344" y="72" width="184" height="50" rx="6"/>
  <text x="436" y="93" text-anchor="middle">your callback</text>
  <text class="code small muted" x="436" y="110" text-anchor="middle">[(event, RecordedEvent)]</text>

  <rect class="node green" x="548" y="72" width="100" height="50" rx="6"/>
  <text x="598" y="102" text-anchor="middle">commit</text>

  <path class="edge" d="M148 97 H180" marker-end="url(#arrow)"/>
  <path class="edge" d="M324 97 H340" marker-end="url(#arrow)"/>
  <path class="edge" d="M528 97 H544" marker-end="url(#arrow)"/>

  <rect class="band amber" x="254" y="142" width="344" height="30" rx="5"/>
  <text class="small amber" x="426" y="161" text-anchor="middle">$all row lock held from append until commit</text>

  <rect class="node rose" x="16" y="212" width="648" height="34" rx="6"/>
  <text x="340" y="233" text-anchor="middle">Callback throws: everything rolls back, including the append.</text>

  <rect class="node dashed" x="16" y="258" width="648" height="34" rx="6"/>
  <text x="340" y="279" text-anchor="middle">No-op command: no events, so the callback does not run. Maybe a is Nothing.</text>
