<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240">
  <text class="title" x="24" y="24">One workflow that crashes on every attempt (maxAttempts = 5)</text>


  <text class="small muted" x="30" y="50">attempt number</text>
  <rect class="band amber" x="70" y="68" width="24" height="12" rx="2"/>
  <rect class="band amber" x="134" y="68" width="48" height="12" rx="2"/>
  <rect class="band amber" x="222" y="68" width="96" height="12" rx="2"/>
  <rect class="band amber" x="358" y="68" width="192" height="12" rx="2"/>

  <rect class="node" x="30" y="58" width="40" height="32" rx="5"/>
  <text x="50" y="79" text-anchor="middle">1</text>
  <rect class="node" x="94" y="58" width="40" height="32" rx="5"/>
  <text x="114" y="79" text-anchor="middle">2</text>
  <rect class="node" x="182" y="58" width="40" height="32" rx="5"/>
  <text x="202" y="79" text-anchor="middle">3</text>
  <rect class="node" x="318" y="58" width="40" height="32" rx="5"/>
  <text x="338" y="79" text-anchor="middle">4</text>
  <rect class="node" x="550" y="58" width="40" height="32" rx="5"/>
  <text x="570" y="79" text-anchor="middle">5</text>

  <text class="small rose" x="50" y="106" text-anchor="middle">crash</text>
  <text class="small rose" x="114" y="106" text-anchor="middle">crash</text>
  <text class="small rose" x="202" y="106" text-anchor="middle">crash</text>
  <text class="small rose" x="338" y="106" text-anchor="middle">crash</text>
  <text class="small rose" x="570" y="106" text-anchor="middle">crash</text>
  <text class="small amber" x="82" y="106" text-anchor="middle">2 s</text>
  <text class="small amber" x="158" y="106" text-anchor="middle">4 s</text>
  <text class="small amber" x="270" y="106" text-anchor="middle">8 s</text>
  <text class="small amber" x="454" y="106" text-anchor="middle">16 s</text>

  <path class="axis" d="M70 122 H550" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="small muted" x="310" y="140" text-anchor="middle">about 30 s of next_attempt_at backoff in total</text>

  <path class="edge rose" d="M570 114 V164" marker-end="url(#arrow-rose)"/>
  <rect class="node rose" x="340" y="168" width="316" height="34" rx="5"/>
  <text x="498" y="190" text-anchor="middle">WorkflowFailed appended, status failed</text>
  <text class="small muted" x="340" y="224">It leaves discovery until an operator resurrects it.</text>

  <text class="small muted" x="24" y="182">Each crash: attempts + 1, last_error stored,</text>
  <text class="small muted" x="24" y="198">lease released. The gap grows each time.</text>
</svg>
