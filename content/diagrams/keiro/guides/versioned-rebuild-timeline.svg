<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352">
  <path class="axis dashed" d="M302 34 V214"/>
  <path class="axis dashed" d="M446 34 V214"/>
  <path class="axis dashed" d="M582 34 V214"/>
  <circle class="node" cx="302" cy="20" r="10"/>
  <text class="small bold" x="302" y="24" text-anchor="middle">1</text>
  <circle class="node" cx="446" cy="20" r="10"/>
  <text class="small bold" x="446" y="24" text-anchor="middle">2</text>
  <circle class="node" cx="582" cy="20" r="10"/>
  <text class="small bold" x="582" y="24" text-anchor="middle">3</text>

  <text class="small muted" x="16" y="63">Run phase</text>
  <rect class="node" x="128" y="40" width="170" height="36" rx="5"/>
  <text class="code small" x="213" y="63" text-anchor="middle">ReplayRunning</text>
  <rect class="node amber" x="306" y="40" width="136" height="36" rx="5"/>
  <text class="code small" x="374" y="63" text-anchor="middle">CutoverPendingHead</text>
  <rect class="node amber" x="450" y="40" width="128" height="36" rx="5"/>
  <text class="code small" x="514" y="63" text-anchor="middle">CutoverReplaying</text>
  <rect class="node green" x="586" y="40" width="78" height="36" rx="5"/>
  <text class="code small" x="625" y="63" text-anchor="middle">Promoted</text>

  <text class="small muted" x="16" y="109">V1 generation</text>
  <rect class="node green" x="128" y="86" width="170" height="36" rx="5"/>
  <text class="small" x="213" y="109" text-anchor="middle">serving: reads, writes</text>
  <rect class="node amber" x="306" y="86" width="272" height="36" rx="5"/>
  <text class="small" x="442" y="109" text-anchor="middle">serving: reads only, writers fenced</text>
  <rect class="node muted" x="586" y="86" width="78" height="36" rx="5"/>
  <text class="small" x="625" y="109" text-anchor="middle">retired</text>

  <text class="small muted" x="16" y="155">V2 generation</text>
  <rect class="node accent dashed" x="128" y="132" width="450" height="36" rx="5"/>
  <text class="small" x="353" y="155" text-anchor="middle">staging: the replay applies events here</text>
  <rect class="node green" x="586" y="132" width="78" height="36" rx="5"/>
  <text class="small" x="625" y="155" text-anchor="middle">serving</text>

  <text class="small muted" x="16" y="197">History</text>
  <rect class="band accent" x="128" y="180" width="450" height="26" rx="5"/>
  <text class="small" x="353" y="197" text-anchor="middle">Kiroku retention lease, renewed before each mutation</text>

  <circle class="node" cx="30" cy="240" r="9"/>
  <text class="small bold" x="30" y="244" text-anchor="middle">1</text>
  <text class="small" x="46" y="244">Replay is complete and the head lag is within cutoverThreshold. Writers are fenced.</text>
  <text class="small muted" x="46" y="262">While the lag is larger, the run extends its captured head and keeps replaying.</text>
  <circle class="node" cx="30" cy="282" r="9"/>
  <text class="small bold" x="30" y="286" text-anchor="middle">2</text>
  <text class="small" x="46" y="286">The run captures the final head. Writers stay fenced.</text>
  <circle class="node" cx="30" cy="306" r="9"/>
  <text class="small bold" x="30" y="310" text-anchor="middle">3</text>
  <text class="small" x="46" y="310">One bounded lock phase promotes every target. V2 serves and V1 retires.</text>
  <text class="small muted" x="46" y="328">Later, dropVersionedRetiredGeneration moves a retired generation to dropped.</text>
</svg>
