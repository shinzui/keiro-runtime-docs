<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470">
  <text class="heading" x="20" y="24">Path A: IntegrationProducer subscription</text>
  <rect class="group" x="16" y="38" width="184" height="122" rx="8"/>
  <text class="small muted" x="28" y="58">command transaction</text>
  <rect class="node" x="28" y="80" width="160" height="36" rx="5"/>
  <text x="108" y="103" text-anchor="middle">append domain event</text>
  <text class="small muted" x="108" y="142" text-anchor="middle">commits first</text>
  <path class="edge" d="M188 98 H228" marker-end="url(#arrow)"/>
  <rect class="node" x="232" y="76" width="162" height="44" rx="5"/>
  <text class="code" x="313" y="94" text-anchor="middle">IntegrationProducer</text>
  <text class="small muted" x="313" y="111" text-anchor="middle">reads it, runs mapEvent</text>
  <path class="edge" d="M394 98 H418" marker-end="url(#arrow)"/>
  <rect class="group accent" x="424" y="38" width="240" height="122" rx="8"/>
  <text class="small accent" x="436" y="58">checkpoint transaction</text>
  <rect class="node accent" x="436" y="68" width="216" height="34" rx="5"/>
  <text class="code" x="544" y="90" text-anchor="middle">enqueueProducerEventTx</text>
  <rect class="node" x="436" y="112" width="216" height="34" rx="5"/>
  <text x="544" y="134" text-anchor="middle">save checkpoint</text>

  <text class="heading" x="20" y="198">Path B: inline in the command (sagas, process managers)</text>
  <rect class="group accent" x="16" y="210" width="424" height="76" rx="8"/>
  <text class="small accent" x="28" y="230">runCommandWithSqlEvents transaction</text>
  <rect class="node" x="28" y="240" width="160" height="34" rx="5"/>
  <text x="108" y="262" text-anchor="middle">append events</text>
  <rect class="node accent" x="204" y="240" width="224" height="34" rx="5"/>
  <text class="code" x="316" y="262" text-anchor="middle">enqueueIntegrationEventTx</text>

  <path class="edge accent" d="M544 160 V318" marker-end="url(#arrow-accent)"/>
  <path class="edge accent" d="M316 286 V318" marker-end="url(#arrow-accent)"/>
  <rect class="band accent" x="16" y="322" width="648" height="40" rx="6"/>
  <text class="code accent" x="28" y="347">keiro_outbox</text>
  <text class="small muted" x="130" y="347">one row per integration event, status pending</text>

  <path class="edge" d="M544 362 V384" marker-end="url(#arrow)"/>
  <rect class="node" x="444" y="388" width="220" height="44" rx="5"/>
  <text class="code" x="554" y="406" text-anchor="middle">publishClaimedOutbox</text>
  <text class="small muted" x="554" y="423" text-anchor="middle">one pass per tick</text>
  <path class="edge" d="M444 410 H410" marker-end="url(#arrow)"/>
  <rect class="node" x="226" y="388" width="180" height="44" rx="5"/>
  <text x="316" y="406" text-anchor="middle">publish callback</text>
  <text class="small muted" x="316" y="423" text-anchor="middle">for example, the Kafka bridge</text>
  <text class="small muted" x="20" y="458">Teal boxes mark the write that puts the row in the outbox.</text>
</svg>
