<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <text class="title" x="264" y="30" text-anchor="middle">Stage 1</text>
  <text class="title" x="424" y="30" text-anchor="middle">Stage 2</text>
  <text class="title" x="584" y="30" text-anchor="middle">Stage 3</text>
  <text class="small muted" x="264" y="48" text-anchor="middle">keep emitting</text>
  <text class="small muted" x="424" y="48" text-anchor="middle">cut over</text>
  <text class="small muted" x="584" y="48" text-anchor="middle">remove the edge</text>

  <path class="axis dashed" d="M344 60 V290"/>
  <path class="axis dashed" d="M504 60 V290"/>

  <rect class="band" x="16" y="64" width="648" height="52" rx="6"/>
  <text x="28" y="95">Event marker</text>
  <rect class="node" x="192" y="74" width="144" height="32" rx="5"/>
  <text class="code" x="264" y="95" text-anchor="middle">retiring</text>
  <rect class="node" x="352" y="74" width="304" height="32" rx="5"/>
  <text class="code" x="504" y="95" text-anchor="middle">deprecated</text>

  <rect class="band" x="16" y="124" width="648" height="52" rx="6"/>
  <text x="28" y="147">Emitting</text>
  <text x="28" y="164">transition</text>
  <rect class="node accent" x="192" y="134" width="144" height="32" rx="5"/>
  <text x="264" y="155" text-anchor="middle">live</text>
  <rect class="node violet" x="352" y="134" width="144" height="32" rx="5"/>
  <text class="code" x="424" y="155" text-anchor="middle">replay-only</text>
  <rect class="node ghost" x="512" y="134" width="144" height="32" rx="5"/>
  <text class="muted" x="584" y="155" text-anchor="middle">removed</text>

  <rect class="band" x="16" y="184" width="648" height="52" rx="6"/>
  <text x="28" y="207">Decode arm and</text>
  <text x="28" y="224">upcaster rungs</text>
  <rect class="node green" x="192" y="194" width="464" height="32" rx="5"/>
  <text x="424" y="215" text-anchor="middle">kept while any payload at that version can be read</text>

  <text class="heading" x="28" y="262">Move on when</text>
  <text class="small" x="264" y="262" text-anchor="middle">Traffic stops. Operators</text>
  <text class="small" x="264" y="278" text-anchor="middle">terminalize or truncate.</text>
  <text class="small" x="424" y="262" text-anchor="middle">A replay audit shows</text>
  <text class="small" x="424" y="278" text-anchor="middle">no stream holds the event.</text>
  <text class="small muted" x="584" y="262" text-anchor="middle">Rungs are permanent</text>
  <text class="small muted" x="584" y="278" text-anchor="middle">compatibility code.</text>
</svg>
