<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560">
  <text class="heading" x="20" y="28">Logical identity</text>
  <rect class="node accent" x="20" y="40" width="250" height="34" rx="6"/>
  <text class="code accent" x="145" y="62" text-anchor="middle">(orderFulfillment, ord-42)</text>
  <text class="small muted" x="290" y="54">Stable across rotations. keiro_workflows holds</text>
  <text class="small muted" x="290" y="70">one row for it, with current generation 1.</text>

  <rect class="band" x="16" y="100" width="648" height="96" rx="6"/>
  <text class="code" x="30" y="124">wf:orderFulfillment-ord-42</text>
  <text class="small muted" x="650" y="124" text-anchor="end">generation 0</text>
  <rect class="node" x="30" y="142" width="150" height="34" rx="5"/>
  <text class="code small" x="105" y="163" text-anchor="middle">reserve-inventory</text>
  <rect class="node" x="192" y="142" width="150" height="34" rx="5"/>
  <text class="code small" x="267" y="163" text-anchor="middle">sleep:cooling-off</text>
  <text class="muted" x="371" y="163" text-anchor="middle">…</text>
  <rect class="node amber" x="400" y="142" width="250" height="34" rx="5"/>
  <text class="code small" x="525" y="163" text-anchor="middle">WorkflowContinuedAsNew 1</text>

  <rect class="band" x="16" y="240" width="648" height="96" rx="6"/>
  <path class="edge amber" d="M525 176 V214 H105 V277" marker-end="url(#arrow-amber)"/>
  <text class="small amber" x="300" y="232" text-anchor="middle">continueAsNew carries the seed</text>

  <text class="code" x="140" y="264">wf:orderFulfillment-ord-42#1</text>
  <text class="small muted" x="650" y="264" text-anchor="end">generation 1</text>
  <rect class="node violet" x="30" y="282" width="150" height="34" rx="5"/>
  <text class="code small" x="105" y="303" text-anchor="middle">__workflow_seed__</text>
  <rect class="node" x="192" y="282" width="150" height="34" rx="5"/>
  <text class="code small" x="267" y="303" text-anchor="middle">charge</text>
  <text class="muted" x="371" y="303" text-anchor="middle">…</text>
  <rect class="node green" x="400" y="282" width="250" height="34" rx="5"/>
  <text class="code small" x="525" y="303" text-anchor="middle">WorkflowCompleted</text>

  <text class="heading" x="20" y="376">keiro_workflow_steps (derived index)</text>
  <text class="code small muted" x="30" y="402">workflow_id</text>
  <text class="code small muted" x="130" y="402">workflow_name</text>
  <text class="code small muted" x="270" y="402">generation</text>
  <text class="code small muted" x="370" y="402">step_name</text>
  <path class="axis" d="M16 410 H664"/>

  <rect class="band" x="16" y="414" width="648" height="22" rx="3"/>
  <text class="code small" x="30" y="429">ord-42</text>
  <text class="code small" x="130" y="429">orderFulfillment</text>
  <text class="code small" x="270" y="429">0</text>
  <text class="code small" x="370" y="429">reserve-inventory</text>
  <text class="code small" x="30" y="453">ord-42</text>
  <text class="code small" x="130" y="453">orderFulfillment</text>
  <text class="code small" x="270" y="453">0</text>
  <text class="code small" x="370" y="453">sleep:cooling-off</text>
  <rect class="band" x="16" y="462" width="648" height="22" rx="3"/>
  <text class="code small" x="30" y="477">ord-42</text>
  <text class="code small" x="130" y="477">orderFulfillment</text>
  <text class="code small" x="270" y="477">0</text>
  <text class="code small amber" x="370" y="477">__workflow_continued_as_new__</text>
  <text class="code small" x="30" y="501">ord-42</text>
  <text class="code small" x="130" y="501">orderFulfillment</text>
  <text class="code small" x="270" y="501">1</text>
  <text class="code small violet" x="370" y="501">__workflow_seed__</text>
  <rect class="band" x="16" y="510" width="648" height="22" rx="3"/>
  <text class="code small" x="30" y="525">ord-42</text>
  <text class="code small" x="130" y="525">orderFulfillment</text>
  <text class="code small" x="270" y="525">1</text>
  <text class="code small" x="370" y="525">charge</text>
  <text class="code small" x="30" y="549">ord-42</text>
  <text class="code small" x="130" y="549">orderFulfillment</text>
  <text class="code small" x="270" y="549">1</text>
  <text class="code small green" x="370" y="549">__workflow_completed__</text>
</svg>
