<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560">
  <text class="heading" x="20" y="28">Logical identity</text>
  <rect class="node accent" x="20" y="40" width="250" height="34" rx="6"/>
  <text class="code accent" x="145" y="62" text-anchor="middle">(&lt;name&gt;, &lt;id&gt;)</text>
  <text class="small muted" x="290" y="54">Stable across rotations. keiro_workflows holds</text>
  <text class="small muted" x="290" y="70">one row for it, with current generation 1.</text>

  <rect class="band" x="16" y="100" width="648" height="96" rx="6"/>
  <text class="code" x="30" y="124">wf:&lt;name&gt;-&lt;id&gt;</text>
  <text class="small muted" x="650" y="124" text-anchor="end">generation 0</text>
  <rect class="node violet" x="30" y="142" width="140" height="34" rx="5"/>
  <text class="code small" x="100" y="163" text-anchor="middle">__workflow_seed__</text>
  <rect class="node" x="180" y="142" width="90" height="34" rx="5"/>
  <text class="code small" x="225" y="163" text-anchor="middle">poll</text>
  <rect class="node" x="280" y="142" width="130" height="34" rx="5"/>
  <text class="code small" x="345" y="163" text-anchor="middle">sleep:interval</text>
  <rect class="node amber" x="420" y="142" width="230" height="34" rx="5"/>
  <text class="code small" x="535" y="163" text-anchor="middle">WorkflowContinuedAsNew 1</text>

  <rect class="band" x="16" y="240" width="648" height="96" rx="6"/>
  <path class="edge amber" d="M535 176 V214 H100 V277" marker-end="url(#arrow-amber)"/>
  <text class="small amber" x="318" y="232" text-anchor="middle">continueAsNew carries the seed</text>

  <text class="code" x="130" y="264">wf:&lt;name&gt;-&lt;id&gt;#1</text>
  <text class="small muted" x="650" y="264" text-anchor="end">generation 1</text>
  <rect class="node violet" x="30" y="282" width="140" height="34" rx="5"/>
  <text class="code small" x="100" y="303" text-anchor="middle">__workflow_seed__</text>
  <rect class="node" x="180" y="282" width="90" height="34" rx="5"/>
  <text class="code small" x="225" y="303" text-anchor="middle">poll</text>
  <text class="muted" x="300" y="303" text-anchor="middle">…</text>
  <text class="small muted" x="650" y="303" text-anchor="end">current generation, still running</text>

  <text class="heading" x="20" y="376">keiro_workflow_steps (derived index)</text>
  <text class="code small muted" x="30" y="402">workflow_id</text>
  <text class="code small muted" x="130" y="402">workflow_name</text>
  <text class="code small muted" x="270" y="402">generation</text>
  <text class="code small muted" x="370" y="402">step_name</text>
  <path class="axis" d="M16 410 H664"/>

  <rect class="band" x="16" y="414" width="648" height="22" rx="3"/>
  <text class="code small" x="30" y="429">&lt;id&gt;</text>
  <text class="code small" x="130" y="429">&lt;name&gt;</text>
  <text class="code small" x="270" y="429">0</text>
  <text class="code small violet" x="370" y="429">__workflow_seed__</text>
  <text class="code small" x="30" y="453">&lt;id&gt;</text>
  <text class="code small" x="130" y="453">&lt;name&gt;</text>
  <text class="code small" x="270" y="453">0</text>
  <text class="code small" x="370" y="453">poll</text>
  <rect class="band" x="16" y="462" width="648" height="22" rx="3"/>
  <text class="code small" x="30" y="477">&lt;id&gt;</text>
  <text class="code small" x="130" y="477">&lt;name&gt;</text>
  <text class="code small" x="270" y="477">0</text>
  <text class="code small" x="370" y="477">sleep:interval</text>
  <text class="code small" x="30" y="501">&lt;id&gt;</text>
  <text class="code small" x="130" y="501">&lt;name&gt;</text>
  <text class="code small" x="270" y="501">0</text>
  <text class="code small amber" x="370" y="501">__workflow_continued_as_new__</text>
  <rect class="band" x="16" y="510" width="648" height="22" rx="3"/>
  <text class="code small" x="30" y="525">&lt;id&gt;</text>
  <text class="code small" x="130" y="525">&lt;name&gt;</text>
  <text class="code small" x="270" y="525">1</text>
  <text class="code small violet" x="370" y="525">__workflow_seed__</text>
  <text class="code small" x="30" y="549">&lt;id&gt;</text>
  <text class="code small" x="130" y="549">&lt;name&gt;</text>
  <text class="code small" x="270" y="549">1</text>
  <text class="code small" x="370" y="549">poll</text>
</svg>
