<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350">
  <text class="small" x="100" y="28" text-anchor="middle">append 1</text>
  <text class="small" x="250" y="28" text-anchor="middle">append 2</text>
  <text class="small rose" x="250" y="44" text-anchor="middle">NOTIFY dropped</text>
  <text class="small" x="520" y="28" text-anchor="middle">append 3</text>

  <text class="title" x="24" y="84">Fixed poll</text>
  <text class="code small muted halo" x="110" y="84">runWorkflowResumeWorker</text>
  <rect class="band" x="16" y="94" width="648" height="50" rx="6"/>

  <text class="title" x="24" y="210">Push</text>
  <text class="code small muted halo" x="70" y="210">runWorkflowResumeWorkerPush</text>
  <rect class="band" x="16" y="220" width="648" height="50" rx="6"/>

  <path class="edge dashed muted" d="M100 54 V270"/>
  <path class="edge dashed muted" d="M250 54 V270"/>
  <path class="edge dashed muted" d="M520 54 V270"/>
  <circle class="dot accent" cx="100" cy="54" r="4"/>
  <circle class="dot rose" cx="250" cy="54" r="4"/>
  <circle class="dot accent" cx="520" cy="54" r="4"/>

  <!-- fixed poll lane: passes every pollInterval -->
  <path class="edge amber thick" d="M100 119 H204"/>
  <path class="edge amber thick" d="M250 119 H384"/>
  <path class="edge amber thick" d="M520 119 H564"/>
  <rect class="node accent" x="24" y="107" width="32" height="24" rx="4"/>
  <rect class="node accent" x="204" y="107" width="32" height="24" rx="4"/>
  <rect class="node accent" x="384" y="107" width="32" height="24" rx="4"/>
  <rect class="node accent" x="564" y="107" width="32" height="24" rx="4"/>

  <path class="axis" d="M40 160 H220" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="small muted halo" x="130" y="178" text-anchor="middle">pollInterval</text>

  <!-- push lane: wake passes plus fallback passes -->
  <path class="edge amber thick" d="M250 245 H286"/>
  <rect class="node accent" x="24" y="233" width="32" height="24" rx="4"/>
  <rect class="node accent" x="106" y="233" width="32" height="24" rx="4"/>
  <rect class="node violet" x="286" y="233" width="32" height="24" rx="4"/>
  <rect class="node violet" x="466" y="233" width="32" height="24" rx="4"/>
  <rect class="node accent" x="526" y="233" width="32" height="24" rx="4"/>

  <path class="axis" d="M122 286 H302" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="small muted halo" x="212" y="304" text-anchor="middle">pollInterval with no NOTIFY</text>

  <!-- legend -->
  <rect class="node accent" x="24" y="324" width="24" height="16" rx="3"/>
  <text class="small" x="56" y="336">pass (poll tick or wake)</text>
  <rect class="node violet" x="250" y="324" width="24" height="16" rx="3"/>
  <text class="small" x="282" y="336">fallback pass</text>
  <path class="edge amber thick" d="M420 332 H448"/>
  <text class="small" x="456" y="336">reaction delay</text>
</svg>
