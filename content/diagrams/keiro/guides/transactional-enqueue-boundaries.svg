<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 346">
  <text class="heading" x="20" y="24">Before: two separate transactions</text>
  <rect class="group" x="16" y="36" width="250" height="80" rx="8"/>
  <text class="small muted" x="28" y="54">domain transaction</text>
  <rect class="node" x="28" y="66" width="150" height="36" rx="5"/>
  <text class="code" x="103" y="89" text-anchor="middle">saveNote</text>
  <rect class="node green" x="190" y="70" width="64" height="28" rx="5"/>
  <text class="small green" x="222" y="88" text-anchor="middle">commit</text>
  <path class="edge dashed muted" d="M266 84 H410" marker-end="url(#arrow)"/>
  <circle class="dot rose" cx="338" cy="84" r="6"/>
  <text class="small rose" x="338" y="136" text-anchor="middle">crash here</text>
  <text class="small muted" x="338" y="153" text-anchor="middle">row committed, job lost</text>
  <rect class="group" x="414" y="36" width="250" height="80" rx="8"/>
  <text class="small muted" x="426" y="54">enqueue: its own PGMQ transaction</text>
  <rect class="node" x="426" y="66" width="150" height="36" rx="5"/>
  <text class="code" x="501" y="89" text-anchor="middle">enqueue</text>
  <rect class="node green" x="588" y="70" width="64" height="28" rx="5"/>
  <text class="small green" x="620" y="88" text-anchor="middle">commit</text>

  <text class="heading" x="20" y="196">After: one hasql transaction</text>
  <rect class="group accent" x="16" y="208" width="648" height="92" rx="8"/>
  <text class="small accent" x="28" y="226">enqueueNoteGitSyncTx</text>
  <rect class="node" x="28" y="238" width="150" height="44" rx="5"/>
  <text class="code" x="103" y="256" text-anchor="middle">upsertNoteStmt</text>
  <text class="small muted" x="103" y="273" text-anchor="middle">domain write</text>
  <path class="edge" d="M178 260 H192" marker-end="url(#arrow)"/>
  <rect class="node" x="196" y="238" width="196" height="44" rx="5"/>
  <text class="code" x="294" y="256" text-anchor="middle">claimGitSyncEnqueueStmt</text>
  <text class="small muted" x="294" y="273" text-anchor="middle">ON CONFLICT DO NOTHING</text>
  <path class="edge" d="M392 260 H406" marker-end="url(#arrow)"/>
  <rect class="node accent" x="410" y="238" width="164" height="44" rx="5"/>
  <text class="code" x="492" y="256" text-anchor="middle">pgmq.send</text>
  <text class="small muted" x="492" y="273" text-anchor="middle">only when inserted</text>
  <path class="edge" d="M574 260 H584" marker-end="url(#arrow)"/>
  <rect class="node green" x="588" y="246" width="64" height="28" rx="5"/>
  <text class="small green" x="620" y="264" text-anchor="middle">commit</text>
  <text class="small muted" x="20" y="330">The domain write, the claim, and the send commit or roll back together.</text>
</svg>
