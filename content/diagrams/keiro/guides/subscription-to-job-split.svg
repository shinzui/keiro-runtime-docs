<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 362">
  <text class="heading" x="20" y="26">Subscription: decide and ack fast</text>
  <rect class="node" x="16" y="42" width="170" height="48" rx="5"/>
  <text class="code" x="101" y="62" text-anchor="middle">OrderConfirmed</text>
  <text class="small muted" x="101" y="79" text-anchor="middle">already in the event log</text>
  <path class="edge" d="M186 66 H216" marker-end="url(#arrow)"/>
  <rect class="node" x="220" y="42" width="230" height="48" rx="5"/>
  <text x="335" y="62" text-anchor="middle">subscription member</text>
  <text class="small muted" x="335" y="79" text-anchor="middle">decide, then enqueue once by key</text>
  <path class="edge" d="M450 66 H480" marker-end="url(#arrow)"/>
  <rect class="node green" x="484" y="42" width="180" height="48" rx="5"/>
  <text class="code" x="574" y="62" text-anchor="middle">ShardAckOk</text>
  <text class="small muted" x="574" y="79" text-anchor="middle">checkpoint advances</text>

  <text class="heading" x="20" y="128">Job queue: call and retry</text>
  <path class="edge accent" d="M335 90 H335 V138" marker-end="url(#arrow-accent)"/>
  <text class="small accent" x="343" y="120">enqueue</text>
  <rect class="node accent" x="220" y="142" width="230" height="48" rx="5"/>
  <text class="code" x="335" y="162" text-anchor="middle">fulfillment.notify_shipper</text>
  <text class="small muted" x="335" y="179" text-anchor="middle">pgmq queue</text>
  <path class="edge" d="M450 166 H480" marker-end="url(#arrow)"/>
  <rect class="node" x="484" y="142" width="180" height="48" rx="5"/>
  <text x="574" y="162" text-anchor="middle">job worker</text>
  <text class="small muted" x="574" y="179" text-anchor="middle">HTTP POST to the shipper</text>

  <path class="edge" d="M496 190 V320"/>
  <path class="edge green" d="M496 228 H512" marker-end="url(#arrow-green)"/>
  <rect class="node green" x="516" y="208" width="148" height="40" rx="5"/>
  <text class="code" x="590" y="224" text-anchor="middle">Done</text>
  <text class="small muted" x="590" y="240" text-anchor="middle">delete the message</text>
  <path class="edge amber" d="M496 274 H512" marker-end="url(#arrow-amber)"/>
  <rect class="node amber" x="516" y="254" width="148" height="40" rx="5"/>
  <text class="code" x="590" y="270" text-anchor="middle">Retry</text>
  <text class="small muted" x="590" y="286" text-anchor="middle">visible again later</text>
  <path class="edge rose" d="M496 320 H512" marker-end="url(#arrow-rose)"/>
  <rect class="node rose" x="516" y="300" width="148" height="40" rx="5"/>
  <text class="code" x="590" y="316" text-anchor="middle">Dead</text>
  <text class="small muted" x="590" y="332" text-anchor="middle">routed to the DLQ</text>

  <rect class="node rose dashed" x="16" y="232" width="440" height="58" rx="6"/>
  <text class="small rose" x="30" y="255">Do not retry the HTTP call with ShardAckRetry.</text>
  <text class="small muted" x="30" y="275">It redelivers the source event and re-runs every effect.</text>
</svg>
