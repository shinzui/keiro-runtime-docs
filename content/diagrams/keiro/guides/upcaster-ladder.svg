<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350">
  <text class="heading" x="20" y="34">Stored stamp</text>
  <text class="code" x="240" y="34" text-anchor="middle">v1</text>
  <text class="code" x="360" y="34" text-anchor="middle">v2</text>
  <text class="code accent" x="480" y="34" text-anchor="middle">v3</text>
  <text class="small muted" x="480" y="50" text-anchor="middle">schemaVersion</text>
  <text class="small amber" x="300" y="74" text-anchor="middle">rung 1</text>
  <text class="small amber" x="420" y="74" text-anchor="middle">rung 2</text>

  <rect class="node accent" x="560" y="86" width="104" height="128" rx="6"/>
  <text class="code accent" x="612" y="146" text-anchor="middle">decode</text>
  <text class="small muted" x="612" y="164" text-anchor="middle">current e</text>

  <text class="small" x="20" y="105">stamped v1</text>
  <rect class="node" x="208" y="86" width="64" height="28" rx="5"/>
  <text class="code small" x="240" y="104" text-anchor="middle">v1</text>
  <path class="edge amber" d="M272 100 H323" marker-end="url(#arrow-amber)"/>
  <rect class="node" x="328" y="86" width="64" height="28" rx="5"/>
  <text class="code small" x="360" y="104" text-anchor="middle">v2</text>
  <path class="edge amber" d="M392 100 H443" marker-end="url(#arrow-amber)"/>
  <rect class="node" x="448" y="86" width="64" height="28" rx="5"/>
  <text class="code small" x="480" y="104" text-anchor="middle">v3</text>
  <path class="edge" d="M512 100 H555" marker-end="url(#arrow)"/>

  <text class="small" x="20" y="155">stamped v2</text>
  <rect class="node" x="328" y="136" width="64" height="28" rx="5"/>
  <text class="code small" x="360" y="154" text-anchor="middle">v2</text>
  <path class="edge amber" d="M392 150 H443" marker-end="url(#arrow-amber)"/>
  <rect class="node" x="448" y="136" width="64" height="28" rx="5"/>
  <text class="code small" x="480" y="154" text-anchor="middle">v3</text>
  <path class="edge" d="M512 150 H555" marker-end="url(#arrow)"/>

  <text class="small" x="20" y="205">stamped v3</text>
  <rect class="node" x="448" y="186" width="64" height="28" rx="5"/>
  <text class="code small" x="480" y="204" text-anchor="middle">v3</text>
  <path class="edge" d="M512 200 H555" marker-end="url(#arrow)"/>

  <path class="axis dashed" d="M16 236 H664"/>
  <text class="small" x="20" y="267">stamped v4</text>
  <rect class="node rose" x="328" y="248" width="336" height="30" rx="5"/>
  <text class="code small rose" x="496" y="267" text-anchor="middle">Left VersionAhead: newer than v3</text>

  <text class="small muted" x="20" y="312">Each rung also receives the stored EventType, so one chain serves every event kind.</text>
  <text class="small muted" x="20" y="332">mkCodec rejects a codec with a missing rung before runtime.</text>
</svg>
