<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 378">
  <rect class="band accent" x="16" y="36" width="648" height="88" rx="6"/>
  <text class="heading" x="28" y="26">keiro: no Kafka client dependency</text>
  <rect class="node" x="28" y="58" width="196" height="44" rx="5"/>
  <text class="code" x="126" y="76" text-anchor="middle">publishClaimedOutbox</text>
  <text class="small muted" x="126" y="93" text-anchor="middle">claims rows, marks results</text>
  <path class="edge" d="M224 80 H244" marker-end="url(#arrow)"/>
  <rect class="node" x="248" y="58" width="192" height="44" rx="5"/>
  <text class="code" x="344" y="76" text-anchor="middle">outboxRowToKafkaRecord</text>
  <text class="small muted" x="344" y="93" text-anchor="middle">pure conversion</text>
  <path class="edge" d="M440 80 H466" marker-end="url(#arrow)"/>
  <rect class="node accent" x="470" y="58" width="180" height="44" rx="5"/>
  <text class="code" x="560" y="76" text-anchor="middle">KafkaProducerRecord</text>
  <text class="small muted" x="560" y="93" text-anchor="middle">neutral record</text>

  <rect class="band" x="16" y="160" width="648" height="72" rx="6"/>
  <text class="heading" x="28" y="152">Your integration package</text>
  <path class="edge" d="M560 102 V170" marker-end="url(#arrow)"/>
  <rect class="node" x="470" y="174" width="180" height="44" rx="5"/>
  <text class="code" x="560" y="192" text-anchor="middle">toBrokerRecord</text>
  <text class="small muted" x="560" y="209" text-anchor="middle">to the library record</text>
  <rect class="node" x="28" y="174" width="250" height="44" rx="5"/>
  <text class="code" x="153" y="192" text-anchor="middle">PublishOutcome per OutboxId</text>
  <text class="small muted" x="153" y="209" text-anchor="middle">PublishSucceeded or PublishFailed</text>
  <path class="edge" d="M126 174 V106" marker-end="url(#arrow)"/>

  <rect class="band violet" x="16" y="268" width="648" height="72" rx="6"/>
  <text class="heading" x="28" y="260">Broker library and Kafka</text>
  <path class="edge" d="M560 218 V278" marker-end="url(#arrow)"/>
  <rect class="node" x="470" y="282" width="180" height="44" rx="5"/>
  <text class="code" x="560" y="300" text-anchor="middle">produceSync</text>
  <text class="small muted" x="560" y="317" text-anchor="middle">waits for the broker</text>
  <path class="edge dashed" d="M470 304 H153 V222" marker-end="url(#arrow)"/>
  <text class="small muted" x="300" y="296">ack or error</text>
  <text class="small muted" x="20" y="366">Report PublishSucceeded only after the broker acks that row.</text>
</svg>
