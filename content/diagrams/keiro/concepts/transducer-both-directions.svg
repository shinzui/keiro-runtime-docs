<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236">
  <text class="heading" x="16" y="22">Transduce: one command</text>
  <rect class="node" x="16" y="34" width="200" height="50" rx="6"/>
  <text class="small" x="116" y="54" text-anchor="middle">(state, registers)</text>
  <text class="small" x="116" y="72" text-anchor="middle">+ command</text>
  <path class="edge" d="M216 59 H250" marker-end="url(#arrow)"/>

  <rect class="node accent" x="254" y="34" width="172" height="168" rx="10"/>
  <text class="small bold accent" x="340" y="56" text-anchor="middle">keiki SymTransducer</text>
  <circle class="node" cx="296" cy="118" r="22"/>
  <text class="small" x="296" y="122" text-anchor="middle">s1</text>
  <circle class="node" cx="384" cy="118" r="22"/>
  <text class="small" x="384" y="122" text-anchor="middle">s2</text>
  <path class="edge accent" d="M318 118 H358" marker-end="url(#arrow-accent)"/>
  <text class="code small" x="340" y="104" text-anchor="middle">ci/co</text>
  <text class="small muted" x="340" y="176" text-anchor="middle">same edges</text>
  <text class="small muted" x="340" y="192" text-anchor="middle">in both directions</text>

  <path class="edge" d="M426 59 H460" marker-end="url(#arrow)"/>
  <rect class="node" x="464" y="34" width="200" height="50" rx="6"/>
  <text class="small" x="564" y="54" text-anchor="middle">(next state, registers)</text>
  <text class="small" x="564" y="72" text-anchor="middle">+ events, or reject</text>

  <text class="heading" x="16" y="142">Hydrate: replay</text>
  <rect class="node violet" x="16" y="152" width="200" height="50" rx="6"/>
  <text class="small" x="116" y="172" text-anchor="middle">stored events</text>
  <text class="small" x="116" y="190" text-anchor="middle">from kiroku</text>
  <path class="edge" d="M216 177 H250" marker-end="url(#arrow)"/>
  <path class="edge" d="M426 177 H460" marker-end="url(#arrow)"/>
  <rect class="node" x="464" y="152" width="200" height="50" rx="6"/>
  <text class="small" x="564" y="172" text-anchor="middle">current</text>
  <text class="small" x="564" y="190" text-anchor="middle">(state, registers)</text>

  <text class="small muted" x="16" y="226">Each stored event matches the transition that emitted it.</text>
</svg>
