<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262">
  <rect class="band" x="16" y="14" width="318" height="26" rx="4"/>
  <text class="heading" x="175" y="31" text-anchor="middle">Build and CI</text>
  <rect class="band" x="343" y="14" width="100" height="26" rx="4"/>
  <text class="heading" x="393" y="31" text-anchor="middle">Startup</text>
  <rect class="band amber" x="452" y="14" width="100" height="26" rx="4"/>
  <text class="heading" x="502" y="31" text-anchor="middle">Pre-deploy</text>
  <rect class="band" x="561" y="14" width="100" height="26" rx="4"/>
  <text class="heading" x="611" y="31" text-anchor="middle">Production</text>

  <rect class="node" x="16" y="52" width="100" height="60" rx="6"/>
  <text class="small bold" x="66" y="78" text-anchor="middle">1 compiler</text>
  <rect class="node dashed" x="125" y="52" width="100" height="60" rx="6"/>
  <text class="small bold" x="175" y="78" text-anchor="middle">2 check, diff</text>
  <text class="small muted" x="175" y="96" text-anchor="middle">DSL only</text>
  <rect class="node dashed" x="234" y="52" width="100" height="60" rx="6"/>
  <text class="small bold" x="284" y="78" text-anchor="middle">3 harness</text>
  <text class="small muted" x="284" y="96" text-anchor="middle">DSL only</text>
  <rect class="node" x="343" y="52" width="100" height="60" rx="6"/>
  <text class="small bold" x="393" y="78" text-anchor="middle">4</text>
  <text class="code small" x="393" y="96" text-anchor="middle">mkEventStream</text>
  <rect class="node amber" x="452" y="52" width="100" height="60" rx="6"/>
  <text class="small bold" x="502" y="78" text-anchor="middle">5 replay audit</text>
  <text class="small muted" x="502" y="96" text-anchor="middle">real logs</text>
  <rect class="node" x="561" y="52" width="100" height="60" rx="6"/>
  <text class="small bold" x="611" y="78" text-anchor="middle">6 runtime</text>
  <text class="small bold" x="611" y="96" text-anchor="middle">witnesses</text>

  <text class="heading" x="16" y="142">What each gate can see</text>
  <text class="small" x="66" y="164" text-anchor="middle">event and</text>
  <text class="small" x="66" y="180" text-anchor="middle">command types</text>
  <text class="small" x="175" y="164" text-anchor="middle">one spec and</text>
  <text class="small" x="175" y="180" text-anchor="middle">a git ref</text>
  <text class="small" x="284" y="164" text-anchor="middle">current shapes,</text>
  <text class="small" x="284" y="180" text-anchor="middle">old goldens</text>
  <text class="small" x="393" y="164" text-anchor="middle">the new machine</text>
  <text class="small" x="393" y="180" text-anchor="middle">in isolation</text>
  <text class="small" x="502" y="164" text-anchor="middle">real stored</text>
  <text class="small" x="502" y="180" text-anchor="middle">histories</text>
  <text class="small" x="611" y="164" text-anchor="middle">live failures,</text>
  <text class="small" x="611" y="180" text-anchor="middle">counters</text>

  <path class="axis accent" d="M16 206 H656" marker-end="url(#arrow-accent)"/>
  <text class="small accent" x="16" y="226">more evidence about stored data</text>
  <text class="small muted" x="16" y="250">Each gate sits at the earliest boundary with enough evidence. No gate checks everything.</text>
</svg>
