<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372">
  <text class="heading" x="16" y="22">Your application</text>
  <text class="heading" x="450" y="22">PostgreSQL</text>

  <rect class="node" x="16" y="36" width="200" height="56" rx="6"/>
  <text class="small bold" x="30" y="58">registry</text>
  <text class="code small" x="30" y="78">WorkflowName -&gt; body</text>

  <rect class="node accent" x="250" y="36" width="164" height="56" rx="6"/>
  <text class="small bold" x="332" y="58" text-anchor="middle">resume worker</text>
  <text class="small muted" x="332" y="78" text-anchor="middle">claims a lease</text>

  <rect class="node" x="450" y="36" width="214" height="56" rx="6"/>
  <text class="code small bold" x="464" y="58">keiro_workflows</text>
  <text class="small muted" x="464" y="78">running, or due wake hint</text>

  <path class="edge" d="M446 64 H418" marker-end="url(#arrow)"/>
  <text class="small bold accent" x="432" y="56" text-anchor="middle">2</text>
  <path class="edge" d="M250 64 H220" marker-end="url(#arrow)"/>
  <text class="small bold accent" x="235" y="56" text-anchor="middle">3</text>
  <path class="edge" d="M116 92 V138" marker-end="url(#arrow)"/>

  <rect class="node accent" x="16" y="142" width="200" height="132" rx="6"/>
  <text class="small bold" x="30" y="164">workflow body</text>
  <text class="code small" x="30" y="188">step "reserve"</text>
  <text class="code small" x="30" y="208">sleepNamed "cooling-off"</text>
  <text class="code small" x="30" y="228">awakeableNamed "payment"</text>
  <text class="code small" x="30" y="248">step "charge"</text>

  <rect class="node violet" x="450" y="128" width="214" height="146" rx="6"/>
  <text class="code small bold" x="464" y="150">wf:&lt;name&gt;-&lt;id&gt;</text>
  <text class="small muted" x="464" y="168">journal stream</text>
  <text class="code small" x="464" y="192">StepRecorded reserve</text>
  <text class="code small" x="464" y="212">StepRecorded sleep:…</text>
  <text class="code small" x="464" y="232">StepRecorded awk:…</text>
  <text class="small muted" x="464" y="258">append-only history</text>

  <path class="edge" d="M220 208 H446" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="small bold accent" x="333" y="196" text-anchor="middle">4</text>
  <text class="small" x="333" y="228" text-anchor="middle">reuse journaled results,</text>
  <text class="small" x="333" y="244" text-anchor="middle">run and append the rest</text>

  <rect class="node amber" x="450" y="306" width="214" height="56" rx="6"/>
  <text class="small bold" x="464" y="328">wake sources</text>
  <text class="small muted" x="464" y="348">timer row, awakeable, child</text>
  <path class="edge amber" d="M557 302 V278" marker-end="url(#arrow-amber)"/>
  <text class="small bold amber" x="572" y="294">1</text>

  <text class="small muted" x="16" y="312">1 A wake source journals its completion.</text>
  <text class="small muted" x="16" y="330">2 The worker discovers the instance.</text>
  <text class="small muted" x="16" y="348">3 The registry rebuilds the body.</text>
  <text class="small muted" x="16" y="366">4 The body runs again from the top.</text>
</svg>
