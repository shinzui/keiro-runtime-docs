<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318">
  <text class="heading" x="16" y="22">Delivery 1</text>
  <rect class="group green" x="16" y="32" width="312" height="196" rx="10"/>
  <rect class="node" x="32" y="48" width="280" height="44" rx="6"/>
  <text class="small" x="172" y="66" text-anchor="middle">insert inbox row</text>
  <text class="code small" x="172" y="84" text-anchor="middle">(ordering, msg_01hxyz)</text>
  <path class="edge" d="M172 92 V108" marker-end="url(#arrow)"/>
  <rect class="node green" x="32" y="112" width="280" height="34" rx="6"/>
  <text class="small" x="172" y="133" text-anchor="middle">new row: handler inserts a local row</text>
  <path class="edge" d="M172 146 V162" marker-end="url(#arrow)"/>
  <rect class="node" x="32" y="166" width="280" height="44" rx="6"/>
  <text class="small" x="172" y="184" text-anchor="middle">both rows commit together</text>
  <text class="code small green" x="172" y="202" text-anchor="middle">Right (InboxProcessed ())</text>

  <text class="heading" x="352" y="22">Delivery 2, same event</text>
  <rect class="group" x="352" y="32" width="312" height="196" rx="10"/>
  <rect class="node" x="368" y="48" width="280" height="44" rx="6"/>
  <text class="small" x="508" y="66" text-anchor="middle">insert inbox row</text>
  <text class="code small" x="508" y="84" text-anchor="middle">ON CONFLICT DO NOTHING</text>
  <path class="edge" d="M508 92 V108" marker-end="url(#arrow)"/>
  <rect class="node ghost dashed" x="368" y="112" width="280" height="34" rx="6"/>
  <text class="small muted" x="508" y="133" text-anchor="middle">row exists: handler skipped</text>
  <path class="edge" d="M508 146 V162" marker-end="url(#arrow)"/>
  <rect class="node" x="368" y="166" width="280" height="44" rx="6"/>
  <text class="small" x="508" y="184" text-anchor="middle">nothing new is written</text>
  <text class="code small" x="508" y="202" text-anchor="middle">Right InboxDuplicate</text>

  <text class="heading" x="16" y="260">After both deliveries</text>
  <rect class="band accent" x="16" y="270" width="648" height="40" rx="8"/>
  <text class="code small" x="30" y="295">keiro_inbox</text>
  <text class="small" x="120" y="295">1 row, InboxCompleted</text>
  <text class="small" x="360" y="295">local table: 1 row</text>
</svg>
