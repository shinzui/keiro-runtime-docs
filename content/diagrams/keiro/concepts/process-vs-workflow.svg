<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318">
  <text class="heading" x="16" y="22">Process reactions</text>
  <rect class="group" x="16" y="32" width="312" height="246" rx="10"/>
  <rect class="node violet" x="32" y="50" width="80" height="30" rx="5"/>
  <text class="small" x="72" y="70" text-anchor="middle">event 1</text>
  <rect class="node violet" x="32" y="120" width="80" height="30" rx="5"/>
  <text class="small" x="72" y="140" text-anchor="middle">event 2</text>
  <rect class="node violet" x="32" y="190" width="80" height="30" rx="5"/>
  <text class="small" x="72" y="210" text-anchor="middle">event 3</text>
  <path class="edge" d="M112 65 H140 V95 H156" marker-end="url(#arrow)"/>
  <path class="edge" d="M112 135 H156" marker-end="url(#arrow)"/>
  <path class="edge" d="M112 205 H140 V175 H156" marker-end="url(#arrow)"/>
  <rect class="node accent" x="160" y="80" width="152" height="110" rx="6"/>
  <text class="small bold" x="236" y="104" text-anchor="middle">process manager</text>
  <text class="small" x="236" y="128" text-anchor="middle">correlate, react,</text>
  <text class="small" x="236" y="146" text-anchor="middle">record progress</text>
  <text class="small muted" x="236" y="172" text-anchor="middle">manager stream</text>
  <path class="edge" d="M236 190 V224" marker-end="url(#arrow)"/>
  <rect class="node" x="160" y="228" width="152" height="34" rx="6"/>
  <text class="small" x="236" y="249" text-anchor="middle">commands, timers</text>

  <text class="heading" x="352" y="22">Named-step workflow</text>
  <rect class="group" x="352" y="32" width="312" height="246" rx="10"/>
  <rect class="node accent" x="368" y="48" width="280" height="214" rx="6"/>
  <text class="small bold" x="384" y="70">one function, top to bottom</text>
  <text class="code small" x="384" y="100">step "reserve-inventory"</text>
  <text class="code small amber" x="384" y="128">sleepNamed "cooling-off"</text>
  <text class="code small amber" x="384" y="156">awakeableNamed "payment-webhook"</text>
  <text class="code small" x="384" y="184">step "charge"</text>
  <text class="code small" x="384" y="212">spawnChild, awaitChild</text>
  <text class="small muted" x="384" y="244">results in the workflow journal</text>

  <text class="small muted" x="16" y="304">Left: independent events drive each reaction. Right: waits sit inside one sequence.</text>
</svg>
