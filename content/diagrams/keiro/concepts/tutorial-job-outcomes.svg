<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <rect class="node violet" x="16" y="14" width="300" height="40" rx="6"/>
  <text class="code small" x="30" y="38">tutorial_ping</text>
  <text class="small muted" x="140" y="38">main queue</text>
  <rect class="node rose" x="364" y="14" width="300" height="40" rx="6"/>
  <text class="code small" x="378" y="38">tutorial_ping_dlq</text>
  <text class="small muted" x="520" y="38">dead-letter queue</text>

  <text class="heading" x="16" y="88">Handler result</text>
  <rect class="node green" x="16" y="98" width="150" height="50" rx="6"/>
  <text class="code small bold" x="91" y="119" text-anchor="middle">Done</text>
  <text class="small" x="91" y="137" text-anchor="middle">AckOk</text>
  <rect class="node amber" x="182" y="98" width="150" height="50" rx="6"/>
  <text class="code small bold" x="257" y="119" text-anchor="middle">Retry delay</text>
  <text class="small" x="257" y="137" text-anchor="middle">AckRetry</text>
  <rect class="node rose" x="348" y="98" width="150" height="50" rx="6"/>
  <text class="code small bold" x="423" y="119" text-anchor="middle">Dead reason</text>
  <text class="small" x="423" y="137" text-anchor="middle">AckDeadLetter</text>
  <rect class="node rose dashed" x="514" y="98" width="150" height="50" rx="6"/>
  <text class="small bold" x="589" y="119" text-anchor="middle">undecodable payload</text>
  <text class="small" x="589" y="137" text-anchor="middle">handler never runs</text>

  <path class="edge" d="M91 148 V176" marker-end="url(#arrow)"/>
  <path class="edge" d="M257 148 V176" marker-end="url(#arrow)"/>
  <path class="edge" d="M423 148 V176" marker-end="url(#arrow)"/>
  <path class="edge" d="M589 148 V176" marker-end="url(#arrow)"/>

  <text class="heading" x="16" y="196">Effect on the message</text>
  <rect class="node" x="16" y="206" width="150" height="56" rx="6"/>
  <text class="small" x="91" y="230" text-anchor="middle">deleted from</text>
  <text class="small" x="91" y="248" text-anchor="middle">the main queue</text>
  <rect class="node" x="182" y="206" width="150" height="56" rx="6"/>
  <text class="small" x="257" y="230" text-anchor="middle">stays on the main</text>
  <text class="small" x="257" y="248" text-anchor="middle">queue for redelivery</text>
  <rect class="node" x="348" y="206" width="150" height="56" rx="6"/>
  <text class="small" x="423" y="230" text-anchor="middle">moved to</text>
  <text class="small" x="423" y="248" text-anchor="middle">the DLQ</text>
  <rect class="node" x="514" y="206" width="150" height="56" rx="6"/>
  <text class="small" x="589" y="230" text-anchor="middle">moved to the DLQ</text>
  <text class="code small" x="589" y="248" text-anchor="middle">InvalidPayload</text>

  <text class="small muted" x="16" y="290">runJobOnce 1 reads one message, runs the handler, and acks the result.</text>
</svg>
