<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330">
  <text class="heading" x="16" y="22">Read side · rebuild group reporting</text>
  <rect class="node violet" x="16" y="34" width="150" height="50" rx="6"/>
  <text class="small" x="91" y="55" text-anchor="middle">category</text>
  <text class="code small" x="91" y="73" text-anchor="middle">hospitalLoad</text>
  <path class="edge" d="M166 59 H190" marker-end="url(#arrow)"/>
  <rect class="node" x="194" y="34" width="190" height="50" rx="6"/>
  <text class="small" x="289" y="55" text-anchor="middle">projection owner</text>
  <text class="code small" x="289" y="73" text-anchor="middle">hospital_load_writer</text>
  <path class="edge" d="M384 59 H408" marker-end="url(#arrow)"/>
  <rect class="node green" x="412" y="34" width="252" height="50" rx="6"/>
  <text class="small" x="538" y="55" text-anchor="middle">readmodel hospital_load</text>
  <text class="code small" x="538" y="73" text-anchor="middle">hospital_transfer.hospital_load</text>

  <path class="edge dashed" d="M538 84 V176" marker-end="url(#arrow)"/>
  <text class="small" x="548" y="126">resolve stable:</text>
  <text class="small" x="548" y="144">one row per hospital</text>

  <text class="heading" x="16" y="166">Write side</text>
  <rect class="node violet" x="16" y="180" width="190" height="56" rx="6"/>
  <text class="small" x="111" y="201" text-anchor="middle">input</text>
  <text class="code small" x="111" y="221" text-anchor="middle">AcceptedHospitalTransferNeed</text>
  <path class="edge" d="M206 208 H230" marker-end="url(#arrow)"/>
  <rect class="node accent" x="234" y="180" width="430" height="56" rx="6"/>
  <text class="small" x="248" y="201">router</text>
  <text class="code small bold" x="300" y="201">HospitalTransferRouter</text>
  <text class="small muted" x="248" y="221">key transferNeedId · rejected: deadLetter · poison: halt</text>

  <path class="edge" d="M330 236 V270" marker-end="url(#arrow)"/>
  <path class="edge" d="M450 236 V270" marker-end="url(#arrow)"/>
  <path class="edge" d="M570 236 V270" marker-end="url(#arrow)"/>
  <text class="code small muted" x="322" y="258" text-anchor="end">RouteAcceptedTransferNeed</text>
  <rect class="node" x="276" y="274" width="108" height="44" rx="6"/>
  <text class="small" x="330" y="294" text-anchor="middle">Hospital</text>
  <text class="small muted" x="330" y="310" text-anchor="middle">hospital A</text>
  <rect class="node" x="396" y="274" width="108" height="44" rx="6"/>
  <text class="small" x="450" y="294" text-anchor="middle">Hospital</text>
  <text class="small muted" x="450" y="310" text-anchor="middle">hospital B</text>
  <rect class="node" x="516" y="274" width="108" height="44" rx="6"/>
  <text class="small" x="570" y="294" text-anchor="middle">Hospital</text>
  <text class="small muted" x="570" y="310" text-anchor="middle">hospital C</text>
  <text class="small muted" x="16" y="296">Each Hospital stream</text>
  <text class="small muted" x="16" y="312">records the routed need.</text>
</svg>
