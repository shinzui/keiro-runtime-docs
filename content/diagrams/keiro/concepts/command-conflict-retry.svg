<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392">
  <text class="heading" x="20" y="22">runCommand A</text>
  <text class="heading" x="340" y="22" text-anchor="middle">Stream orders-1</text>
  <text class="heading" x="660" y="22" text-anchor="end">runCommand B</text>
  <path class="axis dashed" d="M110 34 V340"/>
  <path class="axis" d="M340 34 V340"/>
  <path class="axis dashed" d="M570 34 V340"/>

  <rect class="node" x="20" y="44" width="180" height="30" rx="6"/>
  <text class="small" x="110" y="63" text-anchor="middle">Hydrate at version n</text>
  <rect class="node" x="480" y="44" width="180" height="30" rx="6"/>
  <text class="small" x="570" y="63" text-anchor="middle">Hydrate at version n</text>
  <rect class="node violet" x="290" y="44" width="100" height="30" rx="6"/>
  <text class="code small" x="340" y="63" text-anchor="middle">version n</text>

  <rect class="node" x="20" y="86" width="180" height="30" rx="6"/>
  <text class="small" x="110" y="105" text-anchor="middle">Transduce</text>
  <rect class="node" x="480" y="86" width="180" height="30" rx="6"/>
  <text class="small" x="570" y="105" text-anchor="middle">Transduce</text>

  <rect class="node" x="20" y="128" width="180" height="30" rx="6"/>
  <text class="small" x="110" y="147" text-anchor="middle">Append, ExactVersion n</text>
  <path class="edge green" d="M200 143 H286" marker-end="url(#arrow-green)"/>
  <rect class="node green" x="290" y="128" width="100" height="30" rx="6"/>
  <text class="code small" x="340" y="147" text-anchor="middle">version n+1</text>

  <rect class="node" x="480" y="176" width="180" height="30" rx="6"/>
  <text class="small" x="570" y="195" text-anchor="middle">Append, ExactVersion n</text>
  <path class="edge rose" d="M480 191 H394" marker-end="url(#arrow-rose)"/>
  <rect class="node rose" x="290" y="176" width="100" height="30" rx="6"/>
  <text class="small" x="340" y="195" text-anchor="middle">conflict</text>
  <path class="edge rose dashed" d="M394 210 H476" marker-end="url(#arrow-rose)"/>
  <text class="code small rose" x="435" y="226" text-anchor="middle">WrongExpectedVersion</text>

  <rect class="node amber" x="480" y="240" width="180" height="44" rx="6"/>
  <text class="small" x="570" y="258" text-anchor="middle">retry 1: Hydrate at n+1,</text>
  <text class="small" x="570" y="275" text-anchor="middle">Transduce again</text>

  <rect class="node" x="480" y="296" width="180" height="30" rx="6"/>
  <text class="small" x="570" y="315" text-anchor="middle">Append, ExactVersion n+1</text>
  <path class="edge green" d="M480 311 H394" marker-end="url(#arrow-green)"/>
  <rect class="node green" x="290" y="296" width="100" height="30" rx="6"/>
  <text class="code small" x="340" y="315" text-anchor="middle">version n+2</text>

  <rect class="band" x="16" y="352" width="648" height="32" rx="6"/>
  <text class="small" x="30" y="373">Retries stop at retryLimit (default 3). Then runCommand returns RetryExhausted.</text>
</svg>
