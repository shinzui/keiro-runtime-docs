<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <text class="heading" x="130" y="22">Tx 1 · emitIndex -1</text>
  <text class="heading" x="310" y="22">Tx 2 · emitIndex 0</text>
  <text class="heading" x="490" y="22">Tx 3 · emitIndex 1</text>

  <text class="small bold" x="16" y="58">Delivery 1</text>
  <text class="small muted" x="16" y="76">source event E</text>
  <rect class="node green" x="124" y="40" width="168" height="50" rx="6"/>
  <text class="small" x="208" y="61" text-anchor="middle">manager state</text>
  <text class="small" x="208" y="78" text-anchor="middle">+ timers: appended</text>
  <rect class="node green" x="304" y="40" width="168" height="50" rx="6"/>
  <text class="small" x="388" y="61" text-anchor="middle">target command 0</text>
  <text class="small" x="388" y="78" text-anchor="middle">appended</text>
  <rect class="node rose dashed" x="484" y="40" width="180" height="50" rx="6"/>
  <text class="small rose" x="574" y="61" text-anchor="middle">crash before</text>
  <text class="small rose" x="574" y="78" text-anchor="middle">target command 1</text>

  <path class="edge dashed" d="M70 92 V136" marker-end="url(#arrow)"/>
  <text class="small muted" x="80" y="118">redelivered</text>

  <text class="small bold" x="16" y="160">Delivery 2</text>
  <text class="small muted" x="16" y="178">same event E</text>
  <rect class="node" x="124" y="142" width="168" height="50" rx="6"/>
  <text class="code small" x="208" y="172" text-anchor="middle">PMStateDuplicate</text>
  <rect class="node" x="304" y="142" width="168" height="50" rx="6"/>
  <text class="code small" x="388" y="172" text-anchor="middle">PMCommandDuplicate</text>
  <rect class="node green" x="484" y="142" width="180" height="50" rx="6"/>
  <text class="code small" x="574" y="172" text-anchor="middle">PMCommandAppended</text>

  <rect class="band" x="16" y="214" width="648" height="74" rx="8"/>
  <text class="small" x="30" y="236">Each write has a deterministic id:</text>
  <text class="code small" x="30" y="258">v5 UUID over (name, correlationId, sourceEventId, emitIndex)</text>
  <text class="small muted" x="30" y="278">The same inputs give the same id, so a repeated write becomes a duplicate.</text>
</svg>
