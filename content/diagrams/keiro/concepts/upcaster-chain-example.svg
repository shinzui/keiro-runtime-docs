<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <text class="heading" x="16" y="22">Write with the v2 codec</text>
  <rect class="node" x="16" y="34" width="150" height="50" rx="6"/>
  <text class="code small" x="91" y="63" text-anchor="middle">OrderPlaced</text>
  <path class="edge" d="M166 59 H228" marker-end="url(#arrow)"/>
  <text class="code small muted" x="197" y="51" text-anchor="middle">encode</text>
  <rect class="node violet" x="232" y="34" width="432" height="50" rx="6"/>
  <text class="small" x="246" y="54">stored payload in the v2 shape</text>
  <text class="small" x="246" y="74">metadata: schema version 2 (this key always wins)</text>

  <text class="heading" x="16" y="128">Read an old v1 event with the same codec</text>
  <rect class="node violet" x="16" y="140" width="180" height="96" rx="6"/>
  <text class="small" x="30" y="162">stored v1 OrderPlaced</text>
  <text class="code small" x="30" y="186">{…, "qty": 3}</text>
  <text class="small muted" x="30" y="210">no version stamp,</text>
  <text class="small muted" x="30" y="226">so version 1</text>

  <path class="edge amber" d="M196 188 H252" marker-end="url(#arrow-amber)"/>
  <text class="small amber" x="224" y="178" text-anchor="middle">rung 1</text>

  <rect class="node amber" x="256" y="140" width="220" height="96" rx="6"/>
  <text class="code small" x="270" y="162">upcastOrderPlacedV1</text>
  <text class="code small" x="270" y="186">{…, "quantity": 3,</text>
  <text class="code small" x="278" y="204">"sku": "UNKNOWN"}</text>
  <text class="small muted" x="270" y="226">now at schemaVersion 2</text>

  <path class="edge green" d="M476 188 H532" marker-end="url(#arrow-green)"/>
  <text class="small green" x="504" y="178" text-anchor="middle">decode</text>
  <rect class="node green" x="536" y="140" width="128" height="96" rx="6"/>
  <text class="code small" x="600" y="184" text-anchor="middle">OrderPlaced</text>
  <text class="small muted" x="600" y="204" text-anchor="middle">domain value</text>

  <text class="small muted" x="16" y="270">The stored bytes never change. The chain runs on every read.</text>
  <text class="small rose" x="16" y="290">A missing rung fails with GapInUpcasterChain.</text>
</svg>
