<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290">
  <text class="heading" x="16" y="22">Registry status</text>
  <rect class="band green" x="120" y="32" width="100" height="30" rx="4"/>
  <text class="code small" x="170" y="51" text-anchor="middle">Live</text>
  <rect class="band amber" x="220" y="32" width="340" height="30" rx="4"/>
  <text class="code small" x="390" y="51" text-anchor="middle">Rebuilding</text>
  <rect class="band green" x="560" y="32" width="104" height="30" rx="4"/>
  <text class="code small" x="612" y="51" text-anchor="middle">Live</text>

  <path class="axis dashed" d="M220 70 V250"/>
  <path class="axis dashed" d="M560 70 V250"/>

  <text class="small bold" x="16" y="104">Rebuilder</text>
  <rect class="node amber" x="226" y="84" width="122" height="72" rx="6"/>
  <text class="code small" x="287" y="102" text-anchor="middle">startRebuild</text>
  <text class="small muted" x="287" y="118" text-anchor="middle">truncate table,</text>
  <text class="small muted" x="287" y="132" text-anchor="middle">clear dedup keys,</text>
  <text class="small muted" x="287" y="146" text-anchor="middle">reset cursor</text>
  <rect class="node" x="364" y="84" width="112" height="72" rx="6"/>
  <text class="small" x="420" y="108" text-anchor="middle">replay ordered</text>
  <text class="small" x="420" y="124" text-anchor="middle">events, unfenced</text>
  <text class="small muted" x="420" y="144" text-anchor="middle">no snapshots</text>
  <rect class="node" x="492" y="84" width="62" height="72" rx="6"/>
  <text class="small" x="523" y="124" text-anchor="middle">verify</text>
  <rect class="node green" x="564" y="84" width="100" height="72" rx="6"/>
  <text class="code small" x="615" y="124" text-anchor="middle">finishRebuild</text>
  <path class="edge" d="M348 120 H360" marker-end="url(#arrow)"/>
  <path class="edge" d="M476 120 H488" marker-end="url(#arrow)"/>

  <text class="small bold" x="16" y="196">Live writers</text>
  <text class="code small green" x="170" y="196" text-anchor="middle">AsyncApplied</text>
  <rect class="node rose" x="230" y="178" width="320" height="28" rx="6"/>
  <text class="code small" x="390" y="197" text-anchor="middle">AsyncFenced: do not checkpoint</text>
  <text class="code small green" x="612" y="196" text-anchor="middle">AsyncApplied</text>

  <text class="small bold" x="16" y="240">Queries</text>
  <text class="small green" x="170" y="240" text-anchor="middle">served</text>
  <rect class="node rose" x="230" y="222" width="320" height="28" rx="6"/>
  <text class="small" x="390" y="241" text-anchor="middle">rejected while not Live</text>
  <text class="small green" x="612" y="240" text-anchor="middle">served</text>

  <text class="small muted" x="16" y="280">startRebuild does its four changes in one transaction. The table is rebuilt in place.</text>
</svg>
