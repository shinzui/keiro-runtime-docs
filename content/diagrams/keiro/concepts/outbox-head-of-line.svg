<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 334">
  <text class="heading" x="16" y="22">keiro_outbox rows for one source, in outbox sequence</text>
  <text class="small muted" x="30" y="48">seq</text>
  <text class="small muted" x="80" y="48">key</text>
  <text class="small muted" x="200" y="48">status</text>
  <text class="small muted" x="420" y="48">PerKeyHeadOfLine claim</text>

  <rect class="band amber" x="16" y="58" width="648" height="30" rx="4"/>
  <text class="code small" x="30" y="78">1</text>
  <text class="code small" x="80" y="78">order-1</text>
  <text class="small" x="200" y="78">failed, waits for backoff</text>
  <text class="small amber" x="420" y="78">head of order-1: blocks later order-1</text>

  <rect class="band green" x="16" y="94" width="648" height="30" rx="4"/>
  <text class="code small" x="30" y="114">2</text>
  <text class="code small" x="80" y="114">order-2</text>
  <text class="small" x="200" y="114">pending</text>
  <text class="small green" x="420" y="114">claimed</text>

  <rect class="band" x="16" y="130" width="648" height="30" rx="4"/>
  <text class="code small muted" x="30" y="150">3</text>
  <text class="code small muted" x="80" y="150">order-3</text>
  <text class="small muted" x="200" y="150">dead (terminal)</text>
  <text class="small muted" x="420" y="150">no longer blocks order-3</text>

  <rect class="band" x="16" y="166" width="648" height="30" rx="4"/>
  <text class="code small" x="30" y="186">4</text>
  <text class="code small" x="80" y="186">order-1</text>
  <text class="small" x="200" y="186">pending</text>
  <text class="small rose" x="420" y="186">blocked by 1</text>

  <rect class="band green" x="16" y="202" width="648" height="30" rx="4"/>
  <text class="code small" x="30" y="222">5</text>
  <text class="code small muted" x="80" y="222">Nothing</text>
  <text class="small" x="200" y="222">pending</text>
  <text class="small green" x="420" y="222">claimed: no key, no block</text>

  <rect class="band" x="16" y="238" width="648" height="30" rx="4"/>
  <text class="code small" x="30" y="258">6</text>
  <text class="code small" x="80" y="258">order-2</text>
  <text class="small" x="200" y="258">pending</text>
  <text class="small rose" x="420" y="258">blocked by 2 until 2 is sent</text>

  <rect class="band green" x="16" y="274" width="648" height="30" rx="4"/>
  <text class="code small" x="30" y="294">7</text>
  <text class="code small" x="80" y="294">order-3</text>
  <text class="small" x="200" y="294">pending</text>
  <text class="small green" x="420" y="294">claimed</text>

  <text class="small muted" x="16" y="326">One stuck key holds back only its own later rows.</text>
</svg>
