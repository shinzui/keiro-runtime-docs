<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 314">
  <text class="heading" x="16" y="22">Global position</text>
  <path class="axis" d="M140 44 H664" marker-end="url(#arrow-muted)"/>
  <circle class="dot muted" cx="160" cy="44" r="3"/>
  <circle class="dot muted" cx="200" cy="44" r="3"/>
  <circle class="dot muted" cx="240" cy="44" r="3"/>
  <circle class="dot muted" cx="280" cy="44" r="3"/>
  <circle class="dot muted" cx="320" cy="44" r="3"/>
  <circle class="dot muted" cx="360" cy="44" r="3"/>
  <circle class="dot muted" cx="400" cy="44" r="3"/>
  <circle class="dot muted" cx="440" cy="44" r="3"/>
  <circle class="dot muted" cx="480" cy="44" r="3"/>
  <circle class="dot muted" cx="520" cy="44" r="3"/>
  <circle class="dot muted" cx="560" cy="44" r="3"/>
  <circle class="dot muted" cx="600" cy="44" r="3"/>

  <path class="axis dashed accent" d="M240 54 V240"/>
  <text class="small accent" x="240" y="258" text-anchor="middle">cursor now</text>
  <text class="code small accent" x="240" y="274" text-anchor="middle">last_seen</text>
  <path class="axis dashed violet" d="M360 54 V240"/>
  <text class="small violet" x="360" y="258" text-anchor="middle">command result</text>
  <text class="code small violet" x="360" y="274" text-anchor="middle">GlobalPosition</text>
  <path class="axis dashed amber" d="M480 54 V240"/>
  <text class="small amber" x="480" y="258" text-anchor="middle">head at</text>
  <text class="small amber" x="480" y="274" text-anchor="middle">query start</text>
  <text class="small muted" x="600" y="70" text-anchor="middle">later appends</text>

  <text class="code small bold" x="16" y="106">Eventual</text>
  <circle class="dot green" cx="240" cy="102" r="6"/>
  <text class="small" x="254" y="106">read now</text>

  <text class="code small bold" x="16" y="160">PositionWait</text>
  <rect class="band violet" x="240" y="148" width="120" height="22" rx="4"/>
  <text class="small" x="300" y="163" text-anchor="middle">wait</text>
  <circle class="dot green" cx="360" cy="159" r="6"/>
  <text class="small" x="374" y="163">read</text>

  <text class="code small bold" x="16" y="214">Strong</text>
  <rect class="band amber" x="240" y="202" width="240" height="22" rx="4"/>
  <text class="small" x="360" y="217" text-anchor="middle">wait for the cursor</text>
  <circle class="dot green" cx="480" cy="213" r="6"/>
  <text class="small" x="494" y="217">read</text>

  <text class="small muted" x="16" y="306">A wait polls subscriptions.last_seen until it reaches the target or timeoutMicros elapses.</text>
</svg>
