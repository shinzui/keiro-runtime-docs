<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290">
  <path class="axis" d="M130 30 H664" marker-end="url(#arrow-muted)"/>
  <text class="small muted" x="664" y="22" text-anchor="end">time</text>
  <circle class="dot violet" cx="190" cy="30" r="5"/>
  <text class="small violet" x="190" y="22" text-anchor="middle">append A</text>
  <circle class="dot violet" cx="420" cy="30" r="5"/>
  <text class="small violet" x="420" y="22" text-anchor="middle">append B</text>
  <path class="axis dashed violet" d="M190 36 V230"/>
  <path class="axis dashed violet" d="M420 36 V230"/>

  <text class="small bold" x="16" y="78">Fixed poll</text>
  <rect class="band" x="130" y="58" width="534" height="34" rx="4"/>
  <rect class="node" x="136" y="64" width="22" height="22" rx="3"/>
  <rect class="node accent" x="296" y="64" width="22" height="22" rx="3"/>
  <rect class="node accent" x="456" y="64" width="22" height="22" rx="3"/>
  <rect class="node" x="616" y="64" width="22" height="22" rx="3"/>
  <path class="edge amber" d="M190 110 H292" marker-end="url(#arrow-amber)"/>
  <text class="small amber" x="242" y="128" text-anchor="middle">waits for the tick</text>
  <path class="edge amber" d="M420 110 H452" marker-end="url(#arrow-amber)"/>

  <text class="small bold" x="16" y="178">Push-aware</text>
  <rect class="band" x="130" y="158" width="534" height="34" rx="4"/>
  <rect class="node" x="136" y="164" width="22" height="22" rx="3"/>
  <rect class="node accent" x="196" y="164" width="22" height="22" rx="3"/>
  <text class="small accent" x="226" y="214">NOTIFY wakes a pass</text>
  <circle class="dot rose" cx="426" cy="175" r="5"/>
  <text class="small rose" x="434" y="214">NOTIFY lost</text>
  <rect class="node accent" x="556" y="164" width="22" height="22" rx="3"/>
  <text class="small accent" x="567" y="240" text-anchor="middle">fallback timeout pass</text>
  <path class="axis accent" d="M567 192 V226"/>

  <text class="small muted" x="16" y="278">Squares are durable poll passes. Each pass polls durable state, so a lost NOTIFY only adds delay.</text>
</svg>
