<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290">
  <text class="heading" x="16" y="22">Worker processes</text>
  <text class="heading" x="212" y="22">keiro_subscription_shards</text>
  <text class="heading" x="480" y="22">Kiroku group members</text>

  <rect class="node accent" x="16" y="40" width="160" height="88" rx="8"/>
  <text class="small bold" x="96" y="78" text-anchor="middle">process 1</text>
  <text class="small muted" x="96" y="96" text-anchor="middle">two live readers</text>
  <rect class="node violet" x="16" y="140" width="160" height="88" rx="8"/>
  <text class="small bold" x="96" y="178" text-anchor="middle">process 2</text>
  <text class="small muted" x="96" y="196" text-anchor="middle">one reader, claiming</text>

  <rect class="band accent" x="212" y="40" width="236" height="40" rx="4"/>
  <text class="code small" x="226" y="64">bucket 0</text>
  <text class="small" x="320" y="64">leased by process 1</text>
  <rect class="band accent" x="212" y="88" width="236" height="40" rx="4"/>
  <text class="code small" x="226" y="112">bucket 1</text>
  <text class="small" x="320" y="112">leased by process 1</text>
  <rect class="band violet" x="212" y="140" width="236" height="40" rx="4"/>
  <text class="code small" x="226" y="164">bucket 2</text>
  <text class="small" x="320" y="164">leased by process 2</text>
  <rect class="band amber" x="212" y="188" width="236" height="40" rx="4"/>
  <text class="code small" x="226" y="212">bucket 3</text>
  <text class="small amber" x="320" y="212">lease expired</text>

  <path class="edge" d="M176 60 H208" marker-end="url(#arrow)"/>
  <path class="edge" d="M176 108 H208" marker-end="url(#arrow)"/>
  <path class="edge" d="M176 160 H208" marker-end="url(#arrow)"/>
  <path class="edge dashed amber" d="M176 208 H208" marker-end="url(#arrow-amber)"/>

  <path class="edge dashed" d="M448 60 H476" marker-end="url(#arrow)"/>
  <path class="edge dashed" d="M448 108 H476" marker-end="url(#arrow)"/>
  <path class="edge dashed" d="M448 160 H476" marker-end="url(#arrow)"/>
  <path class="edge dashed" d="M448 208 H476" marker-end="url(#arrow)"/>
  <rect class="node" x="480" y="44" width="184" height="32" rx="6"/>
  <text class="small" x="572" y="64" text-anchor="middle">member 0 checkpoint</text>
  <rect class="node" x="480" y="92" width="184" height="32" rx="6"/>
  <text class="small" x="572" y="112" text-anchor="middle">member 1 checkpoint</text>
  <rect class="node" x="480" y="144" width="184" height="32" rx="6"/>
  <text class="small" x="572" y="164" text-anchor="middle">member 2 checkpoint</text>
  <rect class="node" x="480" y="192" width="184" height="32" rx="6"/>
  <text class="small" x="572" y="212" text-anchor="middle">member 3 checkpoint</text>

  <text class="small muted" x="16" y="258">A reconcile pass renews leases and claims at most one bucket.</text>
  <text class="small muted" x="16" y="276">A new owner resumes from the durable member checkpoint.</text>
</svg>
