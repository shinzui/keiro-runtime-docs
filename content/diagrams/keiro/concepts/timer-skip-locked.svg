<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318">
  <text class="heading" x="16" y="22">keiro_timers, ordered by fire_at</text>
  <text class="code small muted" x="30" y="46">timer_id</text>
  <text class="code small muted" x="130" y="46">status</text>
  <text class="code small muted" x="260" y="46">fire_at</text>

  <rect class="band" x="16" y="56" width="400" height="32" rx="4"/>
  <text class="code small muted" x="30" y="77">t5</text>
  <text class="code small muted" x="130" y="77">fired</text>
  <text class="code small muted" x="260" y="77">09:58</text>

  <rect class="band" x="16" y="94" width="400" height="32" rx="4"/>
  <text class="code small muted" x="30" y="115">t3</text>
  <text class="code small muted" x="130" y="115">firing</text>
  <text class="code small muted" x="260" y="115">09:59</text>

  <rect class="band accent" x="16" y="132" width="400" height="32" rx="4"/>
  <text class="code small" x="30" y="153">t1</text>
  <text class="code small" x="130" y="153">scheduled</text>
  <text class="code small" x="260" y="153">10:00</text>
  <text class="small accent" x="340" y="153">locked</text>

  <rect class="band accent" x="16" y="170" width="400" height="32" rx="4"/>
  <text class="code small" x="30" y="191">t2</text>
  <text class="code small" x="130" y="191">scheduled</text>
  <text class="code small" x="260" y="191">10:01</text>
  <text class="small accent" x="340" y="191">locked</text>

  <path class="axis dashed amber" d="M16 214 H416"/>
  <text class="small amber" x="424" y="218">now = 10:02</text>

  <rect class="band" x="16" y="226" width="400" height="32" rx="4"/>
  <text class="code small" x="30" y="247">t4</text>
  <text class="code small" x="130" y="247">scheduled</text>
  <text class="code small" x="260" y="247">10:05</text>
  <text class="small muted" x="340" y="247">not due</text>

  <text class="heading" x="470" y="22">Concurrent workers</text>
  <rect class="node accent" x="470" y="132" width="194" height="32" rx="6"/>
  <text class="small" x="567" y="153" text-anchor="middle">worker 1 claims t1</text>
  <rect class="node accent" x="470" y="170" width="194" height="32" rx="6"/>
  <text class="small" x="567" y="191" text-anchor="middle">worker 2 skips t1, claims t2</text>
  <rect class="node" x="470" y="226" width="194" height="32" rx="6"/>
  <text class="small" x="567" y="247" text-anchor="middle">worker 3 finds no due row</text>
  <path class="edge accent" d="M466 148 H420" marker-end="url(#arrow-accent)"/>
  <path class="edge accent" d="M466 186 H420" marker-end="url(#arrow-accent)"/>

  <text class="small muted" x="16" y="290">A claim moves the row to firing and adds one to attempts.</text>
  <text class="small muted" x="16" y="308">The query reads only scheduled rows with fire_at &lt;= now.</text>
</svg>
