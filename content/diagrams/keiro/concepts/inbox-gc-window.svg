<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262">
  <path class="axis" d="M40 120 H664" marker-end="url(#arrow-muted)"/>
  <text class="small muted" x="664" y="140" text-anchor="end">time</text>

  <rect class="band accent" x="80" y="94" width="400" height="20" rx="4"/>
  <text class="small accent" x="280" y="88" text-anchor="middle">completed row kept: the duplicate-detection window</text>
  <path class="axis dashed amber" d="M480 40 V180"/>
  <text class="code small amber" x="480" y="34" text-anchor="middle">garbageCollectCompleted</text>

  <circle class="dot green" cx="80" cy="120" r="6"/>
  <text class="small bold" x="80" y="156" text-anchor="middle">first delivery</text>
  <text class="code small green" x="80" y="174" text-anchor="middle">InboxProcessed</text>

  <circle class="dot" cx="300" cy="120" r="6"/>
  <text class="small bold" x="300" y="156" text-anchor="middle">redelivery</text>
  <text class="code small" x="300" y="174" text-anchor="middle">InboxDuplicate</text>

  <circle class="dot rose" cx="580" cy="120" r="6"/>
  <text class="small bold" x="580" y="156" text-anchor="middle">late redelivery</text>
  <text class="small rose" x="580" y="174" text-anchor="middle">processed again</text>

  <rect class="node" x="16" y="206" width="648" height="44" rx="6"/>
  <text class="small" x="30" y="225">Set the retention above the longest delivery delay. The user guide suggests 30 days.</text>
  <text class="small muted" x="30" y="242">Failed rows are never collected. An operator reviews them.</text>
</svg>
