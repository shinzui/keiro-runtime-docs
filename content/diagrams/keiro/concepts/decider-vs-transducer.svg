<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 304">
  <text class="heading" x="16" y="22">decide / evolve (not used by keiro)</text>
  <rect class="group muted" x="16" y="32" width="312" height="226" rx="10"/>
  <rect class="node" x="32" y="48" width="280" height="52" rx="6"/>
  <text class="code small bold" x="46" y="69">decide</text>
  <text class="code small" x="46" y="89">(state, command) -&gt; [event]</text>
  <rect class="node" x="32" y="116" width="280" height="52" rx="6"/>
  <text class="code small bold" x="46" y="137">evolve</text>
  <text class="code small" x="46" y="157">(state, event) -&gt; state</text>
  <text class="small rose" x="46" y="194">Two functions: emit and update can drift.</text>
  <text class="small muted" x="46" y="214">Working memory hides inside state.</text>
  <text class="small muted" x="46" y="234">No place to state replay safety.</text>

  <text class="heading accent" x="352" y="22">keiro: one SymTransducer</text>
  <rect class="group accent" x="352" y="32" width="312" height="226" rx="10"/>
  <rect class="node accent" x="368" y="48" width="280" height="52" rx="6"/>
  <text class="code small bold" x="382" y="69">step (forward)</text>
  <text class="code small" x="382" y="89">(s, RegFile rs) + ci -&gt; (s', rs', [co])</text>
  <rect class="node accent" x="368" y="116" width="280" height="52" rx="6"/>
  <text class="code small bold" x="382" y="137">replay (hydrate)</text>
  <text class="small" x="382" y="157">invert co to ci, re-check the guard</text>
  <text class="small green" x="382" y="194">One edge set: emit and update stay coupled.</text>
  <text class="small muted" x="382" y="214">Typed registers, ε-edges, guards as data.</text>
  <text class="small muted" x="382" y="234">keiki checks replay safety statically.</text>

  <text class="small muted" x="16" y="290">Cost: a guard or update edit changes how stored events replay.</text>
</svg>
