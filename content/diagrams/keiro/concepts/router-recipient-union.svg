<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <text class="heading" x="230" y="22" text-anchor="middle">target A</text>
  <text class="heading" x="400" y="22" text-anchor="middle">target B</text>
  <text class="heading" x="570" y="22" text-anchor="middle">target C</text>

  <text class="small bold" x="16" y="56">Attempt 1</text>
  <text class="small muted" x="16" y="74">resolve: A, B</text>
  <rect class="node green" x="160" y="40" width="140" height="44" rx="6"/>
  <text class="small" x="230" y="67" text-anchor="middle">appended</text>
  <rect class="node rose" x="330" y="40" width="140" height="44" rx="6"/>
  <text class="small" x="400" y="59" text-anchor="middle">transient failure</text>
  <text class="code small" x="400" y="76" text-anchor="middle">AckRetry</text>
  <rect class="node ghost dashed" x="500" y="40" width="140" height="44" rx="6"/>
  <text class="small muted" x="570" y="67" text-anchor="middle">not resolved</text>

  <text class="small bold" x="16" y="138">Attempt 2</text>
  <text class="small muted" x="16" y="156">resolve: B, C</text>
  <rect class="node ghost dashed" x="160" y="122" width="140" height="44" rx="6"/>
  <text class="small muted" x="230" y="149" text-anchor="middle">not resolved</text>
  <rect class="node green" x="330" y="122" width="140" height="44" rx="6"/>
  <text class="small" x="400" y="149" text-anchor="middle">appended</text>
  <rect class="node green" x="500" y="122" width="140" height="44" rx="6"/>
  <text class="small" x="570" y="149" text-anchor="middle">appended</text>

  <path class="axis" d="M16 190 H664"/>
  <text class="small bold" x="16" y="222">Durable result</text>
  <text class="small muted" x="16" y="240">union of attempts</text>
  <rect class="node accent" x="160" y="204" width="140" height="44" rx="6"/>
  <text class="small" x="230" y="231" text-anchor="middle">done in attempt 1</text>
  <rect class="node accent" x="330" y="204" width="140" height="44" rx="6"/>
  <text class="small" x="400" y="231" text-anchor="middle">done in attempt 2</text>
  <rect class="node accent" x="500" y="204" width="140" height="44" rx="6"/>
  <text class="small" x="570" y="231" text-anchor="middle">done in attempt 2</text>

  <text class="small muted" x="16" y="284">Each id derives from the target stream and occurrence, so a reorder cannot move an id.</text>
</svg>
