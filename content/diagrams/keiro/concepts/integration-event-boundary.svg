<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 384">
  <text class="heading" x="16" y="22">Context ordering</text>
  <rect class="group" x="16" y="32" width="230" height="222" rx="10"/>
  <text class="heading" x="664" y="22" text-anchor="end">Context billing</text>
  <rect class="group" x="434" y="32" width="230" height="222" rx="10"/>

  <rect class="node" x="32" y="48" width="198" height="46" rx="6"/>
  <text class="small" x="131" y="67" text-anchor="middle">private domain event</text>
  <text class="code small" x="131" y="85" text-anchor="middle">RecordedEvent</text>
  <path class="edge" d="M131 94 V114" marker-end="url(#arrow)"/>
  <rect class="node accent" x="32" y="118" width="198" height="46" rx="6"/>
  <text class="small" x="131" y="137" text-anchor="middle">map to the public</text>
  <text class="code small" x="131" y="155" text-anchor="middle">IntegrationEvent</text>
  <path class="edge" d="M131 164 V184" marker-end="url(#arrow)"/>
  <rect class="node" x="32" y="188" width="198" height="46" rx="6"/>
  <text class="code small" x="131" y="207" text-anchor="middle">keiro_outbox</text>
  <text class="small muted" x="131" y="225" text-anchor="middle">publish later</text>

  <rect class="node violet" x="262" y="112" width="156" height="62" rx="8"/>
  <text class="small bold" x="340" y="134" text-anchor="middle">Kafka topic</text>
  <text class="code small" x="340" y="154" text-anchor="middle">billing.orders.v1</text>
  <path class="edge" d="M230 211 H246 V143 H258" marker-end="url(#arrow)"/>
  <path class="edge" d="M418 143 H430 V71 H446" marker-end="url(#arrow)"/>
  <text class="small muted" x="340" y="198" text-anchor="middle">at-least-once</text>
  <text class="small muted" x="340" y="214" text-anchor="middle">delivery</text>

  <rect class="node" x="450" y="48" width="198" height="46" rx="6"/>
  <text class="code small" x="549" y="76" text-anchor="middle">integrationEventFromKafka</text>
  <path class="edge" d="M549 94 V114" marker-end="url(#arrow)"/>
  <rect class="node accent" x="450" y="118" width="198" height="46" rx="6"/>
  <text class="small" x="549" y="137" text-anchor="middle">inbox: dedupe on</text>
  <text class="code small" x="549" y="155" text-anchor="middle">(source, messageId)</text>
  <path class="edge" d="M549 164 V184" marker-end="url(#arrow)"/>
  <rect class="node" x="450" y="188" width="198" height="46" rx="6"/>
  <text class="small" x="549" y="207" text-anchor="middle">local handler</text>
  <text class="small muted" x="549" y="225" text-anchor="middle">effect runs once</text>

  <text class="heading" x="16" y="286">The envelope is the contract</text>
  <rect class="band accent" x="16" y="296" width="648" height="80" rx="8"/>
  <text class="code small bold" x="30" y="318">messageId</text>
  <text class="small" x="112" y="318">stable dedupe key, written into the outbox row</text>
  <text class="code small" x="30" y="342">source · destination · key · eventType · schemaVersion</text>
  <text class="code small" x="30" y="364">payloadBytes</text>
  <text class="small muted" x="130" y="364">bytes, not a typed value</text>
</svg>
