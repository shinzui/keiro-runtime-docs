<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 306">
  <text class="heading" x="16" y="22">1 · Startup</text>
  <rect class="node" x="16" y="32" width="190" height="36" rx="6"/>
  <text class="code small" x="111" y="54" text-anchor="middle">registerReadModel</text>
  <path class="edge" d="M206 50 H240" marker-end="url(#arrow)"/>
  <rect class="node violet" x="244" y="32" width="420" height="36" rx="6"/>
  <text class="code small" x="258" y="54">keiro.keiro_read_models</text>
  <text class="small muted" x="440" y="54">name, version, shapeHash</text>

  <text class="heading" x="16" y="100">2 · Command with an inline projection</text>
  <rect class="group accent" x="16" y="110" width="648" height="72" rx="10"/>
  <text class="small accent" x="652" y="128" text-anchor="end">one transaction</text>
  <rect class="node" x="30" y="132" width="250" height="36" rx="6"/>
  <text class="small" x="155" y="154" text-anchor="middle">append order events to kiroku</text>
  <path class="edge" d="M280 150 H314" marker-end="url(#arrow)"/>
  <rect class="node green" x="318" y="132" width="330" height="36" rx="6"/>
  <text class="code small" x="483" y="154" text-anchor="middle">apply: upsert app_reads.order_summary</text>

  <text class="heading" x="16" y="214">3 · Query</text>
  <rect class="node" x="16" y="224" width="120" height="44" rx="6"/>
  <text class="code small" x="76" y="250" text-anchor="middle">runQuery</text>
  <path class="edge" d="M136 246 H166" marker-end="url(#arrow)"/>
  <rect class="node violet" x="170" y="224" width="230" height="44" rx="6"/>
  <text class="small" x="285" y="242" text-anchor="middle">registry check: registered,</text>
  <text class="small" x="285" y="258" text-anchor="middle">version and hash, Live</text>
  <path class="edge" d="M400 246 H430" marker-end="url(#arrow)"/>
  <rect class="node green" x="434" y="224" width="230" height="44" rx="6"/>
  <text class="small" x="549" y="250" text-anchor="middle">read app_reads.order_summary</text>

  <text class="small muted" x="16" y="298">A failed projection rolls back the append too. An unregistered model fails before the read.</text>
</svg>
