<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330">
  <text class="heading" x="16" y="22">Guard regions for one transition</text>
  <rect class="node amber" x="16" y="36" width="340" height="230" rx="12"/>
  <text class="code small" x="30" y="58">old-guard</text>
  <rect class="node accent" x="150" y="80" width="190" height="170" rx="10"/>
  <text class="code small" x="164" y="102">new-guard</text>
  <text class="small" x="164" y="122">live edge</text>
  <text class="small" x="30" y="190">removed region:</text>
  <text class="code small" x="30" y="208">old ∧ ¬new</text>
  <text class="small amber" x="30" y="228">replay-only twin</text>
  <circle class="dot" cx="210" cy="170" r="5"/>
  <circle class="dot" cx="270" cy="200" r="5"/>
  <circle class="dot" cx="290" cy="150" r="5"/>
  <circle class="dot amber" cx="70" cy="110" r="5"/>
  <circle class="dot amber" cx="100" cy="140" r="5"/>
  <text class="small muted" x="16" y="290">Dots are stored events. Each one still needs</text>
  <text class="small muted" x="16" y="308">an edge whose guard region contains it.</text>

  <text class="heading" x="388" y="22">Two-phase inversion</text>
  <rect class="node" x="388" y="36" width="276" height="34" rx="6"/>
  <text class="small" x="526" y="57" text-anchor="middle">stored event</text>
  <path class="edge" d="M526 70 V88" marker-end="url(#arrow)"/>
  <rect class="node accent" x="388" y="92" width="276" height="40" rx="6"/>
  <text class="small" x="526" y="117" text-anchor="middle">1 · try live edges first</text>
  <path class="edge" d="M526 132 V150" marker-end="url(#arrow)"/>
  <text class="small muted" x="536" y="146">no live edge</text>
  <rect class="node amber" x="388" y="154" width="276" height="40" rx="6"/>
  <text class="small" x="526" y="179" text-anchor="middle">2 · try replay-only edges</text>
  <path class="edge rose" d="M526 194 V212" marker-end="url(#arrow-rose)"/>
  <text class="small muted" x="536" y="208">no edge at all</text>
  <rect class="node rose" x="388" y="216" width="276" height="40" rx="6"/>
  <text class="code small" x="526" y="241" text-anchor="middle">HydrationNoInvertingEdge</text>

  <text class="small muted" x="388" y="290">A replay-only edge never accepts</text>
  <text class="small muted" x="388" y="308">a new command.</text>
</svg>
