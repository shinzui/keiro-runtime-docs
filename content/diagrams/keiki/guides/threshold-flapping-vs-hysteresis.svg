  <rect class="band accent" x="198.6" y="156" width="13.6" height="16"/>
  <rect class="band muted" x="212.2" y="156" width="27.7" height="16"/>
  <rect class="band accent" x="239.9" y="156" width="25.4" height="16"/>
  <rect class="band muted" x="265.3" y="156" width="22.0" height="16"/>
  <rect class="band accent" x="287.3" y="156" width="176.0" height="16"/>
