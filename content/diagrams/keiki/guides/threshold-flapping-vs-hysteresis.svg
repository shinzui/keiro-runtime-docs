  <rect class="band muted" x="540.7" y="156" width="109.3" height="16"/>
  <text class="small" x="650" y="192" text-anchor="end">10 status changes</text>

  <text class="heading" x="20" y="230">Two thresholds: hysteresis</text>
  <path class="axis" d="M100 352 H650"/>
  <path class="axis dashed green" d="M100 288 H650"/>
  <text class="small green" x="16" y="292">upper</text>
  <path class="axis dashed rose" d="M100 308 H650"/>
  <text class="small rose" x="16" y="312">lower</text>
  <path class="edge thick" fill="none" d="M100.0 328 L137.9 318 L175.9 306 L204.3 296 L228.0 302 L251.7 294 L275.4 301 L299.1 295 L327.6 283 L365.5 268 L403.4 270 L441.4 286 L465.1 299 L488.8 294 L512.5 301 L536.2 296 L574.1 313 L612.1 323 L650.0 328"/>
  <text class="small muted" x="16" y="373">status</text>
  <rect class="band muted" x="100.0" y="360" width="215.7" height="16"/>
  <rect class="band accent" x="315.7" y="360" width="247.2" height="16"/>
  <rect class="band muted" x="563.0" y="360" width="87.0" height="16"/>
  <text class="small" x="650" y="396" text-anchor="end">2 status changes</text>
  <text class="small muted" x="100" y="396">Flip up above the upper line. Flip down below the lower line.</text>

  <path class="axis" d="M100 412 H200" marker-end="url(#arrow-muted)"/>
  <text class="small muted" x="208" y="416">time</text>
