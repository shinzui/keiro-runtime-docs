<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 512">
  <text class="code bold" x="20" y="26">loanWorkflow</text>
  <text class="small muted" x="124" y="26">one lockstep composite value</text>
  <rect class="group" x="16" y="38" width="648" height="412" rx="8"/>

  <path class="edge" d="M170 50 V72" marker-end="url(#arrow)"/>
  <text class="code small muted" x="182" y="66">LoanCmd</text>

  <rect class="node accent" x="40" y="76" width="260" height="34" rx="6"/>
  <text class="code" x="170" y="97" text-anchor="middle">loanApplication</text>

  <path class="edge" d="M170 110 V140" marker-end="url(#arrow)"/>
  <text class="code small muted" x="182" y="130">LoanEvent</text>

  <rect class="node violet" x="40" y="144" width="260" height="44" rx="6"/>
  <text class="code small muted" x="170" y="161" text-anchor="middle">lmapMaybeCi</text>
  <text class="code" x="170" y="179" text-anchor="middle">loanEventToSyncInput</text>
  <path class="axis dashed" d="M300 166 H326"/>
  <text class="code small green" x="336" y="161">ApplicationApproved → Just LoanCreatedIn</text>
  <text class="small muted" x="336" y="181">every other LoanEvent → Nothing (dropped)</text>

  <path class="edge" d="M170 188 V218" marker-end="url(#arrow)"/>
  <text class="code small muted" x="182" y="208">SyncInput</text>

  <rect class="node accent" x="40" y="222" width="260" height="34" rx="6"/>
  <text class="code" x="170" y="243" text-anchor="middle">coreBankingSync</text>

  <path class="edge" d="M170 256 V286" marker-end="url(#arrow)"/>
  <text class="code small muted" x="182" y="276">SyncOutput</text>

  <rect class="node violet" x="40" y="290" width="260" height="44" rx="6"/>
  <text class="code small muted" x="170" y="307" text-anchor="middle">lmapMaybeCi</text>
  <text class="code" x="170" y="325" text-anchor="middle">syncOutputToLoanCmd</text>
  <path class="axis dashed" d="M300 312 H326"/>
  <text class="code small green" x="336" y="307">LegacyAssignmentCommanded → Just assignment</text>
  <text class="small muted" x="336" y="327">SyncToLegacyRequested → Nothing (dropped)</text>

  <path class="edge" d="M170 334 V364" marker-end="url(#arrow)"/>
  <text class="code small muted" x="182" y="354">LoanCmd'</text>

  <rect class="node accent" x="40" y="368" width="260" height="34" rx="6"/>
  <text class="code" x="170" y="389" text-anchor="middle">loan</text>

  <path class="edge" d="M170 402 V436" marker-end="url(#arrow)"/>
  <text class="code small muted" x="182" y="424">LoanEvent'</text>

  <text class="small muted" x="336" y="390">Every non-ε composite edge fires</text>
  <text class="small muted" x="336" y="408">all three legs in one step.</text>

  <text class="small muted" x="20" y="476">Vertex</text>
  <text class="code small" x="104" y="476">Composite LoanAppVertex (Composite SyncVertex LoanVertex)</text>
  <text class="small muted" x="20" y="498">Registers</text>
  <text class="code small" x="104" y="498">Append LoanAppRegs (Append SyncRegs LoanRegs)</text>
</svg>
