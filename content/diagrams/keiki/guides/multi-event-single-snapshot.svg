<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 278">
  <text class="heading" x="16" y="32">Before the edge</text>
  <text class="heading" x="250" y="32">One edge body</text>
  <text class="heading" x="520" y="32">After the edge</text>

  <rect class="node" x="16" y="50" width="190" height="132" rx="6"/>
  <text class="code small bold" x="28" y="72">snapshot (regs, ci)</text>
  <text class="code small" x="28" y="100">ci: StartRegistration</text>
  <text class="code small" x="28" y="124">d.email = bob@x</text>
  <text class="code small muted" x="28" y="148">#email: pre-write value</text>

  <rect class="node amber dashed" x="250" y="50" width="226" height="36" rx="6"/>
  <text class="code small" x="262" y="73">slot @"email" .= d.email</text>
  <rect class="node accent" x="250" y="98" width="226" height="36" rx="6"/>
  <text class="code small" x="262" y="121">emit RegistrationStarted</text>
  <rect class="node accent" x="250" y="146" width="226" height="36" rx="6"/>
  <text class="code small" x="262" y="169">emit ConfirmationEmailSent</text>

  <path class="edge accent" d="M206 116 H246" marker-end="url(#arrow-accent)"/>
  <path class="edge accent" d="M206 164 H246" marker-end="url(#arrow-accent)"/>
  <text class="small accent" x="226" y="146" text-anchor="middle">read</text>

  <path class="edge amber" d="M476 68 H516" marker-end="url(#arrow-amber)"/>
  <rect class="node" x="520" y="50" width="144" height="84" rx="6"/>
  <text class="code small" x="532" y="74">#email = bob@x</text>
  <text class="small muted" x="532" y="98">write applied once,</text>
  <text class="small muted" x="532" y="116">seen by the next edge</text>

  <text class="code small" x="363" y="210" text-anchor="middle">output: [RegistrationStarted, ConfirmationEmailSent]</text>
  <text class="small" x="16" y="244">Both emits read the same snapshot. Read each field from the input, d.email.</text>
  <text class="small rose" x="16" y="266">An emit that reads #email gets the pre-write value, not the value written above it.</text>
</svg>
