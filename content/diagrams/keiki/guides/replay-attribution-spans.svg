  <path class="axis" d="M60 108 H600"/>
  <path class="axis" d="M60 102 V114 M240 102 V114 M420 102 V114 M600 102 V114"/>
  <text class="code small muted" x="60" y="130" text-anchor="middle">0</text>
  <text class="code small muted" x="240" y="130" text-anchor="middle">1</text>
  <text class="code small muted" x="420" y="130" text-anchor="middle">2</text>
  <text class="code small muted" x="600" y="130" text-anchor="middle">3</text>

  <text class="heading" x="20" y="166">Trace</text>
  <text class="code small muted" x="660" y="166" text-anchor="end">replaySuccessTrace :: [ReplayAttribution s]</text>
  <rect class="node accent" x="64" y="178" width="352" height="34" rx="5"/>
