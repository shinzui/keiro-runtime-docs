  <text class="code small muted" x="330" y="50" text-anchor="middle">1</text>
  <text class="code small muted" x="510" y="50" text-anchor="middle">2</text>
  <rect class="node" x="64" y="58" width="172" height="34" rx="5"/>
  <text class="code small" x="150" y="79" text-anchor="middle">RegistrationStarted</text>
  <rect class="node" x="244" y="58" width="172" height="34" rx="5"/>
