<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372">
  <rect class="group" x="16" y="20" width="648" height="314" rx="10"/>
  <text class="code bold" x="32" y="46">VertexBuilder</text>
  <text class="small muted" x="648" y="46" text-anchor="end">plain Monad, Prelude.do, one entry per from</text>
  <text class="code small" x="32" y="72">B.buildTransducer Empty emptyOrderRegs isFinal do</text>

  <rect class="group violet" x="36" y="88" width="608" height="230" rx="8"/>
  <text class="code bold violet" x="52" y="114">EdgeListBuilder</text>
  <text class="small muted" x="628" y="114" text-anchor="end">plain Monad, Prelude.do, edges of one vertex</text>
  <text class="code small" x="52" y="140">B.from OpenWithItems do</text>

  <rect class="node accent" x="56" y="156" width="568" height="146" rx="6"/>
  <text class="code bold accent" x="72" y="182">EdgeBuilder</text>
  <text class="small muted" x="608" y="182" text-anchor="end">indexed, B.do, one edge body</text>
  <text class="code small" x="72" y="208">B.onCmd inCtorAddItem $ \d -&gt; B.do</text>
  <text class="code small" x="96" y="232">B.slot @"itemCount" .= TApp1 (+ 1) #itemCount</text>
  <text class="code small" x="96" y="256">B.emit wireItemAdded ItemAddedTermFields { … }</text>
  <text class="code small" x="96" y="280">B.goto OpenWithItems</text>
  <text class="small accent" x="608" y="232" text-anchor="end">adds itemCount to w</text>

  <text class="small muted" x="16" y="358">The index w lists the slots written so far. A second write to one slot fails to compile.</text>
</svg>
