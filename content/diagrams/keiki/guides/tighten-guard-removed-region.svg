<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290">
  <text class="heading" x="20" y="24">Before the change</text>
  <text class="small muted" x="20" y="57">old</text>
  <rect class="band muted" x="80" y="38" width="450" height="30" rx="4"/>
  <text class="code small" x="92" y="58">amount ≤ 50000</text>

  <text class="heading" x="20" y="100">After the change</text>
  <text class="small muted" x="20" y="133">live</text>
  <rect class="band green" x="80" y="114" width="90" height="30" rx="4"/>
  <text class="code small" x="125" y="134" text-anchor="middle">≤ 10000</text>
  <text class="small muted" x="182" y="134">all new commands</text>

  <text class="small muted" x="20" y="171">twin</text>
  <rect class="band amber" x="170" y="152" width="360" height="30" rx="4"/>
  <text class="code small" x="182" y="172">replayOnly: old guard ∧ ¬ new guard</text>
  <text class="small muted" x="575" y="172" text-anchor="middle">no edge</text>

  <path class="axis dashed" d="M170 76 V210"/>
  <path class="axis dashed" d="M530 76 V210"/>
  <path class="axis" d="M80 210 H640" marker-end="url(#arrow-muted)"/>
  <text class="code small muted" x="80" y="228" text-anchor="middle">0</text>
  <text class="code small muted" x="170" y="228" text-anchor="middle">10000</text>
  <text class="code small muted" x="530" y="228" text-anchor="middle">50000</text>
  <text class="code small muted" x="640" y="228" text-anchor="end">d.amount</text>

  <text class="small" x="20" y="258">The amber band is the removed region. New commands there are rejected.</text>
  <text class="small" x="20" y="278">Stored events from that region still invert through the replay-only twin.</text>
</svg>
