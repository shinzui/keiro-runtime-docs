<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330">
  <text class="heading" x="20" y="28">Input</text>
  <text class="heading" x="220" y="28">Outgoing edges</text>
  <text class="code small muted" x="460" y="28" text-anchor="end">edgesOut s</text>
  <text class="heading" x="500" y="28">step result</text>

  <!-- inputs -->
  <rect class="node" x="20" y="92" width="160" height="36" rx="6"/>
  <text class="code small" x="100" y="114" text-anchor="middle">(s, RegFile rs)</text>
  <rect class="node" x="20" y="148" width="160" height="36" rx="6"/>
  <text class="code small" x="100" y="170" text-anchor="middle">ci (command)</text>
  <path class="edge" d="M180 110 H216" marker-end="url(#arrow)"/>
  <path class="edge" d="M180 166 H198 V130 H216" marker-end="url(#arrow)"/>
  <text class="small muted" x="20" y="214">The guard reads the</text>
  <text class="small muted" x="20" y="230">registers and the command.</text>

  <!-- other edges -->
  <rect class="node ghost" x="220" y="42" width="240" height="30" rx="6"/>
  <text class="small muted" x="232" y="61">Edge · guard is false</text>
  <rect class="node ghost" x="220" y="252" width="240" height="30" rx="6"/>
  <text class="small muted" x="232" y="271">Edge · guard is false</text>

  <!-- firing edge -->
  <rect class="node accent" x="220" y="84" width="240" height="156" rx="6"/>
  <text class="small bold accent" x="232" y="103">Edge · guard holds</text>
  <path class="axis" d="M220 112 H460"/>
  <text class="code small" x="232" y="132">guard</text>
  <text class="code small muted" x="300" y="132">phi</text>
  <text class="code small" x="232" y="162">update</text>
  <text class="code small muted" x="300" y="162">Update rs w ci</text>
  <text class="code small" x="232" y="192">output</text>
  <text class="code small muted" x="300" y="192">[OutTerm rs ci co]</text>
  <text class="code small" x="232" y="222">target</text>
  <text class="code small muted" x="300" y="222">s</text>

  <!-- result -->
  <rect class="group accent" x="490" y="84" width="174" height="156" rx="8"/>
  <text class="code small" x="577" y="106" text-anchor="middle">(s, RegFile rs, [co])</text>
  <rect class="node" x="502" y="146" width="150" height="26" rx="5"/>
  <text class="small" x="577" y="163" text-anchor="middle">registers after update</text>
  <rect class="node" x="502" y="176" width="150" height="26" rx="5"/>
  <text class="small" x="577" y="193" text-anchor="middle">events: 0, 1, or many</text>
  <rect class="node" x="502" y="206" width="150" height="26" rx="5"/>
  <text class="small" x="577" y="223" text-anchor="middle">next vertex</text>
  <path class="edge" d="M410 158 H498" marker-end="url(#arrow)"/>
  <path class="edge" d="M440 188 H498" marker-end="url(#arrow)"/>
  <path class="edge" d="M320 218 H498" marker-end="url(#arrow)"/>

  <text class="small muted" x="20" y="306">Every output term reads the registers and command from before the update.</text>
  <text class="small rose" x="20" y="324">No edge whose guard holds: step returns Nothing, and stepEither returns a StepFailure.</text>
</svg>
