<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 616">
  <!-- compose -->
  <text class="code bold" x="20" y="30">compose t1 t2</text>
  <text class="small muted" x="664" y="30" text-anchor="end">sequential: the t1 output alphabet is the t2 input alphabet</text>
  <rect class="group accent" x="160" y="44" width="360" height="72" rx="8"/>
  <rect class="node" x="196" y="58" width="110" height="44" rx="6"/>
  <text class="code" x="251" y="76" text-anchor="middle">t1</text>
  <text class="small muted" x="251" y="93" text-anchor="middle">s1 · rs1</text>
  <rect class="node" x="374" y="58" width="110" height="44" rx="6"/>
  <text class="code" x="429" y="76" text-anchor="middle">t2</text>
  <text class="small muted" x="429" y="93" text-anchor="middle">s2 · rs2</text>
  <path class="edge" d="M20 80 H192" marker-end="url(#arrow)"/>
  <text class="code small" x="88" y="72" text-anchor="middle">ci1</text>
  <path class="edge" d="M306 80 H370" marker-end="url(#arrow)"/>
  <text class="code small" x="338" y="72" text-anchor="middle">mid</text>
  <path class="edge" d="M484 80 H660" marker-end="url(#arrow)"/>
  <text class="code small" x="592" y="72" text-anchor="middle">co</text>
  <text class="code small" x="20" y="140">vertex: Composite s1 s2 · registers: Append rs1 rs2</text>
  <text class="small muted" x="20" y="158">One composite edge fires a t1 edge and a t2 edge in lockstep.</text>

  <path class="axis" d="M20 180 H660"/>

  <!-- alternative -->
  <text class="code bold" x="20" y="212">alternative t1 t2</text>
  <text class="small muted" x="664" y="212" text-anchor="end">disjoint inputs, two arms with independent state</text>
  <rect class="group accent" x="160" y="226" width="360" height="128" rx="8"/>
  <rect class="node" x="285" y="238" width="110" height="44" rx="6"/>
  <text class="code" x="340" y="256" text-anchor="middle">t1</text>
  <text class="small muted" x="340" y="273" text-anchor="middle">s1 · rs1</text>
  <rect class="node" x="285" y="298" width="110" height="44" rx="6"/>
  <text class="code" x="340" y="316" text-anchor="middle">t2</text>
  <text class="small muted" x="340" y="333" text-anchor="middle">s2 · rs2</text>
  <path class="edge" d="M20 290 H196"/>
  <text class="code small" x="88" y="282" text-anchor="middle">Either ci1 ci2</text>
  <circle class="dot" cx="196" cy="290" r="3.5"/>
  <path class="edge" d="M196 290 V260 H281" marker-end="url(#arrow)"/>
  <path class="edge" d="M196 290 V320 H281" marker-end="url(#arrow)"/>
  <text class="code small" x="240" y="253" text-anchor="middle">Left</text>
  <text class="code small" x="240" y="313" text-anchor="middle">Right</text>
  <path class="edge" d="M395 260 H484 V290"/>
  <path class="edge" d="M395 320 H484 V290"/>
  <circle class="dot" cx="484" cy="290" r="3.5"/>
  <text class="code small" x="440" y="253" text-anchor="middle">Left</text>
  <text class="code small" x="440" y="313" text-anchor="middle">Right</text>
  <path class="edge" d="M484 290 H660" marker-end="url(#arrow)"/>
  <text class="code small" x="592" y="282" text-anchor="middle">Either co1 co2</text>
  <text class="code small" x="20" y="378">vertex: Composite s1 s2 (product) · registers: Append rs1 rs2</text>
  <text class="small muted" x="20" y="396">A Left input advances only s1. A Right input advances only s2.</text>

  <path class="axis" d="M20 418 H660"/>

  <!-- feedback1 -->
  <text class="code bold" x="20" y="450">feedback1 t f</text>
  <text class="small muted" x="664" y="450" text-anchor="end">= compose t (compose f t), a finite two-copy cascade</text>
  <rect class="group accent" x="120" y="464" width="440" height="96" rx="8"/>
  <rect class="group violet" x="282" y="472" width="268" height="80" rx="6"/>
  <text class="small violet" x="416" y="544" text-anchor="middle">compose f t</text>
  <rect class="node" x="140" y="480" width="100" height="44" rx="6"/>
  <text class="code" x="190" y="498" text-anchor="middle">t</text>
  <text class="small muted" x="190" y="515" text-anchor="middle">outer · s1</text>
  <rect class="node violet" x="296" y="480" width="100" height="44" rx="6"/>
  <text class="code" x="346" y="498" text-anchor="middle">f</text>
  <text class="small muted" x="346" y="515" text-anchor="middle">policy · s2</text>
  <rect class="node" x="436" y="480" width="100" height="44" rx="6"/>
  <text class="code" x="486" y="498" text-anchor="middle">t</text>
  <text class="small muted" x="486" y="515" text-anchor="middle">inner · s1</text>
  <path class="edge" d="M20 502 H136" marker-end="url(#arrow)"/>
  <text class="code small" x="70" y="494" text-anchor="middle">ci</text>
  <path class="edge" d="M240 502 H292" marker-end="url(#arrow)"/>
  <text class="code small halo" x="262" y="494" text-anchor="middle">co</text>
  <path class="edge" d="M396 502 H432" marker-end="url(#arrow)"/>
  <text class="code small" x="414" y="494" text-anchor="middle">ci</text>
  <path class="edge" d="M536 502 H660" marker-end="url(#arrow)"/>
  <text class="code small" x="610" y="494" text-anchor="middle">co</text>
  <text class="code small" x="20" y="584">vertex: Composite s1 (Composite s2 s1) · registers: Append rs1 (Append rs2 rs1)</text>
  <text class="small muted" x="20" y="602">The inner copy steps from its own state. Nothing flows back into the outer copy.</text>
</svg>
