<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <text class="small muted" x="16" y="28">Each edge label: the command above the line, the event below it.</text>
  <!-- initial marker -->
  <circle class="dot" cx="81" cy="112" r="5"/>
  <path class="edge" d="M81 117 V146" marker-end="url(#arrow)"/>

  <!-- edges -->
  <path class="edge" d="M146 168 H296" marker-end="url(#arrow)"/>
  <text class="code small violet" x="221" y="160" text-anchor="middle">StartRegistration</text>
  <text class="code small accent" x="221" y="184" text-anchor="middle">RegistrationStarted</text>

  <path class="edge" d="M410 150 V68 H556" marker-end="url(#arrow)"/>
  <text class="code small violet" x="483" y="60" text-anchor="middle">ConfirmAccount</text>
  <text class="code small accent" x="483" y="84" text-anchor="middle">AccountConfirmed</text>

  <path class="edge" d="M330 186 V214 H370 V190" marker-end="url(#arrow)"/>
  <text class="code small violet" x="350" y="232" text-anchor="middle">ResendConfirmation</text>
  <text class="code small accent" x="350" y="248" text-anchor="middle">ConfirmationResent</text>

  <path class="edge dashed" d="M430 186 V268 H556" marker-end="url(#arrow)"/>
  <text class="code small violet" x="493" y="260" text-anchor="middle">FulfillGDPRRequest</text>
  <text class="code muted" x="493" y="286" text-anchor="middle">ε</text>

  <path class="edge" d="M612 86 V246" marker-end="url(#arrow)"/>
  <text class="code small violet" x="602" y="160" text-anchor="end">FulfillGDPRRequest</text>
  <text class="code small accent" x="602" y="176" text-anchor="end">AccountDeleted</text>

  <!-- vertices -->
  <rect class="node" x="16" y="150" width="130" height="36" rx="6"/>
  <text class="code small" x="81" y="172" text-anchor="middle">PotentialCustomer</text>
  <rect class="node" x="300" y="150" width="150" height="36" rx="6"/>
  <text class="code small" x="375" y="172" text-anchor="middle">RequiresConfirmation</text>
  <rect class="node" x="560" y="50" width="104" height="36" rx="6"/>
  <text class="code small" x="612" y="72" text-anchor="middle">Confirmed</text>
  <rect class="node green" x="560" y="250" width="104" height="36" rx="6"/>
  <text class="code small" x="612" y="272" text-anchor="middle">Deleted</text>
  <text class="small green" x="612" y="304" text-anchor="middle">final</text>

  <!-- legend -->
  <path class="axis" d="M16 326 H664"/>
  <text class="code violet" x="20" y="352">π₁</text>
  <text class="small" x="48" y="352">keeps only the command labels. Its language is the permitted command sequences.</text>
  <text class="code accent" x="20" y="374">π₂</text>
  <text class="small" x="48" y="374">keeps only the event labels. Its transition function is evolve.</text>
  <text class="small muted" x="48" y="394">The ε edge carries no event, so π₂ has no edge from RequiresConfirmation to Deleted.</text>
</svg>
