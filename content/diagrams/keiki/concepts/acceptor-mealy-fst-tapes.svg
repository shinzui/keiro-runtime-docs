<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440">
  <!-- DFA -->
  <text class="title" x="20" y="36">Acceptor (DFA)</text>
  <text class="small muted" x="20" y="54">no output tape</text>
  <text class="small muted" x="160" y="44" text-anchor="end">in</text>
  <rect class="node" x="170" y="24" width="150" height="30" rx="3"/>
  <text class="code" x="245" y="44" text-anchor="middle">a</text>
  <rect class="node" x="320" y="24" width="150" height="30" rx="3"/>
  <text class="code" x="395" y="44" text-anchor="middle">a</text>
  <text class="code small muted" x="170" y="76" text-anchor="middle">Even</text>
  <text class="code small muted" x="320" y="76" text-anchor="middle">Odd</text>
  <text class="code small muted" x="470" y="76" text-anchor="middle">Even</text>
  <text class="small green bold" x="496" y="44">accept</text>
  <text class="small muted" x="496" y="62">ends in an accepting state</text>

  <path class="axis" d="M20 98 H660"/>

  <!-- Mealy -->
  <text class="title" x="20" y="132">Mealy machine</text>
  <text class="small muted" x="20" y="150">total: exactly one</text>
  <text class="small muted" x="20" y="166">output per input</text>
  <text class="small muted" x="160" y="140" text-anchor="end">in</text>
  <rect class="node" x="170" y="120" width="150" height="30" rx="3"/>
  <text class="code" x="245" y="140" text-anchor="middle">x1</text>
  <rect class="node" x="320" y="120" width="150" height="30" rx="3"/>
  <text class="code" x="395" y="140" text-anchor="middle">x2</text>
  <rect class="node" x="470" y="120" width="150" height="30" rx="3"/>
  <text class="code" x="545" y="140" text-anchor="middle">x3</text>
  <path class="edge" d="M245 150 V170" marker-end="url(#arrow)"/>
  <path class="edge" d="M395 150 V170" marker-end="url(#arrow)"/>
  <path class="edge" d="M545 150 V170" marker-end="url(#arrow)"/>
  <text class="small muted" x="160" y="194" text-anchor="end">out</text>
  <rect class="node accent" x="170" y="174" width="150" height="30" rx="3"/>
  <text class="code" x="245" y="194" text-anchor="middle">y1</text>
  <rect class="node accent" x="320" y="174" width="150" height="30" rx="3"/>
  <text class="code" x="395" y="194" text-anchor="middle">y2</text>
  <rect class="node accent" x="470" y="174" width="150" height="30" rx="3"/>
  <text class="code" x="545" y="194" text-anchor="middle">y3</text>
  <text class="small muted" x="170" y="226">Every cell is filled. No input is refused. No state is final.</text>

  <path class="axis" d="M20 244 H660"/>

  <!-- FST -->
  <text class="title" x="20" y="278">Finite-state</text>
  <text class="title" x="20" y="296">transducer</text>
  <text class="small muted" x="20" y="314">partial, ε-output,</text>
  <text class="small muted" x="20" y="330">final states</text>
  <text class="small muted" x="160" y="286" text-anchor="end">in</text>
  <rect class="node" x="170" y="266" width="150" height="30" rx="3"/>
  <text class="code small" x="245" y="285" text-anchor="middle">StartRegistration</text>
  <rect class="node" x="320" y="266" width="150" height="30" rx="3"/>
  <text class="code small" x="395" y="285" text-anchor="middle">ResendConfirmation</text>
  <rect class="node" x="470" y="266" width="150" height="30" rx="3"/>
  <text class="code small" x="545" y="285" text-anchor="middle">FulfillGDPRRequest</text>
  <path class="edge" d="M245 296 V316" marker-end="url(#arrow)"/>
  <path class="edge" d="M395 296 V316" marker-end="url(#arrow)"/>
  <path class="edge dashed muted" d="M545 296 V316" marker-end="url(#arrow)"/>
  <text class="small muted" x="160" y="340" text-anchor="end">out</text>
  <rect class="node accent" x="170" y="320" width="150" height="30" rx="3"/>
  <text class="code small" x="245" y="339" text-anchor="middle">RegistrationStarted</text>
  <rect class="node accent" x="320" y="320" width="150" height="30" rx="3"/>
  <text class="code small" x="395" y="339" text-anchor="middle">ConfirmationResent</text>
  <rect class="node ghost" x="470" y="320" width="150" height="30" rx="3"/>
  <text class="code muted" x="545" y="340" text-anchor="middle">ε</text>
  <text class="code small muted" x="170" y="370" text-anchor="middle">PotentialCustomer</text>
  <text class="code small muted" x="320" y="370" text-anchor="middle">RequiresConfirmation</text>
  <text class="code small muted" x="470" y="370" text-anchor="middle">RequiresConfirmation</text>
  <text class="code small green" x="620" y="370" text-anchor="middle">Deleted (final)</text>
  <rect class="node rose dashed" x="170" y="392" width="150" height="30" rx="3"/>
  <text class="code small" x="245" y="411" text-anchor="middle">ConfirmAccount</text>
  <path class="edge rose" d="M320 407 H342" marker-end="url(#arrow-rose)"/>
  <text class="small rose" x="350" y="404">no edge from PotentialCustomer:</text>
  <text class="small rose" x="350" y="420">δ returns Nothing, the command is rejected</text>
</svg>
