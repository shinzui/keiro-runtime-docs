<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <text class="heading" x="20" y="28">Register reads share one variable</text>
  <rect class="band" x="16" y="40" width="648" height="144" rx="6"/>
  <rect class="node" x="40" y="56" width="150" height="34" rx="5"/>
  <text class="code" x="115" y="78" text-anchor="middle">proj #x</text>
  <rect class="node" x="40" y="132" width="150" height="34" rx="5"/>
  <text class="code" x="115" y="154" text-anchor="middle">proj #x</text>
  <path class="edge accent" d="M192 73 H256 V104 H322" marker-end="url(#arrow-accent)"/>
  <path class="edge accent" d="M192 149 H256 V118 H322" marker-end="url(#arrow-accent)"/>
  <rect class="node accent" x="328" y="94" width="130" height="34" rx="5"/>
  <text class="code accent" x="393" y="116" text-anchor="middle">reg/x</text>
  <text class="small muted" x="393" y="148" text-anchor="middle">key RegVar x, cached</text>
  <text class="small green" x="484" y="106">x /= x is unsat.</text>
  <text class="small green" x="484" y="126">The equality is valid.</text>

  <text class="heading" x="20" y="216">Opaque applications get fresh variables</text>
  <rect class="band" x="16" y="228" width="648" height="136" rx="6"/>
  <rect class="node" x="40" y="244" width="150" height="34" rx="5"/>
  <text class="code" x="115" y="266" text-anchor="middle">TApp1 f t</text>
  <rect class="node" x="40" y="314" width="150" height="34" rx="5"/>
  <text class="code" x="115" y="336" text-anchor="middle">TApp1 f t</text>
  <path class="edge amber" d="M192 261 H322" marker-end="url(#arrow-amber)"/>
  <path class="edge amber" d="M192 331 H322" marker-end="url(#arrow-amber)"/>
  <rect class="node amber" x="328" y="244" width="130" height="34" rx="5"/>
  <text class="code amber" x="393" y="266" text-anchor="middle">app1</text>
  <rect class="node amber" x="328" y="314" width="130" height="34" rx="5"/>
  <text class="code amber" x="393" y="336" text-anchor="middle">app1</text>
  <text class="small muted" x="393" y="301" text-anchor="middle">fresh, not cached</text>
  <text class="small rose" x="484" y="290">The two values can differ.</text>
  <text class="small rose" x="484" y="310">The guard is under-verified.</text>
</svg>
