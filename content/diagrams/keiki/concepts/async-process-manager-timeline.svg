<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520">
  <text class="heading" x="16" y="24">Runtime drives each transducer separately · time runs down</text>
  <rect class="band" x="12" y="36" width="210" height="388" rx="6"/>
  <rect class="band" x="235" y="36" width="210" height="388" rx="6"/>
  <rect class="band" x="458" y="36" width="210" height="388" rx="6"/>
  <text class="code bold" x="117" y="58" text-anchor="middle">loanApplication</text>
  <text class="code bold" x="340" y="58" text-anchor="middle">coreBankingSync</text>
  <text class="code bold" x="563" y="58" text-anchor="middle">loan</text>

  <!-- step 1: loanApplication -->
  <rect class="node" x="20" y="74" width="194" height="48" rx="6"/>
  <text class="code small" x="117" y="94" text-anchor="middle">UnderReview → Approved</text>
  <text class="code small accent" x="117" y="112" text-anchor="middle">ApplicationApproved</text>

  <!-- adapter 1 -->
  <path class="edge accent" d="M40 122 V191 H239" marker-end="url(#arrow-accent)"/>
  <text class="code small" x="52" y="182">loanEventToSyncInput</text>
  <text class="code small muted" x="52" y="208">LoanCreatedIn</text>

  <!-- step 2: coreBankingSync -->
  <rect class="node" x="243" y="167" width="194" height="48" rx="6"/>
  <text class="code small" x="340" y="187" text-anchor="middle">SyncIdle → SyncRequested</text>
  <text class="code small accent" x="340" y="205" text-anchor="middle">SyncToLegacyRequested</text>

  <!-- loan: CreateLoan -->
  <rect class="node" x="466" y="167" width="194" height="48" rx="6"/>
  <text class="small muted" x="563" y="156" text-anchor="middle">runtime issues CreateLoan</text>
  <text class="code small" x="563" y="187" text-anchor="middle">LoanInitial → LoanAwaiting</text>
  <text class="code small accent" x="563" y="205" text-anchor="middle">LoanCreated</text>

  <!-- later: legacy callback -->
  <rect class="node ghost dashed" x="20" y="262" width="194" height="48" rx="6"/>
  <text class="small muted" x="117" y="282" text-anchor="middle">later: the legacy system replies</text>
  <text class="code small" x="117" y="300" text-anchor="middle">LegacyCallbackReceivedIn</text>
  <path class="edge dashed" d="M214 286 H239" marker-end="url(#arrow)"/>

  <!-- step 3: coreBankingSync -->
  <rect class="node" x="243" y="262" width="194" height="48" rx="6"/>
  <text class="code small" x="340" y="282" text-anchor="middle">SyncRequested → SyncSettled</text>
  <text class="code small accent" x="340" y="300" text-anchor="middle">LegacyAssignmentCommanded</text>

  <!-- adapter 2 -->
  <path class="edge accent" d="M263 310 V381 H462" marker-end="url(#arrow-accent)"/>
  <text class="code small" x="275" y="372">syncOutputToLoanCmd</text>
  <text class="code small muted" x="275" y="398">AssignLegacyLoanId</text>

  <!-- step 4: loan -->
  <rect class="node" x="466" y="357" width="194" height="48" rx="6"/>
  <text class="code small" x="563" y="377" text-anchor="middle">LoanAwaiting → LoanLinked</text>
  <text class="code small accent" x="563" y="395" text-anchor="middle">LegacyLoanIdAssigned</text>

  <text class="small muted" x="16" y="446">Each solid box is one separate step. Top line: vertex change. Bottom line: emitted output.</text>

  <rect class="node rose dashed" x="12" y="462" width="656" height="44" rx="6"/>
  <text class="small" x="28" y="481">The lockstep loanWorkflow composite needs every leg to fire in one step.</text>
  <text class="small" x="28" y="498">No single command does that, so its composite edges almost never fire.</text>
</svg>
