<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 288">
  <text class="heading" x="20" y="28">Vertex Pending, input Submit</text>
  <rect class="band" x="16" y="44" width="648" height="56" rx="6"/>
  <text class="title" x="30" y="66">Process</text>
  <text class="code small muted" x="30" y="86">submittedAt &lt;= deadline</text>
  <path class="edge thick accent" d="M200 72 H340"/>
  <path class="edge thick accent dashed" d="M180 72 H200"/>
  <circle class="dot accent" cx="340" cy="72" r="6"/>
  <rect class="band" x="16" y="112" width="648" height="56" rx="6"/>
  <text class="title" x="30" y="134">Reject</text>
  <text class="code small muted" x="30" y="154">submittedAt &gt;= deadline</text>
  <path class="edge thick violet" d="M340 140 H620"/>
  <path class="edge thick violet dashed" d="M620 140 H640"/>
  <circle class="dot violet" cx="340" cy="140" r="6"/>
  <path class="axis rose dashed" d="M340 52 V214"/>
  <path class="axis" d="M180 214 H640" marker-end="url(#arrow)"/>
  <text class="code small muted" x="640" y="236" text-anchor="end">submittedAt</text>
  <circle class="dot rose" cx="340" cy="214" r="7"/>
  <text class="code small" x="340" y="240" text-anchor="middle">deadline</text>
  <text class="small rose" x="340" y="270" text-anchor="middle">At submittedAt = deadline both guards are true: two edges can fire.</text>
</svg>
