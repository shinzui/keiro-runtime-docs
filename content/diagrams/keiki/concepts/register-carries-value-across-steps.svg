<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330">
  <!-- step boundaries -->
  <path class="axis dashed" d="M207 74 V240"/>
  <path class="axis dashed" d="M479 74 V240"/>

  <!-- commands -->
  <rect class="node violet" x="122" y="24" width="170" height="50" rx="6"/>
  <text class="code small" x="207" y="45" text-anchor="middle">StartRegistration</text>
  <text class="code small muted" x="207" y="63" text-anchor="middle">alice@x.io Z9F4 t0</text>
  <rect class="node violet" x="394" y="24" width="170" height="50" rx="6"/>
  <text class="code small" x="479" y="45" text-anchor="middle">ConfirmAccount</text>
  <text class="code small muted" x="479" y="63" text-anchor="middle">Z9F4 t1</text>

  <!-- vertices -->
  <rect class="node" x="36" y="96" width="140" height="34" rx="6"/>
  <text class="code small" x="106" y="117" text-anchor="middle">PotentialCustomer</text>
  <rect class="node" x="263" y="96" width="160" height="34" rx="6"/>
  <text class="code small" x="343" y="117" text-anchor="middle">RequiresConfirmation</text>
  <rect class="node" x="516" y="96" width="110" height="34" rx="6"/>
  <text class="code small" x="571" y="117" text-anchor="middle">Confirmed</text>
  <path class="edge" d="M176 113 H259" marker-end="url(#arrow)"/>
  <path class="edge" d="M423 113 H512" marker-end="url(#arrow)"/>

  <!-- registers -->
  <text class="heading" x="20" y="162">Register file</text>
  <text class="code small" x="20" y="191">email</text>
  <rect class="node amber dashed" x="104" y="172" width="99" height="28" rx="4"/>
  <text class="small amber" x="153" y="191" text-anchor="middle">uninit</text>
  <rect class="node accent" x="211" y="172" width="264" height="28" rx="4"/>
  <text class="code small" x="343" y="191" text-anchor="middle">alice@x.io</text>
  <rect class="node accent" x="483" y="172" width="181" height="28" rx="4"/>
  <text class="code small" x="573" y="191" text-anchor="middle">alice@x.io</text>

  <text class="code small" x="20" y="225">confirmCode</text>
  <rect class="node amber dashed" x="104" y="206" width="99" height="28" rx="4"/>
  <text class="small amber" x="153" y="225" text-anchor="middle">uninit</text>
  <rect class="node accent" x="211" y="206" width="264" height="28" rx="4"/>
  <text class="code small" x="343" y="225" text-anchor="middle">Z9F4</text>
  <rect class="node accent" x="483" y="206" width="181" height="28" rx="4"/>
  <text class="code small" x="573" y="225" text-anchor="middle">Z9F4</text>

  <!-- guard reads the register -->
  <path class="edge green" d="M420 234 V258" marker-end="url(#arrow-green)"/>
  <rect class="node green" x="300" y="262" width="364" height="30" rx="6"/>
  <text class="code small" x="482" y="281" text-anchor="middle">guard: requireEq d.confirmCode #confirmCode</text>
  <text class="small muted" x="20" y="316">StartRegistration writes Z9F4 into a register. The ConfirmAccount guard reads it one step later.</text>
</svg>
