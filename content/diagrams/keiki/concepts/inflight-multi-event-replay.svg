<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <!-- carrier states -->
  <rect class="node" x="20" y="36" width="260" height="36" rx="6"/>
  <text class="code small" x="150" y="58" text-anchor="middle">Settled PotentialCustomer</text>

  <rect class="node amber" x="20" y="154" width="260" height="52" rx="6"/>
  <text class="code small" x="150" y="176" text-anchor="middle">InFlight RequiresConfirmation</text>
  <text class="code small amber" x="150" y="194" text-anchor="middle">[ConfirmationEmailSent]</text>

  <rect class="node green" x="20" y="288" width="260" height="36" rx="6"/>
  <text class="code small" x="150" y="310" text-anchor="middle">Settled RequiresConfirmation</text>

  <!-- event 0 -->
  <path class="edge" d="M150 72 V150" marker-end="url(#arrow)"/>
  <text class="small muted" x="166" y="90">event 0</text>
  <rect class="node accent" x="166" y="96" width="196" height="28" rx="4"/>
  <text class="code small" x="264" y="114" text-anchor="middle">RegistrationStarted</text>
  <text class="small muted" x="378" y="106">The head inverts to StartRegistration.</text>
  <text class="small muted" x="378" y="122">The update runs. The tail is queued.</text>

  <!-- truncation branch -->
  <path class="edge dashed amber" d="M280 180 H370" marker-end="url(#arrow-amber)"/>
  <text class="small amber bold" x="378" y="166">If the log stops here:</text>
  <text class="small" x="378" y="184">replayEvents returns this carrier to resume.</text>
  <text class="small" x="378" y="202">reconstituteEither fails with ReplayLogTruncated.</text>

  <!-- event 1 -->
  <path class="edge" d="M150 206 V284" marker-end="url(#arrow)"/>
  <text class="small muted" x="166" y="228">event 1</text>
  <rect class="node accent" x="166" y="234" width="196" height="28" rx="4"/>
  <text class="code small" x="264" y="252" text-anchor="middle">ConfirmationEmailSent</text>
  <text class="small muted" x="378" y="244">It equals the queue head. The queue empties.</text>
  <text class="small muted" x="378" y="260">No register update runs.</text>
  <text class="small rose" x="378" y="278">Any other event: ReplayQueueMismatch.</text>
</svg>
