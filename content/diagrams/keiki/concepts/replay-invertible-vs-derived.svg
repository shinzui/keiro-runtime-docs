<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <text class="heading" x="20" y="28">Stored field</text>
  <text class="heading" x="212" y="28">Output term</text>
  <text class="heading" x="424" y="28">What replay does</text>

  <rect class="node" x="20" y="44" width="180" height="48" rx="5"/>
  <text class="code" x="110" y="73" text-anchor="middle">quantity = 3</text>
  <rect class="node violet" x="212" y="44" width="200" height="48" rx="5"/>
  <text class="code" x="312" y="73" text-anchor="middle">TInpCtorField</text>
  <text class="small" x="424" y="63">Keeps the observed value.</text>
  <text class="small muted" x="424" y="82">Supplies a command field.</text>

  <rect class="node" x="20" y="100" width="180" height="48" rx="5"/>
  <text class="code" x="110" y="129" text-anchor="middle">unitPrice = 250</text>
  <rect class="node violet" x="212" y="100" width="200" height="48" rx="5"/>
  <text class="code" x="312" y="129" text-anchor="middle">TInpCtorField</text>
  <text class="small" x="424" y="119">Keeps the observed value.</text>
  <text class="small muted" x="424" y="138">Supplies a command field.</text>

  <rect class="node" x="20" y="156" width="180" height="48" rx="5"/>
  <text class="code" x="110" y="185" text-anchor="middle">balance = 900</text>
  <rect class="node" x="212" y="156" width="200" height="48" rx="5"/>
  <text class="code" x="312" y="185" text-anchor="middle">TReg #balance</text>
  <text class="small" x="424" y="175">Keeps the observed value.</text>
  <text class="small muted" x="424" y="194">Not checked against registers.</text>

  <path class="axis dashed" d="M20 220 H664"/>

  <rect class="node" x="20" y="236" width="180" height="48" rx="5"/>
  <text class="code" x="110" y="265" text-anchor="middle">lineTotal = 750</text>
  <rect class="node amber" x="212" y="236" width="200" height="48" rx="5"/>
  <text class="code small" x="312" y="256" text-anchor="middle">TArith</text>
  <text class="code small" x="312" y="273" text-anchor="middle">quantity * unitPrice</text>
  <text class="small" x="424" y="255">Recomputes from the command.</text>
  <text class="small muted" x="424" y="274">Compares with the stored value.</text>

  <rect class="band rose" x="16" y="304" width="648" height="36" rx="6"/>
  <text class="small rose" x="340" y="327" text-anchor="middle">Stored lineTotal = 999: replay recomputes 750 and rejects the event.</text>
  <rect class="band muted" x="16" y="348" width="648" height="36" rx="6"/>
  <text class="small muted" x="340" y="371" text-anchor="middle">Stored balance = 1: replay keeps 1, because it does not recheck this position.</text>
</svg>
