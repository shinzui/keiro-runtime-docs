<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <text class="heading" x="20" y="36">Event log for user-42</text>
  <text class="heading" x="330" y="36">Processing ConfirmAccount</text>

  <!-- log -->
  <rect class="band" x="20" y="60" width="250" height="30" rx="4"/>
  <text class="small muted" x="32" y="79">1</text>
  <text class="code small" x="52" y="79">RegistrationStarted</text>
  <rect class="band" x="20" y="96" width="250" height="30" rx="4"/>
  <text class="small muted" x="32" y="115">2</text>
  <text class="code small" x="52" y="115">ConfirmationEmailSent</text>
  <rect class="node green dashed" x="20" y="237" width="250" height="30" rx="4"/>
  <text class="small muted" x="32" y="256">3</text>
  <text class="code small" x="52" y="256">AccountConfirmed</text>
  <text class="small green" x="258" y="256" text-anchor="end">new</text>
  <text class="small muted" x="20" y="300">Past rows never change.</text>
  <text class="small muted" x="20" y="318">New facts are appended.</text>

  <!-- bracket from past events to step 1 -->
  <path class="edge" d="M276 60 H288 V126 H276"/>
  <path class="edge" d="M288 86 H326" marker-end="url(#arrow)"/>

  <!-- steps -->
  <rect class="node" x="330" y="60" width="334" height="52" rx="6"/>
  <text class="small bold" x="344" y="80">1 · Reconstitute</text>
  <text class="code small" x="344" y="100">s = foldl' evolve initial pastEvents</text>
  <rect class="node accent" x="364" y="124" width="266" height="26" rx="13"/>
  <text class="code small" x="497" y="141" text-anchor="middle">RequiresConfirmation alice@x.io Z9F4</text>

  <rect class="node" x="330" y="166" width="334" height="52" rx="6"/>
  <text class="small bold" x="344" y="186">2 · Decide</text>
  <text class="code small" x="344" y="206">newEvents = decide (ConfirmAccount Z9F4 t1) s</text>

  <rect class="node green" x="330" y="232" width="334" height="40" rx="6"/>
  <text class="small bold" x="344" y="257">3 · Append</text>
  <text class="small" x="430" y="257">the only mutation in the cycle</text>
  <path class="edge green" d="M330 252 H274" marker-end="url(#arrow-green)"/>

  <rect class="node" x="330" y="288" width="334" height="52" rx="6"/>
  <text class="small bold" x="344" y="308">4 · Advance (optional)</text>
  <text class="code small" x="344" y="328">s' = foldl' evolve s newEvents</text>
  <rect class="node accent" x="404" y="352" width="186" height="26" rx="13"/>
  <text class="code small" x="497" y="369" text-anchor="middle">Confirmed alice@x.io</text>

  <path class="edge" d="M497 112 V120" marker-end="url(#arrow)"/>
  <path class="edge" d="M497 150 V162" marker-end="url(#arrow)"/>
  <path class="edge" d="M497 218 V228" marker-end="url(#arrow)"/>
  <path class="edge" d="M497 272 V284" marker-end="url(#arrow)"/>
  <path class="edge" d="M497 340 V348" marker-end="url(#arrow)"/>
</svg>
