  <text class="code small" x="68" y="102" text-anchor="middle">&quot;alice@x.io&quot;</text>
  <path class="edge" d="M116 80 H129" marker-end="url(#arrow)"/>
  <rect class="node accent" x="132" y="44" width="96" height="72" rx="6"/>
  <text class="small muted" x="180" y="62" text-anchor="middle">RCons</text>
  <text class="code small" x="180" y="82" text-anchor="middle">confirmCode</text>
  <text class="code small" x="180" y="102" text-anchor="middle">&quot;Z9F4&quot;</text>
  <path class="edge" d="M228 80 H241" marker-end="url(#arrow)"/>
  <rect class="node accent" x="244" y="44" width="96" height="72" rx="6"/>
  <text class="small muted" x="292" y="62" text-anchor="middle">RCons</text>
  <text class="code small" x="292" y="82" text-anchor="middle">registeredAt</text>
  <text class="code small" x="292" y="102" text-anchor="middle">t0</text>
  <path class="edge" d="M340 80 H353" marker-end="url(#arrow)"/>
  <rect class="node amber dashed" x="356" y="44" width="96" height="72" rx="6"/>
  <text class="small muted" x="404" y="62" text-anchor="middle">RCons</text>
  <text class="code small" x="404" y="82" text-anchor="middle">confirmedAt</text>
  <text class="code small amber" x="404" y="102" text-anchor="middle">uninit</text>
  <path class="edge" d="M452 80 H465" marker-end="url(#arrow)"/>
  <rect class="node amber dashed" x="468" y="44" width="96" height="72" rx="6"/>
  <text class="small muted" x="516" y="62" text-anchor="middle">RCons</text>
  <text class="code small" x="516" y="82" text-anchor="middle">deletedAt</text>
  <text class="code small amber" x="516" y="102" text-anchor="middle">uninit</text>
  <path class="edge" d="M564 80 H577" marker-end="url(#arrow)"/>
  <rect class="node" x="580" y="62" width="64" height="36" rx="6"/>
  <text class="code small" x="612" y="84" text-anchor="middle">RNil</text>
  <path class="edge accent" d="M68 146 V120" marker-end="url(#arrow-accent)"/>
  <text class="code small accent" x="68" y="162" text-anchor="middle">ZIdx</text>
  <text class="code small muted" x="68" y="180" text-anchor="middle">#email</text>
  <path class="edge accent" d="M180 146 V120" marker-end="url(#arrow-accent)"/>
  <text class="code small accent" x="180" y="162" text-anchor="middle">SIdx ZIdx</text>
  <text class="code small muted" x="180" y="180" text-anchor="middle">#confirmCode</text>
  <path class="edge accent" d="M292 146 V120" marker-end="url(#arrow-accent)"/>
  <text class="code small accent" x="292" y="162" text-anchor="middle">SIdx (SIdx ZIdx)</text>
  <text class="code small muted" x="292" y="180" text-anchor="middle">#registeredAt</text>
  <text class="small muted" x="360" y="160">An Index is a typed pointer: ZIdx picks the</text>
  <text class="small muted" x="360" y="176">head slot and each SIdx skips one slot.</text>
  <text class="small" x="20" y="210">A write forces the new slot value to WHNF.</text>
  <text class="small amber" x="20" y="228">uninit: the deferred error from emptyRegFile. It fails only when something reads it.</text>
