<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 684">
  <!-- input -->
  <text class="code" x="352" y="22">LoanCmd</text>
  <path class="edge" d="M340 10 V76" marker-end="url(#arrow)"/>

  <!-- nested groups -->
  <rect class="group" x="20" y="44" width="640" height="490" rx="10"/>
  <text class="code small muted" x="34" y="64">loanApplication `compose` (…)</text>
  <rect class="group violet" x="40" y="144" width="600" height="378" rx="10"/>
  <text class="code small violet" x="54" y="164">lmapMaybeCi loanEventToSyncInput (…)</text>
  <rect class="group" x="60" y="240" width="560" height="270" rx="10"/>
  <text class="code small muted" x="74" y="260">coreBankingSync `compose` (…)</text>
  <rect class="group violet" x="80" y="336" width="520" height="162" rx="10"/>
  <text class="code small violet" x="94" y="356">lmapMaybeCi syncOutputToLoanCmd loan</text>

  <!-- chain -->
  <rect class="node accent" x="230" y="80" width="220" height="34" rx="6"/>
  <text class="code" x="340" y="102" text-anchor="middle">loanApplication</text>
  <path class="edge" d="M340 114 V172" marker-end="url(#arrow)"/>
  <text class="code small" x="352" y="136">LoanEvent</text>

  <rect class="node violet dashed" x="230" y="176" width="220" height="34" rx="6"/>
  <text class="code small" x="340" y="197" text-anchor="middle">loanEventToSyncInput</text>
  <path class="edge" d="M340 210 V268" marker-end="url(#arrow)"/>
  <text class="code small" x="352" y="232">SyncInput</text>

  <rect class="node accent" x="230" y="272" width="220" height="34" rx="6"/>
  <text class="code" x="340" y="294" text-anchor="middle">coreBankingSync</text>
  <path class="edge" d="M340 306 V364" marker-end="url(#arrow)"/>
  <text class="code small" x="352" y="328">SyncOutput</text>

  <rect class="node violet dashed" x="230" y="368" width="220" height="34" rx="6"/>
  <text class="code small" x="340" y="389" text-anchor="middle">syncOutputToLoanCmd</text>
  <path class="edge" d="M340 402 V436" marker-end="url(#arrow)"/>
  <text class="code small" x="352" y="424">LoanCmd'</text>

  <rect class="node accent" x="230" y="440" width="220" height="34" rx="6"/>
  <text class="code" x="340" y="462" text-anchor="middle">loan</text>

  <!-- output -->
  <path class="edge" d="M340 474 V560" marker-end="url(#arrow)"/>
  <text class="code" x="352" y="562">LoanEvent'</text>

  <!-- composite types -->
  <text class="heading" x="20" y="598">The composite loanWorkflow value</text>
  <text class="small muted" x="20" y="622">registers</text>
  <text class="code small" x="100" y="622">Append LoanAppRegs (Append SyncRegs LoanRegs)</text>
  <text class="small muted" x="20" y="644">vertex</text>
  <text class="code small" x="100" y="644">Composite LoanAppVertex (Composite SyncVertex LoanVertex)</text>
  <text class="small muted" x="20" y="672">Dashed violet boxes are Maybe-returning adapters. A Nothing result filters the value out.</text>
</svg>
