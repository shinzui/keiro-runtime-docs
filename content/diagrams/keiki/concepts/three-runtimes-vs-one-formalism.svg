<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <text class="heading" x="36" y="28">Today: three runtimes</text>
  <text class="heading" x="374" y="28">keiki: one formalism</text>
  <path class="axis" d="M340 16 V384"/>

  <!-- left: three runtimes -->
  <rect class="node" x="36" y="44" width="270" height="50" rx="6"/>
  <text class="small bold" x="171" y="64" text-anchor="middle">Event sourcing</text>
  <text class="small muted" x="171" y="82" text-anchor="middle">decide and evolve, written separately</text>
  <rect class="node" x="36" y="128" width="270" height="50" rx="6"/>
  <text class="small bold" x="171" y="148" text-anchor="middle">Workflow engine</text>
  <text class="small muted" x="171" y="166" text-anchor="middle">imperative workflow code</text>
  <rect class="node" x="36" y="212" width="270" height="50" rx="6"/>
  <text class="small bold" x="171" y="232" text-anchor="middle">Durable execution</text>
  <text class="small muted" x="171" y="250" text-anchor="middle">resume after a crash</text>
  <path class="edge dashed rose" d="M171 94 V128"/>
  <path class="edge dashed rose" d="M171 178 V212"/>
  <text class="small rose" x="182" y="115">hand-wired glue</text>
  <text class="small rose" x="182" y="199">hand-wired glue</text>

  <text class="small bold rose" x="36" y="296">The four seams</text>
  <text class="small" x="36" y="316">1. No single formal model spans them.</text>
  <text class="small" x="36" y="334">2. Nothing derives replay from deciding.</text>
  <text class="small" x="36" y="352">3. Workflows are opaque code.</text>
  <text class="small" x="36" y="370">4. Composition is ad hoc.</text>

  <!-- right: one value -->
  <rect class="node accent" x="374" y="44" width="270" height="50" rx="6"/>
  <text class="small bold" x="509" y="64" text-anchor="middle">one value</text>
  <text class="code small" x="509" y="82" text-anchor="middle">SymTransducer phi rs s ci co</text>
  <path class="edge" d="M388 94 V243"/>
  <path class="edge" d="M388 131 H400" marker-end="url(#arrow)"/>
  <path class="edge" d="M388 187 H400" marker-end="url(#arrow)"/>
  <path class="edge" d="M388 243 H400" marker-end="url(#arrow)"/>
  <rect class="node" x="404" y="112" width="240" height="38" rx="6"/>
  <text class="small" x="524" y="135" text-anchor="middle">aggregate: command to event</text>
  <rect class="node" x="404" y="168" width="240" height="38" rx="6"/>
  <text class="small" x="524" y="191" text-anchor="middle">process manager: event to command</text>
  <rect class="node" x="404" y="224" width="240" height="38" rx="6"/>
  <text class="small" x="524" y="247" text-anchor="middle">workflow: timers and activities</text>

  <rect class="group muted" x="374" y="290" width="270" height="56" rx="8"/>
  <text class="small muted" x="509" y="312" text-anchor="middle">Infrastructure, a separate layer</text>
  <text class="small muted" x="509" y="330" text-anchor="middle">event store, queue, subscriptions</text>
  <text class="small green" x="374" y="372">Same definitions, tests, analyses, and composition.</text>
</svg>
