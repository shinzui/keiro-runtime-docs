  <text class="small rose" x="20" y="164">At v = reorderPoint both edges can fire. z3 finds this model and the gate fails.</text>
  <text class="heading" x="20" y="206">After: g_drop uses &lt;, so the guards partition the line</text>
  <text class="code small" x="20" y="244">g_stay</text>
