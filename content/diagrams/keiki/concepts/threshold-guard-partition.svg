  <text class="code small" x="20" y="94">g_drop</text>
  <text class="code small muted" x="76" y="94">v &lt;= reorderPoint</text>
  <path class="edge thick violet" d="M410 90 H216" marker-end="url(#arrow-violet)"/>
  <circle class="dot violet" cx="270" cy="90" r="5"/>
  <circle class="dot violet" cx="340" cy="90" r="5"/>
