<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350">
  <rect class="node accent" x="100" y="16" width="480" height="38" rx="6"/>
  <text class="code small" x="340" y="40" text-anchor="middle">$(deriveAggregate &apos;&apos;OrderCmd &apos;&apos;OrderCartRegs &apos;&apos;OrderEvent)</text>
  <path class="edge" d="M240 54 V70 H173 V88" marker-end="url(#arrow)"/>
  <path class="edge" d="M440 54 V70 H507 V88" marker-end="url(#arrow)"/>
  <rect class="group" x="16" y="92" width="314" height="214" rx="8"/>
  <text class="code small bold" x="173" y="116" text-anchor="middle">deriveAggregateCtorsAll</text>
  <text class="small muted" x="173" y="134" text-anchor="middle">per command constructor</text>
  <rect class="node violet" x="30" y="150" width="112" height="52" rx="6"/>
  <text class="code small" x="86" y="180" text-anchor="middle">AddItem</text>
  <path class="edge" d="M142 176 H160" marker-end="url(#arrow)"/>
  <text class="code small accent" x="168" y="164">inCtorAddItem</text>
  <text class="code small accent" x="168" y="180">inpAddItem</text>
  <text class="code small accent" x="168" y="196">isAddItem</text>
  <rect class="node violet" x="30" y="216" width="112" height="52" rx="6"/>
  <text class="code small" x="86" y="246" text-anchor="middle">Reserve</text>
  <path class="edge" d="M142 242 H160" marker-end="url(#arrow)"/>
  <text class="code small accent" x="168" y="230">inCtorReserve</text>
  <text class="code small accent" x="168" y="246">inpReserve</text>
  <text class="code small accent" x="168" y="262">isReserve</text>
  <text class="small muted" x="173" y="292" text-anchor="middle">and the same for the other eight</text>
  <rect class="group" x="350" y="92" width="314" height="214" rx="8"/>
  <text class="code small bold" x="507" y="116" text-anchor="middle">deriveWireCtorsAll</text>
  <text class="small muted" x="507" y="134" text-anchor="middle">per event constructor</text>
  <rect class="node violet" x="364" y="150" width="112" height="52" rx="6"/>
  <text class="code small" x="420" y="180" text-anchor="middle">ItemAdded</text>
  <path class="edge" d="M476 176 H494" marker-end="url(#arrow)"/>
  <text class="code small accent" x="502" y="172">wireItemAdded</text>
  <text class="code small accent" x="502" y="188">ItemAddedTermFields</text>
  <rect class="node violet" x="364" y="216" width="112" height="52" rx="6"/>
  <text class="code small" x="420" y="246" text-anchor="middle">OrderReserved</text>
  <path class="edge" d="M476 242 H494" marker-end="url(#arrow)"/>
  <text class="code small accent" x="502" y="238">wireOrderReserved</text>
  <text class="code small accent" x="502" y="254">OrderReservedTermFields</text>
  <text class="small muted" x="507" y="292" text-anchor="middle">and the same for the other eight</text>
  <text class="small muted" x="340" y="336" text-anchor="middle">Add a constructor and its helpers appear on the next compile. No list needs to stay in sync.</text>
