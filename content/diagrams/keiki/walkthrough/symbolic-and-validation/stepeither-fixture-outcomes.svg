<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352">
  <text class="heading" x="20" y="22">Outcome per vertex</text>
  <text class="code small" x="196" y="22">stepEither fixture (v, RNil) True</text>
  <rect class="group" x="20" y="36" width="310" height="144" rx="8"/>
  <text class="code bold" x="36" y="62">V0</text>
  <text class="small" x="36" y="86">edge 0: guard true, target VEnd</text>
  <text class="small" x="36" y="104">edge 1: guard true, target V3</text>
  <path class="edge rose" d="M175 116 V126" marker-end="url(#arrow-rose)"/>
  <rect class="node rose" x="32" y="132" width="286" height="40" rx="6"/>
  <text class="code small" x="175" y="149" text-anchor="middle">Left (AmbiguousEdges V0 …)</text>
  <text class="small rose" x="175" y="165" text-anchor="middle">a defect: two edges matched</text>
  <rect class="group" x="350" y="36" width="310" height="144" rx="8"/>
  <text class="code bold" x="366" y="62">V1</text>
  <text class="small" x="366" y="86">edge 0: guard false</text>
  <path class="edge amber" d="M505 116 V126" marker-end="url(#arrow-amber)"/>
  <rect class="node amber" x="362" y="132" width="286" height="40" rx="6"/>
  <text class="code small" x="505" y="149" text-anchor="middle">Left (NoMatchingEdge V1 …)</text>
  <text class="small amber" x="505" y="165" text-anchor="middle">an ordinary rejection</text>
  <rect class="group" x="20" y="192" width="310" height="144" rx="8"/>
  <text class="code bold" x="36" y="218">V2</text>
  <text class="small" x="36" y="242">no outgoing edges</text>
  <path class="edge" d="M175 272 V282" marker-end="url(#arrow)"/>
  <rect class="node muted" x="32" y="288" width="286" height="40" rx="6"/>
  <text class="code small" x="175" y="305" text-anchor="middle">Left (NoOutgoingEdges V2)</text>
  <text class="small muted" x="175" y="321" text-anchor="middle">a dead end</text>
  <rect class="group" x="350" y="192" width="310" height="144" rx="8"/>
  <text class="code bold" x="366" y="218">V3</text>
  <text class="small" x="366" y="242">edge 0: guard true</text>
  <path class="edge green" d="M505 272 V282" marker-end="url(#arrow-green)"/>
  <rect class="node green" x="362" y="288" width="286" height="40" rx="6"/>
  <text class="code small" x="505" y="305" text-anchor="middle">Right (s', regs', outs)</text>
  <text class="small green" x="505" y="321" text-anchor="middle">the same triple that step returns</text>
</svg>
