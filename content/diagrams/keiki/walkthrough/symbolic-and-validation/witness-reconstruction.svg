<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392">
  <text class="heading" x="20" y="22">SBV model, read by label</text>
  <rect class="node" x="20" y="34" width="290" height="176" rx="6"/>
  <text class="code small" x="36" y="62">inputCtor</text>
  <text class="code small accent" x="294" y="62" text-anchor="end">"ConfirmPayment"</text>
  <line class="axis" x1="32" y1="76" x2="298" y2="76"/>
  <text class="code small" x="36" y="100">reg/amountPaid</text>
  <text class="code small accent" x="294" y="100" text-anchor="end">1000</text>
  <line class="axis" x1="32" y1="114" x2="298" y2="114"/>
  <text class="code small" x="36" y="138">reg/&lt;other slot&gt;</text>
  <text class="small muted" x="294" y="138" text-anchor="end">no value</text>
  <line class="axis" x1="32" y1="152" x2="298" y2="152"/>
  <text class="code small" x="36" y="176">inp/ConfirmPayment/…</text>
  <text class="small muted" x="294" y="176" text-anchor="end">no value</text>
  <text class="small muted" x="36" y="200">a missing label means unconstrained</text>

  <text class="heading" x="370" y="22">Rebuild</text>
  <rect class="node violet" x="370" y="34" width="290" height="74" rx="6"/>
  <text class="code small" x="386" y="56">extractRegFile</text>
  <text class="small" x="386" y="76">reads reg/&lt;slot&gt; for every slot</text>
  <text class="small muted" x="386" y="96">a missing value uses symDefault</text>
  <rect class="node violet" x="370" y="124" width="290" height="86" rx="6"/>
  <text class="code small" x="386" y="146">pickCi</text>
  <text class="small" x="386" y="166">finds the InCtor named by inputCtor,</text>
  <text class="small" x="386" y="184">reads inp/&lt;ctor&gt;/&lt;field&gt;,</text>
  <text class="small" x="386" y="202">then calls icBuild</text>

  <path class="edge" d="M310 71 H364" marker-end="url(#arrow)"/>
  <path class="edge" d="M310 167 H364" marker-end="url(#arrow)"/>

  <path class="edge" d="M515 210 V236 H400 V252" marker-end="url(#arrow)"/>
  <rect class="node accent" x="190" y="258" width="300" height="50" rx="6"/>
  <text class="code small" x="340" y="280" text-anchor="middle">models p (regs, cmd)</text>
  <text class="small accent" x="340" y="298" text-anchor="middle">concrete recheck, keiki 0.7.0.0</text>

  <path class="edge green" d="M260 308 V336 H180 V346" marker-end="url(#arrow-green)"/>
  <path class="edge rose" d="M420 308 V336 H500 V346" marker-end="url(#arrow-rose)"/>
  <rect class="node green" x="60" y="352" width="240" height="34" rx="6"/>
  <text class="code small green" x="180" y="374" text-anchor="middle">True: Just (regs, cmd)</text>
  <rect class="node rose" x="380" y="352" width="240" height="34" rx="6"/>
  <text class="code small rose" x="500" y="374" text-anchor="middle">False: Nothing</text>
</svg>
