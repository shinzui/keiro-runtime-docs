<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <text class="heading" x="20" y="22">Guard of opaqueT</text>
  <text class="heading" x="400" y="22">What the translator emits</text>

  <rect class="node" x="110" y="36" width="140" height="34" rx="6"/>
  <text class="code small" x="180" y="58" text-anchor="middle">PEq</text>
  <path class="edge" d="M150 70 V88 H90 V104" marker-end="url(#arrow)"/>
  <path class="edge" d="M210 70 V88 H270 V104" marker-end="url(#arrow)"/>

  <rect class="node rose" x="20" y="110" width="140" height="44" rx="6"/>
  <text class="code small rose" x="90" y="130" text-anchor="middle">TApp1</text>
  <text class="code small rose" x="90" y="146" text-anchor="middle">(5 `elem`)</text>
  <rect class="node" x="200" y="114" width="140" height="34" rx="6"/>
  <text class="code small" x="270" y="136" text-anchor="middle">TLit True</text>

  <path class="edge dashed muted" d="M90 154 V188" marker-end="url(#arrow)"/>
  <rect class="node ghost" x="20" y="194" width="140" height="34" rx="6"/>
  <text class="code small muted" x="90" y="216" text-anchor="middle">TReg items</text>

  <line class="axis dashed" x1="360" y1="40" x2="360" y2="236"/>
  <text class="small" x="400" y="58">PEq at Bool: a real equality</text>
  <text class="code small rose" x="400" y="128">SBV.free "app1"</text>
  <text class="small rose" x="400" y="146">a fresh, unconstrained variable</text>
  <text class="code small" x="400" y="174">literal True</text>
  <text class="small muted" x="400" y="216">never translated: the solver</text>
  <text class="small muted" x="400" y="232">cannot see into the closure</text>

  <rect class="band rose" x="20" y="254" width="640" height="92" rx="6"/>
  <text class="small rose" x="36" y="278">The solver sees app1 == True, a boolean it knows nothing about.</text>
  <text class="small rose" x="36" y="298">The symbolic checks pass the edge without proving anything about it.</text>
  <text class="code small" x="36" y="324">predHasOpaqueTerm (guard e) = True</text>
  <text class="small" x="300" y="324">so the opt-in audit emits OpaqueGuard</text>
</svg>
