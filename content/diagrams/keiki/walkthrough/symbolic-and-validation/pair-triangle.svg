<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330">
  <text class="heading" x="20" y="22">Outgoing edges of</text>
  <text class="code small" x="186" y="22">RequiresConfirmation</text>
  <text class="code small" x="265" y="54" text-anchor="middle">j = 0: e0</text>
  <text class="small muted" x="265" y="72" text-anchor="middle">ConfirmAccount</text>
  <text class="code small" x="421" y="54" text-anchor="middle">j = 1: e1</text>
  <text class="small muted" x="421" y="72" text-anchor="middle">ResendConfirmation</text>
  <text class="code small" x="577" y="54" text-anchor="middle">j = 2: e2</text>
  <text class="small muted" x="577" y="72" text-anchor="middle">FulfillGDPRRequest</text>
  <text class="code small" x="20" y="112">i = 0: e0</text>
  <text class="small muted" x="20" y="130">ConfirmAccount</text>
  <rect class="node ghost" x="190" y="88" width="150" height="54" rx="6"/>
  <text class="small muted" x="265" y="120" text-anchor="middle">same edge</text>
  <rect class="node accent" x="346" y="88" width="150" height="54" rx="6"/>
  <text class="code small" x="421" y="112" text-anchor="middle">isBot (g0 conj g1)</text>
  <text class="small accent" x="421" y="130" text-anchor="middle">one solver call</text>
  <rect class="node accent" x="502" y="88" width="150" height="54" rx="6"/>
  <text class="code small" x="577" y="112" text-anchor="middle">isBot (g0 conj g2)</text>
  <text class="small accent" x="577" y="130" text-anchor="middle">one solver call</text>
  <text class="code small" x="20" y="172">i = 1: e1</text>
  <text class="small muted" x="20" y="190">ResendConfirmation</text>
  <rect class="node ghost" x="190" y="148" width="150" height="54" rx="6"/>
  <text class="small muted" x="265" y="180" text-anchor="middle">pair seen above</text>
  <rect class="node ghost" x="346" y="148" width="150" height="54" rx="6"/>
  <text class="small muted" x="421" y="180" text-anchor="middle">same edge</text>
  <rect class="node accent" x="502" y="148" width="150" height="54" rx="6"/>
  <text class="code small" x="577" y="172" text-anchor="middle">isBot (g1 conj g2)</text>
  <text class="small accent" x="577" y="190" text-anchor="middle">one solver call</text>
  <text class="code small" x="20" y="232">i = 2: e2</text>
  <text class="small muted" x="20" y="250">FulfillGDPRRequest</text>
  <rect class="node ghost" x="190" y="208" width="150" height="54" rx="6"/>
  <text class="small muted" x="265" y="240" text-anchor="middle">pair seen above</text>
  <rect class="node ghost" x="346" y="208" width="150" height="54" rx="6"/>
  <text class="small muted" x="421" y="240" text-anchor="middle">pair seen above</text>
  <rect class="node ghost" x="502" y="208" width="150" height="54" rx="6"/>
  <text class="small muted" x="577" y="240" text-anchor="middle">same edge</text>
  <text class="small" x="20" y="296">Only pairs with i &lt; j are checked: 3 edges give 3 * 2 / 2 = 3 checks.</text>
  <text class="small" x="20" y="316">The vertex is single-valued when every checked pair is bot.</text>
</svg>
