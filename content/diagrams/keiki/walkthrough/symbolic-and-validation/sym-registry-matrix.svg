<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410">
  <text class="heading" x="20" y="22">Type</text>
  <text class="heading" x="170" y="22">SymRep</text>
  <text class="small muted" x="390" y="22" text-anchor="end">discover…</text>
  <text class="code small" x="450" y="22" text-anchor="middle">Sym</text>
  <text class="small muted" x="450" y="40" text-anchor="middle">PEq</text>
  <text class="code small" x="540" y="22" text-anchor="middle">SymOrd</text>
  <text class="small muted" x="540" y="40" text-anchor="middle">PCmp</text>
  <text class="code small" x="630" y="22" text-anchor="middle">SymNum</text>
  <text class="small muted" x="630" y="40" text-anchor="middle">TArith</text>
  <rect class="band" x="12" y="54" width="660" height="38" rx="4"/>
  <text class="code small" x="20" y="78">Bool</text>
  <text class="code small" x="170" y="78">Bool</text>
  <circle class="dot green" cx="450" cy="73" r="6"/>
  <line class="axis" x1="534" y1="73" x2="546" y2="73"/>
  <line class="axis" x1="624" y1="73" x2="636" y2="73"/>
  <text class="code small" x="20" y="116">Int</text>
  <text class="code small" x="170" y="109">Integer</text>
  <text class="small muted" x="170" y="124">no Int overflow</text>
  <circle class="dot green" cx="450" cy="111" r="6"/>
  <circle class="dot green" cx="540" cy="111" r="6"/>
  <circle class="dot green" cx="630" cy="111" r="6"/>
  <rect class="band" x="12" y="130" width="660" height="38" rx="4"/>
  <text class="code small" x="20" y="154">Integer</text>
  <text class="code small" x="170" y="154">Integer</text>
  <circle class="dot green" cx="450" cy="149" r="6"/>
  <circle class="dot green" cx="540" cy="149" r="6"/>
  <circle class="dot green" cx="630" cy="149" r="6"/>
  <text class="code small" x="20" y="192">Natural</text>
  <text class="code small" x="170" y="185">Integer</text>
  <text class="small muted" x="170" y="200">constrained to &gt;= 0</text>
  <circle class="dot green" cx="450" cy="187" r="6"/>
  <circle class="dot green" cx="540" cy="187" r="6"/>
  <circle class="dot green" cx="630" cy="187" r="6"/>
  <rect class="band" x="12" y="206" width="660" height="38" rx="4"/>
  <text class="code small" x="20" y="230">Word8 … Word64</text>
  <text class="code small" x="170" y="223">same fixed width</text>
  <text class="small muted" x="170" y="238">exact wraparound</text>
  <circle class="dot green" cx="450" cy="225" r="6"/>
  <circle class="dot green" cx="540" cy="225" r="6"/>
  <circle class="dot green" cx="630" cy="225" r="6"/>
  <text class="code small" x="20" y="268">Int32, Int64</text>
  <text class="code small" x="170" y="261">same fixed width</text>
  <text class="small muted" x="170" y="276">exact wraparound</text>
  <circle class="dot green" cx="450" cy="263" r="6"/>
  <circle class="dot green" cx="540" cy="263" r="6"/>
  <circle class="dot green" cx="630" cy="263" r="6"/>
  <rect class="band" x="12" y="282" width="660" height="38" rx="4"/>
  <text class="code small" x="20" y="306">Text</text>
  <text class="code small" x="170" y="306">String</text>
  <circle class="dot green" cx="450" cy="301" r="6"/>
  <line class="axis" x1="534" y1="301" x2="546" y2="301"/>
  <line class="axis" x1="624" y1="301" x2="636" y2="301"/>
  <text class="code small" x="20" y="344">UTCTime</text>
  <text class="code small" x="170" y="337">Integer</text>
  <text class="small muted" x="170" y="352">epoch picoseconds</text>
  <circle class="dot green" cx="450" cy="339" r="6"/>
  <circle class="dot green" cx="540" cy="339" r="6"/>
  <line class="axis" x1="624" y1="339" x2="636" y2="339"/>
  <circle class="dot green" cx="26" cy="378" r="6"/>
  <text class="small" x="38" y="382">hit: a real SBV equality, comparison, or arithmetic</text>
  <line class="axis" x1="20" y1="402" x2="32" y2="402"/>
  <text class="small" x="38" y="406">miss: a fresh opaque variable, which is sound but less precise</text>
</svg>
