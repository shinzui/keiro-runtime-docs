<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270">
  <text class="heading" x="20" y="22">Two guards on Submit, over the value of submittedAt</text>

  <rect class="band accent" x="40" y="48" width="300" height="34" rx="4"/>
  <text class="code small accent" x="56" y="70">Process: submittedAt &lt;= deadline</text>
  <circle class="dot accent" cx="340" cy="65" r="6"/>

  <rect class="band violet" x="340" y="104" width="300" height="34" rx="4"/>
  <text class="code small violet" x="624" y="126" text-anchor="end">Reject: submittedAt &gt;= deadline</text>
  <circle class="dot violet" cx="340" cy="121" r="6"/>

  <path class="edge dashed rose" d="M340 40 V188"/>
  <line class="axis" x1="30" y1="188" x2="650" y2="188" marker-end="url(#arrow)"/>
  <line class="axis" x1="340" y1="180" x2="340" y2="196"/>
  <text class="code small" x="340" y="214" text-anchor="middle">deadline</text>
  <text class="small muted" x="650" y="214" text-anchor="end">submittedAt</text>
  <text class="small rose" x="352" y="164">both guards hold at exactly one value</text>

  <text class="small muted" x="20" y="246">A test or a random generator rarely picks that value. An SMT solver checks</text>
  <text class="small muted" x="20" y="262">whether Process AND Reject can be true, over every value at once.</text>
</svg>
