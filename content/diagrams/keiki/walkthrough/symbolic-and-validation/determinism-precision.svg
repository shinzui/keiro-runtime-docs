<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372">
  <text class="heading" x="20" y="22">All edge pairs at a vertex</text>
  <rect class="band rose" x="20" y="34" width="240" height="34" rx="4"/>
  <text class="small rose" x="140" y="56" text-anchor="middle">guards really overlap</text>
  <rect class="band green" x="264" y="34" width="396" height="34" rx="4"/>
  <text class="small green" x="462" y="56" text-anchor="middle">guards are disjoint</text>

  <text class="code small" x="20" y="100">checkTransitionDeterminismPure</text>
  <text class="small muted" x="660" y="100" text-anchor="end">pure path in validateTransducer</text>
  <rect class="node rose" x="20" y="108" width="130" height="30" rx="4"/>
  <text class="small rose" x="85" y="128" text-anchor="middle">provable only</text>
  <text class="small" x="164" y="128">under-approximates: every warning is real, silence proves nothing</text>

  <text class="code small" x="20" y="172">checkTransitionDeterminismSym</text>
  <text class="small muted" x="660" y="172" text-anchor="end">needs z3 on PATH</text>
  <rect class="node rose" x="20" y="180" width="240" height="30" rx="4"/>
  <text class="small rose" x="140" y="200" text-anchor="middle">every real overlap</text>
  <rect class="node amber dashed" x="264" y="180" width="80" height="30" rx="4"/>
  <text class="small amber" x="304" y="200" text-anchor="middle">unknown</text>
  <text class="small" x="356" y="200">uncertain solver runs are reported</text>

  <text class="code small" x="20" y="244">checkTransitionDeterminism over HsPred</text>
  <text class="small muted" x="660" y="244" text-anchor="end">raw polymorphic check</text>
  <rect class="node amber" x="20" y="252" width="600" height="30" rx="4"/>
  <text class="small amber" x="320" y="272" text-anchor="middle">every pair that is not literally PBot</text>
  <text class="small" x="20" y="306">over-approximates: noise on the pure carrier</text>

  <text class="small muted" x="20" y="340">The Sym check is the polymorphic check with the SymPred carrier:</text>
  <text class="code small" x="20" y="358">checkTransitionDeterminismSym = checkTransitionDeterminism . withSymPred</text>
</svg>
