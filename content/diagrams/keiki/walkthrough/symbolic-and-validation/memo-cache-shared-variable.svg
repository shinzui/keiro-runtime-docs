<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352">
  <rect class="band" x="120" y="12" width="440" height="34" rx="6"/>
  <text class="code small" x="340" y="34" text-anchor="middle">PEq #amount 0  conj  PEq #amount 1</text>

  <line class="axis dashed" x1="340" y1="60" x2="340" y2="340"/>
  <text class="heading" x="20" y="76">Before EP-42</text>
  <text class="heading" x="360" y="76">With seVarCache</text>

  <rect class="node" x="20" y="90" width="140" height="34" rx="6"/>
  <text class="code small" x="90" y="112" text-anchor="middle">read #amount</text>
  <rect class="node" x="180" y="90" width="140" height="34" rx="6"/>
  <text class="code small" x="250" y="112" text-anchor="middle">read #amount</text>
  <path class="edge" d="M90 124 V164" marker-end="url(#arrow)"/>
  <path class="edge" d="M250 124 V164" marker-end="url(#arrow)"/>
  <text class="small muted" x="100" y="148">SBV.free</text>
  <text class="small muted" x="260" y="148">SBV.free</text>
  <rect class="node amber" x="20" y="170" width="140" height="40" rx="6"/>
  <text class="code small amber" x="90" y="195" text-anchor="middle">variable 1 = 0</text>
  <rect class="node amber" x="180" y="170" width="140" height="40" rx="6"/>
  <text class="code small amber" x="250" y="195" text-anchor="middle">variable 2 = 1</text>
  <path class="edge rose" d="M170 210 V260" marker-end="url(#arrow-rose)"/>
  <rect class="node rose" x="20" y="266" width="300" height="56" rx="6"/>
  <text class="small rose" x="170" y="289" text-anchor="middle">satisfiable, so the pair overlaps</text>
  <text class="code small rose" x="170" y="309" text-anchor="middle">isSingleValuedSym = False</text>

  <rect class="node" x="360" y="90" width="140" height="34" rx="6"/>
  <text class="code small" x="430" y="112" text-anchor="middle">read #amount</text>
  <rect class="node" x="520" y="90" width="140" height="34" rx="6"/>
  <text class="code small" x="590" y="112" text-anchor="middle">read #amount</text>
  <path class="edge" d="M430 124 V144 H500 V164" marker-end="url(#arrow)"/>
  <path class="edge" d="M590 124 V144 H520 V164" marker-end="url(#arrow)"/>
  <rect class="node accent" x="390" y="170" width="240" height="40" rx="6"/>
  <text class="code small accent" x="510" y="188" text-anchor="middle">key RegVar "amount"</text>
  <text class="small accent" x="510" y="203" text-anchor="middle">one variable, label reg/amount</text>
  <path class="edge green" d="M510 210 V260" marker-end="url(#arrow-green)"/>
  <rect class="node green" x="360" y="266" width="300" height="56" rx="6"/>
  <text class="small green" x="510" y="289" text-anchor="middle">amount == 0 and amount == 1: unsat</text>
  <text class="code small green" x="510" y="309" text-anchor="middle">isSingleValuedSym = True</text>
</svg>
