<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330">
  <text class="heading" x="20" y="22">Left arm: email</text>
  <text class="heading" x="660" y="22" text-anchor="end">Right arm: pinger</text>
  <text class="code small muted" x="235" y="46" text-anchor="middle">PingIdle</text>
  <text class="code small muted" x="565" y="46" text-anchor="middle">PingDone</text>
  <text class="code small muted" x="20" y="93">EmailPending</text>
  <rect class="node accent" x="140" y="60" width="190" height="56" rx="6"/>
  <text class="small muted" x="235" y="82" text-anchor="middle">Composite</text>
  <text class="code small" x="235" y="102" text-anchor="middle">EmailPending PingIdle</text>
  <rect class="node " x="470" y="60" width="190" height="56" rx="6"/>
  <text class="small muted" x="565" y="82" text-anchor="middle">Composite</text>
  <text class="code small" x="565" y="102" text-anchor="middle">EmailPending PingDone</text>
  <path class="edge violet" d="M330 88 H464" marker-end="url(#arrow-violet)"/>
  <text class="code small violet" x="400" y="80" text-anchor="middle">Right Ping</text>
  <text class="small violet" x="400" y="106" text-anchor="middle">emits Right Pong</text>
  <text class="code small muted" x="20" y="255">EmailSentVertex</text>
  <rect class="node " x="140" y="222" width="190" height="56" rx="6"/>
  <text class="small muted" x="235" y="244" text-anchor="middle">Composite</text>
  <text class="code small" x="235" y="264" text-anchor="middle">EmailSentVertex PingIdle</text>
  <rect class="node green" x="470" y="222" width="190" height="56" rx="6"/>
  <text class="small muted" x="565" y="244" text-anchor="middle">Composite</text>
  <text class="code small" x="565" y="264" text-anchor="middle">EmailSentVertex PingDone</text>
  <path class="edge violet" d="M330 250 H464" marker-end="url(#arrow-violet)"/>
  <text class="code small violet" x="400" y="242" text-anchor="middle">Right Ping</text>
  <text class="small violet" x="400" y="268" text-anchor="middle">emits Right Pong</text>
  <path class="edge accent" d="M235 116 V216" marker-end="url(#arrow-accent)"/>
  <text class="code small accent" x="245" y="160">Left SendEmail</text>
  <text class="small accent" x="245" y="178">emits Left EmailSent</text>
  <path class="edge accent" d="M565 116 V216" marker-end="url(#arrow-accent)"/>
  <text class="code small accent" x="555" y="160" text-anchor="end">Left SendEmail</text>
  <text class="small accent" x="555" y="178" text-anchor="end">emits Left EmailSent</text>
  <text class="small accent" x="140" y="304">start: both arms at their initial state</text>
  <text class="small green" x="660" y="304" text-anchor="end">final only when both arms are final</text>
</svg>
