<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 398">
  <text class="heading" x="20" y="22">t2 reads a mid field</text>
  <text class="heading" x="360" y="22">t1 emitted o1</text>

  <rect class="node" x="20" y="34" width="300" height="72" rx="6"/>
  <text class="code small" x="36" y="56">TInpCtorField ic2 ix2</text>
  <text class="small muted" x="36" y="76">constructor named by icName ic2</text>
  <text class="small muted" x="36" y="94">field position n = indexInt ix2 = 1</text>

  <rect class="node" x="360" y="34" width="300" height="72" rx="6"/>
  <text class="code small" x="376" y="56">OPack ic1 wc1 of1</text>
  <text class="small muted" x="376" y="76">constructor named by wcName wc1</text>
  <text class="small muted" x="376" y="94">of1 holds t1's term for each field</text>

  <path class="edge" d="M170 106 V124 H300 V138" marker-end="url(#arrow)"/>
  <path class="edge" d="M510 106 V124 H380 V138" marker-end="url(#arrow)"/>
  <rect class="node accent" x="190" y="144" width="300" height="40" rx="6"/>
  <text class="code small" x="340" y="169" text-anchor="middle">icName ic2 == wcName wc1 ?</text>

  <path class="edge rose" d="M490 164 H520" marker-end="url(#arrow-rose)"/>
  <rect class="node rose" x="526" y="140" width="134" height="48" rx="6"/>
  <text class="small rose" x="593" y="160" text-anchor="middle">no: error, but the</text>
  <text class="small rose" x="593" y="177" text-anchor="middle">guard is already PBot</text>

  <path class="edge accent" d="M340 184 V222" marker-end="url(#arrow-accent)"/>
  <text class="small accent" x="350" y="206">yes: nthTerm n of1</text>

  <rect class="node muted" x="120" y="228" width="140" height="44" rx="6"/>
  <text class="small" x="190" y="248" text-anchor="middle">field 0</text>
  <text class="small muted" x="190" y="264" text-anchor="middle">t1's term</text>
  <rect class="node accent" x="270" y="228" width="140" height="44" rx="6"/>
  <text class="small accent" x="340" y="248" text-anchor="middle">field 1</text>
  <text class="small accent" x="340" y="264" text-anchor="middle">SomeTerm tm</text>
  <rect class="node muted" x="420" y="228" width="140" height="44" rx="6"/>
  <text class="small" x="490" y="248" text-anchor="middle">field 2</text>
  <text class="small muted" x="490" y="264" text-anchor="middle">t1's term</text>
  <text class="small muted" x="20" y="255">OutFields of1</text>

  <path class="edge accent" d="M340 272 V306" marker-end="url(#arrow-accent)"/>
  <rect class="band accent" x="80" y="312" width="520" height="70" rx="6"/>
  <text class="code small" x="340" y="336" text-anchor="middle">weakenLTerm @rs1 @rs2 (unsafeCoerceTerm tm)</text>
  <text class="small" x="340" y="356" text-anchor="middle">t1's computation of the field, read from t1's input and registers,</text>
  <text class="small" x="340" y="372" text-anchor="middle">now typed over Append rs1 rs2 and ci1</text>
</svg>
