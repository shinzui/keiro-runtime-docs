<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 342">
  <rect class="node muted" x="160" y="16" width="220" height="36" rx="6"/>
  <text class="code small" x="270" y="39" text-anchor="middle">Either AEvt (Either BEvt CEvt)</text>

  <path class="edge" d="M220 52 V72 H120 V96" marker-end="url(#arrow)"/>
  <text class="code small muted" x="160" y="66" text-anchor="middle">Left</text>
  <path class="edge" d="M320 52 V72 H420 V96" marker-end="url(#arrow)"/>
  <text class="code small muted" x="380" y="66" text-anchor="middle">Right</text>

  <rect class="node accent" x="20" y="102" width="200" height="76" rx="6"/>
  <text class="small accent" x="120" y="124" text-anchor="middle">family 1: AEvt</text>
  <text class="code small" x="120" y="146" text-anchor="middle">wireCtor3At1</text>
  <text class="code small muted" x="120" y="166" text-anchor="middle">= leftWireCtor</text>

  <rect class="node muted" x="330" y="102" width="180" height="36" rx="6"/>
  <text class="code small" x="420" y="125" text-anchor="middle">Either BEvt CEvt</text>

  <path class="edge" d="M380 138 V158 H290 V194" marker-end="url(#arrow)"/>
  <text class="code small muted" x="330" y="152" text-anchor="middle">Left</text>
  <path class="edge" d="M460 138 V158 H550 V194" marker-end="url(#arrow)"/>
  <text class="code small muted" x="510" y="152" text-anchor="middle">Right</text>

  <rect class="node violet" x="180" y="200" width="220" height="76" rx="6"/>
  <text class="small violet" x="290" y="222" text-anchor="middle">family 2: BEvt</text>
  <text class="code small" x="290" y="244" text-anchor="middle">wireCtor3At2</text>
  <text class="code small muted" x="290" y="264" text-anchor="middle">= rightWireCtor . leftWireCtor</text>

  <rect class="node amber" x="440" y="200" width="220" height="76" rx="6"/>
  <text class="small amber" x="550" y="222" text-anchor="middle">family 3 (last): CEvt</text>
  <text class="code small" x="550" y="244" text-anchor="middle">wireCtor3At3</text>
  <text class="code small muted" x="550" y="264" text-anchor="middle">= rightWireCtor . rightWireCtor</text>

  <text class="small muted" x="20" y="306">Read each injector from the root: one right per Right edge, then a left, except the last family.</text>
  <text class="small muted" x="20" y="326">inCtor3At* and outTerm3At* follow the same paths on the input side and for whole outputs.</text>
</svg>
