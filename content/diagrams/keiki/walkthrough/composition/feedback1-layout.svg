<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372">
  <text class="heading" x="20" y="22">Vertex</text>
  <text class="code small" x="92" y="22">Composite s1 (Composite s2 s1)</text>
  <rect class="group" x="232" y="32" width="436" height="80" rx="8"/>
  <rect class="node" x="20" y="40" width="200" height="50" rx="6"/>
  <text class="code" x="120" y="62" text-anchor="middle">s1</text>
  <text class="small muted" x="120" y="80" text-anchor="middle">outer t</text>
  <rect class="node" x="240" y="40" width="200" height="50" rx="6"/>
  <text class="code" x="340" y="62" text-anchor="middle">s2</text>
  <text class="small muted" x="340" y="80" text-anchor="middle">policy f</text>
  <rect class="node" x="460" y="40" width="200" height="50" rx="6"/>
  <text class="code" x="560" y="62" text-anchor="middle">s1</text>
  <text class="small muted" x="560" y="80" text-anchor="middle">inner t: a separate dimension</text>
  <text class="small muted" x="450" y="106" text-anchor="middle">inner compose f t</text>

  <text class="heading" x="20" y="148">Registers</text>
  <text class="code small" x="112" y="148">Append rs1 (Append rs2 rs1)</text>
  <rect class="group" x="232" y="158" width="436" height="80" rx="8"/>
  <rect class="node rose" x="20" y="166" width="200" height="50" rx="6"/>
  <text class="code rose" x="120" y="188" text-anchor="middle">rs1</text>
  <text class="small rose" x="120" y="206" text-anchor="middle">outer t's slots</text>
  <rect class="node" x="240" y="166" width="200" height="50" rx="6"/>
  <text class="code" x="340" y="188" text-anchor="middle">rs2</text>
  <text class="small muted" x="340" y="206" text-anchor="middle">policy's slots</text>
  <rect class="node rose" x="460" y="166" width="200" height="50" rx="6"/>
  <text class="code rose" x="560" y="188" text-anchor="middle">rs1</text>
  <text class="small rose" x="560" y="206" text-anchor="middle">inner t's slots, same names</text>
  <text class="small muted" x="450" y="232" text-anchor="middle">Append rs2 rs1</text>

  <rect class="band rose" x="20" y="258" width="640" height="56" rx="6"/>
  <text class="code small rose" x="36" y="280">Disjoint (Names rs1) (Names (Append rs2 rs1))</text>
  <text class="small rose" x="36" y="300">rs1 is on both sides, so only rs1 = '[] satisfies the outer compose.</text>

  <rect class="band green" x="20" y="324" width="640" height="38" rx="6"/>
  <text class="small green" x="36" y="348">Toggle fixture: ToggleRegs = '[], and the state lives in the vertex (Off or On).</text>
</svg>
