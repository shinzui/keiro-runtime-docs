<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 334">
  <text class="heading" x="170" y="22">InCtor</text>
  <text class="code small" x="236" y="22">after lmapCi f</text>
  <text class="heading" x="430" y="22">WireCtor</text>
  <text class="code small" x="512" y="22">after rmapCo g</text>

  <rect class="node muted" x="170" y="34" width="240" height="34" rx="6"/>
  <text class="code small" x="290" y="56" text-anchor="middle">icName = n &lt;&gt; "#lmapped"</text>
  <rect class="node muted" x="430" y="34" width="230" height="34" rx="6"/>
  <text class="code small" x="545" y="56" text-anchor="middle">wcName = n &lt;&gt; "#rmapped"</text>
  <text class="small muted" x="20" y="56">name stamp</text>

  <text class="title green" x="20" y="108">Forward</text>
  <text class="small muted" x="20" y="126">delta, omega,</text>
  <text class="small muted" x="20" y="142">evalPred, evalTerm</text>
  <rect class="node green" x="170" y="84" width="240" height="64" rx="6"/>
  <text class="code small" x="290" y="110" text-anchor="middle">icMatch = m . f</text>
  <text class="small green" x="290" y="132" text-anchor="middle">still matches the new alphabet</text>
  <rect class="node green" x="430" y="84" width="230" height="64" rx="6"/>
  <text class="code small" x="545" y="110" text-anchor="middle">wcBuild = g . b</text>
  <text class="small green" x="545" y="132" text-anchor="middle">still builds the new output</text>

  <text class="title rose" x="20" y="190">Inverse</text>
  <text class="small muted" x="20" y="208">solveOutput</text>
  <rect class="node rose" x="170" y="166" width="240" height="64" rx="6"/>
  <text class="code small" x="290" y="192" text-anchor="middle">icBuild = poisonedIcBuild n</text>
  <text class="small rose" x="290" y="214" text-anchor="middle">throws when forced</text>
  <rect class="node rose" x="430" y="166" width="230" height="64" rx="6"/>
  <text class="code small" x="545" y="192" text-anchor="middle">wcMatch = \_ -&gt; Nothing</text>
  <text class="small rose" x="545" y="214" text-anchor="middle">solveOutput gives Nothing</text>

  <rect class="band amber" x="20" y="252" width="640" height="68" rx="6"/>
  <text class="small amber" x="36" y="274">On SomeSymTransducer, the same map also sets poisonedInput or poisonedOutput.</text>
  <text class="small amber" x="36" y="294">A later Category composition across that boundary raises</text>
  <text class="code small amber" x="36" y="312">PoisonedCompositionError</text>
</svg>
