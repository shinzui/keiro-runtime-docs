  <text class="small" x="620" y="96" text-anchor="middle">n2 = 2</text>
  <text class="small muted" x="620" y="114" text-anchor="middle">size of s2</text>
  <text class="code small" x="620" y="160" text-anchor="middle">ai * n2</text>
  <text class="code small" x="620" y="178" text-anchor="middle">+ bi</text>
  <text class="small muted" x="620" y="222" text-anchor="middle">toEnum uses</text>
  <text class="code small muted" x="620" y="240" text-anchor="middle">divMod n2</text>
  <text class="small muted" x="20" y="300">fromEnum walks s2 first while s1 holds still, then carries into s1.</text>
  <text class="small muted" x="20" y="318">[minBound .. maxBound] lists the whole product in this order.</text>
