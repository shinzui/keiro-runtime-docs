<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352">
  <rect class="node" x="200" y="16" width="280" height="44" rx="6"/>
  <text class="code small" x="340" y="36" text-anchor="middle">initialPath e1 s2</text>
  <text class="small muted" x="340" y="52" text-anchor="middle">t1 edge emits [MidA n, MidB n]</text>
  <path class="edge" d="M340 60 V74 H260 V86" marker-end="url(#arrow)"/>
  <rect class="node" x="180" y="92" width="160" height="44" rx="6"/>
  <text class="code small" x="260" y="111" text-anchor="middle">eA</text>
  <text class="small green" x="260" y="128" text-anchor="middle">step 1 (MidA): PTop</text>
  <path class="edge" d="M340 60 V74 H500 V86" marker-end="url(#arrow)"/>
  <rect class="node" x="420" y="92" width="160" height="44" rx="6"/>
  <text class="code small" x="500" y="111" text-anchor="middle">eB</text>
  <text class="small rose" x="500" y="128" text-anchor="middle">step 1 (MidA): PBot</text>
  <path class="edge" d="M260 136 V160 H100 V180" marker-end="url(#arrow)"/>
  <rect class="node rose" x="25" y="186" width="150" height="62" rx="6"/>
  <text class="code small" x="100" y="206" text-anchor="middle">[eA, eA]</text>
  <text class="small" x="100" y="223" text-anchor="middle">step 2 (MidB): PBot</text>
  <text class="small rose" x="100" y="240" text-anchor="middle">contains PBot</text>
  <path class="edge" d="M260 136 V160 H260 V180" marker-end="url(#arrow)"/>
  <rect class="node green" x="185" y="186" width="150" height="62" rx="6"/>
  <text class="code small" x="260" y="206" text-anchor="middle">[eA, eB]</text>
  <text class="small" x="260" y="223" text-anchor="middle">step 2 (MidB): PTop</text>
  <text class="small green" x="260" y="240" text-anchor="middle">can fire</text>
  <path class="edge" d="M500 136 V160 H420 V180" marker-end="url(#arrow)"/>
  <rect class="node rose" x="345" y="186" width="150" height="62" rx="6"/>
  <text class="code small" x="420" y="206" text-anchor="middle">[eB, eA]</text>
  <text class="small" x="420" y="223" text-anchor="middle">step 2 (MidB): PBot</text>
  <text class="small rose" x="420" y="240" text-anchor="middle">contains PBot</text>
  <path class="edge" d="M500 136 V160 H580 V180" marker-end="url(#arrow)"/>
  <rect class="node rose" x="505" y="186" width="150" height="62" rx="6"/>
  <text class="code small" x="580" y="206" text-anchor="middle">[eB, eB]</text>
  <text class="small" x="580" y="223" text-anchor="middle">step 2 (MidB): PTop</text>
  <text class="small rose" x="580" y="240" text-anchor="middle">contains PBot</text>
  <rect class="band" x="20" y="270" width="640" height="66" rx="6"/>
  <text class="small" x="36" y="292">finalizePath turns all four paths into composite edges, each with two outputs.</text>
  <text class="small" x="36" y="310">Only [eA, eB] has a satisfiable guard.</text>
  <text class="code small" x="36" y="328">omega on T1Trigger 42 = [EchoA 42, EchoB 42]</text>
</svg>
