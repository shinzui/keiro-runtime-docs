  <text class="heading" x="330" y="24">t2 registers: rs2</text>
  <rect class="node " x="20" y="36" width="96" height="40" rx="6"/>
  <text class="code" x="68" y="61" text-anchor="middle">a</text>
  <text class="small muted" x="68" y="94" text-anchor="middle">position 0</text>
  <rect class="node accent" x="120" y="36" width="96" height="40" rx="6"/>
  <text class="code" x="168" y="61" text-anchor="middle">b</text>
  <text class="small muted" x="168" y="94" text-anchor="middle">position 1</text>
  <rect class="node " x="330" y="36" width="96" height="40" rx="6"/>
  <text class="code" x="378" y="61" text-anchor="middle">x</text>
  <text class="small muted" x="378" y="94" text-anchor="middle">position 0</text>
  <rect class="node violet" x="434" y="36" width="96" height="40" rx="6"/>
  <text class="code" x="482" y="61" text-anchor="middle">y</text>
  <text class="small muted" x="482" y="94" text-anchor="middle">position 1</text>
  <rect class="node " x="538" y="36" width="96" height="40" rx="6"/>
  <text class="code" x="586" y="61" text-anchor="middle">z</text>
  <text class="small muted" x="586" y="94" text-anchor="middle">position 2</text>
  <text class="heading" x="20" y="316">Composite registers: Append rs1 rs2</text>
  <rect class="group" x="12" y="204" width="508" height="88" rx="8"/>
  <rect class="node " x="20" y="214" width="96" height="40" rx="6"/>
  <text class="code" x="68" y="239" text-anchor="middle">a</text>
  <text class="small muted" x="68" y="272" text-anchor="middle">position 0</text>
  <rect class="node accent" x="120" y="214" width="96" height="40" rx="6"/>
  <text class="code" x="168" y="239" text-anchor="middle">b</text>
  <text class="small muted" x="168" y="272" text-anchor="middle">position 1</text>
  <rect class="node " x="220" y="214" width="96" height="40" rx="6"/>
  <text class="code" x="268" y="239" text-anchor="middle">x</text>
  <text class="small muted" x="268" y="272" text-anchor="middle">position 2</text>
  <rect class="node violet" x="320" y="214" width="96" height="40" rx="6"/>
  <text class="code" x="368" y="239" text-anchor="middle">y</text>
  <text class="small muted" x="368" y="272" text-anchor="middle">position 3</text>
  <rect class="node " x="420" y="214" width="96" height="40" rx="6"/>
  <text class="code" x="468" y="239" text-anchor="middle">z</text>
  <text class="small muted" x="468" y="272" text-anchor="middle">position 4</text>
  <path class="edge accent" d="M168 112 V208" marker-end="url(#arrow-accent)"/>
  <text class="code small accent" x="180" y="140">weakenL</text>
  <text class="small accent" x="180" y="158">position 1 stays 1</text>
  <path class="edge violet" d="M482 112 V150 H368 V208" marker-end="url(#arrow-violet)"/>
  <text class="code small violet" x="494" y="134">weakenR @rs1</text>
  <text class="small violet" x="494" y="152">one SIdx per rs1 slot</text>
  <text class="small violet" x="494" y="170">position 1 becomes 3</text>
