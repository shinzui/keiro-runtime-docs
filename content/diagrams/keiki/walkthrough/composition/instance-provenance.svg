<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <text class="heading" x="20" y="22">Instance</text>
  <text class="heading" x="200" y="22">Input and output boundary</text>
  <text class="heading" x="490" y="22">Built on</text>
  <text class="title" x="20" y="60">Choice</text>
  <text class="small muted" x="20" y="78">keeps t&apos;s flags</text>
  <line class="edge green" x1="186" y1="63" x2="206" y2="63"/>
  <line class="edge green" x1="454" y1="63" x2="474" y2="63"/>
  <rect class="node" x="206" y="38" width="248" height="50" rx="6"/>
  <circle class="dot green" cx="206" cy="63" r="7"/>
  <circle class="dot green" cx="454" cy="63" r="7"/>
  <text class="code small" x="330" y="68" text-anchor="middle">left&apos; t, right&apos; t</text>
  <text class="code small" x="490" y="60">alternative with</text>
  <text class="code small" x="490" y="78">identityTransducer</text>
  <text class="title" x="20" y="130">Strong</text>
  <text class="small muted" x="20" y="148">sets both flags</text>
  <line class="edge rose" x1="186" y1="133" x2="206" y2="133"/>
  <line class="edge rose" x1="454" y1="133" x2="474" y2="133"/>
  <rect class="node" x="206" y="108" width="248" height="50" rx="6"/>
  <circle class="dot rose" cx="206" cy="133" r="7"/>
  <circle class="dot rose" cx="454" cy="133" r="7"/>
  <text class="code small" x="330" y="138" text-anchor="middle">first&apos; t, second&apos; t</text>
  <text class="code small" x="490" y="130">firstSym</text>
  <text class="title" x="20" y="200">Arrow</text>
  <text class="small muted" x="20" y="218">sets output flag</text>
  <line class="edge green" x1="186" y1="203" x2="206" y2="203"/>
  <line class="edge rose" x1="454" y1="203" x2="474" y2="203"/>
  <rect class="node" x="206" y="178" width="248" height="50" rx="6"/>
  <circle class="dot green" cx="206" cy="203" r="7"/>
  <circle class="dot rose" cx="454" cy="203" r="7"/>
  <text class="code small" x="330" y="208" text-anchor="middle">arr f</text>
  <text class="code small" x="490" y="200">arrTransducer f</text>
  <circle class="dot green" cx="26" cy="262" r="6"/>
  <text class="small" x="38" y="266">clean boundary</text>
  <circle class="dot rose" cx="156" cy="262" r="6"/>
  <text class="small" x="168" y="266">poisoned boundary: not replay-invertible</text>
  <line class="axis dashed" x1="20" y1="282" x2="660" y2="282"/>
  <text class="code small" x="20" y="306">arr f &gt;&gt;&gt; arr g</text>
  <rect class="node" x="190" y="318" width="150" height="44" rx="6"/>
  <text class="code small" x="265" y="345" text-anchor="middle">arr f</text>
  <circle class="dot green" cx="190" cy="340" r="7"/>
  <circle class="dot rose" cx="340" cy="340" r="7"/>
  <path class="edge rose" d="M347 340 H413" marker-end="url(#arrow-rose)"/>
  <rect class="node" x="420" y="318" width="150" height="44" rx="6"/>
  <text class="code small" x="495" y="345" text-anchor="middle">arr g</text>
  <circle class="dot green" cx="420" cy="340" r="7"/>
  <circle class="dot rose" cx="570" cy="340" r="7"/>
  <text class="small rose" x="380" y="384" text-anchor="middle">upstream output is poisoned, so (.) throws PoisonedCompositionError</text>
</svg>
