<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318">
  <text class="heading" x="20" y="22">Round trip</text>
  <text class="code small" x="112" y="22">inCtorTinyFoo :: InCtor TinyCmd ifs</text>

  <rect class="node" x="20" y="40" width="180" height="60" rx="6"/>
  <text class="code" x="110" y="66" text-anchor="middle">TinyFoo 7 9</text>
  <text class="small muted" x="110" y="86" text-anchor="middle">a value of ci = TinyCmd</text>

  <text class="small muted" x="440" y="34">RegFile ifs</text>
  <rect class="node accent" x="440" y="40" width="110" height="60" rx="6"/>
  <text class="code" x="495" y="66" text-anchor="middle">"a"</text>
  <text class="code small" x="495" y="86" text-anchor="middle">7</text>
  <rect class="node accent" x="550" y="40" width="110" height="60" rx="6"/>
  <text class="code" x="605" y="66" text-anchor="middle">"b"</text>
  <text class="code small" x="605" y="86" text-anchor="middle">9</text>

  <path class="edge" d="M200 58 H434" marker-end="url(#arrow)"/>
  <text class="code small" x="317" y="50" text-anchor="middle">icMatch: Just rf</text>
  <path class="edge" d="M440 84 H206" marker-end="url(#arrow)"/>
  <text class="code small" x="323" y="102" text-anchor="middle">icBuild rf</text>

  <text class="heading" x="20" y="148">Evaluation</text>
  <text class="code small" x="112" y="148">evalTerm (TInpCtorField inCtorTinyFoo #a) RNil ci</text>

  <rect class="node" x="20" y="162" width="130" height="34" rx="6"/>
  <text class="code" x="85" y="184" text-anchor="middle">TinyFoo 7 9</text>
  <path class="edge" d="M150 179 H214" marker-end="url(#arrow)"/>
  <text class="code small" x="182" y="171" text-anchor="middle">icMatch</text>
  <rect class="node" x="220" y="162" width="110" height="34" rx="6"/>
  <text class="code" x="275" y="184" text-anchor="middle">Just rf</text>
  <path class="edge" d="M330 179 H354" marker-end="url(#arrow)"/>
  <rect class="node" x="360" y="162" width="110" height="34" rx="6"/>
  <text class="code" x="415" y="184" text-anchor="middle">rf ! #a</text>
  <path class="edge" d="M470 179 H494" marker-end="url(#arrow)"/>
  <rect class="node green" x="500" y="162" width="160" height="34" rx="6"/>
  <text class="code green" x="580" y="184" text-anchor="middle">7</text>

  <rect class="node" x="20" y="222" width="130" height="34" rx="6"/>
  <text class="code" x="85" y="244" text-anchor="middle">TinyBar 0</text>
  <path class="edge" d="M150 239 H214" marker-end="url(#arrow)"/>
  <text class="code small" x="182" y="231" text-anchor="middle">icMatch</text>
  <rect class="node" x="220" y="222" width="110" height="34" rx="6"/>
  <text class="code" x="275" y="244" text-anchor="middle">Nothing</text>
  <path class="edge rose" d="M330 239 H354" marker-end="url(#arrow-rose)"/>
  <rect class="node rose" x="360" y="214" width="300" height="50" rx="6"/>
  <text class="code small rose" x="510" y="234" text-anchor="middle">error "evalTerm: TInpCtorField</text>
  <text class="code small rose" x="510" y="252" text-anchor="middle">guard violation: TinyFoo"</text>

  <text class="small muted" x="20" y="296">icBuild is the left inverse: icMatch (icBuild rf) == Just rf.</text>
</svg>
