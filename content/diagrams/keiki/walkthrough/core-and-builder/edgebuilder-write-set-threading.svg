<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <text class="heading" x="20" y="22">Write-set index w</text>
  <text class="heading" x="300" y="22">Statement in one B.do body</text>

  <rect class="node" x="20" y="34" width="250" height="34" rx="6"/>
  <text class="code" x="145" y="56" text-anchor="middle">'[]</text>

  <path class="edge" d="M145 68 V114" marker-end="url(#arrow)"/>
  <text class="code small" x="300" y="88">B.slot @"email" .= d.email</text>
  <text class="small muted" x="300" y="105">needs Disjoint '["email"] '[]</text>

  <rect class="node" x="20" y="120" width="250" height="34" rx="6"/>
  <text class="code" x="145" y="142" text-anchor="middle">'["email"]</text>

  <path class="edge" d="M145 154 V200" marker-end="url(#arrow)"/>
  <text class="code small" x="300" y="174">B.slot @"confirmCode" .= d.confirmCode</text>
  <text class="small muted" x="300" y="191">output index is Concat '["confirmCode"] w</text>

  <rect class="node" x="20" y="206" width="250" height="34" rx="6"/>
  <text class="code" x="145" y="228" text-anchor="middle">'["confirmCode", "email"]</text>

  <path class="edge" d="M145 240 V286" marker-end="url(#arrow)"/>
  <text class="code small" x="300" y="260">B.emit wireRegistrationStarted …</text>
  <text class="small muted" x="300" y="277">emit, require*, goto leave w unchanged</text>

  <rect class="node" x="20" y="292" width="250" height="34" rx="6"/>
  <text class="code" x="145" y="314" text-anchor="middle">'["confirmCode", "email"]</text>

  <path class="edge rose" d="M145 326 V372" marker-end="url(#arrow-rose)"/>
  <text class="code small rose" x="300" y="346">B.slot @"email" .= …</text>
  <text class="small rose" x="300" y="363">Disjoint '["email"] w fails on this line</text>

  <rect class="node rose" x="20" y="378" width="250" height="34" rx="6"/>
  <text class="code small rose" x="145" y="400" text-anchor="middle">TypeError names "email"</text>
</svg>
