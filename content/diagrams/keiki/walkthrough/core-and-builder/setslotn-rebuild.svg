<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 334">
  <text class="heading" x="20" y="24">Before</text>
  <text class="code small" x="90" y="24">regs</text>

  <rect class="node" x="20" y="36" width="150" height="66" rx="6"/>
  <text class="small muted" x="95" y="54" text-anchor="middle">RCons</text>
  <text class="code" x="95" y="73" text-anchor="middle">email</text>
  <text class="code small" x="95" y="92" text-anchor="middle">"a@x"</text>

  <rect class="node" x="200" y="36" width="150" height="66" rx="6"/>
  <text class="small muted" x="275" y="54" text-anchor="middle">RCons</text>
  <text class="code" x="275" y="73" text-anchor="middle">confirmCode</text>
  <text class="code small" x="275" y="92" text-anchor="middle">"Z9F4"</text>

  <rect class="node amber dashed" x="380" y="36" width="150" height="66" rx="6"/>
  <text class="small muted" x="455" y="54" text-anchor="middle">RCons</text>
  <text class="code" x="455" y="73" text-anchor="middle">registeredAt</text>
  <text class="small amber" x="455" y="92" text-anchor="middle">uninit thunk</text>

  <rect class="node muted" x="560" y="52" width="100" height="34" rx="6"/>
  <text class="code" x="610" y="74" text-anchor="middle">RNil</text>

  <path class="edge" d="M170 69 H194" marker-end="url(#arrow)"/>
  <path class="edge" d="M350 69 H374" marker-end="url(#arrow)"/>
  <path class="edge" d="M530 69 H554" marker-end="url(#arrow)"/>

  <text class="heading" x="20" y="152">After</text>
  <text class="code small" x="80" y="152">setSlotN (IS IZ) "K2P1" regs</text>

  <rect class="node violet" x="20" y="164" width="150" height="66" rx="6"/>
  <text class="small violet" x="95" y="182" text-anchor="middle">new RCons</text>
  <text class="code" x="95" y="201" text-anchor="middle">email</text>
  <text class="code small" x="95" y="220" text-anchor="middle">"a@x"</text>

  <rect class="node accent" x="200" y="164" width="150" height="66" rx="6"/>
  <text class="small accent" x="275" y="182" text-anchor="middle">new RCons</text>
  <text class="code" x="275" y="201" text-anchor="middle">confirmCode</text>
  <text class="code small accent" x="275" y="220" text-anchor="middle">!v = "K2P1"</text>

  <path class="edge" d="M170 197 H194" marker-end="url(#arrow)"/>
  <path class="edge accent" d="M350 197 H455 V108" marker-end="url(#arrow-accent)"/>
  <text class="small accent" x="467" y="150">same tail,</text>
  <text class="small accent" x="467" y="166">shared</text>

  <rect class="dot violet" x="24" y="262" width="12" height="12" rx="2"/>
  <text class="small" x="44" y="272">The prefix before the written slot is rebuilt with the same values.</text>
  <rect class="dot accent" x="24" y="286" width="12" height="12" rx="2"/>
  <text class="small" x="44" y="296">The bang forces the new value to WHNF before it is stored.</text>
  <rect class="dot amber" x="24" y="310" width="12" height="12" rx="2"/>
  <text class="small" x="44" y="320">The tail after it is shared, so the unwritten slot keeps its uninit thunk.</text>
</svg>
