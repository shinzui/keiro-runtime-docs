<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 452">
  <text class="heading" x="20" y="22">Event log</text>
  <text class="heading" x="330" y="22">Replay wrapper after each event</text>

  <rect class="node" x="330" y="34" width="330" height="40" rx="6"/>
  <text class="code" x="495" y="59" text-anchor="middle">Settled PotentialCustomer</text>

  <path class="edge" d="M495 74 V130" marker-end="url(#arrow)"/>
  <rect class="node violet" x="20" y="85" width="270" height="34" rx="6"/>
  <text class="code small" x="34" y="106">#0</text>
  <text class="code" x="64" y="107">RegistrationStarted</text>
  <path class="edge dotted muted" d="M290 102 H489"/>
  <text class="small" x="507" y="98">head of a two-event</text>
  <text class="small" x="507" y="114">edge; update applied</text>

  <rect class="node amber" x="330" y="136" width="330" height="52" rx="6"/>
  <text class="code amber" x="495" y="158" text-anchor="middle">InFlight RequiresConfirmation</text>
  <text class="code small amber" x="495" y="178" text-anchor="middle">queue = [ConfirmationEmailSent]</text>

  <path class="edge" d="M495 188 V244" marker-end="url(#arrow)"/>
  <rect class="node violet" x="20" y="199" width="270" height="34" rx="6"/>
  <text class="code small" x="34" y="220">#1</text>
  <text class="code" x="64" y="221">ConfirmationEmailSent</text>
  <path class="edge dotted muted" d="M290 216 H489"/>
  <text class="small" x="507" y="212">equals the queue head;</text>
  <text class="small" x="507" y="228">registers unchanged</text>

  <rect class="node" x="330" y="250" width="330" height="40" rx="6"/>
  <text class="code" x="495" y="275" text-anchor="middle">Settled RequiresConfirmation</text>

  <path class="edge" d="M495 290 V346" marker-end="url(#arrow)"/>
  <rect class="node violet" x="20" y="301" width="270" height="34" rx="6"/>
  <text class="code small" x="34" y="322">#2</text>
  <text class="code" x="64" y="323">AccountConfirmed</text>
  <path class="edge dotted muted" d="M290 318 H489"/>
  <text class="small" x="507" y="314">letter edge;</text>
  <text class="small" x="507" y="330">update applied</text>

  <rect class="node" x="330" y="352" width="330" height="40" rx="6"/>
  <text class="code" x="495" y="377" text-anchor="middle">Settled Confirmed</text>

  <text class="small amber" x="20" y="418">If a page ends after #0, replayEvents returns the InFlight wrapper to resume from.</text>
  <text class="small amber" x="20" y="438">reconstituteEither on the same page fails with ReplayLogTruncated.</text>
</svg>
