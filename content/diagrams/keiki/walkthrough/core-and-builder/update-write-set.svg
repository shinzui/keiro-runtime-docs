<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <text class="heading" x="20" y="22">Distinct slots: accepted</text>
  <text class="heading" x="350" y="22">Same slot: rejected</text>
  <line class="axis dashed" x1="340" y1="10" x2="340" y2="290"/>

  <rect class="node" x="20" y="36" width="152" height="58" rx="6"/>
  <text class="code small" x="96" y="59" text-anchor="middle">USet #email t1</text>
  <text class="code small muted" x="96" y="80" text-anchor="middle">w = '["email"]</text>
  <rect class="node" x="180" y="36" width="152" height="58" rx="6"/>
  <text class="code small" x="256" y="59" text-anchor="middle">USet #confirmCode t2</text>
  <text class="code small muted" x="256" y="80" text-anchor="middle">w = '["confirmCode"]</text>

  <path class="edge" d="M96 94 V114 H160 V132" marker-end="url(#arrow)"/>
  <path class="edge" d="M256 94 V114 H192 V132" marker-end="url(#arrow)"/>
  <rect class="node green" x="76" y="138" width="200" height="50" rx="6"/>
  <text class="code" x="176" y="160" text-anchor="middle">combine</text>
  <text class="small green" x="176" y="178" text-anchor="middle">Disjoint w1 w2 holds</text>

  <path class="edge green" d="M176 188 V210" marker-end="url(#arrow-green)"/>
  <rect class="band green" x="20" y="216" width="312" height="62" rx="6"/>
  <text class="code small" x="176" y="240" text-anchor="middle">Update rs (Concat w1 w2) ci</text>
  <text class="code small" x="176" y="262" text-anchor="middle">w = '["email", "confirmCode"]</text>

  <rect class="node" x="350" y="36" width="152" height="58" rx="6"/>
  <text class="code small" x="426" y="59" text-anchor="middle">USet #email t1</text>
  <text class="code small muted" x="426" y="80" text-anchor="middle">w = '["email"]</text>
  <rect class="node" x="510" y="36" width="152" height="58" rx="6"/>
  <text class="code small" x="586" y="59" text-anchor="middle">USet #email t2</text>
  <text class="code small muted" x="586" y="80" text-anchor="middle">w = '["email"]</text>

  <path class="edge" d="M426 94 V114 H490 V132" marker-end="url(#arrow)"/>
  <path class="edge" d="M586 94 V114 H522 V132" marker-end="url(#arrow)"/>
  <rect class="node rose" x="406" y="138" width="200" height="50" rx="6"/>
  <text class="code" x="506" y="160" text-anchor="middle">combine</text>
  <text class="small rose" x="506" y="178" text-anchor="middle">NotMemberCmp hits 'EQ</text>

  <path class="edge rose" d="M506 188 V210" marker-end="url(#arrow-rose)"/>
  <rect class="band rose" x="350" y="216" width="312" height="62" rx="6"/>
  <text class="code small rose" x="506" y="240" text-anchor="middle">TypeError: slot "email" is written</text>
  <text class="code small rose" x="506" y="262" text-anchor="middle">by both halves of `combine`</text>
</svg>
