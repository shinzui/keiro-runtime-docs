<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410">
  <text class="heading" x="20" y="22">Stored envelope</text>
  <rect class="node" x="20" y="34" width="250" height="96" rx="6"/>
  <text class="code small" x="36" y="58">{ "kind": "Placed",</text>
  <text class="code small" x="36" y="78">  "v": 1,</text>
  <text class="code small" x="36" y="98">  "orderId": "ord-7",</text>
  <text class="code small" x="36" y="118">  … }</text>
  <text class="small muted" x="20" y="150">kind and v are the default key names</text>

  <text class="heading" x="330" y="22">Decoder</text>
  <text class="code small" x="410" y="22">currentVersion = 3</text>
  <path class="edge" d="M270 51 H324" marker-end="url(#arrow)"/>
  <rect class="node" x="330" y="34" width="330" height="34" rx="6"/>
  <text class="small" x="345" y="56">read v; an absent v means version 1</text>
  <text class="small rose" x="414" y="90">v below 1 or above currentVersion: Left</text>

  <path class="edge" d="M400 68 V108" marker-end="url(#arrow)"/>
  <rect class="node amber" x="340" y="114" width="120" height="34" rx="6"/>
  <text class="code small" x="400" y="136" text-anchor="middle">envelope v1</text>
  <path class="edge amber" d="M400 148 V182" marker-end="url(#arrow-amber)"/>
  <text class="code small amber" x="414" y="170">(1, 'upgrade1)</text>
  <rect class="node amber" x="340" y="188" width="120" height="34" rx="6"/>
  <text class="code small" x="400" y="210" text-anchor="middle">envelope v2</text>
  <path class="edge amber" d="M400 222 V256" marker-end="url(#arrow-amber)"/>
  <text class="code small amber" x="414" y="244">(2, 'upgrade2)</text>
  <rect class="node accent" x="340" y="262" width="120" height="34" rx="6"/>
  <text class="code small" x="400" y="284" text-anchor="middle">envelope v3</text>
  <text class="small muted" x="540" y="134">each rung rewrites</text>
  <text class="small muted" x="540" y="150">the whole envelope,</text>
  <text class="small muted" x="540" y="166">keys and kind too</text>

  <path class="edge accent" d="M400 296 V320" marker-end="url(#arrow-accent)"/>
  <rect class="node accent" x="330" y="326" width="330" height="34" rx="6"/>
  <text class="small" x="345" y="348">dispatch on the migrated kind</text>
  <text class="small" x="330" y="384">then decode each field by override or passthrough;</text>
  <text class="small" x="330" y="402">a missing key fails unless the field has a default</text>

  <rect class="band amber" x="20" y="186" width="250" height="110" rx="6"/>
  <text class="small amber" x="34" y="208">validateUpcasters at splice time:</text>
  <text class="small" x="34" y="230">exactly one rung for every source</text>
  <text class="small" x="34" y="248">version in [1 .. currentVersion - 1],</text>
  <text class="small" x="34" y="266">no duplicate and no out-of-range</text>
  <text class="small" x="34" y="284">source</text>
</svg>
