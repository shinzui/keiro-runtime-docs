<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 468">
  <text class="heading" x="20" y="22">Flat</text>
  <text class="code small muted" x="70" y="22">toMermaidComposite</text>
  <rect class="node" x="20" y="36" width="230" height="34" rx="5"/>
  <text class="code small" x="135" y="58" text-anchor="middle">AlertQuiescent_EmailPending</text>
  <path class="edge" d="M250 53 H424" marker-end="url(#arrow)"/>
  <text class="code small muted" x="337" y="46" text-anchor="middle">TriggerAlert / EmailSent</text>
  <rect class="node" x="430" y="36" width="230" height="34" rx="5"/>
  <text class="code small" x="545" y="58" text-anchor="middle">AlertEmitted_EmailSentVertex</text>

  <text class="heading" x="20" y="110">Nested</text>
  <text class="code small muted" x="88" y="110">toMermaidCompositeNested</text>
  <rect class="group" x="12" y="120" width="300" height="122" rx="8"/>
  <text class="code small muted" x="24" y="140">state AlertQuiescent</text>
  <rect class="node" x="24" y="150" width="276" height="34" rx="5"/>
  <text class="code small" x="162" y="172" text-anchor="middle">AlertQuiescent_EmailPending</text>
  <rect class="node ghost" x="24" y="196" width="276" height="34" rx="5"/>
  <text class="code small muted" x="162" y="218" text-anchor="middle">AlertQuiescent_EmailSentVertex</text>
  <rect class="group" x="368" y="120" width="300" height="122" rx="8"/>
  <text class="code small muted" x="380" y="140">state AlertEmitted</text>
  <rect class="node ghost" x="380" y="150" width="276" height="34" rx="5"/>
  <text class="code small muted" x="518" y="172" text-anchor="middle">AlertEmitted_EmailPending</text>
  <rect class="node" x="380" y="196" width="276" height="34" rx="5"/>
  <text class="code small" x="518" y="218" text-anchor="middle">AlertEmitted_EmailSentVertex</text>
  <path class="edge" d="M300 167 H334 V213 H374" marker-end="url(#arrow)"/>
  <text class="small muted" x="340" y="262" text-anchor="middle">the edge stays at the top level and uses the same flat ids</text>

  <text class="heading" x="20" y="304">Parallel arms</text>
  <text class="code small muted" x="138" y="304">toMermaidAlternative</text>
  <rect class="group" x="12" y="314" width="300" height="94" rx="8"/>
  <text class="code small muted" x="24" y="334">state LeftArm</text>
  <rect class="node" x="24" y="346" width="112" height="34" rx="5"/>
  <text class="code small" x="80" y="368" text-anchor="middle">EmailPending</text>
  <path class="edge" d="M136 363 H170" marker-end="url(#arrow)"/>
  <rect class="node" x="176" y="346" width="124" height="34" rx="5"/>
  <text class="code small" x="238" y="368" text-anchor="middle">EmailSentVertex</text>
  <text class="small muted" x="162" y="400" text-anchor="middle">SendEmail / EmailSent</text>
  <rect class="group" x="368" y="314" width="300" height="94" rx="8"/>
  <text class="code small muted" x="380" y="334">state RightArm</text>
  <rect class="node" x="380" y="346" width="112" height="34" rx="5"/>
  <text class="code small" x="436" y="368" text-anchor="middle">PingIdle</text>
  <path class="edge" d="M492 363 H526" marker-end="url(#arrow)"/>
  <rect class="node" x="532" y="346" width="124" height="34" rx="5"/>
  <text class="code small" x="594" y="368" text-anchor="middle">PingDone</text>
  <text class="small muted" x="518" y="400" text-anchor="middle">Ping / Pong</text>
  <text class="small muted" x="340" y="436" text-anchor="middle">each arm has its own initial marker; the product vertex stays implicit</text>
  <text class="small muted" x="340" y="456" text-anchor="middle">grey boxes: declared in a block, but no edge or final line uses them</text>
</svg>
