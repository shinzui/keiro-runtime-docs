<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290">
  <text class="heading" x="20" y="22">Slot list order</text>
  <rect class="node" x="20" y="34" width="150" height="34" rx="5"/>
  <text class="code small" x="95" y="56" text-anchor="middle">retryCount</text>
  <rect class="node" x="180" y="34" width="150" height="34" rx="5"/>
  <text class="code small" x="255" y="56" text-anchor="middle">cooldownUntil</text>
  <rect class="node" x="340" y="34" width="150" height="34" rx="5"/>
  <text class="code small" x="415" y="56" text-anchor="middle">correlationId</text>

  <text class="code" x="20" y="110">regFileToJSON</text>
  <text class="small muted" x="190" y="110">builds an Aeson.Value through KeyMap</text>
  <rect class="band violet" x="20" y="120" width="640" height="40" rx="5"/>
  <text class="code small" x="36" y="145">{"cooldownUntil": …, "correlationId": …, "retryCount": …}</text>
  <text class="small violet" x="644" y="145" text-anchor="end">alphabetical</text>

  <text class="code" x="20" y="196">regFileToEncoding</text>
  <text class="small muted" x="210" y="196">streams an Aeson.Series</text>
  <rect class="band accent" x="20" y="206" width="640" height="40" rx="5"/>
  <text class="code small" x="36" y="231">{"retryCount": …, "cooldownUntil": …, "correlationId": …}</text>
  <text class="small accent" x="644" y="231" text-anchor="end">slot order</text>

  <text class="small" x="20" y="276">Same JSON value, different bytes. Each path is deterministic, so pick one per persistence site.</text>
</svg>
