  <rect class="node" x="30" y="40" width="152" height="34" rx="5"/>
  <text class="code small" x="106" y="62" text-anchor="middle">RequiresConfirmation</text>
  <text class="code small muted" x="200" y="62" text-anchor="middle">--&gt;</text>
  <rect class="node" x="218" y="40" width="86" height="34" rx="5"/>
  <text class="code small" x="261" y="62" text-anchor="middle">Confirmed</text>
  <text class="code small muted" x="316" y="62" text-anchor="middle">:</text>
  <rect class="node accent" x="328" y="40" width="116" height="34" rx="5"/>
  <text class="code small" x="386" y="62" text-anchor="middle">ConfirmAccount</text>
  <text class="code small muted" x="456" y="62" text-anchor="middle">/</text>
  <rect class="node violet" x="468" y="40" width="130" height="34" rx="5"/>
  <text class="code small" x="533" y="62" text-anchor="middle">AccountConfirmed</text>

  <path class="edge dotted muted" d="M106 74 V100"/>
  <text class="code small" x="106" y="116" text-anchor="middle">idOf s</text>
  <text class="small muted" x="106" y="133" text-anchor="middle">vertexLabel = show</text>
  <path class="edge dotted muted" d="M261 74 V156"/>
  <text class="code small" x="261" y="172" text-anchor="middle">idOf (target e)</text>
  <path class="edge dotted accent" d="M386 74 V100"/>
  <text class="code small accent" x="386" y="116" text-anchor="middle">edgeInputName</text>
