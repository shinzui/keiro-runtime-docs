<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330">
  <rect class="node" x="170" y="20" width="340" height="62" rx="6"/>
  <text class="code" x="340" y="45" text-anchor="middle">SymTransducer phi rs s ci co</text>
  <text class="small muted" x="340" y="67" text-anchor="middle">each edge reads a command ci and emits events [co]</text>

  <path class="edge accent" d="M250 82 V146" marker-end="url(#arrow-accent)"/>
  <text class="small accent" x="238" y="110" text-anchor="end">π₁: drop the events</text>
  <path class="edge violet" d="M430 82 V146" marker-end="url(#arrow-violet)"/>
  <text class="small violet" x="442" y="110">π₂: drop the commands</text>
  <text class="small violet" x="442" y="126">by inverting ω</text>

  <rect class="node accent" x="20" y="152" width="310" height="164" rx="6"/>
  <text class="code bold" x="36" y="178">inputAcceptor t</text>
  <text class="code small" x="36" y="202">:: Acceptor ci (s, RegFile rs)</text>
  <text class="code small" x="36" y="232">aStep    = delta t</text>
  <text class="code small" x="36" y="254">aInitial = (initial t, initialRegs t)</text>
  <text class="code small" x="36" y="276">aIsFinal = isFinal t on s</text>
  <text class="small muted" x="36" y="302">language: accepted command sequences</text>

  <rect class="node violet" x="350" y="152" width="310" height="164" rx="6"/>
  <text class="code bold" x="366" y="178">outputAcceptor t</text>
  <text class="code small" x="366" y="202">:: Acceptor co (InFlight s co, RegFile rs)</text>
  <text class="code small" x="366" y="232">aStep    = applyEventStreaming t</text>
  <text class="code small" x="366" y="254">aInitial = (Settled (initial t), …)</text>
  <text class="code small" x="366" y="276">aIsFinal = Settled s and isFinal t s</text>
  <text class="small muted" x="366" y="302">language: replayable event logs</text>
</svg>
