<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 452">
  <text class="heading" x="20" y="22">Generic walk</text>
  <text class="code small" x="140" y="22">RegFieldsOfRep (Rep StartRegistrationData)</text>

  <rect class="node muted" x="250" y="36" width="180" height="34" rx="6"/>
  <text class="code" x="340" y="58" text-anchor="middle">M1 D</text>
  <text class="small muted" x="444" y="58">pass through</text>
  <path class="edge" d="M340 70 V90" marker-end="url(#arrow)"/>

  <rect class="node muted" x="250" y="96" width="180" height="34" rx="6"/>
  <text class="code" x="340" y="118" text-anchor="middle">M1 C</text>
  <text class="small muted" x="444" y="118">pass through</text>
  <path class="edge" d="M340 130 V150" marker-end="url(#arrow)"/>

  <rect class="node violet" x="270" y="156" width="140" height="34" rx="6"/>
  <text class="code violet" x="340" y="178" text-anchor="middle">l :*: r</text>
  <text class="small violet" x="424" y="178">Append l r</text>
  <path class="edge" d="M300 190 V206 H120 V224" marker-end="url(#arrow)"/>
  <path class="edge" d="M380 190 V206 H470 V224" marker-end="url(#arrow)"/>

  <rect class="node" x="20" y="230" width="200" height="54" rx="6"/>
  <text class="code small" x="120" y="252" text-anchor="middle">selector "email"</text>
  <text class="code small accent" x="120" y="272" text-anchor="middle">'("email", Email)</text>

  <rect class="node violet" x="400" y="240" width="140" height="34" rx="6"/>
  <text class="code violet" x="470" y="262" text-anchor="middle">l :*: r</text>
  <text class="small violet" x="554" y="262">Append l r</text>
  <path class="edge" d="M430 274 V290 H350 V308" marker-end="url(#arrow)"/>
  <path class="edge" d="M510 274 V290 H590 V308" marker-end="url(#arrow)"/>

  <rect class="node" x="230" y="314" width="240" height="54" rx="6"/>
  <text class="code small" x="350" y="336" text-anchor="middle">selector "confirmCode"</text>
  <text class="code small accent" x="350" y="356" text-anchor="middle">'("confirmCode", ConfirmationCode)</text>

  <rect class="node" x="490" y="314" width="170" height="54" rx="6"/>
  <text class="code small" x="575" y="336" text-anchor="middle">selector "at"</text>
  <text class="code small accent" x="575" y="356" text-anchor="middle">'("at", UTCTime)</text>

  <rect class="band accent" x="20" y="388" width="640" height="54" rx="6"/>
  <text class="code small" x="36" y="410">RegFieldsOf StartRegistrationData =</text>
  <text class="code small accent" x="36" y="430">'[ '("email", Email), '("confirmCode", ConfirmationCode), '("at", UTCTime) ]</text>
</svg>
