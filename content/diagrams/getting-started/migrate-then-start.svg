<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330">
  <text class="heading" x="20" y="24">1 · Migration gate: one pg-migrate plan</text>
  <rect class="band amber" x="8" y="34" width="664" height="118" rx="8"/>
  <rect class="node" x="22" y="50" width="140" height="32" rx="6"/>
  <text class="code small" x="92" y="70" text-anchor="middle">kirokuMigrations</text>
  <rect class="node" x="184" y="50" width="140" height="32" rx="6"/>
  <text class="code small" x="254" y="70" text-anchor="middle">keiroMigrations</text>
  <rect class="node" x="346" y="50" width="140" height="32" rx="6"/>
  <text class="code small" x="416" y="70" text-anchor="middle">pgmqMigrations</text>
  <rect class="node" x="508" y="50" width="150" height="32" rx="6"/>
  <text class="code small" x="583" y="70" text-anchor="middle">application</text>
  <path class="edge" d="M162 66 H180" marker-end="url(#arrow)"/>
  <path class="edge" d="M324 66 H342" marker-end="url(#arrow)"/>
  <path class="edge" d="M486 66 H504" marker-end="url(#arrow)"/>
  <text class="small muted" x="92" y="102" text-anchor="middle">schema kiroku</text>
  <text class="small muted" x="254" y="102" text-anchor="middle">schema keiro</text>
  <text class="small muted" x="416" y="102" text-anchor="middle">schema pgmq</text>
  <text class="small muted" x="583" y="102" text-anchor="middle">app schemas</text>
  <text class="small" x="24" y="136">Own migration connection and advisory lock. Apply the plan, then verify it.</text>

  <path class="axis amber dashed" d="M8 176 H672"/>
  <text class="small amber halo" x="340" y="180" text-anchor="middle">gate succeeds</text>

  <text class="heading" x="20" y="214">2 · Runtime start: caller-owned pools</text>
  <rect class="band accent" x="8" y="224" width="664" height="96" rx="8"/>
  <rect class="node accent" x="22" y="240" width="140" height="34" rx="6"/>
  <text class="small" x="92" y="261" text-anchor="middle">create Hasql pools</text>
  <rect class="node accent" x="184" y="240" width="140" height="34" rx="6"/>
  <text class="small" x="254" y="261" text-anchor="middle">reconcile queues</text>
  <rect class="node accent" x="346" y="240" width="140" height="34" rx="6"/>
  <text class="small" x="416" y="261" text-anchor="middle">construct adapters</text>
  <rect class="node accent" x="508" y="240" width="150" height="34" rx="6"/>
  <text class="small" x="583" y="261" text-anchor="middle">start workers</text>
  <path class="edge" d="M162 257 H180" marker-end="url(#arrow)"/>
  <path class="edge" d="M324 257 H342" marker-end="url(#arrow)"/>
  <path class="edge" d="M486 257 H504" marker-end="url(#arrow)"/>
  <text class="small" x="24" y="304">Stores and adapters use these pools during normal operation.</text>
</svg>
