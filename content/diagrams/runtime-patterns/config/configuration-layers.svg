<rect x="241" y="66" width="178" height="65" rx="7" class="node amber"/><text x="330.0" y="102.5" class="bold" text-anchor="middle">Mounted secrets</text>
<rect x="458" y="66" width="178" height="65" rx="7" class="node accent"/><text x="547.0" y="98.5" class="bold" text-anchor="middle">Explicit environment</text><text x="547.0" y="116.5" class="small" text-anchor="middle">Higher precedence</text>
<path d="M 206 99 L 237 99" class="edge " marker-end="url(#arrow)"/>
<path d="M 423 99 L 454 99" class="edge " marker-end="url(#arrow)"/>
