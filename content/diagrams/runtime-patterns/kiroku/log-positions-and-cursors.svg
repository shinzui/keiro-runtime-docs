<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440">
<text x="24" y="28" class="title" text-anchor="start">Three coordinates answer different questions</text>
<text x="24" y="75" class="heading" text-anchor="start">Stream A versions</text>
<rect x="185" y="55" width="100" height="42" rx="7" class="node accent"/><text x="235.0" y="80.0" class="bold" text-anchor="middle">1</text>
<rect x="300" y="55" width="100" height="42" rx="7" class="node accent"/><text x="350.0" y="80.0" class="bold" text-anchor="middle">2</text>
<rect x="415" y="55" width="100" height="42" rx="7" class="node accent"/><text x="465.0" y="80.0" class="bold" text-anchor="middle">3</text>
<text x="24" y="159" class="heading" text-anchor="start">Global positions</text>
<rect x="185" y="135" width="100" height="42" rx="7" class="node "/><text x="235.0" y="160.0" class="bold" text-anchor="middle">8</text>
<rect x="300" y="135" width="100" height="42" rx="7" class="node "/><text x="350.0" y="160.0" class="bold" text-anchor="middle">13</text>
<rect x="415" y="135" width="100" height="42" rx="7" class="node "/><text x="465.0" y="160.0" class="bold" text-anchor="middle">21</text>
<text x="24" y="227" class="heading" text-anchor="start">Read after 13</text>
<path d="M 350 185 V 215 H 460 V 189" class="edge green" marker-end="url(#arrow)"/>
<text x="490" y="227" class="small" text-anchor="middle">Returns 21</text>
<rect x="24" y="272" width="612" height="104" rx="9" class="group "/><text x="38" y="295" class="heading" text-anchor="start">After deleting the visible tail</text>
<text x="44" y="313" class="small" text-anchor="start">Append frontier: 21 remains monotonic.</text>
<text x="44" y="343" class="small" text-anchor="start">Visible head: 13 is the reachable catch-up target.</text>
<text x="330" y="413" class="small" text-anchor="middle">Cursors are exclusive and global positions are not contiguous.</text>
</svg>
