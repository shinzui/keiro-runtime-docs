<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430">
<text x="24" y="28" class="title" text-anchor="start">Durable handoff with stable identity</text>
<rect x="24" y="60" width="270" height="132" rx="9" class="group "/><text x="38" y="83" class="heading" text-anchor="start">Local enqueue transaction</text>
<rect x="44" y="108" width="230" height="67" rx="7" class="node green"/><text x="159.0" y="141.5" class="bold" text-anchor="middle">State + outbox row</text><text x="159.0" y="159.5" class="small" text-anchor="middle">Commit or roll back together</text>
<rect x="360" y="107" width="270" height="68" rx="7" class="node amber"/><text x="495.0" y="141.0" class="bold" text-anchor="middle">Publisher + broker</text><text x="495.0" y="159.0" class="small" text-anchor="middle">Outside business transaction</text>
<path d="M 296 140 L 356 140" class="edge " marker-end="url(#arrow)"/>
<text x="330" y="216" class="small" text-anchor="middle">At-least-once delivery; retain message identity</text>
<rect x="172" y="247" width="316" height="141" rx="9" class="group "/><text x="186" y="270" class="heading" text-anchor="start">Consumer transaction</text>
<rect x="193" y="292" width="274" height="64" rx="7" class="node green"/><text x="330.0" y="324.0" class="bold" text-anchor="middle">Effect + inbox receipt</text><text x="330.0" y="342.0" class="small" text-anchor="middle">Duplicate skips the effect</text>
<path d="M 495 179 V 228 H 330 V 243" class="edge " marker-end="url(#arrow)"/>
<text x="330" y="415" class="small" text-anchor="middle">Receipt retention defines the deduplication window.</text>
</svg>
