<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420">
<text x="24" y="28" class="title" text-anchor="start">Finalization controls durable checkpoint movement</text>
<rect x="230" y="65" width="200" height="55" rx="7" class="node accent"/><text x="330.0" y="96.5" class="bold" text-anchor="middle">Delivered event</text>
<path d="M 330 122 L 330 161" class="edge " marker-end="url(#arrow)"/>
<rect x="24" y="166" width="612" height="182" rx="9" class="group "/><text x="38" y="189" class="heading" text-anchor="start">Framework-owned finalization</text>
<rect x="44" y="216" width="130" height="73" rx="7" class="node green"/><text x="109.0" y="252.5" class="bold" text-anchor="middle">AckOk</text><text x="109.0" y="270.5" class="small" text-anchor="middle">Advance</text>
<rect x="190" y="216" width="130" height="73" rx="7" class="node amber"/><text x="255.0" y="252.5" class="bold" text-anchor="middle">AckRetry</text><text x="255.0" y="270.5" class="small" text-anchor="middle">Same event</text>
<rect x="336" y="216" width="130" height="73" rx="7" class="node rose"/><text x="401.0" y="252.5" class="bold" text-anchor="middle">Dead letter</text><text x="401.0" y="270.5" class="small" text-anchor="middle">Audit + advance</text>
<rect x="482" y="216" width="130" height="73" rx="7" class="node muted"/><text x="547.0" y="252.5" class="bold" text-anchor="middle">AckHalt</text><text x="547.0" y="270.5" class="small" text-anchor="middle">No advance</text>
<path d="M 330 163 H 109 V 211" class="edge " marker-end="url(#arrow)"/>
<path d="M 330 163 H 255 V 211" class="edge " marker-end="url(#arrow)"/>
<path d="M 330 163 H 401 V 211" class="edge " marker-end="url(#arrow)"/>
<path d="M 330 163 H 547 V 211" class="edge " marker-end="url(#arrow)"/>
<text x="330" y="382" class="small" text-anchor="middle">Retries are bounded; deterministic poison needs a decision.</text>
<text x="330" y="408" class="small" text-anchor="middle">Every handler effect must remain idempotent.</text>
</svg>
