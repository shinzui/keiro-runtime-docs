<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480">
<text x="24" y="28" class="title" text-anchor="start">Budget the retries the released classifier allows</text>
<rect x="24" y="64" width="612" height="57" rx="7" class="node rose"/><text x="330.0" y="96.5" class="bold" text-anchor="middle">Released first in-flight disconnect can be permanent</text>
<text x="330" y="150" class="small" text-anchor="middle">The classifier fix is implemented but unreleased.</text>
<rect x="24" y="180" width="612" height="106" rx="9" class="group "/><text x="38" y="203" class="heading" text-anchor="start">Transient poll or ack: separate budgets</text>
<rect x="44" y="223" width="90" height="44" rx="7" class="node "/><text x="89.0" y="249.0" class="bold" text-anchor="middle">Try 1</text>
<rect x="164" y="223" width="90" height="44" rx="7" class="node "/><text x="209.0" y="249.0" class="bold" text-anchor="middle">Try 2</text>
<rect x="284" y="223" width="90" height="44" rx="7" class="node "/><text x="329.0" y="249.0" class="bold" text-anchor="middle">Try 3</text>
<rect x="404" y="223" width="90" height="44" rx="7" class="node "/><text x="449.0" y="249.0" class="bold" text-anchor="middle">Try 4</text>
<rect x="524" y="223" width="90" height="44" rx="7" class="node "/><text x="569.0" y="249.0" class="bold" text-anchor="middle">Try 5</text>
<path d="M 138 244 L 160 244" class="edge " marker-end="url(#arrow)"/>
<path d="M 258 244 L 280 244" class="edge " marker-end="url(#arrow)"/>
<path d="M 378 244 L 400 244" class="edge " marker-end="url(#arrow)"/>
<path d="M 498 244 L 520 244" class="edge " marker-end="url(#arrow)"/>
<text x="149" y="213" class="small" text-anchor="middle">0.1 s</text>
<text x="269" y="213" class="small" text-anchor="middle">0.2 s</text>
<text x="389" y="213" class="small" text-anchor="middle">0.4 s</text>
<text x="509" y="213" class="small" text-anchor="middle">0.8 s</text>
<rect x="24" y="322" width="284" height="75" rx="7" class="node amber"/><text x="166.0" y="359.5" class="bold" text-anchor="middle">Default wait: 1.5 seconds</text><text x="166.0" y="377.5" class="small" text-anchor="middle">Excludes operation duration</text>
<rect x="359" y="322" width="277" height="75" rx="7" class="node rose"/><text x="497.5" y="359.5" class="bold" text-anchor="middle">Exhaustion fails the worker</text><text x="497.5" y="377.5" class="small" text-anchor="middle">Supervision owns restart</text>
<text x="330" y="431" class="small" text-anchor="middle">An enqueue may commit even when its reply is lost.</text>
<text x="330" y="462" class="small" text-anchor="middle">Reconcile using producer identity; do not key on MessageId.</text>
</svg>
