<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 375">
<text x="24" y="28" class="title" text-anchor="start">One absolute head per group</text>
<rect x="24" y="63" width="612" height="120" rx="9" class="group "/><text x="38" y="86" class="heading" text-anchor="start">Group A</text>
<rect x="44" y="106" width="168" height="53" rx="7" class="node rose"/><text x="128.0" y="136.5" class="bold" text-anchor="middle">A1: invisible</text>
<rect x="239" y="106" width="168" height="53" rx="7" class="node "/><text x="323.0" y="136.5" class="bold" text-anchor="middle">A2: waits</text>
<rect x="435" y="106" width="181" height="53" rx="7" class="node "/><text x="525.5" y="136.5" class="bold" text-anchor="middle">A3: waits</text>
<path d="M 216 132 L 235 132" class="edge " marker-end="url(#arrow)"/>
<path d="M 411 132 L 431 132" class="edge " marker-end="url(#arrow)"/>
<rect x="24" y="219" width="612" height="120" rx="9" class="group "/><text x="38" y="242" class="heading" text-anchor="start">Group B</text>
<rect x="44" y="262" width="168" height="53" rx="7" class="node green"/><text x="128.0" y="292.5" class="bold" text-anchor="middle">B1: eligible</text>
<rect x="239" y="262" width="168" height="53" rx="7" class="node "/><text x="323.0" y="292.5" class="bold" text-anchor="middle">B2: waits</text>
<rect x="435" y="262" width="181" height="53" rx="7" class="node "/><text x="525.5" y="292.5" class="bold" text-anchor="middle">B3: waits</text>
<path d="M 216 288 L 235 288" class="edge " marker-end="url(#arrow)"/>
<path d="M 411 288 L 431 288" class="edge " marker-end="url(#arrow)"/>
<text x="330" y="369" class="small" text-anchor="middle">Batch size counts groups, not successors from one group.</text>
</svg>
