<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 448">
<text x="24" y="28" class="title" text-anchor="start">Completeness and proof strength are separate</text>
<rect x="24" y="67" width="250" height="68" rx="7" class="node accent"/><text x="149.0" y="101.0" class="bold" text-anchor="middle">Spec-derived obligations</text><text x="149.0" y="119.0" class="small" text-anchor="middle">Live, rejection, replay keys</text>
<rect x="378" y="67" width="258" height="68" rx="7" class="node violet"/><text x="507.0" y="101.0" class="bold" text-anchor="middle">Executed typed witnesses</text><text x="507.0" y="119.0" class="small" text-anchor="middle">Run through codec + replay</text>
<path d="M 150 139 V 166 H 330 V 191" class="edge " marker-end="url(#arrow)"/>
<path d="M 508 139 V 166 H 330 V 191" class="edge " marker-end="url(#arrow)"/>
<rect x="130" y="196" width="400" height="53" rx="7" class="node "/><text x="330.0" y="226.5" class="bold" text-anchor="middle">Nine report buckets</text>
<path d="M 330 253 V 274 H 166 V 291" class="edge " marker-end="url(#arrow)"/>
<path d="M 330 274 H 498 V 291" class="edge " marker-end="url(#arrow)"/>
<rect x="24" y="296" width="284" height="74" rx="7" class="node green"/><text x="166.0" y="333.0" class="bold" text-anchor="middle">Completeness gate</text><text x="166.0" y="351.0" class="small" text-anchor="middle">No pending/missing/duplicate</text>
<rect x="359" y="296" width="277" height="74" rx="7" class="node amber"/><text x="497.5" y="333.0" class="bold" text-anchor="middle">Proof-strength policy</text><text x="497.5" y="351.0" class="small" text-anchor="middle">Default permits unverified</text>
<text x="166" y="397" class="small" text-anchor="middle">Also no stale or failed keys</text>
<text x="498" y="397" class="small" text-anchor="middle">Stronger gate is deliberate</text>
<text x="330" y="433" class="small" text-anchor="middle">Close gaps with witnesses or a reconciled spec change.</text>
</svg>
