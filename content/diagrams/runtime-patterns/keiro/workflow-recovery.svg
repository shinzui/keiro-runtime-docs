<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420">
<text x="24" y="28" class="title" text-anchor="start">Recovery preserves completed journal work</text>
<rect x="24" y="63" width="284" height="242" rx="9" class="group "/><text x="38" y="86" class="heading" text-anchor="start">Immutable workflow journal</text>
<rect x="44" y="112" width="244" height="48" rx="7" class="node green"/><text x="166.0" y="140.0" class="bold" text-anchor="middle">Step A recorded</text>
<rect x="44" y="177" width="244" height="48" rx="7" class="node green"/><text x="166.0" y="205.0" class="bold" text-anchor="middle">Step B recorded</text>
<rect x="44" y="242" width="244" height="48" rx="7" class="node rose"/><text x="166.0" y="270.0" class="bold" text-anchor="middle">WorkflowFailed</text>
<rect x="359" y="63" width="277" height="242" rx="9" class="group "/><text x="373" y="86" class="heading" text-anchor="start">Instance lifecycle</text>
<rect x="381" y="112" width="233" height="48" rx="7" class="node rose"/><text x="497.5" y="140.0" class="bold" text-anchor="middle">Failed; no discovery</text>
<rect x="381" y="203" width="233" height="73" rx="7" class="node amber"/><text x="497.5" y="239.5" class="bold" text-anchor="middle">Repair, then resurrect</text><text x="497.5" y="257.5" class="small" text-anchor="middle">Reset derived failure state</text>
<path d="M 498 163 L 498 198" class="edge " marker-end="url(#arrow)"/>
<path d="M 499 308 V 347 H 164 V 309" class="edge accent" marker-end="url(#arrow)"/>
<text x="330" y="370" class="small" text-anchor="middle">Replay A and B; execute only fresh boundaries.</text>
<text x="330" y="402" class="small" text-anchor="middle">Lease loss stops fresh side effects at the boundary.</text>
</svg>
