<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470">
<text x="24" y="28" class="title" text-anchor="start">Build beside serving, then promote atomically</text>
<rect x="24" y="63" width="284" height="160" rx="9" class="group "/><text x="38" y="86" class="heading" text-anchor="start">Serving revision V1</text>
<rect x="44" y="112" width="244" height="71" rx="7" class="node green"/><text x="166.0" y="147.5" class="bold" text-anchor="middle">Current target generation</text><text x="166.0" y="165.5" class="small" text-anchor="middle">Live inline + async writers</text>
<rect x="359" y="63" width="277" height="160" rx="9" class="group "/><text x="373" y="86" class="heading" text-anchor="start">Candidate revision V2</text>
<rect x="379" y="112" width="237" height="71" rx="7" class="node violet"/><text x="497.5" y="147.5" class="bold" text-anchor="middle">Staging generation</text><text x="497.5" y="165.5" class="small" text-anchor="middle">Provision, replay, verify</text>
<text x="330" y="248" class="small" text-anchor="middle">V1 serves during candidate replay.</text>
<rect x="24" y="281" width="250" height="68" rx="7" class="node amber"/><text x="149.0" y="315.0" class="bold" text-anchor="middle">Fence + final head</text><text x="149.0" y="333.0" class="small" text-anchor="middle">Prepare dedup + checkpoints</text>
<rect x="378" y="281" width="258" height="68" rx="7" class="node green"/><text x="507.0" y="315.0" class="bold" text-anchor="middle">One promotion transaction</text><text x="507.0" y="333.0" class="small" text-anchor="middle">Bounded relation locks</text>
<path d="M 278 315 L 374 315" class="edge " marker-end="url(#arrow)"/>
<path d="M 498 228 V 260 H 150 V 276" class="edge " marker-end="url(#arrow)"/>
<path d="M 150 226 V 276" class="edge " marker-end="url(#arrow)"/>
<rect x="378" y="394" width="258" height="48" rx="7" class="node green"/><text x="507.0" y="422.0" class="bold" text-anchor="middle">V2 serves; epoch advances</text>
<path d="M 508 353 L 508 389" class="edge " marker-end="url(#arrow)"/>
<text x="24" y="418" class="small" text-anchor="start">Retired V1 receives no writes.</text>
<text x="330" y="462" class="small" text-anchor="middle">A lock timeout or DDL race rolls promotion back.</text>
</svg>
