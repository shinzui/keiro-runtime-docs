<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420">
<text x="24" y="28" class="title" text-anchor="start">Checked wiring inside one durable identity</text>
<rect x="24" y="63" width="612" height="192" rx="9" class="group "/><text x="38" y="86" class="heading" text-anchor="start">One identity, version check, append, and replay</text>
<rect x="44" y="117" width="173" height="63" rx="7" class="node accent"/><text x="130.5" y="148.5" class="bold" text-anchor="middle">Transducer A</text><text x="130.5" y="166.5" class="small" text-anchor="middle">Trusted output</text>
<rect x="243" y="117" width="174" height="63" rx="7" class="node amber"/><text x="330.0" y="148.5" class="bold" text-anchor="middle">Alignment check</text><text x="330.0" y="166.5" class="small" text-anchor="middle">Typed schemas</text>
<rect x="442" y="117" width="173" height="63" rx="7" class="node violet"/><text x="528.5" y="148.5" class="bold" text-anchor="middle">Transducer B</text><text x="528.5" y="166.5" class="small" text-anchor="middle">Trusted input</text>
<path d="M 221 150 L 239 150" class="edge " marker-end="url(#arrow)"/>
<path d="M 420 150 L 438 150" class="edge " marker-end="url(#arrow)"/>
<text x="330" y="227" class="small" text-anchor="middle">Equal names alone cannot justify schema alignment.</text>
<rect x="45" y="307" width="246" height="70" rx="7" class="node rose"/><text x="168.0" y="342.0" class="bold" text-anchor="middle">Mismatch or poison</text><text x="168.0" y="360.0" class="small" text-anchor="middle">Refuse suspicious wiring</text>
<rect x="370" y="307" width="246" height="70" rx="7" class="node green"/><text x="493.0" y="342.0" class="bold" text-anchor="middle">Compatible boundary</text><text x="493.0" y="360.0" class="small" text-anchor="middle">Still validate replay</text>
<path d="M 330 258 V 282 H 168 V 302" class="edge rose" marker-end="url(#arrow)"/>
<path d="M 330 282 H 493 V 302" class="edge green" marker-end="url(#arrow)"/>
<text x="330" y="410" class="small" text-anchor="middle">Independent aggregate identities stay on separate streams.</text>
</svg>
