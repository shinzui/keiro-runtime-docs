<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430">
<text x="24" y="28" class="title" text-anchor="start">A page boundary can cut through an event chain</text>
<rect x="24" y="64" width="612" height="152" rx="9" class="group "/><text x="38" y="87" class="heading" text-anchor="start">One edge emits three events</text>
<rect x="46" y="110" width="170" height="61" rx="7" class="node accent"/><text x="131.0" y="140.5" class="bold" text-anchor="middle">Head event</text><text x="131.0" y="158.5" class="small" text-anchor="middle">Select edge; update once</text>
<rect x="243" y="110" width="173" height="61" rx="7" class="node "/><text x="329.5" y="144.5" class="bold" text-anchor="middle">Tail event B</text>
<rect x="442" y="110" width="173" height="61" rx="7" class="node "/><text x="528.5" y="144.5" class="bold" text-anchor="middle">Tail event C</text>
<path d="M 220 140 L 239 140" class="edge " marker-end="url(#arrow)"/>
<path d="M 420 140 L 438 140" class="edge " marker-end="url(#arrow)"/>
<text x="330" y="199" class="small" text-anchor="middle">Equality-check queued tails; do not apply the update again.</text>
<rect x="24" y="258" width="284" height="103" rx="9" class="group "/><text x="38" y="281" class="heading" text-anchor="start">Page 1</text>
<rect x="44" y="294" width="244" height="48" rx="7" class="node amber"/><text x="166.0" y="322.0" class="bold" text-anchor="middle">InFlight: C remains</text>
<rect x="359" y="258" width="277" height="103" rx="9" class="group "/><text x="373" y="281" class="heading" text-anchor="start">Page 2</text>
<rect x="379" y="294" width="237" height="48" rx="7" class="node green"/><text x="497.5" y="322.0" class="bold" text-anchor="middle">C consumed → Settled</text>
<path d="M 312 318 L 355 318" class="edge " marker-end="url(#arrow)"/>
<text x="330" y="400" class="small" text-anchor="middle">Paged replay retains InFlight across pages.</text>
<text x="330" y="425" class="small" text-anchor="middle">Strict end-of-log replay refuses a remaining tail.</text>
</svg>
