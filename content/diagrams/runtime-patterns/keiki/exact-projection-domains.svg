<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400">
<text x="24" y="28" class="title" text-anchor="start">Exactness covers both directions</text>
<rect x="24" y="83" width="252" height="78" rx="7" class="node accent"/><text x="150.0" y="122.0" class="bold" text-anchor="middle">Real owner values</text><text x="150.0" y="140.0" class="small" text-anchor="middle">Every owner projects into D</text>
<rect x="380" y="83" width="256" height="78" rx="7" class="node violet"/><text x="508.0" y="122.0" class="bold" text-anchor="middle">Declared image D</text><text x="508.0" y="140.0" class="small" text-anchor="middle">Every key reconstructs</text>
<path d="M 280 113 L 376 113" class="edge " marker-end="url(#arrow)"/>
<path d="M 380 147 H 330 V 183 H 150 V 167" class="edge violet" marker-end="url(#arrow)"/>
<text x="330" y="72" class="small" text-anchor="middle">Total getter</text>
<text x="330" y="206" class="small" text-anchor="middle">Inverse succeeds and getter returns the same key.</text>
<rect x="24" y="242" width="612" height="109" rx="9" class="group "/><text x="38" y="265" class="heading" text-anchor="start">Conformance obligations</text>
