<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <text class="heading" x="16" y="24">Routing key</text>
  <text class="heading" x="250" y="24">Binding pattern</text>
  <text class="heading" x="470" y="24">Queue</text>

  <rect class="node accent" x="16" y="40" width="180" height="32" rx="5"/>
  <text class="code small" x="30" y="60">orders.created</text>
  <rect class="node violet" x="16" y="168" width="180" height="32" rx="5"/>
  <text class="code small" x="30" y="188">orders.payment.failed</text>

  <rect class="node" x="250" y="40" width="150" height="32" rx="5"/>
  <text class="code small" x="264" y="60">orders.*</text>
  <rect class="node" x="250" y="104" width="150" height="32" rx="5"/>
  <text class="code small" x="264" y="124">orders.#</text>
  <rect class="node" x="250" y="168" width="150" height="32" rx="5"/>
  <text class="code small" x="264" y="188">orders.*.failed</text>

  <rect class="node" x="470" y="40" width="194" height="32" rx="5"/>
  <text class="code small" x="484" y="60">order_events</text>
  <rect class="node" x="470" y="104" width="194" height="32" rx="5"/>
  <text class="code small" x="484" y="124">all_orders</text>
  <rect class="node" x="470" y="168" width="194" height="32" rx="5"/>
  <text class="code small" x="484" y="188">failed_orders</text>

  <path class="edge muted" d="M400 56 H466" marker-end="url(#arrow)"/>
  <path class="edge muted" d="M400 120 H466" marker-end="url(#arrow)"/>
  <path class="edge muted" d="M400 184 H466" marker-end="url(#arrow)"/>
  <text class="small muted" x="433" y="50" text-anchor="middle">bound</text>

  <path class="edge accent" d="M196 56 H246" marker-end="url(#arrow-accent)"/>
  <path class="edge accent" d="M196 64 H216 V114 H246" marker-end="url(#arrow-accent)"/>
  <path class="edge violet" d="M196 176 H230 V126 H246" marker-end="url(#arrow-violet)"/>
  <path class="edge violet" d="M196 184 H246" marker-end="url(#arrow-violet)"/>

  <text class="small" x="16" y="234"><tspan class="code">*</tspan> matches exactly one segment. <tspan class="code">#</tspan> matches zero or more segments.</text>
  <text class="small muted" x="16" y="256">Each key here matches two patterns, so sendTopic returns 2.</text>
</svg>
