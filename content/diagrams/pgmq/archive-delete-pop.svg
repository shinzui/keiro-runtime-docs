<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290">
  <text class="heading" x="180" y="24">Queue table</text>
  <text class="code small muted" x="180" y="42">pgmq.q_&lt;queue&gt;</text>
  <text class="heading" x="500" y="24">Archive table</text>
  <text class="code small muted" x="500" y="42">pgmq.a_&lt;queue&gt;</text>

  <rect class="band" x="16" y="56" width="648" height="60" rx="6"/>
  <text class="code bold" x="28" y="91">archiveMessage</text>
  <rect class="node accent" x="180" y="70" width="140" height="32" rx="5"/>
  <text class="code small" x="250" y="90" text-anchor="middle">msg_id 1</text>
  <path class="edge green" d="M320 86 H496" marker-end="url(#arrow-green)"/>
  <text class="small green" x="408" y="80" text-anchor="middle">row moves</text>
  <rect class="node green" x="500" y="70" width="140" height="32" rx="5"/>
  <text class="code small" x="570" y="90" text-anchor="middle">msg_id 1</text>

  <rect class="band" x="16" y="124" width="648" height="60" rx="6"/>
  <text class="code bold" x="28" y="159">deleteMessage</text>
  <rect class="node accent" x="180" y="138" width="140" height="32" rx="5"/>
  <text class="code small" x="250" y="158" text-anchor="middle">msg_id 1</text>
  <path class="edge rose dashed" d="M320 154 H356"/>
  <text class="small rose" x="364" y="158">row removed, no history</text>

  <rect class="band amber" x="16" y="192" width="648" height="60" rx="6"/>
  <text class="code bold" x="28" y="227">pop</text>
  <rect class="node accent" x="180" y="206" width="140" height="32" rx="5"/>
  <text class="code small" x="250" y="226" text-anchor="middle">msg_id 1</text>
  <path class="edge amber" d="M320 222 H356" marker-end="url(#arrow-amber)"/>
  <text class="small amber" x="364" y="218">returned and removed in one step</text>
  <text class="small amber" x="364" y="236">no lease, so no automatic retry</text>

  <text class="small muted" x="16" y="278">archiveMessage and deleteMessage both take the queue name and the message id.</text>
</svg>
