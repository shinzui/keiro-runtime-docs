<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330">
  <text class="code small bold" x="16" y="30">pgmq.meta</text>
  <rect class="node amber" x="16" y="44" width="180" height="32" rx="5"/>
  <text class="code small" x="30" y="64">'MyQueue'</text>
  <rect class="node" x="16" y="86" width="180" height="32" rx="5"/>
  <text class="code small" x="30" y="106">'myqueue'</text>

  <text class="code small bold" x="266" y="30">physical table</text>
  <rect class="node accent" x="266" y="56" width="180" height="50" rx="5"/>
  <text class="code small" x="356" y="78" text-anchor="middle">pgmq.q_myqueue</text>
  <text class="small" x="356" y="96" text-anchor="middle">one table, two names</text>
  <path class="edge" d="M196 60 H226 V74 H262" marker-end="url(#arrow)"/>
  <path class="edge" d="M196 102 H226 V88 H262" marker-end="url(#arrow)"/>
  <text class="small muted" x="16" y="142">pgmq.format_table_name lowercases both names.</text>

  <path class="edge" d="M356 106 V156" marker-end="url(#arrow)"/>
  <rect class="node" x="266" y="160" width="180" height="50" rx="5"/>
  <text class="small" x="356" y="181" text-anchor="middle">insert trigger looks up</text>
  <text class="code small" x="356" y="199" text-anchor="middle">'myqueue'</text>

  <text class="code small bold" x="486" y="150">notify_insert_throttle</text>
  <rect class="node amber" x="486" y="168" width="178" height="32" rx="5"/>
  <text class="code small" x="500" y="188">'MyQueue'</text>
  <path class="edge rose dashed" d="M446 184 H482" marker-end="url(#arrow-rose)"/>
  <text class="small rose" x="575" y="222" text-anchor="middle">never matches</text>

  <path class="axis dashed" d="M16 244 H664"/>
  <text class="code small bold" x="16" y="270">pgmq.acquire_queue_lock</text>
  <rect class="node rose" x="16" y="282" width="200" height="32" rx="5"/>
  <text class="code small" x="30" y="302">hash('MyQueue')</text>
  <rect class="node rose" x="236" y="282" width="200" height="32" rx="5"/>
  <text class="code small" x="250" y="302">hash('myqueue')</text>
  <text class="small" x="456" y="296">two locks for one table,</text>
  <text class="small" x="456" y="312">so mutations do not serialize</text>
</svg>
