<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330">
  <text class="heading" x="16" y="24">Queue messages by x-pgmq-group</text>
  <rect class="band" x="16" y="36" width="648" height="40" rx="6"/>
  <text class="code small" x="28" y="61">group A</text>
  <rect class="node accent" x="140" y="42" width="52" height="28" rx="4"/>
  <text class="code small" x="166" y="61" text-anchor="middle">a1</text>
  <rect class="node accent" x="202" y="42" width="52" height="28" rx="4"/>
  <text class="code small" x="228" y="61" text-anchor="middle">a2</text>
  <rect class="node accent" x="264" y="42" width="52" height="28" rx="4"/>
  <text class="code small" x="290" y="61" text-anchor="middle">a3</text>
  <rect class="band" x="16" y="84" width="648" height="40" rx="6"/>
  <text class="code small" x="28" y="109">group B</text>
  <rect class="node violet" x="140" y="90" width="52" height="28" rx="4"/>
  <text class="code small" x="166" y="109" text-anchor="middle">b1</text>
  <rect class="node violet" x="202" y="90" width="52" height="28" rx="4"/>
  <text class="code small" x="228" y="109" text-anchor="middle">b2</text>
  <rect class="band" x="16" y="132" width="648" height="40" rx="6"/>
  <text class="code small" x="28" y="157">group C</text>
  <rect class="node ghost" x="140" y="138" width="52" height="28" rx="4"/>
  <text class="code small muted" x="166" y="157" text-anchor="middle">c1</text>
  <rect class="node" x="202" y="138" width="52" height="28" rx="4"/>
  <text class="code small" x="228" y="157" text-anchor="middle">c2</text>
  <text class="small muted" x="270" y="157">head c1 is leased, so group C is skipped</text>
  <path class="axis dashed" d="M16 192 H664"/>
  <text class="heading" x="16" y="216">One read with qty = 4</text>
  <text class="code small bold" x="16" y="246">readGroupedRoundRobin</text>
  <text class="small muted" x="16" y="264">one per group, then the next layer</text>
  <rect class="node accent" x="300" y="232" width="52" height="28" rx="4"/>
  <text class="code small" x="326" y="251" text-anchor="middle">a1</text>
  <rect class="node violet" x="362" y="232" width="52" height="28" rx="4"/>
  <text class="code small" x="388" y="251" text-anchor="middle">b1</text>
  <rect class="node accent" x="424" y="232" width="52" height="28" rx="4"/>
  <text class="code small" x="450" y="251" text-anchor="middle">a2</text>
  <rect class="node violet" x="486" y="232" width="52" height="28" rx="4"/>
  <text class="code small" x="512" y="251" text-anchor="middle">b2</text>
  <text class="code small bold" x="16" y="298">readGrouped</text>
  <text class="small muted" x="16" y="316">fill from the earliest group first</text>
  <rect class="node accent" x="300" y="284" width="52" height="28" rx="4"/>
  <text class="code small" x="326" y="303" text-anchor="middle">a1</text>
  <rect class="node accent" x="362" y="284" width="52" height="28" rx="4"/>
  <text class="code small" x="388" y="303" text-anchor="middle">a2</text>
  <rect class="node accent" x="424" y="284" width="52" height="28" rx="4"/>
  <text class="code small" x="450" y="303" text-anchor="middle">a3</text>
  <rect class="node violet" x="486" y="284" width="52" height="28" rx="4"/>
  <text class="code small" x="512" y="303" text-anchor="middle">b1</text>
</svg>
