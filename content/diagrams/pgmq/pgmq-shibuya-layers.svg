<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <text class="heading" x="16" y="24">Layer and what it owns</text>
  <text class="heading" x="476" y="24">Use it for</text>

  <rect class="node violet" x="16" y="36" width="440" height="52" rx="6"/>
  <text class="code bold violet" x="30" y="58">keiro-pgmq</text>
  <text class="small" x="30" y="77">typed Job, JobOutcome, retry policy, provisioning</text>
  <text class="small" x="476" y="66">typed keiro background jobs</text>

  <rect class="node accent" x="16" y="100" width="440" height="52" rx="6"/>
  <text class="code bold accent" x="30" y="122">shibuya</text>
  <text class="small" x="30" y="141">handlers, AckDecision, ordering, supervision, health</text>
  <text class="small" x="476" y="130">a supervised worker runtime</text>

  <rect class="node amber" x="56" y="164" width="360" height="52" rx="6"/>
  <text class="code bold amber" x="70" y="186">shibuya-pgmq-adapter</text>
  <text class="small" x="70" y="205">pgmq rows to envelopes, decisions to pgmq calls</text>
  <text class="small" x="476" y="194">the bridge between the two</text>

  <rect class="node" x="16" y="228" width="440" height="52" rx="6"/>
  <text class="code bold" x="30" y="250">pgmq-hs</text>
  <text class="small" x="30" y="269">send, read, archive, delete, topics, FIFO, config, migration</text>
  <text class="small" x="476" y="258">low-level queue integration</text>

  <rect class="band" x="16" y="292" width="440" height="36" rx="6"/>
  <text class="small" x="30" y="315">PostgreSQL with the pgmq schema</text>

</svg>
