<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250">
  <text class="small muted" x="205" y="30" text-anchor="middle">read, readCount 1</text>
  <text class="small amber" x="396" y="30" text-anchor="end">vt expires</text>
  <text class="small muted" x="437" y="30">read, readCount 2</text>


  <path class="axis dashed" d="M205 38 V116"/>
  <path class="axis dashed amber" d="M400 38 V172"/>
  <path class="axis dashed" d="M432.5 38 V152"/>

  <text class="small" x="16" y="70">message row</text>
  <rect class="node muted" x="140" y="52" width="65" height="28" rx="3"/>
  <text class="small" x="172.5" y="70" text-anchor="middle">visible</text>
  <rect class="node accent" x="205" y="52" width="195" height="28" rx="3"/>
  <text class="small" x="302.5" y="70" text-anchor="middle">leased: vt = read + 30 s</text>
  <rect class="node muted" x="400" y="52" width="32.5" height="28" rx="3"/>
  <rect class="node accent" x="432.5" y="52" width="130" height="28" rx="3"/>
  <text class="small" x="497.5" y="70" text-anchor="middle">leased again</text>
  <rect class="node green" x="562.5" y="52" width="97.5" height="28" rx="3"/>
  <text class="small" x="611" y="70" text-anchor="middle">archived</text>

  <text class="small" x="16" y="120">worker A</text>
  <rect class="node" x="205" y="104" width="292.5" height="24" rx="3"/>
  <text class="small" x="220" y="120">handler runs longer than the timeout</text>

  <text class="small" x="16" y="156">worker B</text>
  <rect class="node violet" x="432.5" y="140" width="130" height="24" rx="3"/>
  <text class="small" x="497.5" y="156" text-anchor="middle">same message</text>
  <path class="edge green" d="M562.5 152 H586 V84" marker-end="url(#arrow-green)"/>
  <text class="small green" x="592" y="124">archive</text>

  <rect class="group amber" x="432.5" y="92" width="65" height="84" rx="3"/>
  <text class="small amber" x="465" y="190" text-anchor="middle">both workers handle it</text>

  <path class="axis" d="M140 210 H660" marker-end="url(#arrow)"/>
  <path class="axis" d="M205 206 V214"/>
  <path class="axis" d="M400 206 V214"/>
  <text class="small muted" x="205" y="230" text-anchor="middle">first read</text>
  <text class="small muted" x="400" y="230" text-anchor="middle">first read + 30 s</text>
  <text class="small muted" x="660" y="230" text-anchor="end">time</text>
</svg>
