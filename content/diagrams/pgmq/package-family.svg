<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <text class="heading" x="16" y="24">Queue client packages</text>
  <text class="heading" x="456" y="24">Schema package</text>

  <rect class="node accent" x="16" y="36" width="400" height="44" rx="5"/>
  <text class="code bold" x="30" y="55">pgmq-config</text>
  <text class="small" x="30" y="72">reconciles declared queue topology at startup</text>

  <rect class="node" x="16" y="100" width="400" height="44" rx="5"/>
  <text class="code bold" x="30" y="119">pgmq-effectful</text>
  <text class="small" x="30" y="136">effectful dynamic effect; can emit OpenTelemetry spans</text>

  <rect class="node" x="16" y="164" width="400" height="44" rx="5"/>
  <text class="code bold" x="30" y="183">pgmq-hasql</text>
  <text class="small" x="30" y="200">direct Hasql client: sessions and statements</text>

  <rect class="node violet" x="16" y="228" width="400" height="44" rx="5"/>
  <text class="code bold" x="30" y="247">pgmq-core</text>
  <text class="small" x="30" y="264">validated names and message types</text>

  <path class="edge" d="M216 80 V96" marker-end="url(#arrow)"/>
  <path class="edge" d="M216 144 V160" marker-end="url(#arrow)"/>
  <path class="edge" d="M216 208 V224" marker-end="url(#arrow)"/>

  <rect class="node amber" x="456" y="100" width="208" height="44" rx="5"/>
  <text class="code bold" x="470" y="119">pgmq-migration</text>
  <text class="small" x="470" y="136">PGMQ 1.13.0 schema</text>
  <path class="edge" d="M560 144 V160" marker-end="url(#arrow)"/>
  <rect class="node ghost" x="456" y="164" width="208" height="44" rx="5"/>
  <text class="code bold" x="470" y="183">pg-migrate</text>
  <text class="small muted" x="470" y="200">migration planner, separate project</text>

  <text class="small muted" x="16" y="292">Arrows point to dependencies. Each client package depends on every package below it.</text>
</svg>
