<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <path class="axis" d="M140 34 H664" marker-end="url(#arrow-muted)"/>
  <text class="small muted" x="664" y="26" text-anchor="end">time</text>
  <path class="axis dashed" d="M140 34 V250"/>
  <text class="small" x="140" y="26" text-anchor="middle">read</text>
  <path class="axis dashed amber" d="M480 34 V250"/>
  <text class="small amber" x="480" y="26" text-anchor="middle">lease ends</text>

  <text class="small bold" x="16" y="78">Ack in time</text>
  <rect class="band accent" x="140" y="58" width="340" height="14" rx="3"/>
  <text class="small accent" x="150" y="54">visibility lease</text>
  <rect class="node" x="140" y="80" width="160" height="26" rx="4"/>
  <text class="small" x="220" y="97" text-anchor="middle">handler runs</text>
  <circle class="dot green" cx="306" cy="93" r="5"/>
  <text class="small green" x="316" y="98">AckOk: deleteMessage</text>

  <text class="small bold" x="16" y="160">Slow handler</text>
  <rect class="band accent" x="140" y="140" width="340" height="14" rx="3"/>
  <text class="small accent" x="150" y="136">visibility lease</text>
  <rect class="node amber" x="140" y="162" width="460" height="26" rx="4"/>
  <text class="small" x="300" y="179" text-anchor="middle">handler still running</text>
  <rect class="node rose" x="500" y="200" width="150" height="26" rx="4"/>
  <text class="small" x="575" y="217" text-anchor="middle">read again, readCount 2</text>
  <path class="edge rose" d="M484 213 H496" marker-end="url(#arrow-rose)"/>
  <text class="small rose" x="472" y="244" text-anchor="end">visible again: PGMQ redelivers the message</text>

  <text class="small muted" x="16" y="282">With prefetch, keep bufferSize × batchSize × averageProcessingTime below visibilityTimeout.</text>
</svg>
