<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <text class="heading" x="16" y="22">Migration components, in plan order</text>
  <rect class="node amber" x="16" y="34" width="204" height="32" rx="6"/>
  <text class="code small" x="118" y="54" text-anchor="middle">kirokuMigrations</text>
  <rect class="node amber" x="238" y="34" width="204" height="32" rx="6"/>
  <text class="code small" x="340" y="54" text-anchor="middle">keiroMigrations</text>
  <rect class="node amber" x="460" y="34" width="204" height="32" rx="6"/>
  <text class="small" x="562" y="54" text-anchor="middle">application component</text>
  <path class="edge" d="M220 50 H234" marker-end="url(#arrow)"/>
  <path class="edge" d="M442 50 H456" marker-end="url(#arrow)"/>
  <path class="edge dashed" d="M118 66 V92" marker-end="url(#arrow)"/>
  <path class="edge dashed" d="M340 66 V92" marker-end="url(#arrow)"/>
  <path class="edge dashed" d="M562 66 V92" marker-end="url(#arrow)"/>

  <rect class="node" x="16" y="96" width="204" height="166" rx="6"/>
  <text class="code bold" x="32" y="120">kiroku</text>
  <text class="small muted" x="96" y="120">store</text>
  <text class="code small" x="32" y="146">events</text>
  <text class="code small" x="32" y="166">stream_events</text>
  <text class="code small" x="32" y="186">streams</text>
  <text class="code small" x="32" y="206">subscriptions</text>
  <text class="code small" x="32" y="226">dead_letters</text>

  <rect class="node" x="238" y="96" width="204" height="166" rx="6"/>
  <text class="code bold" x="254" y="120">keiro</text>
  <text class="small muted" x="304" y="120">framework</text>
  <text class="code small" x="254" y="146">keiro_read_models</text>
  <text class="code small" x="254" y="166">keiro_projection_dedup</text>
  <text class="code small" x="254" y="186">keiro_snapshots</text>
  <text class="code small" x="254" y="206">keiro_outbox, keiro_inbox</text>
  <text class="code small" x="254" y="226">keiro_timers</text>
  <text class="code small" x="254" y="246">keiro_workflows</text>

  <rect class="node" x="460" y="96" width="204" height="166" rx="6"/>
  <text class="code bold" x="476" y="120">app_reads</text>
  <text class="small muted" x="556" y="120">application</text>
  <text class="small" x="476" y="146">read-model tables</text>
  <text class="small muted" x="476" y="172">Name the table with</text>
  <text class="code small" x="476" y="192">qualifiedTableName</text>
  <text class="small muted" x="476" y="212">or</text>
  <text class="code small" x="496" y="212">qualifyTable</text>

  <text class="heading" x="16" y="312">Kiroku connection</text>
  <rect class="band accent" x="16" y="322" width="648" height="48" rx="8"/>
  <text class="code small" x="32" y="342">schema = "kiroku"</text>
  <text class="small muted" x="32" y="360">also sets the notification channel</text>
  <text class="code small" x="300" y="342">withProjectionSchema</text>
  <text class="small muted" x="300" y="360">adds app_reads to extraSearchPath</text>
  <path class="edge dashed accent" d="M200 318 V266" marker-end="url(#arrow-accent)"/>
  <path class="edge dashed accent" d="M562 318 V266" marker-end="url(#arrow-accent)"/>
</svg>
