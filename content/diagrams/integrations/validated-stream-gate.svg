<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 322">
  <text class="heading" x="16" y="24">Raw record</text>
  <rect class="node" x="16" y="36" width="190" height="214" rx="6"/>
  <text class="code bold" x="30" y="60">EventStream</text>
  <text class="code small accent" x="30" y="88">transducer</text>
  <text class="small muted" x="30" y="105">keiki SymTransducer</text>
  <text class="code small" x="30" y="130">initialState</text>
  <text class="code small" x="30" y="150">initialRegisters</text>
  <text class="code small" x="30" y="170">eventCodec</text>
  <text class="code small" x="30" y="190">snapshotPolicy</text>
  <text class="code small" x="30" y="210">stateCodec</text>
  <text class="code small" x="30" y="230">resolveStreamName</text>

  <path class="edge" d="M206 143 H228" marker-end="url(#arrow)"/>

  <text class="heading" x="234" y="24">Gate</text>
  <rect class="node accent" x="232" y="36" width="206" height="214" rx="6"/>
  <text class="code bold" x="246" y="60">mkEventStream label</text>
  <text class="small" x="246" y="86">keiki validateTransducer:</text>
  <text class="code small" x="258" y="108">hidden-input</text>
  <text class="code small" x="258" y="128">nondeterministic</text>
  <text class="code small" x="258" y="148">possibly-dead</text>
  <text class="code small muted" x="258" y="168">opaque-guard (opt-in)</text>
  <text class="small" x="246" y="200">snapshot policy needs</text>
  <text class="small" x="246" y="218">a stateCodec</text>

  <path class="edge green" d="M438 92 H462" marker-end="url(#arrow-green)"/>
  <path class="edge rose" d="M438 206 H462" marker-end="url(#arrow-rose)"/>

  <rect class="node green" x="466" y="36" width="198" height="118" rx="6"/>
  <text class="code bold green" x="480" y="60">Right</text>
  <text class="code small" x="524" y="60">ValidatedEventStream</text>
  <text class="small" x="480" y="86">accepted by:</text>
  <text class="code small" x="492" y="106">runCommand</text>
  <text class="code small" x="492" y="124">runCommandWithProjections</text>
  <text class="small" x="492" y="142">routers, process managers</text>

  <rect class="node rose" x="466" y="170" width="198" height="80" rx="6"/>
  <text class="code bold rose" x="480" y="194">Left</text>
  <text class="code small" x="520" y="194">[EventStreamWarning]</text>
  <text class="small" x="480" y="218">each warning names the label</text>
  <text class="small" x="480" y="236">refuse to start</text>

  <path class="edge dashed rose" d="M111 250 V270" marker-end="url(#arrow-rose)"/>
  <rect class="node rose dashed" x="16" y="274" width="422" height="36" rx="6"/>
  <text class="small" x="30" y="297">A bare</text>
  <text class="code small" x="73" y="297">EventStream</text>
  <text class="small" x="146" y="297">passed to a runner is a compile-time type error.</text>
</svg>
