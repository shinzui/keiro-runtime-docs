<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 332">
  <text class="heading" x="16" y="22">In-memory ledger by globalPosition</text>

  <path class="axis green" d="M120 58 V52 H296 V58"/>
  <text class="small green" x="208" y="46" text-anchor="middle">contiguous completed prefix</text>

  <rect class="band" x="16" y="64" width="648" height="48" rx="6"/>
  <text class="small bold" x="28" y="93">Ledger</text>
  <rect class="node green" x="120" y="72" width="80" height="32" rx="5"/>
  <text class="code small" x="160" y="92" text-anchor="middle">100</text>
  <rect class="node green" x="216" y="72" width="80" height="32" rx="5"/>
  <text class="code small" x="256" y="92" text-anchor="middle">101</text>
  <rect class="node amber" x="312" y="72" width="80" height="32" rx="5"/>
  <text class="code small" x="352" y="92" text-anchor="middle">102</text>
  <rect class="node green" x="408" y="72" width="80" height="32" rx="5"/>
  <text class="code small" x="448" y="92" text-anchor="middle">103</text>
  <rect class="node green" x="504" y="72" width="80" height="32" rx="5"/>
  <text class="code small" x="544" y="92" text-anchor="middle">104</text>
  <text class="small muted" x="208" y="130" text-anchor="middle">complete</text>
  <text class="small amber" x="352" y="130" text-anchor="middle">running or</text>
  <text class="small amber" x="352" y="146" text-anchor="middle">retrying</text>
  <text class="small muted" x="496" y="130" text-anchor="middle">complete</text>

  <path class="edge accent" d="M304 174 V110" marker-end="url(#arrow-accent)"/>
  <rect class="node accent" x="196" y="178" width="216" height="34" rx="6"/>
  <text class="small" x="304" y="199" text-anchor="middle">stored checkpoint = 101</text>

  <text class="heading" x="16" y="248">After a crash</text>
  <rect class="band" x="16" y="258" width="648" height="48" rx="6"/>
  <text class="small bold" x="28" y="287">Replay</text>
  <rect class="node dashed amber" x="312" y="266" width="80" height="32" rx="5"/>
  <text class="code small" x="352" y="286" text-anchor="middle">102</text>
  <rect class="node dashed amber" x="408" y="266" width="80" height="32" rx="5"/>
  <text class="code small" x="448" y="286" text-anchor="middle">103</text>
  <rect class="node dashed amber" x="504" y="266" width="80" height="32" rx="5"/>
  <text class="code small" x="544" y="286" text-anchor="middle">104</text>
  <text class="small muted" x="120" y="287">polls from 102</text>
  <text class="small muted" x="16" y="324">The handlers for 103 and 104 run a second time.</text>
</svg>
