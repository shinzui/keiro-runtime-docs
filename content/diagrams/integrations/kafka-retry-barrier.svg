<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318">
  <text class="heading" x="16" y="22">One partition, offsets 40 to 46</text>

  <text class="small bold" x="16" y="70">First poll</text>
  <rect class="band" x="108" y="46" width="556" height="44" rx="6"/>
  <rect class="node green" x="116" y="52" width="64" height="32" rx="5"/>
  <text class="code small" x="148" y="72" text-anchor="middle">40</text>
  <rect class="node green" x="194" y="52" width="64" height="32" rx="5"/>
  <text class="code small" x="226" y="72" text-anchor="middle">41</text>
  <rect class="node amber" x="272" y="52" width="64" height="32" rx="5"/>
  <text class="code small" x="304" y="72" text-anchor="middle">42</text>
  <rect class="node dashed" x="350" y="52" width="64" height="32" rx="5"/>
  <text class="code small muted" x="382" y="72" text-anchor="middle">43</text>
  <rect class="node dashed" x="428" y="52" width="64" height="32" rx="5"/>
  <text class="code small muted" x="460" y="72" text-anchor="middle">44</text>
  <rect class="node ghost" x="506" y="52" width="64" height="32" rx="5"/>
  <text class="code small muted" x="538" y="72" text-anchor="middle">45</text>
  <rect class="node ghost" x="584" y="52" width="64" height="32" rx="5"/>
  <text class="code small muted" x="616" y="72" text-anchor="middle">46</text>

  <text class="small green" x="187" y="108" text-anchor="middle">AckOk: offsets stored</text>
  <text class="small amber" x="304" y="108" text-anchor="middle">AckRetry</text>
  <text class="small muted" x="421" y="108" text-anchor="middle">buffered, then dropped</text>
  <text class="small muted" x="577" y="108" text-anchor="middle">not read yet</text>

  <path class="axis amber dashed" d="M265 40 V230"/>
  <text class="small amber" x="265" y="246" text-anchor="middle">retry barrier</text>

  <path class="edge amber" d="M460 116 V132 H304 V150" marker-end="url(#arrow-amber)"/>
  <text class="small amber" x="472" y="130">wait the delay,</text>
  <text class="small amber" x="472" y="146">then seek back to 42</text>

  <text class="small bold" x="16" y="178">After the seek</text>
  <rect class="band" x="108" y="154" width="556" height="44" rx="6"/>
  <rect class="node accent" x="272" y="160" width="64" height="32" rx="5"/>
  <text class="code small" x="304" y="180" text-anchor="middle">42</text>
  <rect class="node" x="350" y="160" width="64" height="32" rx="5"/>
  <text class="code small" x="382" y="180" text-anchor="middle">43</text>
  <rect class="node" x="428" y="160" width="64" height="32" rx="5"/>
  <text class="code small" x="460" y="180" text-anchor="middle">44</text>
  <text class="small accent" x="304" y="216" text-anchor="middle">redelivered</text>
  <text class="small muted" x="421" y="216" text-anchor="middle">polled again after 42</text>

  <rect class="node" x="16" y="262" width="648" height="44" rx="6"/>
  <text class="small" x="30" y="281">No stored offset passes the barrier until 42 resolves.</text>
  <text class="small muted" x="30" y="298">Shutdown commits the stored offsets. AckHalt pauses the partition and stores nothing.</text>
</svg>
