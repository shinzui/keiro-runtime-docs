name: CI

on:
  pull_request:
  push:
    branches:
      - master

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Quality gates (Nix, Bun + Node 22)
    env:
      KEIRO_DOCS_SKIP_FONTS: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      # The shared shell supplies the pinned compiler and Oxc tools plus this
      # project's Node 22 extension. The committed Bun lock remains frozen.
      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile

      - name: Runtime catalog tests
        run: nix develop --command bun run test:patterns

      - name: Runtime catalog consistency
        run: nix develop --command bun run lint:patterns

      - name: Diagram contracts
        run: nix develop --command bun run lint:diagrams

      - name: Documentation tests
        run: nix develop --command bun run test:docs

      - name: Documentation scope and prose
        run: nix develop --command bun run lint:docs

      - name: Documentation navigation
        run: nix develop --command bun run lint:nav

      - name: Canonical terminology snapshot
        run: nix develop --command bun run lint:terminology

      - name: Typecheck
        run: nix develop --command bun run typecheck

      # Lint and format use the module's packages, matching the local shell.
      - name: Lint
        run: nix develop --command oxlint

      - name: Format check
        run: nix develop --command oxfmt --check .

      # `vite build` prerenders the static SPA into .output/public. CI explicitly
      # skips optional licensed fonts and uses the system monospace fallback.
      - name: Build (static SPA -> .output/public)
        run: nix develop --command bun run build

      # Source-level internal doc-link check (catches broken /docs links in MDX —
      # the meaningful gate for this client-rendered SPA) followed by a linkinator
      # crawl of the built output. See the plan's Decision Log on link-check coverage.
      - name: Link check
        run: nix develop --command bun run lint:links
