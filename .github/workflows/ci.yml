name: CI

on:
  pull_request:
  push:
    branches:
      - master

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Quality gates (Nix, pnpm + Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      # The shared shell supplies the pinned compiler and Oxc tools plus this
      # project's Node 22/pnpm extension. The committed pnpm lock remains frozen.
      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Documentation tests
        run: nix develop --command pnpm run test:docs

      - name: Documentation scope and prose
        run: nix develop --command pnpm run lint:docs

      - name: Documentation navigation
        run: nix develop --command pnpm run lint:nav

      - name: Canonical terminology snapshot
        run: nix develop --command pnpm run lint:terminology

      - name: Typecheck
        run: nix develop --command pnpm run typecheck

      # Lint and format use the module's packages, matching the local shell.
      - name: Lint
        run: nix develop --command oxlint

      - name: Format check
        run: nix develop --command oxfmt --check .

      # `vite build` prerenders the static SPA into .output/public. The font
      # package is optional and absent on the runner; scripts/copy-fonts.mjs
      # tolerates that and exits 0, so the build still succeeds (code blocks fall
      # back to the system monospace — ligatures are a licensed local/deploy concern).
      - name: Build (static SPA -> .output/public)
        run: nix develop --command pnpm build

      # Source-level internal doc-link check (catches broken /docs links in MDX —
      # the meaningful gate for this client-rendered SPA) followed by a linkinator
      # crawl of the built output. See the plan's Decision Log on link-check coverage.
      - name: Link check
        run: nix develop --command pnpm run lint:links
