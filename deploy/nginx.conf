server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        try_files $uri =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ~* \.(js|mjs|css|json|svg|png|jpg|jpeg|webp|ico|woff|woff2|txt|map)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html /_shell.html;
    }
}
